name: build-mobile

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'StarAgent.Mobile/**'
      - 'StarAgent.Android/**'
      - 'StarAgent.iOS/**'
      - 'Stardust/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  macos:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # osx 自包含包可在 Windows 交叉发布，产物为 Mach-O 可执行文件
    - name: Publish osx-x64
      run: dotnet publish StarAgent/StarAgent.csproj -c Release -f net10.0 -r osx-x64 --self-contained -o out/osx-x64 -p:TargetFrameworks=net10.0
    - name: Publish osx-arm64
      run: dotnet publish StarAgent/StarAgent.csproj -c Release -f net10.0 -r osx-arm64 --self-contained -o out/osx-arm64 -p:TargetFrameworks=net10.0

    - uses: actions/upload-artifact@v4
      with:
        name: staragent-osx
        path: out/osx-*

  android:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install Android workload
      run: dotnet workload install android

    # 产物：Bin/Agent/mobile/android/apk/StarAgent-Aot.apk（默认调试签名）
    - name: Pack APK
      run: pwsh -NoProfile -File StarAgent.Android/pack-android.ps1 -Mode Aot -RuntimeIdentifier android-arm64

    - uses: actions/upload-artifact@v4
      with:
        name: staragent-android
        path: Bin/Agent/mobile/android/apk/*.apk

  android-smoke:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install Android workload
      run: dotnet workload install android

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # CI 没有可用 StarServer，只验证冷启动与前台服务；-Smoke 需要真实服务端登录
    - name: Run Android smoke
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: pwsh -NoProfile -File StarAgent.Android/run-android.ps1 -Start

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: staragent-android-smoke
        path: Bin/Agent/mobile/android/artifacts/**

  ios:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install iOS workload
      run: dotnet workload install ios

    # 模拟器构建与冒烟，无需 Apple 开发者账号；真机 ipa 需签名证书
    - name: Run iOS smoke
      run: bash StarAgent.iOS/run-ios.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: staragent-ios-smoke
        path: Bin/Agent/mobile/ios/artifacts/**