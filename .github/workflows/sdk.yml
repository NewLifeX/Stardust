name: sdk

on:
  push:
    branches: ["*"]
    paths:
      - 'SDK/**'
      - '.github/workflows/sdk.yml'
  pull_request:
    branches: ["*"]
    paths:
      - 'SDK/**'
      - '.github/workflows/sdk.yml'
  workflow_dispatch:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        working-directory: SDK/JavaScript
        run: npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test
        working-directory: SDK/Java
        run: mvn -B test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache-dependency-path: |
            SDK/Go/stardust/go.mod
            SDK/Go/stardust-redis/go.mod
      - name: Test
        working-directory: SDK/Go/stardust
        run: go test -count=1 ./...
      - name: Test Redis adapter
        working-directory: SDK/Go/stardust-redis
        run: go test -count=1 ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: SDK/Python
        run: pip install -r requirements.txt
      - name: Test
        working-directory: SDK/Python
        run: python -m unittest discover -s tests -v
