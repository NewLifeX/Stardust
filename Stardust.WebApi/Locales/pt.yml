"Motherboard mismatch (new != old): {0} != {1}": "A placa-mãe não corresponde (novo != antigo): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "O código do produto não corresponde (novo != antigo): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "O nome da máquina não corresponde (novo != antigo): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "O endereço MAC não corresponde (novo != antigo): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "O número de série do disco não corresponde (novo != antigo): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Versão={0} Tamanho={1:n0} Nó={2}"
"Associated online": "Associação online"
"Dynamic registration": "Registro dinâmico"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] entrou em {2}, última atividade em {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "O nó [{0}/{1}] é muito semelhante ao nó existente [{2}]; o nó existente será usado"
"Stardust service platform": "Plataforma de serviços Stardust"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Núcleo do backend da plataforma de serviços distribuídos Stardust. Fornece APIs para nós, aplicações, configuração, registro, monitoramento e alertas, releases, gateway e MCP, com agregação de métricas, estatísticas e tarefas agendadas."
"Service port. Default 6600.": "Porta do serviço. Padrão 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Segredo do token. Algoritmo e segredo usados para gerar tokens JWT, por exemplo HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Período de validade do token. Padrão 2*3600 segundos."
"Session timeout. Default 600 seconds": "Tempo limite da sessão. Padrão 600 segundos"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Tempo de desvio de salt. Os clientes usam a hora atual como salt ao iniciar sessão; uma diferença de horário demasiado grande em relação ao servidor faz falhar a verificação da chave; padrão 600 segundos"
"Auto-register. Allow node clients to register automatically, default true": "Registo automático. Permitir que os clientes de nó se registem automaticamente, padrão true"
"Application auto-registration. Allow app clients to register automatically; default true": "Registo automático de aplicações. Permitir que clientes de aplicação se registem automaticamente; padrão true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Lista de permissões de admissão. Se especificada, apenas nós que atendam às condições de IP podem registar-se, separe várias entradas por vírgulas, suporta correspondência com curinga *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Fórmula do código do nó. Seleciona quais informações de hardware do NodeInfo são usadas para calcular o código do nó. Suporta Crc/Crc16/MD5/MD5_16, padrão Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Limite de identificação do código do nó. UUID+Guid+SerialNumber+DiskId+MAC; se vários deles coincidirem, o nó é considerado o mesmo, padrão 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Período de estatísticas do fluxo de monitoramento. Padrão 5 segundos. Processa a fila em memória para calcular estatísticas por minuto; valores menores melhoram a atualidade, mas aumentam o uso de CPU, valores maiores reduzem o uso de CPU, mas aumentam a latência dos alertas"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Período de estatísticas em lote de monitoramento. Padrão 30 segundos. Corrige os dados agregando do banco de dados; valores menores aceleram a correção, mas aumentam a pressão de IO, valores maiores reduzem a pressão, mas atrasam a correção"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Período de persistência de monitoramento. Padrão 300 segundos. Período de envio em lote da fila de estatísticas atrasadas; os alertas leem valores em tempo real da memória e não são afetados. Valores maiores reduzem significativamente a pressão de UPDATE no banco de dados"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Período de inspeção de monitoramento. Padrão 600 segundos. Recalcula periodicamente as estatísticas horárias/diárias de aplicações pouco populares em vez do recálculo completo em cada ciclo de lote, reduzindo a amplificação de escrita"
"Monitoring alert period. Default 30 seconds": "Período de alerta de monitoramento. Padrão 30 segundos"
"Console address. Used for monitoring alert addresses": "Endereço do console. Usado para endereços de alertas de monitoramento"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Período de retenção de dados. Detalhes das amostras e estatísticas por minuto; padrão 3 dias."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Tempo de retenção de dados de granularidade média. Dados de desempenho e estatísticas por hora, padrão 30 dias"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Período de retenção de dados de grão grosso. Dados históricos e estatísticas diárias, padrão 300 dias."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Modo de limpeza de dados. Suporta Truncate eficiente ou Delete sem DDL. Padrão Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Diretório de upload. Armazena pacotes de atualização e deve ser o mesmo diretório configurado para o StarWeb. Padrão ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Tamanho máximo do pacote de upload. Aplica-se apenas ao máximo de bytes do corpo da solicitação permitido pelo endpoint Deploy/UploadBuildFile; padrão 100000000 (100MB), 0 significa usar o limite padrão do Kestrel, máximo 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Diretório de cache de arquivos. Armazena arquivos de cache como drivers de banco de dados; desativado quando vazio; padrão ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Lista de permissões do cache de arquivos. Se especificada, apenas fontes IP correspondentes podem acessar o cache de arquivos; separe várias entradas por vírgulas; suporta curingas *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Serviço de armazenamento de arquivos. Se deve responder a solicitações de download de arquivos de outros nós. Padrão true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Extração do armazenamento de arquivos. Se deve buscar ativamente novos arquivos publicados por outros nós. Padrão false."
"Upstream server. Reports data synchronously to the upstream server.": "Servidor superior. Relata os dados de forma síncrona ao servidor superior."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Cidade fixa. Por padrão, a cidade é calculada automaticamente a partir do IP. Quando ativado, o cálculo automático é desativado e a cidade é definida manualmente"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Permitir acesso anônimo ao rastreamento. Permite que usuários não autenticados acessem a página de rastreamento /trace; os dados de monitoramento podem conter informações confidenciais. Padrão false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Intervalo de sincronização dotNet. Obter informações do instalador do .NET runtime no site oficial, 0 desativa, unidade segundos, padrão 43200 (12 horas)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Endereço de sincronização dotNet. Endereço oficial da API para obter versões do .NET runtime, suporta o marcador {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Endereço base de download de recursos do Stardust. URL base para instaladores/scripts do StarAgent; padrão o endereço oficial"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Permitir quando os nós controláveis estiverem vazios. Define se as operações são permitidas quando AllowControlNodes está vazio, padrão false (modo seguro, os nós controláveis devem ser configurados explicitamente). Ambientes internos podem definir como true para compatibilidade com dados antigos"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Ativar o serviço MCP. Desativado por padrão; quando ativado, expõe o endpoint POST /mcp para chamadas de LLM/agente."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Conjunto de ações MCP. Nomes de módulos separados por vírgulas (node/app/config/deploy/gateway/monitor/system), * ativa todos"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Prefixos de caminho do limite de taxa. Separados por vírgulas; os caminhos correspondentes são limitados por IP; padrão para endpoints de autenticação como login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Limite de taxa. Número de solicitações permitidas por IP por minuto; padrão 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Permitir relatórios de telemetria anónimos. Necessário para cascata multinível ou SDK mínimo; padrão false (seguro)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Origens CORS permitidas. Separadas por vírgulas; vazio permite qualquer origem; quando especificado, apenas origens na lista branca podem fazer cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Autenticação de download de anexos. Se o token de download de anexos deve ser verificado para /cube/file. Padrão false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Categorias de anexos públicos sem login. Separadas por vírgula; os itens correspondentes podem ser baixados anonimamente."
"Attachment download token validity. Seconds, default 600.": "Validade do token de download de anexos. Segundos, padrão 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService está sincronizando {0}"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService falhou ao sincronizar {0}: {1}"
"DotNetSyncService.Error {0}": "Erro do DotNetSyncService: {0}"
