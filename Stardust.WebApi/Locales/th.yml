"[{0}] has no secret configured; node commands are forbidden. Set a Secret for this application in the registry.": "[{0}] ยังไม่ได้กำหนดค่าความลับ ไม่อนุญาตคำสั่งโหนด โปรดตั้งค่า Secret สำหรับแอปพลิเคชันนี้ในรีจิสทรี"
"[{0}] has no secret configured; control commands are forbidden. Set a Secret for this application in the registry.": "[{0}] ยังไม่ได้กำหนดค่าความลับ ไม่อนุญาตคำสั่งควบคุม โปรดตั้งค่า Secret สำหรับแอปพลิเคชันนี้ในรีจิสทรี"
"[{0}] has no secret configured; remote deployment is forbidden. Set a Secret for this application in the registry.": "[{0}] ยังไม่ได้กำหนดค่าความลับ ไม่อนุญาต deploy ระยะไกล โปรดตั้งค่า Secret สำหรับแอปพลิเคชันนี้ในรีจิสทรี"
"[{0}] has no control permission; remote deployment is forbidden.": "[{0}] ไม่มีสิทธิ์ควบคุม ไม่อนุญาต deploy ระยะไกล"
"[{0}] is not allowed to operate node [{1}].\nFor security, applications cannot send control commands to arbitrary nodes by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all nodes.": "[{0}] ไม่ได้รับอนุญาตให้จัดการโหนด [{1}]\nเพื่อความปลอดภัย โดยค่าเริ่มต้นแอปพลิเคชันไม่สามารถส่งคำสั่งควบคุมไปยังโหนดใด ๆ ได้\nในรีจิสทรี โปรดแก้ไขโหนดที่ควบคุมได้ของ [{0}] เพิ่ม [{2}] หรือตั้งเป็น * สำหรับทุกโหนด"
"[{0}] is not allowed to operate application [{1}].\nFor security, applications cannot send control commands to other applications by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all applications.": "[{0}] ไม่ได้รับอนุญาตให้จัดการแอปพลิเคชัน [{1}]\nเพื่อความปลอดภัย โดยค่าเริ่มต้นแอปพลิเคชันไม่สามารถส่งคำสั่งควบคุมไปยังแอปพลิเคชันอื่นได้\nในรีจิสทรี โปรดแก้ไขโหนดที่ควบคุมได้ของ [{0}] เพิ่ม [{2}] หรือตั้งเป็น * สำหรับทุกแอปพลิเคชัน"
"[{0}] attempted to reply to command [{1}] that belongs to node [{2}]": "[{0}] พยายามตอบกลับคำสั่ง [{1}] ซึ่งเป็นของโหนด [{2}]"
