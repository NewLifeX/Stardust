"Computer serial number mismatch (new != old): {0} != {1}": "หมายเลขซีเรียลคอมพิวเตอร์ไม่ตรงกัน (ใหม่ != เก่า): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "เมนบอร์ดไม่ตรงกัน (ใหม่ != เก่า): {0} != {1}"
