"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] เข้าสู่ระบบเมื่อ {2} ใช้งานล่าสุดเมื่อ {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "โหนด [{0}/{1}] คล้ายกับโหนดที่มีอยู่ [{2}] มาก จะใช้โหนดที่มีอยู่"
"Stardust service platform": "แพลตฟอร์มบริการ Stardust"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "แกนหลังบ้านของแพลตฟอร์มบริการแบบกระจาย Stardust ให้ API สำหรับโหนด แอปพลิเคชัน คอนฟิกูเรชัน รีจิสทรี การเฝ้าระวังและการแจ้งเตือน การเผยแพร่ เกตเวย์ และ MCP พร้อมการรวมเมตริก สถิติ และงานตามกำหนดเวลา"
"Service port. Default 6600.": "พอร์ตบริการ ค่าเริ่มต้น 6600"
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "รหัสลับโทเค็น อัลกอริทึมและรหัสลับที่ใช้สร้างโทเค็น JWT เช่น HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "ระยะเวลาความถูกต้องของโทเค็น ค่าเริ่มต้น 2*3600 วินาที"
"Session timeout. Default 600 seconds": "หมดเวลาของเซสชัน ค่าเริ่มต้น 600 วินาที"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "เวลาคลาดเคลื่อนของ salt ไคลเอนต์ใช้เวลาปัจจุบันเป็น salt เมื่อเข้าสู่ระบบ หากเวลาต่างจากเซิร์ฟเวอร์มากเกินไปจะทำให้การตรวจสอบคีย์ล้มเหลว ค่าเริ่มต้น 600 วินาที"
"Auto-register. Allow node clients to register automatically, default true": "การลงทะเบียนอัตโนมัติ อนุญาตให้ไคลเอนต์โหนดลงทะเบียนโดยอัตโนมัติ ค่าเริ่มต้น true"
"Application auto-registration. Allow app clients to register automatically; default true": "การลงทะเบียนแอปพลิเคชันอัตโนมัติ อนุญาตให้ไคลเอนต์แอปลงทะเบียนโดยอัตโนมัติ ค่าเริ่มต้น true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "รายการที่อนุญาตสำหรับการรับเข้า หากระบุ จะอนุญาตเฉพาะโหนดที่ตรงตามเงื่อนไข IP เท่านั้นให้ลงทะเบียน คั่นหลายรายการด้วยจุลภาค รองรับการจับคู่แบบไวลด์การ์ด *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "สูตรรหัสโหนด เลือกว่าข้อมูลฮาร์ดแวร์ใดใน NodeInfo ที่ใช้คำนวณรหัสโหนด รองรับ Crc/Crc16/MD5/MD5_16 ค่าเริ่มต้น Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "เกณฑ์การระบุรหัสโหนด UUID+Guid+SerialNumber+DiskId+MAC หากมีหลายรายการตรงกัน จะถือว่าเป็นโหนดเดียวกัน ค่าเริ่มต้น 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "รอบสถิติสตรีมการตรวจสอบ ค่าเริ่มต้น 5 วินาที ประมวลผลคิวในหน่วยความจำเพื่อคำนวณสถิติระดับนาที ค่าน้อยลงจะเพิ่มความเป็นเรียลไทม์แต่ใช้ CPU มากขึ้น ค่ามากขึ้นจะลดการใช้ CPU แต่เพิ่มความล่าช้าในการแจ้งเตือน"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "รอบสถิติแบบกลุ่มของการตรวจสอบ ค่าเริ่มต้น 30 วินาที แก้ไขข้อมูลโดยการรวมจากฐานข้อมูล ค่าน้อยลงจะแก้ไขได้เร็วขึ้นแต่เพิ่มภาระ IO ค่ามากขึ้นจะลดภาระแต่ทำให้การแก้ไขล่าช้า"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "รอบการจัดเก็บข้อมูลการตรวจสอบ ค่าเริ่มต้น 300 วินาที รอบการส่งแบบกลุ่มของคิวสถิติที่หน่วงไว้ การแจ้งเตือนอ่านค่าจริงในหน่วยความจำและไม่ได้รับผลกระทบ ค่ามากขึ้นจะลดภาระ UPDATE ของฐานข้อมูลอย่างมีนัยสำคัญ"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "รอบการตรวจตราการตรวจสอบ ค่าเริ่มต้น 600 วินาที คำนวณสถิติรายชั่วโมง/รายวันซ้ำสำหรับแอปพลิเคชันที่ไม่ได้รับความนิยมเป็นรอบๆ แทนการคำนวณใหม่ทั้งหมดในแต่ละรอบกลุ่ม ช่วยลดการขยายการเขียน"
"Monitoring alert period. Default 30 seconds": "รอบการแจ้งเตือนการตรวจสอบ ค่าเริ่มต้น 30 วินาที"
"Console address. Used for monitoring alert addresses": "ที่อยู่คอนโซล ใช้สำหรับที่อยู่การแจ้งเตือนการตรวจสอบ"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "ระยะเวลาการเก็บรักษาข้อมูล รายละเอียดตัวอย่างและสถิติระดับนาที ค่าเริ่มต้น 3 วัน"
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "ระยะเวลาเก็บรักษาข้อมูลระดับปานกลาง ข้อมูลประสิทธิภาพและสถิติรายชั่วโมง ค่าเริ่มต้น 30 วัน"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "ระยะเวลาการเก็บข้อมูลแบบหยาบ ข้อมูลย้อนหลังและสถิติรายวัน ค่าเริ่มต้น 300 วัน"
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "โหมดการล้างข้อมูล รองรับ Truncate ที่มีประสิทธิภาพ หรือ Delete ที่ไม่ต้องใช้ DDL ค่าเริ่มต้น Truncate"
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "ไดเรกทอรีอัปโหลด เก็บแพ็กเกจอัปเกรด ต้องเป็นไดเรกทอรีเดียวกับที่กำหนดค่าไว้สำหรับ StarWeb ค่าเริ่มต้น ../Uploads"
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "ขนาดสูงสุดของแพ็กเกจอัปโหลด ใช้เฉพาะกับจำนวนไบต์สูงสุดของเนื้อหาคำขอที่ปลายทาง Deploy/UploadBuildFile ยอมรับ ค่าเริ่มต้น 100000000 (100MB) ค่า 0 หมายถึงใช้ขีดจำกัดเริ่มต้นของ Kestrel สูงสุด 1GB"
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "ไดเรกทอรีแคชไฟล์ เก็บไฟล์แคช เช่น ไดรเวอร์ฐานข้อมูล จะไม่เปิดใช้งานเมื่อว่างเปล่า ค่าเริ่มต้น ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "รายการที่อนุญาตของแคชไฟล์ หากระบุ จะอนุญาตเฉพาะแหล่ง IP ที่ตรงเงื่อนไขเท่านั้นจึงจะเข้าถึงแคชไฟล์ได้ คั่นหลายรายการด้วยเครื่องหมายจุลภาค รองรับไวลด์การ์ด *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "บริการที่จัดเก็บไฟล์ จะตอบสนองคำขอดาวน์โหลดไฟล์จากโหนดอื่นหรือไม่ ค่าเริ่มต้น true"
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "การดึงไฟล์จากที่จัดเก็บไฟล์ จะดึงไฟล์ใหม่ที่โหนดอื่นเผยแพร่โดยอัตโนมัติหรือไม่ ค่าเริ่มต้น false"
"Upstream server. Reports data synchronously to the upstream server.": "เซิร์ฟเวอร์ระดับบน รายงานข้อมูลไปยังเซิร์ฟเวอร์ระดับบนแบบซิงโครนัส"
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "เมืองคงที่ โดยค่าเริ่มต้นจะคำนวณเมืองจาก IP โดยอัตโนมัติ เมื่อเปิดใช้งานจะหยุดคำนวณอัตโนมัติและตั้งค่าเมืองด้วยตนเอง"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "อนุญาตการเข้าถึงการติดตามแบบไม่ระบุตัวตน อนุญาตให้ผู้ใช้ที่ยังไม่เข้าสู่ระบบเข้าถึงหน้า /trace ข้อมูลการตรวจสอบอาจมีข้อมูลที่ละเอียดอ่อน ค่าเริ่มต้น false"
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "ช่วงเวลาซิงค์ dotNet ดึงข้อมูลตัวติดตั้ง .NET runtime จากเว็บไซต์ทางการ 0 หมายถึงปิดใช้งาน หน่วยเป็นวินาที ค่าเริ่มต้น 43200 (12 ชั่วโมง)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "ที่อยู่ซิงค์ dotNet ที่อยู่ API อย่างเป็นทางการสำหรับดึงเวอร์ชัน .NET runtime รองรับตัวยึดตำแหน่ง {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "ที่อยู่ฐานสำหรับดาวน์โหลดทรัพยากร Stardust URL ฐานของตัวติดตั้ง/สคริปต์ StarAgent ค่าเริ่มต้นคือที่อยู่ทางการ"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "อนุญาตเมื่อโหนดที่ควบคุมได้ว่างเปล่า กำหนดว่าจะอนุญาตให้ดำเนินการหรือไม่เมื่อ AllowControlNodes ว่างเปล่า ค่าเริ่มต้น false (โหมดปลอดภัย ต้องกำหนดโหนดที่ควบคุมได้อย่างชัดเจน) สภาพแวดล้อมภายในสามารถตั้งเป็น true เพื่อรองรับข้อมูลเดิม"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "เปิดใช้งานบริการ MCP ปิดอยู่โดยค่าเริ่มต้น เมื่อเปิดใช้งานจะแสดงปลายทาง POST /mcp สำหรับการเรียกใช้ LLM/เอเจนต์"
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "ชุดการทำงาน MCP ชื่อโมดูลคั่นด้วยจุลภาค (node/app/config/deploy/gateway/monitor/system) * หมายถึงเปิดใช้งานทั้งหมด"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "คำนำหน้าเส้นทางที่จำกัดอัตรา คั่นด้วยเครื่องหมายจุลภาค เส้นทางที่ตรงเงื่อนไขจะถูกจำกัดอัตราตาม IP ค่าเริ่มต้นคือปลายทางการยืนยันตัวตน เช่น login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "จำนวนจำกัดอัตรา จำนวนคำขอที่อนุญาตต่อ IP ต่อนาที ค่าเริ่มต้น 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "อนุญาตการรายงานเทเลเมทรีแบบไม่ระบุตัวตน จำเป็นสำหรับการต่อแบบหลายระดับหรือ SDK ขั้นต่ำ ค่าเริ่มต้น false (ปลอดภัย)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "ต้นกำเนิด CORS ที่อนุญาต คั่นด้วยจุลภาค หากว่างจะอนุญาตทุกต้นกำเนิด หากระบุจะอนุญาตเฉพาะต้นกำเนิดในรายการที่อนุญาตให้ข้ามต้นกำเนิด"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "การรับรองความถูกต้องของการดาวน์โหลดไฟล์แนบ จะตรวจสอบโทเค็นดาวน์โหลดไฟล์แนบสำหรับ /cube/file หรือไม่ ค่าเริ่มต้น false"
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "หมวดหมู่ไฟล์แนบสาธารณะที่ไม่ต้องเข้าสู่ระบบ คั่นด้วยเครื่องหมายจุลภาค รายการที่ตรงกันสามารถดาวน์โหลดได้โดยไม่ระบุตัวตน"
"Attachment download token validity. Seconds, default 600.": "อายุของโทเค็นดาวน์โหลดไฟล์แนบ หน่วยเป็นวินาที ค่าเริ่มต้น 600"
"DotNetSyncService.Sync {0}": "DotNetSyncService กำลังซิงค์ {0}"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService ซิงค์ {0} ไม่สำเร็จ: {1}"
"DotNetSyncService.Error {0}": "ข้อผิดพลาด DotNetSyncService: {0}"
"Default language. Pushed to clients on login and heartbeat, e.g. zh-Hans or en; empty uses the core configuration DefaultLanguage.": "ภาษาเริ่มต้น ส่งให้ไคลเอนต์เมื่อเข้าสู่ระบบและ heartbeat เช่น zh-Hans หรือ en; หากเว้นว่างจะใช้ DefaultLanguage จากคอนฟิกหลัก"
