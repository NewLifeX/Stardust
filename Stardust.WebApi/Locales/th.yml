"Application [{0}] already exists; reusing the old identity for dynamic registration is forbidden. Check the secret or contact the administrator. To enable automatic instance onboarding, adjust the application's re-registration mode (convergence window/trusted access/open).": "แอปพลิเคชัน [{0}] มีอยู่แล้ว ไม่อนุญาตให้นำตัวตนเดิมกลับมาใช้สำหรับการลงทะเบียนแบบไดนามิก โปรดตรวจสอบความลับหรือติดต่อผู้ดูแลระบบ หากต้องการเปิดใช้การเพิ่มอินสแตนซ์อัตโนมัติ โปรดปรับโหมดลงทะเบียนใหม่ของแอปพลิเคชัน (หน้าต่างลู่เข้า/การเข้าถึงที่เชื่อถือได้/เปิด)"
