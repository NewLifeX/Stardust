"Debug switch. Default false": "Virheenkorjauskytkin. Oletus false"
"Disable strict SSH host key checking. Default false (checking enabled)": "Poista tiukka SSH-isäntäavainten tarkistus käytöstä. Oletus false (tarkistus käytössä)"
"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Stardust-palvelimen osoite. Esimerkiksi http://star.newlifex.com:6600; oletuksena tyhjä"
"App key. English name used to register with the Stardust registry": "Sovellusavain. Englanninkielinen nimi, jota käytetään rekisteröinnissä Stardust-rekisteriin"
"App secret. Used to register with the Stardust registry": "Sovellussalaisuus. Käytetään rekisteröinnissä Stardust-rekisteriin"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Palvelun osoite. Julkiset osoitteet, joista muut URL-osoitteet muodostetaan; erota useat osoitteet pilkuilla, ja 5 pyyntötiheydeltään yleisintä käytetään"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Sallitut isännät. Pilkuilla erotetut isäntänimet *-jokerimerkein, käytetään Host-otsakkeen valvontaan; IP-pyyntöjä ei validoida. Jätä tyhjäksi poistaaksesi validoinnin käytöstä"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Jäljitysnäytteenottoväli. Väli jäljitystietojen raportoinnille Stardustiin, oletus 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Normaalien näytteiden enimmäismäärä. Enimmäismäärä normaaleja tapahtumia jaksoa kohden riippuvuuskaavioita varten, oletus 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Virhenäytteiden enimmäismäärä. Enimmäismäärä virhetapahtumia jaksoa kohden, oletus 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Kerää OpenTelemetry-jäljitykset. Muuntaa kolmannen osapuolen komponenttien toiminnot jäljityksiksi, oletus true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Jäljitysnimien etuliitteet. Muuttuvat URL-polun osat havaitaan automaattisesti; erota etuliitteet puolipisteillä ja säädä tarvittaessa manuaalisesti"
"Stardust settings": "Stardust-asetukset"
