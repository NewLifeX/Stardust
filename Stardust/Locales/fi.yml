"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust-valvontakeskus: ITracer kerää ja raportoi sovellusten jäljitystietoja ja instrumentoi automaattisesti API-päätepisteet, HTTP-pyynnöt, tietokantatoiminnot ja Redis-toiminnot. Sitä voidaan käyttää järjestelmän kunnon valvontaan sekä kutsuketjujen ja suorituskyvyn pullonkaulojen analysointiin hajautetuissa järjestelmissä."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust-määrityskeskus: IConfigProvider hallinnoi määrityksiä keskitetysti, lataa määritystiedot automaattisesti määrityskeskuksesta ja tukee muutosten reaaliaikaista jakelua, mukaan lukien XCode-tietokannan yhteysmerkkijonot. Määrityskeskus antaa myös jokaiselle sovellusinstanssille uniikin WorkerId:n, jolloin Snowflake-algoritmi tuottaa taatusti täysin uniikkeja snowflake-ID:itä."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust-tapahtumaväylä: sovellustapahtumat raportoidaan StarServerille WebSocketin kautta; StarServerin sisäinen EventHub jakaa ne aiheen mukaan vastaavalle tapahtumaväylälle; muut aiheeseen tilatut WebSocket-istunnot toimittavat viestit kohdesovellukselle. Itsenäisessä StarServer-käyttöönotossa sisäinen väylä käyttää muistipohjaista toteutusta; klusterikäyttöönotossa sisäinen väylä käyttää Redis-jonoa."
"Stardust probe: {0}": "Stardust-luotaus: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust-rekisteri: IRegistry tarjoaa palvelunhaun; se hakee automaattisesti kaikkien tarjoajien solmuosoitteet palvelunimen perusteella ja luo IApiClientin palvelun kutsumista varten, lisäten tai poistaen osoitteita, kun tarjoajat tulevat verkkoon tai poistuvat sieltä."
