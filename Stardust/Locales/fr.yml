"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Centre de surveillance Stardust : ITracer collecte et signale les données de traçage de l'application, en instrumentant automatiquement les points de terminaison d'API, les requêtes HTTP, les opérations de base de données et les opérations Redis. Il permet de surveiller l'état du système et d'analyser les chaînes d'appels et les goulets d'étranglement de performance dans les systèmes distribués."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Centre de configuration Stardust : IConfigProvider gère la configuration de manière centralisée, charge automatiquement les données de configuration depuis le centre de configuration et prend en charge la diffusion des modifications en temps réel, y compris les chaînes de connexion de base de données XCode. Le centre de configuration attribue également un WorkerId unique à chaque instance d'application, garantissant que l'algorithme Snowflake génère des identifiants snowflake absolument uniques."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Bus d'événements Stardust : les événements applicatifs sont signalés à StarServer via WebSocket ; l'EventHub interne à StarServer les distribue par sujet au bus d'événements correspondant ; les autres sessions WebSocket abonnées à ce sujet remettent ensuite les messages à l'application cible. Dans un déploiement StarServer autonome, le bus interne utilise une implémentation en mémoire ; dans un déploiement en cluster, le bus interne utilise une file Redis."
"Stardust probe: {0}": "Sonde Stardust : {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registre Stardust : IRegistry assure la découverte de services ; il obtient automatiquement les adresses des nœuds de tous les fournisseurs par nom de service et crée un IApiClient pour appeler le service, en ajoutant ou supprimant des adresses selon que les fournisseurs sont en ligne ou hors ligne."
