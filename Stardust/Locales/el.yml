# 设置页字段（英文源文，中文提供译文，其余语言回退英文）
"Debug switch. Default false": "Διακόπτης αποσφαλμάτωσης. Προεπιλογή false"
"Disable strict SSH host key checking. Default false (checking enabled)": "Απενεργοποίηση αυστηρού ελέγχου κλειδιού κεντρικού υπολογιστή SSH. Προεπιλογή false (ο έλεγχος είναι ενεργός)"
"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Διεύθυνση διακομιστή Stardust. Για παράδειγμα http://star.newlifex.com:6600· κενή από προεπιλογή"
"App key. English name used to register with the Stardust registry": "Κλειδί εφαρμογής. Αγγλικό όνομα που χρησιμοποιείται για εγγραφή στο μητρώο Stardust"
"App secret. Used to register with the Stardust registry": "Μυστικό εφαρμογής. Χρησιμοποιείται για εγγραφή στο μητρώο Stardust"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Διεύθυνση υπηρεσίας. Δημόσιες διευθύνσεις που χρησιμοποιούνται για τη δημιουργία άλλων URL· διαχωρίστε πολλαπλές διευθύνσεις με κόμματα και χρησιμοποιούνται οι 5 πρώτες κατά συχνότητα αιτημάτων"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Επιτρεπόμενοι κεντρικοί υπολογιστές. Ονόματα κεντρικών υπολογιστών χωρισμένα με κόμματα, με μπαλαντέρ *, που χρησιμοποιούνται για την επικύρωση της κεφαλίδας Host· τα αιτήματα IP δεν επικυρώνονται. Αφήστε κενό για απενεργοποίηση της επικύρωσης"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Περίοδος δειγματοληψίας ιχνηλάτησης. Διάστημα αναφοράς δεδομένων ιχνηλάτησης στο Stardust, προεπιλογή 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Μέγιστα κανονικά δείγματα. Μέγιστος αριθμός κανονικών συμβάντων που καταγράφονται ανά περίοδο για τα γραφήματα εξαρτήσεων, προεπιλογή 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Μέγιστα δείγματα σφαλμάτων. Μέγιστος αριθμός συμβάντων σφάλματος που καταγράφονται ανά περίοδο, προεπιλογή 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Συλλογή ιχνών OpenTelemetry. Μετατρέπει τις δραστηριότητες στοιχείων τρίτων σε ίχνη, προεπιλογή true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Προθέματα ονομάτων ιχνηλάτησης. Τα μεταβλητά τμήματα διαδρομής URL ανιχνεύονται αυτόματα· διαχωρίστε τα προθέματα με άνω τελείες και προσαρμόστε χειροκίνητα εάν χρειάζεται"
"Stardust settings": "Ρυθμίσεις Stardust"
# 运行时消息补充词条
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to follow the system language": "Γλώσσα διεπαφής, για παράδειγμα zh-Hans, zh-Hant, en ή ja· αφήστε κενό για να ακολουθείται η γλώσσα του συστήματος"
"Service removed or disabled": "Η υπηρεσία αφαιρέθηκε ή απενεργοποιήθηκε"
"Configuration changed": "Η διαμόρφωση άλλαξε"
"Unsupported health check protocol: {0}": "Μη υποστηριζόμενο πρωτόκολλο ελέγχου εύρυθμης λειτουργίας: {0}"
"Health check error: {0} - {1}": "Σφάλμα ελέγχου εύρυθμης λειτουργίας: {0} - {1}"
"Health check failed: {0} - {1}": "Ο έλεγχος εύρυθμης λειτουργίας απέτυχε: {0} - {1}"
"Health check timed out: {0}": "Λήξη χρόνου ελέγχου εύρυθμης λειτουργίας: {0}"
"Health check failed: invalid port - {0}": "Ο έλεγχος εύρυθμης λειτουργίας απέτυχε: μη έγκυρη θύρα - {0}"
"Local probe failed: {0}": "Η τοπική ανίχνευση απέτυχε: {0}"
"Configuration center [{0}] error: {1}": "Σφάλμα κέντρου ρυθμίσεων [{0}]: {1}"
"Monitoring center [{0}] error: {1}: {2}": "Σφάλμα κέντρου παρακολούθησης [{0}]: {1}: {2}"
"Event bus [{0}] remote subscription succeeded!": "Η απομακρυσμένη εγγραφή στο δίαυλο συμβάντων [{0}] ολοκληρώθηκε!"
"Event bus [{0}] remote unsubscription succeeded!": "Η απομακρυσμένη διαγραφή εγγραφής από το δίαυλο συμβάντων [{0}] ολοκληρώθηκε!"
"Failed to report the sample data twice; discarding this batch: {0}": "Η δεύτερη αναφορά των δεδομένων δείγματος απέτυχε· η παρτίδα απορρίπτεται: {0}"
"Configuration refresh succeeded.": "Η ρύθμιση παραμέτρων ανανεώθηκε με επιτυχία."
"Service refresh succeeded.": "Η υπηρεσία ανανεώθηκε με επιτυχία."
"Invalid parameter.": "Μη έγκυρη παράμετρος."
"Succeeded": "Επιτυχία"
"File [{0}] changed; stopping the application and starting it {1}ms later": "Το αρχείο [{0}] άλλαξε· η εφαρμογή σταματά και ξεκινά σε {1}ms"
"Stardust distributed core": "Κατανεμημένος πυρήνας Stardust"
"Stardust distributed service framework core library. Provides client SDKs for configuration center, registry, service discovery, distributed tracing, APM, and log center, supporting configuration pulling, service registration and discovery, call tracing, performance and log reporting.": "Βασική βιβλιοθήκη του κατανεμημένου πλαισίου υπηρεσιών Stardust. Παρέχει SDK πελάτη για κέντρο διαμόρφωσης, μητρώο, ανακάλυψη υπηρεσιών, κατανεμημένη ιχνηλάτηση, APM και κέντρο καταγραφής, υποστηρίζοντας λήψη διαμόρφωσης, καταχώριση και ανακάλυψη υπηρεσιών, ιχνηλάτηση κλήσεων και αναφορά απόδοσης και αρχείων καταγραφής."
