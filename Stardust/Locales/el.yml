"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Κέντρο παρακολούθησης Stardust: το ITracer συλλέγει και αναφέρει δεδομένα ιχνηλάτησης της εφαρμογής, με αυτόματη οργάνωση (instrumentation) των τελικών σημείων API, των αιτημάτων HTTP, των λειτουργιών βάσης δεδομένων και των λειτουργιών Redis. Μπορεί να χρησιμοποιηθεί για την παρακολούθηση της υγείας του συστήματος και την ανάλυση αλυσίδων κλήσεων και σημείων συμφόρησης απόδοσης σε κατανεμημένα συστήματα."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Κέντρο διαμόρφωσης Stardust: το IConfigProvider διαχειρίζεται κεντρικά τη διαμόρφωση, φορτώνει αυτόματα τα δεδομένα διαμόρφωσης από το κέντρο διαμόρφωσης και υποστηρίζει παράδοση αλλαγών σε πραγματικό χρόνο, συμπεριλαμβανομένων των συμβολοσειρών σύνδεσης βάσης δεδομένων XCode. Το κέντρο διαμόρφωσης εκχωρεί επίσης ένα μοναδικό WorkerId σε κάθε παρουσία εφαρμογής, διασφαλίζοντας ότι ο αλγόριθμος Snowflake παράγει απολύτως μοναδικά snowflake ID."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Δίαυλος συμβάντων Stardust: τα συμβάντα της εφαρμογής αναφέρονται στον StarServer μέσω WebSocket· το EventHub μέσα στον StarServer τα διανέμει ανά θέμα στον αντίστοιχο δίαυλο συμβάντων· άλλες συνεδρίες WebSocket που έχουν εγγραφεί σε αυτό το θέμα παραδίδουν στη συνέχεια τα μηνύματα στην εφαρμογή-στόχο. Σε εγκατάσταση StarServer ενός διακομιστή, ο εσωτερικός δίαυλος χρησιμοποιεί υλοποίηση στη μνήμη· σε εγκατάσταση συμπλέγματος, ο εσωτερικός δίαυλος χρησιμοποιεί ουρά Redis."
"Stardust probe: {0}": "Δοκιμή Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Μητρώο Stardust: το IRegistry παρέχει ανακάλυψη υπηρεσιών· λαμβάνει αυτόματα τις διευθύνσεις κόμβων όλων των παρόχων με βάση το όνομα υπηρεσίας και δημιουργεί ένα IApiClient για την κλήση της υπηρεσίας, προσθέτοντας ή αφαιρώντας διευθύνσεις καθώς οι πάροχοι συνδέονται ή αποσυνδέονται."
