"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Centrum monitorování Stardust: ITracer shromažďuje a odesílá data trasování aplikací, automaticky instrumentuje koncové body API, požadavky HTTP, databázové operace a operace Redis. Lze jej použít ke sledování stavu systému a analýze řetězců volání a výkonnostních úzkých míst v distribuovaných systémech."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Centrum konfigurace Stardust: IConfigProvider centrálně spravuje konfiguraci, automaticky načítá konfigurační data z centra konfigurace a podporuje doručování změn v reálném čase, včetně připojovacích řetězců databáze XCode. Centrum konfigurace také přiřazuje každé instanci aplikace jedinečný WorkerId, čímž zajišťuje, že algoritmus Snowflake generuje naprosto jedinečné Snowflake ID."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Sběrnice událostí Stardust: události aplikací se odesílají do StarServer přes WebSocket; EventHub uvnitř StarServer je distribuuje podle topic do příslušné sběrnice událostí; ostatní relace WebSocket odebírající daný topic doručí zprávy cílové aplikaci. Při samostatném nasazení StarServer používá interní sběrnice implementaci v paměti; při klastrovém nasazení používá interní sběrnice frontu Redis."
"Stardust probe: {0}": "Sonda Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registr Stardust: IRegistry zajišťuje zjišťování služeb; automaticky získává adresy uzlů všech poskytovatelů podle názvu služby a vytváří IApiClient pro volání služby, přičemž přidává nebo odebírá adresy, když se poskytovatelé připojují nebo odpojují."
