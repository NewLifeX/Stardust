"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Adresa služby. Veřejné adresy používané k sestavení dalších URL; více adres oddělujte čárkami, používá se 5 nejčastěji požadovaných"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Povolení hostitelé. Názvy hostitelů oddělené čárkami se zástupnými znaky *, používané k ověření hlavičky Host; požadavky na IP se neověřují. Ponechte prázdné pro vypnutí ověřování"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Period vzorkování trasování. Interval odesílání dat trasování do Stardust, výchozí 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Maximální počet normálních vzorků. Maximální počet normálních událostí zaznamenaných za periodu pro grafy závislostí, výchozí 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Maximální počet vzorků chyb. Maximální počet událostí chyb zaznamenaných za periodu, výchozí 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Shromažďovat trasování OpenTelemetry. Převádí aktivity komponent třetích stran na trasování, výchozí true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Předpony názvů trasování. Proměnné segmenty cesty URL se zjišťují automaticky; oddělujte předpony středníky a v případě potřeby je upravte ručně"
