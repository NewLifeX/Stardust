"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Host consentiti. Nomi host separati da virgole con caratteri jolly *, usati per convalidare l'intestazione Host; le richieste tramite IP non vengono convalidate. Lasciare vuoto per disabilitare la convalida"
