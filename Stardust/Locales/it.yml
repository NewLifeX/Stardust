"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Centro di monitoraggio Stardust: ITracer raccoglie e segnala i dati di tracciamento dell'applicazione, instrumentando automaticamente endpoint API, richieste HTTP, operazioni su database e operazioni Redis. Può essere usato per monitorare lo stato del sistema e analizzare catene di chiamate e colli di bottiglia delle prestazioni nei sistemi distribuiti."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Centro di configurazione Stardust: IConfigProvider gestisce centralmente la configurazione, carica automaticamente i dati di configurazione dal centro di configurazione e supporta la propagazione delle modifiche in tempo reale, comprese le stringhe di connessione al database XCode. Il centro di configurazione assegna inoltre un WorkerId univoco a ogni istanza dell'applicazione, garantendo che l'algoritmo Snowflake generi ID snowflake assolutamente univoci."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Bus degli eventi Stardust: gli eventi dell'applicazione vengono segnalati a StarServer tramite WebSocket; l'EventHub all'interno di StarServer li distribuisce per argomento al bus degli eventi corrispondente; le altre sessioni WebSocket sottoscritte a tale argomento recapitano quindi i messaggi all'applicazione di destinazione. In una distribuzione standalone di StarServer, il bus interno usa un'implementazione in memoria; in una distribuzione in cluster, il bus interno usa una coda Redis."
"Stardust probe: {0}": "Sonda Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registro Stardust: IRegistry fornisce il rilevamento dei servizi; ottiene automaticamente gli indirizzi dei nodi di tutti i provider in base al nome del servizio e crea un IApiClient per chiamare il servizio, aggiungendo o rimuovendo indirizzi man mano che i provider si connettono o si disconnettono."
