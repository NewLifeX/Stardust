"App secret. Used to register with the Stardust registry": "Секрет застосунку. Використовується для реєстрації в реєстрі Stardust"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Адреса служби. Публічні адреси для побудови інших URL; кілька адрес розділяються комами, використовуються 5 найчастіше запитаних"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Дозволені хости. Імена хостів через кому з підстановкою *, використовуються для перевірки заголовка Host; IP-запити не перевіряються. Залиште порожнім, щоб вимкнути перевірку"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Період вибірки трасування. Інтервал надсилання даних трасування до Stardust, за замовчуванням 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Максимум нормальних вибірок. Максимальна кількість нормальних подій за період для графів залежностей, за замовчуванням 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Максимум вибірок помилок. Максимальна кількість подій помилок за період, за замовчуванням 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Збирати трасування OpenTelemetry. Перетворює активності сторонніх компонентів на трасування, за замовчуванням true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Префікси назв трасування. Змінні сегменти шляху URL визначаються автоматично; розділяйте префікси крапкою з комою та за потреби коригуйте вручну"
"Stardust settings": "Параметри Stardust"
# 运行时消息补充词条
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to follow the system language": "Мова інтерфейсу, наприклад zh-Hans, zh-Hant, en або ja; залиште порожнім, щоб дотримуватися системної мови"
"Service removed or disabled": "Службу видалено або вимкнено"
"Configuration changed": "Конфігурацію змінено"
