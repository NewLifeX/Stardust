"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Центр моніторингу Stardust: ITracer збирає та надсилає дані трасування застосунків, автоматично інструментуючи кінцеві точки API, HTTP-запити, операції з базою даних і Redis. Його можна використовувати для моніторингу стану системи та аналізу ланцюжків викликів і вузьких місць продуктивності в розподілених системах."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Центр конфігурації Stardust: IConfigProvider централізовано керує конфігурацією, автоматично завантажує дані конфігурації з центру конфігурації та підтримує доставку змін у реальному часі, зокрема рядки підключення до бази даних XCode. Центр конфігурації також призначає кожному екземпляру застосунку унікальний WorkerId, гарантуючи, що алгоритм Snowflake генерує абсолютно унікальні Snowflake ID."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Шина подій Stardust: події застосунків передаються до StarServer через WebSocket; EventHub всередині StarServer розподіляє їх за topic до відповідної шини подій; інші сеанси WebSocket, підписані на цей topic, доставляють повідомлення цільовому застосунку. Під час одиночного розгортання StarServer внутрішня шина використовує реалізацію в пам'яті; під час кластерного розгортання внутрішня шина використовує чергу Redis."
"Stardust probe: {0}": "Зонд Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Реєстр Stardust: IRegistry забезпечує виявлення служб; він автоматично отримує адреси вузлів усіх постачальників за назвою служби та створює IApiClient для виклику служби, додаючи або видаляючи адреси, коли постачальники підключаються або відключаються."
