"Failed to clean up IIS deployment files: {0}": "پاک‌سازی فایل‌های استقرار IIS ناموفق بود: {0}"
# 设置页字段（英文源文，中文提供译文，其余语言回退英文）
"Debug switch. Default false": "کلید اشکال‌زدایی. پیش‌فرض false"
"Disable strict SSH host key checking. Default false (checking enabled)": "غیرفعال‌سازی بررسی سخت‌گیرانه کلید میزبان SSH. پیش‌فرض false (بررسی فعال)"
"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "آدرس سرور Stardust. مثال http://star.newlifex.com:6600؛ پیش‌فرض خالی"
"App key. English name used to register with the Stardust registry": "کلید برنامه. نام انگلیسی مورد استفاده برای ثبت در رجیستری Stardust"
"App secret. Used to register with the Stardust registry": "کلید محرمانه برنامه. برای ثبت در رجیستری Stardust استفاده می‌شود"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "آدرس سرویس. آدرس‌های عمومی برای ساخت URLهای دیگر؛ چند آدرس را با ویرگول جدا کنید و ۵ آدرس پرتکرارتر استفاده می‌شود"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "میزبان‌های مجاز. نام میزبان‌ها با جداکننده ویرگول و نویسه عام *، برای اعتبارسنجی سرآیند Host؛ درخواست‌های IP اعتبارسنجی نمی‌شوند. برای غیرفعال‌سازی اعتبارسنجی خالی بگذارید"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "دوره نمونه‌برداری ردیابی. فاصله گزارش داده‌های ردیابی به Stardust، پیش‌فرض ۶۰ ثانیه"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "حداکثر نمونه‌های عادی. حداکثر رویدادهای عادی ثبت‌شده در هر دوره برای نمودارهای وابستگی، پیش‌فرض ۱"
"Maximum error samples. Maximum error events recorded per period, default 10": "حداکثر نمونه‌های خطا. حداکثر رویدادهای خطا ثبت‌شده در هر دوره، پیش‌فرض ۱۰"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "جمع ردیابی‌های OpenTelemetry. فعالیت کامپوننت‌های شخص ثالث را به ردیابی تبدیل می‌کند، پیش‌فرض true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "پیشوندهای نام ردیابی. بخش‌های متغیر مسیر URL به‌طور خودکار شناسایی می‌شوند؛ پیشوندها را با نقطه‌ویرگول جدا کنید و در صورت نیاز دستی تنظیم کنید"
"Stardust settings": "تنظیمات Stardust"
