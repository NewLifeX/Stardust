"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "مرکز پایش Stardust: ITracer داده‌های ردیابی برنامه را جمع‌آوری و گزارش می‌کند و به‌طور خودکار نقاط پایانی API، درخواست‌های HTTP، عملیات پایگاه داده و عملیات Redis را ابزارگذاری می‌کند. می‌توان از آن برای پایش سلامت سیستم و تحلیل زنجیره فراخوانی و گلوگاه‌های عملکرد در سیستم‌های توزیع‌شده استفاده کرد."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "مرکز پیکربندی Stardust: IConfigProvider پیکربندی را به‌صورت متمرکز مدیریت می‌کند، داده‌های پیکربندی را به‌طور خودکار از مرکز پیکربندی بارگذاری می‌کند و از ارسال تغییرات در زمان واقعی پشتیبانی می‌کند، از جمله رشته‌های اتصال پایگاه داده XCode. همچنین مرکز پیکربندی یک WorkerId یکتا به هر نمونه برنامه اختصاص می‌دهد تا الگوریتم Snowflake شناسه‌های کاملاً یکتا تولید کند."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "گذرگاه رویداد Stardust: رویدادهای برنامه از طریق WebSocket به StarServer گزارش می‌شوند؛ EventHub داخل StarServer آن‌ها را بر اساس موضوع به گذرگاه رویداد مربوطه توزیع می‌کند؛ سپس سایر نشست‌های WebSocket مشترک در آن موضوع، پیام‌ها را به برنامه هدف می‌رسانند. در استقرار مستقل StarServer، گذرگاه داخلی از پیاده‌سازی درون‌حافظه‌ای استفاده می‌کند؛ در استقرار خوشه‌ای، گذرگاه داخلی از صف Redis استفاده می‌کند."
