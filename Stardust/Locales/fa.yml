"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "رجیستری Stardust: IRegistry کشف سرویس را فراهم می‌کند؛ به‌طور خودکار آدرس گره‌های همه ارائه‌دهندگان را بر اساس نام سرویس دریافت می‌کند و یک IApiClient برای فراخوانی سرویس ایجاد می‌کند و با اتصال یا قطع ارائه‌دهندگان، آدرس‌ها را اضافه یا حذف می‌کند."
