"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "سجل Stardust: يوفر IRegistry اكتشاف الخدمات؛ يحصل تلقائيًا على عناوين عقد جميع المزوّدين حسب اسم الخدمة وينشئ IApiClient لاستدعاء الخدمة، مع إضافة العناوين أو إزالتها عند اتصال المزوّدين أو انقطاعهم."
