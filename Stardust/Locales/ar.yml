"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "عنوان الخدمة. العناوين العامة المستخدمة لبناء عناوين URL أخرى؛ افصل العناوين المتعددة بفواصل ويُستخدم أعلى 5 منها حسب تكرار الطلبات"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "المضيفون المسموح بهم. أسماء مضيفين مفصولة بفواصل مع أحرف البدل *، تُستخدم للتحقق من ترويسة Host؛ لا يتم التحقق من طلبات IP. اتركه فارغًا لتعطيل التحقق"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "فترة أخذ عينات التتبع. الفاصل الزمني للإبلاغ عن بيانات التتبع إلى Stardust، الافتراضي 60 ثانية"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "الحد الأقصى للعينات العادية. أقصى عدد من الأحداث العادية المسجلة لكل فترة من أجل رسوم التبعية، الافتراضي 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "الحد الأقصى لعينات الأخطاء. أقصى عدد من أحداث الأخطاء المسجلة لكل فترة، الافتراضي 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "جمع تتبعات OpenTelemetry. يحوّل أنشطة مكونات الجهات الخارجية إلى تتبعات، الافتراضي true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "بادئات أسماء التتبع. تُكتشف مقاطع مسار URL المتغيرة تلقائيًا؛ افصل البادئات بفواصل منقوطة واضبطها يدويًا عند الحاجة"
"Stardust settings": "إعدادات Stardust"
# 运行时消息补充词条
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to follow the system language": "لغة واجهة المستخدم، مثل zh-Hans أو zh-Hant أو en أو ja؛ اتركها فارغة لاتباع لغة النظام"
"Service removed or disabled": "أُزيلت الخدمة أو تم تعطيلها"
"Configuration changed": "تم تغيير التهيئة"
"Unsupported health check protocol: {0}": "بروتوكول فحص السلامة غير مدعوم: {0}"
"Health check error: {0} - {1}": "خطأ في فحص السلامة: {0} - {1}"
"Health check failed: {0} - {1}": "فشل فحص السلامة: {0} - {1}"
"Health check timed out: {0}": "انتهت مهلة فحص السلامة: {0}"
"Health check failed: invalid port - {0}": "فشل فحص السلامة: منفذ غير صالح - {0}"
"Local probe failed: {0}": "فشل الفحص المحلي: {0}"
"Configuration center [{0}] error: {1}": "خطأ في مركز التكوين [{0}]: {1}"
"Monitoring center [{0}] error: {1}: {2}": "خطأ في مركز المراقبة [{0}]: {1}: {2}"
"Event bus [{0}] remote subscription succeeded!": "تم الاشتراك عن بُعد في ناقل الأحداث [{0}] بنجاح!"
"Event bus [{0}] remote unsubscription succeeded!": "تم إلغاء الاشتراك عن بُعد في ناقل الأحداث [{0}] بنجاح!"
"Failed to report the sample data twice; discarding this batch: {0}": "فشل الإبلاغ عن بيانات العينة للمرة الثانية؛ يتم تجاهل هذه الدفعة: {0}"
"Configuration refresh succeeded.": "تم تحديث التكوين بنجاح."
"Service refresh succeeded.": "تم تحديث الخدمة بنجاح."
"Invalid parameter.": "معلمة غير صالحة."
"Succeeded": "ناجح"
"File [{0}] changed; stopping the application and starting it {1}ms later": "تم تغيير الملف [{0}]؛ سيتم إيقاف التطبيق وبدء تشغيله بعد {1}ms"
"Stardust distributed core": "نواة Stardust الموزعة"
"Stardust distributed service framework core library. Provides client SDKs for configuration center, registry, service discovery, distributed tracing, APM, and log center, supporting configuration pulling, service registration and discovery, call tracing, performance and log reporting.": "المكتبة الأساسية لإطار الخدمات الموزعة Stardust. توفر SDKs للعميل لمركز التكوين والسجل واكتشاف الخدمات والتتبع الموزع وAPM ومركز السجلات، وتدعم سحب التكوين وتسجيل الخدمات واكتشافها وتتبع الاستدعاءات وإرسال الأداء والسجلات."
