"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "مركز مراقبة Stardust: يجمع ITracer بيانات تتبع التطبيق ويبلغ عنها، ويضيف أدوات القياس تلقائيًا إلى نقاط نهاية API وطلبات HTTP وعمليات قاعدة البيانات وعمليات Redis. يمكن استخدامه لمراقبة سلامة النظام وتحليل سلاسل الاستدعاء واختناقات الأداء في الأنظمة الموزعة."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "مركز تهيئة Stardust: يدير IConfigProvider التهيئة مركزيًا، ويحمّل بيانات التهيئة تلقائيًا من مركز التهيئة، ويدعم الدفع الفوري للتغييرات، بما في ذلك سلاسل اتصال قاعدة بيانات XCode. كما يخصص مركز التهيئة WorkerId فريدًا لكل نسخة تطبيق، مما يضمن أن تولّد خوارزمية Snowflake معرّفات فريدة تمامًا."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "ناقل أحداث Stardust: تُبلَّغ أحداث التطبيق إلى StarServer عبر WebSocket؛ ويوزعها EventHub داخل StarServer حسب الموضوع إلى ناقل الأحداث المقابل؛ ثم تُسلّم جلسات WebSocket الأخرى المشتركة في ذلك الموضوع الرسائل إلى التطبيق الهدف. في نشر StarServer المستقل، يستخدم الناقل الداخلي تنفيذًا في الذاكرة؛ وفي النشر العنقودي، يستخدم الناقل الداخلي قائمة انتظار Redis."
