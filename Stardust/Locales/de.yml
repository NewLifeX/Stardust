"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust-Überwachungszentrum: ITracer erfasst und meldet Tracing-Daten der Anwendung und instrumentiert automatisch API-Endpunkte, HTTP-Anfragen, Datenbankvorgänge und Redis-Vorgänge. Es kann zur Überwachung der Systemintegrität und zur Analyse von Aufrufketten und Leistungsengpässen in verteilten Systemen verwendet werden."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust-Konfigurationszentrum: IConfigProvider verwaltet die Konfiguration zentral, lädt Konfigurationsdaten automatisch aus dem Konfigurationszentrum und unterstützt die Bereitstellung von Änderungen in Echtzeit, einschließlich XCode-Datenbankverbindungszeichenfolgen. Das Konfigurationszentrum weist außerdem jeder Anwendungsinstanz eine eindeutige WorkerId zu, damit der Snowflake-Algorithmus absolut eindeutige Snowflake-IDs erzeugt."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust-Ereignisbus: Anwendungsereignisse werden über WebSocket an StarServer gemeldet; der EventHub in StarServer verteilt sie nach Thema an den entsprechenden Ereignisbus; andere WebSocket-Sitzungen, die dieses Thema abonniert haben, stellen die Nachrichten dann der Zielanwendung zu. Bei einer eigenständigen StarServer-Bereitstellung verwendet der interne Bus eine In-Memory-Implementierung; bei einer Cluster-Bereitstellung verwendet der interne Bus eine Redis-Warteschlange."
"Stardust probe: {0}": "Stardust-Prüfung: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust-Registrierung: IRegistry bietet Dienstermittlung; sie ruft automatisch die Knotenadressen aller Anbieter anhand des Dienstnamens ab und erstellt einen IApiClient zum Aufrufen des Diensts, wobei Adressen hinzugefügt oder entfernt werden, wenn Anbieter online oder offline gehen."
