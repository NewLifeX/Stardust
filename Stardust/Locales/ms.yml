"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Pusat pemantauan Stardust: ITracer mengumpul dan melaporkan data jejak aplikasi, serta menginstrumentasi titik akhir API, permintaan HTTP, operasi pangkalan data dan operasi Redis secara automatik. Ia boleh digunakan untuk memantau kesihatan sistem serta menganalisis rantaian panggilan dan kesesakan prestasi dalam sistem teragih."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Pusat konfigurasi Stardust: IConfigProvider mengurus konfigurasi secara berpusat, memuatkan data konfigurasi daripada pusat konfigurasi secara automatik, dan menyokong penghantaran perubahan masa nyata, termasuk rentetan sambungan pangkalan data XCode. Pusat konfigurasi juga memberikan WorkerId unik kepada setiap instans aplikasi supaya algoritma Snowflake menghasilkan snowflake ID yang benar-benar unik."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Bas peristiwa Stardust: peristiwa aplikasi dilaporkan ke StarServer melalui WebSocket; EventHub dalam StarServer menghantarnya mengikut topik ke bas peristiwa berkaitan; sesi WebSocket lain yang melanggan topik tersebut kemudian menyampaikan mesej kepada aplikasi sasaran. Dalam deploy StarServer tunggal, bas dalaman menggunakan pelaksanaan dalam memori; dalam deploy kelompok, bas dalaman menggunakan baris gilir Redis."
"Stardust probe: {0}": "Probe Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Pendaftaran Stardust: IRegistry menyediakan penemuan perkhidmatan; ia memperoleh alamat nod semua penyedia mengikut nama perkhidmatan secara automatik dan mencipta IApiClient untuk memanggil perkhidmatan, menambah atau mengalih keluar alamat apabila penyedia dalam talian atau luar talian."
