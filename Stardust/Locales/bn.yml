# 设置页字段（英文源文，中文提供译文，其余语言回退英文）
"Debug switch. Default false": "ডিবাগ সুইচ। ডিফল্ট false"
"Disable strict SSH host key checking. Default false (checking enabled)": "কঠোর SSH হোস্ট কী যাচাই নিষ্ক্রিয় করুন। ডিফল্ট false (যাচাই সক্রিয়)"
"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Stardust সার্ভার ঠিকানা। উদাহরণ http://star.newlifex.com:6600; ডিফল্টভাবে খালি"
"App key. English name used to register with the Stardust registry": "অ্যাপ কী। Stardust রেজিস্ট্রিতে নিবন্ধনের জন্য ব্যবহৃত ইংরেজি নাম"
"App secret. Used to register with the Stardust registry": "অ্যাপ সিক্রেট। Stardust রেজিস্ট্রিতে নিবন্ধনের জন্য ব্যবহৃত হয়"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "পরিষেবা ঠিকানা। অন্যান্য URL তৈরি করতে ব্যবহৃত পাবলিক ঠিকানা; একাধিক ঠিকানা কমা দিয়ে আলাদা করুন এবং অনুরোধের ফ্রিকোয়েন্সি অনুযায়ী শীর্ষ 5টি ব্যবহৃত হয়"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "অনুমোদিত হোস্ট। * ওয়াইল্ডকার্ডসহ কমা দিয়ে আলাদা করা হোস্ট নাম, Host হেডার যাচাই করতে ব্যবহৃত হয়; IP অনুরোধ যাচাই করা হয় না। যাচাই নিষ্ক্রিয় করতে খালি রাখুন"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "ট্রেস স্যাম্পলিং সময়কাল। Stardust-এ ট্রেস ডেটা রিপোর্ট করার বিরতি, ডিফল্ট 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "সর্বোচ্চ সাধারণ নমুনা। নির্ভরতা গ্রাফের জন্য প্রতি সময়কালে রেকর্ড করা সর্বোচ্চ সাধারণ ইভেন্ট, ডিফল্ট 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "সর্বোচ্চ ত্রুটি নমুনা। প্রতি সময়কালে রেকর্ড করা সর্বোচ্চ ত্রুটি ইভেন্ট, ডিফল্ট 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "OpenTelemetry ট্রেস সংগ্রহ করুন। তৃতীয় পক্ষের কম্পোনেন্ট কার্যকলাপকে ট্রেসে রূপান্তর করে, ডিফল্ট true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "ট্রেস নামের উপসর্গ। পরিবর্তনশীল URL পাথ সেগমেন্ট স্বয়ংক্রিয়ভাবে শনাক্ত হয়; উপসর্গগুলো সেমিকোলন দিয়ে আলাদা করুন এবং প্রয়োজনে ম্যানুয়ালি সমন্বয় করুন"
"Stardust settings": "Stardust সেটিংস"
