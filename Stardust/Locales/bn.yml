"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust মনিটরিং কেন্দ্র: ITracer অ্যাপ্লিকেশন ট্রেসিং ডেটা সংগ্রহ ও রিপোর্ট করে এবং API এন্ডপয়েন্ট, HTTP অনুরোধ, ডেটাবেস অপারেশন ও Redis অপারেশন স্বয়ংক্রিয়ভাবে ইন্সট্রুমেন্ট করে। এটি সিস্টেমের স্বাস্থ্য পর্যবেক্ষণ এবং বিতরণকৃত সিস্টেমে কল চেইন ও কর্মক্ষমতার বাধা বিশ্লেষণে ব্যবহার করা যায়।"
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust কনফিগারেশন কেন্দ্র: IConfigProvider কেন্দ্রীয়ভাবে কনফিগারেশন পরিচালনা করে, কনফিগারেশন কেন্দ্র থেকে স্বয়ংক্রিয়ভাবে কনফিগারেশন ডেটা লোড করে এবং XCode ডেটাবেস সংযোগ স্ট্রিংসহ রিয়েল-টাইম পরিবর্তন বিতরণ সমর্থন করে। কনফিগারেশন কেন্দ্র প্রতিটি অ্যাপ্লিকেশন ইনস্ট্যান্সকে একটি অনন্য WorkerId বরাদ্দ করে, যাতে Snowflake অ্যালগরিদম সম্পূর্ণ অনন্য Snowflake ID তৈরি করে।"
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust ইভেন্ট বাস: অ্যাপ্লিকেশন ইভেন্ট WebSocket-এর মাধ্যমে StarServer-এ রিপোর্ট করা হয়; StarServer-এর ভিতরের EventHub সেগুলোকে টপিক অনুযায়ী সংশ্লিষ্ট ইভেন্ট বাসে বিতরণ করে; সেই টপিক সাবস্ক্রাইব করা অন্য WebSocket সেশনগুলো বার্তাগুলো লক্ষ্য অ্যাপ্লিকেশনে পৌঁছে দেয়। একক StarServer স্থাপনায় অভ্যন্তরীণ বাস ইন-মেমরি বাস্তবায়ন ব্যবহার করে; ক্লাস্টার স্থাপনায় অভ্যন্তরীণ বাস Redis কিউ ব্যবহার করে।"
"Stardust probe: {0}": "Stardust প্রোব: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust রেজিস্ট্রি: IRegistry পরিষেবা আবিষ্কার প্রদান করে; এটি পরিষেবার নাম অনুযায়ী সব প্রোভাইডারের নোড ঠিকানা স্বয়ংক্রিয়ভাবে সংগ্রহ করে এবং পরিষেবা কল করার জন্য IApiClient তৈরি করে, প্রোভাইডার অনলাইন বা অফলাইন হলে ঠিকানা যোগ বা সরায়।"
