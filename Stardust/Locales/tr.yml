"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust izleme merkezi: ITracer uygulama izleme verilerini toplar ve bildirir; API uç noktalarını, HTTP isteklerini, veritabanı işlemlerini ve Redis işlemlerini otomatik olarak izler. Dağıtılmış sistemlerde sistem durumunu izlemek, çağrı zincirlerini ve performans darboğazlarını analiz etmek için kullanılabilir."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust yapılandırma merkezi: IConfigProvider yapılandırmayı merkezi olarak yönetir, yapılandırma verilerini yapılandırma merkezinden otomatik olarak yükler ve XCode veritabanı bağlantı dizeleri dahil olmak üzere gerçek zamanlı değişiklik iletimini destekler. Yapılandırma merkezi ayrıca her uygulama örneğine benzersiz bir WorkerId atayarak Snowflake algoritmasının kesinlikle benzersiz snowflake ID üretmesini sağlar."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust olay veriyolu: uygulama olayları WebSocket üzerinden StarServer'a bildirilir; StarServer içindeki EventHub bunları konuya göre ilgili olay veriyoluna dağıtır; o konuya abone olan diğer WebSocket oturumları da iletileri hedef uygulamaya ulaştırır. Tek sunuculu StarServer dağıtımında iç veriyolu bellek içi uygulama kullanır; kümelenmiş dağıtımda ise iç veriyolu bir Redis kuyruğu kullanır."
"Stardust probe: {0}": "Stardust yoklaması: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust kayıt merkezi: IRegistry hizmet bulma sağlar; hizmet adına göre tüm sağlayıcıların düğüm adreslerini otomatik olarak alır ve hizmeti çağırmak için bir IApiClient oluşturur; sağlayıcılar çevrimiçi veya çevrimdışı oldukça adresleri ekler ya da kaldırır."
