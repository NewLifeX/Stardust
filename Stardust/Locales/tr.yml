"App key. English name used to register with the Stardust registry": "Uygulama anahtarı. Stardust kayıt merkezine kaydolmak için kullanılan İngilizce ad"
"App secret. Used to register with the Stardust registry": "Uygulama gizli anahtarı. Stardust kayıt merkezine kaydolmak için kullanılır"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Hizmet adresi. Diğer URL'leri oluşturmak için kullanılan genel adresler; birden çok adresi virgülle ayırın, istek sıklığına göre en üstteki 5 adres kullanılır"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "İzin verilen ana makineler. * joker karakterleri içerebilen, virgülle ayrılmış ana makine adları; Host başlığını doğrulamak için kullanılır; IP istekleri doğrulanmaz. Doğrulamayı devre dışı bırakmak için boş bırakın"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "İzleme örnekleme aralığı. İzleme verilerini Stardust'a bildirme aralığı, varsayılan 60 sn"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Maksimum normal örnek. Bağımlılık grafikleri için dönem başına kaydedilen maksimum normal olay sayısı, varsayılan 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Maksimum hata örneği. Dönem başına kaydedilen maksimum hata olayı sayısı, varsayılan 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "OpenTelemetry izlemelerini topla. Üçüncü taraf bileşen etkinliklerini izlemelere dönüştürür, varsayılan true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "İzleme adı önekleri. Değişken URL yol parçaları otomatik algılanır; önekleri noktalı virgülle ayırın ve gerekirse elle uyarlayın"
"Stardust settings": "Stardust ayarları"
