"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust-overvågningscenter: ITracer indsamler og rapporterer sporingsdata fra applikationer og instrumenterer automatisk API-slutpunkter, HTTP-anmodninger, databaseoperationer og Redis-operationer. Det kan bruges til at overvåge systemets tilstand og analysere kaldskæder og flaskehalse i ydeevnen i distribuerede systemer."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust-konfigurationscenter: IConfigProvider administrerer konfigurationen centralt, indlæser automatisk konfigurationsdata fra konfigurationscentret og understøtter levering af ændringer i realtid, herunder XCode-databaseforbindelsesstrenge. Konfigurationscentret tildeler også en unik WorkerId til hver applikationsinstans, så Snowflake-algoritmen garanteret genererer absolut unikke snowflake-ID'er."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust-hændelsesbus: applikationshændelser rapporteres til StarServer via WebSocket; EventHub i StarServer fordeler dem efter emne til den tilsvarende hændelsesbus; andre WebSocket-sessioner, der abonnerer på emnet, leverer derefter meddelelserne til målapplikationen. I en selvstændig StarServer-udrulning bruger den interne bus en hukommelsesbaseret implementering; i en klyngeudrulning bruger den interne bus en Redis-kø."
"Stardust probe: {0}": "Stardust-sond: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust-register: IRegistry leverer tjenesteopdagelse; det henter automatisk nodeadresserne for alle udbydere via tjenestenavn og opretter en IApiClient til at kalde tjenesten, mens adresser tilføjes eller fjernes, når udbydere kommer online eller offline."
