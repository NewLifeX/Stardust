"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Tjenesteadresse. Offentlige adresser, der bruges til at opbygge andre URL'er; adskil flere adresser med kommaer, og de 5 mest anvendte bruges"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Tilladte værter. Kommaseparerede værtsnavne med *-jokertegn, der bruges til at validere Host-headeren; IP-anmodninger valideres ikke. Lad feltet være tomt for at deaktivere validering"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Sporingsprøveperiode. Interval for rapportering af sporingsdata til Stardust, standard 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Maksimalt antal normale prøver. Maksimalt antal normale hændelser, der registreres pr. periode til afhængighedsgrafer, standard 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Maksimalt antal fejlprøver. Maksimalt antal fejlhændelser, der registreres pr. periode, standard 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Indsaml OpenTelemetry-spor. Konverterer aktiviteter fra tredjepartskomponenter til spor, standard true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Præfikser for sporingsnavne. Variable URL-stisegmenter registreres automatisk; adskil præfikser med semikolon, og juster manuelt efter behov"
"Stardust settings": "Stardust-indstillinger"
