"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Pusat pemantauan Stardust: ITracer mengumpulkan dan melaporkan data trace aplikasi, serta otomatis menginstrumentasi endpoint API, permintaan HTTP, operasi database, dan operasi Redis. Dapat digunakan untuk memantau kesehatan sistem serta menganalisis rantai panggilan dan hambatan kinerja pada sistem terdistribusi."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Pusat konfigurasi Stardust: IConfigProvider mengelola konfigurasi secara terpusat, otomatis memuat data konfigurasi dari pusat konfigurasi, dan mendukung pengiriman perubahan secara real-time, termasuk string koneksi database XCode. Pusat konfigurasi juga memberikan WorkerId unik untuk setiap instans aplikasi sehingga algoritme Snowflake menghasilkan snowflake ID yang benar-benar unik."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Bus peristiwa Stardust: peristiwa aplikasi dilaporkan ke StarServer melalui WebSocket; EventHub di dalam StarServer mendistribusikannya berdasarkan topik ke bus peristiwa terkait; sesi WebSocket lain yang berlangganan topik tersebut kemudian mengirimkan pesan ke aplikasi tujuan. Pada deployment StarServer tunggal, bus internal memakai implementasi dalam memori; pada deployment klaster, bus internal memakai antrean Redis."
"Stardust probe: {0}": "Probe Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registri Stardust: IRegistry menyediakan penemuan layanan; otomatis memperoleh alamat node semua penyedia berdasarkan nama layanan dan membuat IApiClient untuk memanggil layanan, lalu menambah atau menghapus alamat saat penyedia online atau offline."
