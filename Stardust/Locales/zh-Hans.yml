"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "采集 OpenTelemetry 埋点。把进程内第三方组件的活动转成埋点上报，默认true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "埋点名称截断前缀。自动识别URL路径中的可变参数后提取，多个前缀分号隔开，可手工调整"
