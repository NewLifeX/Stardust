"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust 모니터링 센터: ITracer는 애플리케이션 추적 데이터를 수집하고 보고하며, API 엔드포인트, HTTP 요청, 데이터베이스 작업, Redis 작업을 자동으로 계측합니다. 분산 시스템에서 시스템 상태를 모니터링하고 호출 체인과 성능 병목을 분석하는 데 사용할 수 있습니다."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust 구성 센터: IConfigProvider는 구성을 중앙에서 관리하고, 구성 센터에서 구성 데이터를 자동으로 로드하며, XCode 데이터베이스 연결 문자열을 포함한 실시간 변경 전달을 지원합니다. 구성 센터는 또한 각 애플리케이션 인스턴스에 고유한 WorkerId를 할당하여 Snowflake 알고리즘이 절대적으로 고유한 snowflake ID를 생성하도록 보장합니다."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust 이벤트 버스: 애플리케이션 이벤트는 WebSocket을 통해 StarServer로 보고되고, StarServer 내부의 EventHub가 토픽별로 해당 이벤트 버스로 전달하며, 해당 토픽을 구독한 다른 WebSocket 세션이 메시지를 대상 애플리케이션으로 전달합니다. 단일 StarServer 배포에서는 내부 버스가 인메모리 구현을 사용하고, 클러스터 배포에서는 내부 버스가 Redis 큐를 사용합니다."
"Stardust probe: {0}": "Stardust 프로브: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust 레지스트리: IRegistry는 서비스 검색을 제공하며, 서비스 이름으로 모든 공급자의 노드 주소를 자동으로 가져오고 서비스 호출용 IApiClient를 생성하며, 공급자가 온라인/오프라인될 때 주소를 추가하거나 제거합니다."
