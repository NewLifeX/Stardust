# 设置页字段（英文源文，中文提供译文，其余语言回退英文）
"Debug switch. Default false": "디버그 스위치입니다. 기본값 false"
"Disable strict SSH host key checking. Default false (checking enabled)": "엄격한 SSH 호스트 키 검사를 사용하지 않습니다. 기본값 false(검사 사용)"
"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Stardust 서버 주소입니다. 예: http://star.newlifex.com:6600, 기본값은 비어 있음"
"App key. English name used to register with the Stardust registry": "앱 키입니다. Stardust 레지스트리에 등록할 때 사용하는 영문 이름"
"App secret. Used to register with the Stardust registry": "앱 비밀 값입니다. Stardust 레지스트리에 등록할 때 사용합니다"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "서비스 주소입니다. 다른 URL을 구성할 때 사용하는 공용 주소이며, 여러 주소는 쉼표로 구분하고 요청 빈도 기준 상위 5개를 사용합니다"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "허용 호스트입니다. * 와일드카드를 포함할 수 있는 쉼표로 구분된 호스트 이름으로 Host 헤더를 검증하는 데 사용하며, IP 요청은 검증하지 않습니다. 비워 두면 검증을 사용하지 않습니다"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "추적 샘플링 주기입니다. 추적 데이터를 Stardust로 보고하는 간격이며 기본값은 60초입니다"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "최대 정상 샘플 수입니다. 의존성 그래프를 위해 주기당 기록하는 최대 정상 이벤트 수이며 기본값은 1입니다"
"Maximum error samples. Maximum error events recorded per period, default 10": "최대 오류 샘플 수입니다. 주기당 기록하는 최대 오류 이벤트 수이며 기본값은 10입니다"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "OpenTelemetry 추적을 수집합니다. 타사 구성 요소의 활동을 추적으로 변환하며 기본값은 true입니다"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "추적 이름 접두사입니다. 가변 URL 경로 세그먼트는 자동으로 감지하며, 접두사는 세미콜론으로 구분하고 필요하면 직접 조정하세요"
"Stardust settings": "Stardust 설정"
