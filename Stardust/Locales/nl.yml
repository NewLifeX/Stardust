"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust-monitoringscentrum: ITracer verzamelt en rapporteert traceringsgegevens van applicaties en instrumenteert automatisch API-eindpunten, HTTP-aanvragen, databasebewerkingen en Redis-bewerkingen. Het kan worden gebruikt om de systeemgezondheid te bewaken en om oproepketens en prestatieknelpunten in gedistribueerde systemen te analyseren."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust-configuratiecentrum: IConfigProvider beheert de configuratie centraal, laadt configuratiegegevens automatisch uit het configuratiecentrum en ondersteunt realtime levering van wijzigingen, inclusief XCode-databaseverbindingsreeksen. Het configuratiecentrum wijst ook een unieke WorkerId toe aan elk applicatie-exemplaar, zodat het Snowflake-algoritme gegarandeerd absoluut unieke snowflake-ID's genereert."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust-gebeurtenisbus: applicatiegebeurtenissen worden via WebSocket aan StarServer gerapporteerd; de EventHub in StarServer verdeelt ze op onderwerp naar de bijbehorende gebeurtenisbus; andere WebSocket-sessies die op dat onderwerp zijn geabonneerd, bezorgen de berichten vervolgens bij de doelapplicatie. In een zelfstandige StarServer-implementatie gebruikt de interne bus een in-memory implementatie; in een clusterimplementatie gebruikt de interne bus een Redis-wachtrij."
"Stardust probe: {0}": "Stardust-probe: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust-register: IRegistry biedt servicediscovery; het haalt automatisch de knooppuntadressen van alle providers op basis van servicenaam op en maakt een IApiClient voor het aanroepen van de service, waarbij adressen worden toegevoegd of verwijderd wanneer providers online of offline gaan."
