"Stardust monitoring center Server={0} AppId={1} ClientId={2}": "Stardust megfigyelő központ Server={0} AppId={1} ClientId={2}"
"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust megfigyelő központ: az ITracer gyűjti és jelenti az alkalmazás nyomkövetési adatait, automatikusan instrumentálva az API-végpontokat, a HTTP-kéréseket, az adatbázis-műveleteket és a Redis-műveleteket. Használható a rendszer állapotának megfigyelésére, valamint hívási láncok és teljesítmény-szűk keresztmetszetek elemzésére elosztott rendszerekben."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust konfigurációs központ: az IConfigProvider központilag kezeli a konfigurációt, automatikusan betölti a konfigurációs adatokat a konfigurációs központból, és támogatja a valós idejű változáskézbesítést, beleértve az XCode adatbázis-kapcsolati karakterláncokat is. A konfigurációs központ emellett egyedi WorkerId-t rendel minden alkalmazáspéldányhoz, biztosítva, hogy a Snowflake algoritmus feltétlenül egyedi snowflake ID-ket állítson elő."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust eseménybusz: az alkalmazásesemények WebSocketen keresztül jutnak el a StarServerhez; a StarServeren belüli EventHub témák szerint továbbítja őket a megfelelő eseménybuszra; az adott témára feliratkozott többi WebSocket-munkamenet ezután eljuttatja az üzeneteket a célalkalmazáshoz. Egyedi StarServer-telepítésnél a belső busz memóriabeli megvalósítást használ; klaszterelt telepítésnél a belső busz Redis-sort használ."
"Stardust probe: {0}": "Stardust-próba: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust nyilvántartás: az IRegistry szolgáltatásfelderítést biztosít; szolgáltatásnév alapján automatikusan lekéri az összes szolgáltató csomópontcímét, és létrehoz egy IApiClient-et a szolgáltatás hívásához, hozzáadva vagy eltávolítva a címeket, ahogy a szolgáltatók online vagy offline állapotba kerülnek."
