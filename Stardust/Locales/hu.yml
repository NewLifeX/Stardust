"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Nyomkövetési mintavételi időszak. A nyomkövetési adatok Stardusthoz történő jelentésének időköze, alapértelmezés: 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Maximális normál minta. A függőségi gráfokhoz időszakonként rögzített normál események maximális száma, alapértelmezés: 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Maximális hibaminta. Az időszakonként rögzített hibaesemények maximális száma, alapértelmezés: 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "OpenTelemetry-nyomok gyűjtése. A harmadik féltől származó összetevők tevékenységeit nyomokká alakítja, alapértelmezés: true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Nyomkövetési név-előtagok. A változó URL-útvonalszakaszok automatikusan felismerésre kerülnek; az előtagokat pontosvesszővel válassza el, és szükség esetén kézzel igazítsa"
"Stardust settings": "Stardust beállítások"
# 运行时消息补充词条
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to follow the system language": "Felhasználói felület nyelve, például zh-Hans, zh-Hant, en vagy ja; hagyja üresen a rendszer nyelvének követéséhez"

