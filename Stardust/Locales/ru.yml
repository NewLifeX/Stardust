"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Адрес сервера Stardust. Например, http://star.newlifex.com:6600; по умолчанию пусто"
"App key. English name used to register with the Stardust registry": "Ключ приложения. Английское имя для регистрации в реестре Stardust"
"App secret. Used to register with the Stardust registry": "Секрет приложения. Используется для регистрации в реестре Stardust"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Адрес службы. Публичные адреса для построения других URL; несколько адресов разделяются запятыми, используются 5 наиболее часто запрашиваемых"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Разрешённые хосты. Имена хостов через запятую с подстановкой *, используются для проверки заголовка Host; IP-запросы не проверяются. Оставьте пустым, чтобы отключить проверку"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Период выборки трассировки. Интервал отправки данных трассировки в Stardust, по умолчанию 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Максимум нормальных выборок. Максимальное число нормальных событий за период для графов зависимостей, по умолчанию 1"
