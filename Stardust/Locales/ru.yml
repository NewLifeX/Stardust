"Stardust monitoring center Server={0} AppId={1} ClientId={2}": "Центр мониторинга Stardust Server={0} AppId={1} ClientId={2}"
"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Центр мониторинга Stardust: ITracer собирает и отправляет данные трассировки приложений, автоматически инструментируя конечные точки API, HTTP-запросы, операции с базой данных и Redis. Его можно использовать для мониторинга состояния системы и анализа цепочек вызовов и узких мест производительности в распределённых системах."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Центр конфигурации Stardust: IConfigProvider централизованно управляет конфигурацией, автоматически загружает данные конфигурации из центра конфигурации и поддерживает доставку изменений в реальном времени, включая строки подключения к базе данных XCode. Центр конфигурации также назначает каждому экземпляру приложения уникальный WorkerId, гарантируя, что алгоритм Snowflake генерирует абсолютно уникальные Snowflake ID."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Шина событий Stardust: события приложений передаются в StarServer по WebSocket; EventHub внутри StarServer распределяет их по topic в соответствующую шину событий; другие сеансы WebSocket, подписанные на этот topic, доставляют сообщения целевому приложению. При одиночном развёртывании StarServer внутренняя шина использует реализацию в памяти; при кластерном развёртывании внутренняя шина использует очередь Redis."
"Stardust probe: {0}": "Зонд Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Реестр Stardust: IRegistry обеспечивает обнаружение служб; он автоматически получает адреса узлов всех поставщиков по имени службы и создаёт IApiClient для вызова службы, добавляя или удаляя адреса при подключении или отключении поставщиков."
