"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust-övervakningscentral: ITracer samlar in och rapporterar spårningsdata från applikationer och instrumenterar automatiskt API-slutpunkter, HTTP-begäranden, databasåtgärder och Redis-åtgärder. Den kan användas för att övervaka systemhälsan och analysera anropskedjor och prestandaflaskhalsar i distribuerade system."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust-konfigurationscentral: IConfigProvider hanterar konfigurationen centralt, läser automatiskt in konfigurationsdata från konfigurationscentralen och stöder leverans av ändringar i realtid, inklusive XCode-databasanslutningssträngar. Konfigurationscentralen tilldelar också en unik WorkerId till varje applikationsinstans så att Snowflake-algoritmen garanterat genererar absolut unika snöflinga-ID:n."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust-händelsebuss: applikationshändelser rapporteras till StarServer via WebSocket; EventHub i StarServer skickar dem efter ämne till motsvarande händelsebuss; andra WebSocket-sessioner som prenumererar på ämnet levererar sedan meddelandena till målapplikationen. I en fristående StarServer-driftsättning använder den interna bussen en minnesbaserad implementering; i en klusterdriftsättning använder den interna bussen en Redis-kö."
"Stardust probe: {0}": "Stardust-sond: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust-register: IRegistry tillhandahåller tjänsteupptäckt; den hämtar automatiskt nodadresserna för alla leverantörer via tjänstenamn och skapar en IApiClient för att anropa tjänsten, med tillägg eller borttagning av adresser när leverantörer ansluter eller kopplas från."
