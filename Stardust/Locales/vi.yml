"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Địa chỉ máy chủ Stardust. Ví dụ http://star.newlifex.com:6600; mặc định để trống"
"App key. English name used to register with the Stardust registry": "Khóa ứng dụng. Tên tiếng Anh dùng để đăng ký với registry Stardust"
"App secret. Used to register with the Stardust registry": "Bí mật ứng dụng. Dùng để đăng ký với registry Stardust"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "Địa chỉ dịch vụ. Địa chỉ công khai dùng để tạo URL khác; phân tách nhiều địa chỉ bằng dấu phẩy và dùng 5 địa chỉ được yêu cầu nhiều nhất"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Máy chủ được phép. Tên máy chủ phân tách bằng dấu phẩy có ký tự đại diện *, dùng để kiểm tra header Host; yêu cầu bằng IP không được kiểm tra. Để trống để tắt kiểm tra"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Chu kỳ lấy mẫu trace. Khoảng thời gian báo cáo dữ liệu trace tới Stardust, mặc định 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Số mẫu thường tối đa. Số sự kiện thường tối đa mỗi chu kỳ cho đồ thị phụ thuộc, mặc định 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Số mẫu lỗi tối đa. Số sự kiện lỗi tối đa mỗi chu kỳ, mặc định 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Thu thập trace OpenTelemetry. Chuyển hoạt động của thành phần bên thứ ba thành trace, mặc định true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Tiền tố tên trace. Các đoạn đường dẫn URL biến đổi được phát hiện tự động; phân tách tiền tố bằng dấu chấm phẩy và điều chỉnh khi cần"
"Stardust settings": "Cài đặt Stardust"
# 运行时消息补充词条
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to follow the system language": "Ngôn ngữ giao diện, ví dụ zh-Hans, zh-Hant, en hoặc ja; để trống để theo ngôn ngữ hệ thống"
"Service removed or disabled": "Dịch vụ đã bị xóa hoặc tắt"
"Configuration changed": "Cấu hình đã thay đổi"
"Unsupported health check protocol: {0}": "Giao thức kiểm tra tình trạng không được hỗ trợ: {0}"
"Health check error: {0} - {1}": "Lỗi kiểm tra tình trạng: {0} - {1}"
"Health check failed: {0} - {1}": "Kiểm tra tình trạng thất bại: {0} - {1}"
"Health check timed out: {0}": "Kiểm tra tình trạng quá thời gian: {0}"
"Health check failed: invalid port - {0}": "Kiểm tra tình trạng thất bại: cổng không hợp lệ - {0}"
"Local probe failed: {0}": "Thăm dò cục bộ thất bại: {0}"
"Configuration center [{0}] error: {1}": "Lỗi trung tâm cấu hình [{0}]: {1}"
"Monitoring center [{0}] error: {1}: {2}": "Lỗi trung tâm giám sát [{0}]: {1}: {2}"
"Event bus [{0}] remote subscription succeeded!": "Đăng ký từ xa bus sự kiện [{0}] thành công!"
"Event bus [{0}] remote unsubscription succeeded!": "Hủy đăng ký từ xa bus sự kiện [{0}] thành công!"
"Failed to report the sample data twice; discarding this batch: {0}": "Báo cáo lại dữ liệu mẫu thất bại; lô này sẽ bị hủy bỏ: {0}"
"Configuration refresh succeeded.": "Làm mới cấu hình thành công."
"Service refresh succeeded.": "Làm mới dịch vụ thành công."
"Invalid parameter.": "Tham số không hợp lệ."
"Succeeded": "Thành công"
"File [{0}] changed; stopping the application and starting it {1}ms later": "Tệp [{0}] đã thay đổi; ứng dụng sẽ dừng và khởi động lại sau {1}ms"
"Stardust distributed core": "Lõi phân tán Stardust"
"Stardust distributed service framework core library. Provides client SDKs for configuration center, registry, service discovery, distributed tracing, APM, and log center, supporting configuration pulling, service registration and discovery, call tracing, performance and log reporting.": "Thư viện lõi của khung dịch vụ phân tán Stardust. Cung cấp SDK máy khách cho trung tâm cấu hình, sổ đăng ký, khám phá dịch vụ, theo dõi phân tán, APM và trung tâm nhật ký, hỗ trợ lấy cấu hình, đăng ký và khám phá dịch vụ, theo dõi lệnh gọi cũng như báo cáo hiệu năng và nhật ký."
