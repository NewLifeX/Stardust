"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Trung tâm giám sát Stardust: ITracer thu thập và báo cáo dữ liệu trace của ứng dụng, tự động instrument các endpoint API, yêu cầu HTTP, thao tác cơ sở dữ liệu và thao tác Redis. Có thể dùng để giám sát tình trạng hệ thống và phân tích chuỗi gọi và điểm nghẽn hiệu năng trong hệ thống phân tán."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Trung tâm cấu hình Stardust: IConfigProvider quản lý cấu hình tập trung, tự động tải dữ liệu cấu hình từ trung tâm cấu hình và hỗ trợ đẩy thay đổi theo thời gian thực, bao gồm chuỗi kết nối cơ sở dữ liệu XCode. Trung tâm cấu hình cũng gán WorkerId duy nhất cho mỗi phiên bản ứng dụng, đảm bảo thuật toán Snowflake tạo ra snowflake ID hoàn toàn duy nhất."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Bus sự kiện Stardust: sự kiện của ứng dụng được báo cáo tới StarServer qua WebSocket; EventHub bên trong StarServer phân phối theo chủ đề đến bus sự kiện tương ứng; các phiên WebSocket khác đăng ký chủ đề đó sẽ chuyển tiếp thông báo đến ứng dụng đích. Khi triển khai StarServer đơn lẻ, bus nội bộ dùng triển khai trong bộ nhớ; khi triển khai cụm, bus nội bộ dùng hàng đợi Redis."
"Stardust probe: {0}": "Thăm dò Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registry Stardust: IRegistry cung cấp khám phá dịch vụ; tự động lấy địa chỉ node của tất cả nhà cung cấp theo tên dịch vụ và tạo IApiClient để gọi dịch vụ, thêm hoặc xóa địa chỉ khi nhà cung cấp trực tuyến hoặc ngoại tuyến."
