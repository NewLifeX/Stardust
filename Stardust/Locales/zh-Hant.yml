# 设置页字段（英文源文，中文提供译文，其余语言回退英文）
"Debug switch. Default false": "偵錯開關。預設 false"
"Disable strict SSH host key checking. Default false (checking enabled)": "停用 SSH 嚴格主機金鑰檢查。預設 false（啟用檢查）"
"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "星塵伺服器位址。例如 http://star.newlifex.com:6600，預設為空"
"App key. English name used to register with the Stardust registry": "應用識別。接入星塵註冊中心，英文名"
"App secret. Used to register with the Stardust registry": "應用金鑰。接入星塵註冊中心"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "服務位址。使用者存取的原始外網位址，用於內部建構其他 Url，多個位址以逗號分隔，依使用者存取頻率取前 5 個"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "允許的主機。多個主機名以逗號分隔，支援 * 模糊比對，用於驗證請求的 Host 標頭，IP 位址請求不進行驗證。留空則不驗證"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "追蹤取樣週期。定期上報埋點資料到星塵平台，預設 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "最大正常取樣數。取樣週期內，最多只記錄指定數量的正常事件，用於繪製相依關係，預設 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "最大異常取樣數。取樣週期內，最多只記錄指定數量的異常事件，預設 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "採集 OpenTelemetry 埋點。把行程內第三方元件的活動轉成埋點上報，預設 true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "埋點名稱截斷前綴。自動辨識 URL 路徑中的可變參數後擷取，多個前綴以分號分隔，可手動調整"
"Stardust settings": "星塵設定"
