"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "星塵監控中心：ITracer採集並上報應用埋點數據，自動埋點Api接口、Http請求、數據庫操作、Redis操作等。可用於監控系統健康狀態，分析分佈式系統的調用鏈和性能瓶頸。"
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "星塵配置中心：IConfigProvider集中管理配置，自動從配置中心加載配置數據並支持變更實時下發，包括XCode數據庫連接字符串等。配置中心同時支持分配應用實例的唯一WorkerId，確保Snowflake算法能夠生成絕對唯一的雪花Id"
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "星塵事件總線：應用事件通過 WebSocket 上報到 StarServer；StarServer 內部的 EventHub 按 topic 分發到對應的事件總線；訂閱該 topic 的其它 WebSocket 會話再把消息下發到目標應用。StarServer 單體部署時內部總線使用內存實現；集群部署時內部總線使用 Redis 隊列實現。"
"Stardust probe: {0}": "星塵探測：{0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "星塵註冊中心：IRegistry提供服務發現能力，可根據服務名自動獲取所有提供者的節點地址，並創建調用服務的IApiClient客戶端，並根據服務提供者的上線與下線自動新增或減少服務地址。"
