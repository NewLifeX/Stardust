"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Centro de monitorización de Stardust: ITracer recopila y notifica los datos de seguimiento de la aplicación e instrumenta automáticamente los puntos de conexión de API, las solicitudes HTTP, las operaciones de base de datos y las operaciones de Redis. Permite supervisar el estado del sistema y analizar las cadenas de llamadas y los cuellos de botella de rendimiento en sistemas distribuidos."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Centro de configuración de Stardust: IConfigProvider gestiona la configuración de forma centralizada, carga automáticamente los datos de configuración desde el centro de configuración y admite la entrega de cambios en tiempo real, incluidas las cadenas de conexión de base de datos de XCode. El centro de configuración también asigna un WorkerId único a cada instancia de aplicación, lo que garantiza que el algoritmo Snowflake genere ID de copo de nieve absolutamente únicos."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Bus de eventos de Stardust: los eventos de la aplicación se notifican a StarServer por WebSocket; el EventHub dentro de StarServer los distribuye por tema al bus de eventos correspondiente; otras sesiones WebSocket suscritas a ese tema entregan después los mensajes a la aplicación de destino. En un despliegue único de StarServer, el bus interno usa una implementación en memoria; en un despliegue en clúster, el bus interno usa una cola de Redis."
"Stardust probe: {0}": "Sonda de Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registro de Stardust: IRegistry ofrece descubrimiento de servicios; obtiene automáticamente las direcciones de nodo de todos los proveedores por nombre de servicio y crea un IApiClient para llamar al servicio, agregando o eliminando direcciones a medida que los proveedores se conectan o desconectan."
