"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Recopilar trazas de OpenTelemetry. Convierte las actividades de componentes de terceros en trazas, predeterminado true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Prefijos de nombres de trazas. Los segmentos variables de la ruta URL se detectan automáticamente; separe los prefijos con punto y coma y ajústelos manualmente si es necesario"
