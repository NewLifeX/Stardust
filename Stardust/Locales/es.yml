"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Hosts permitidos. Nombres de host separados por comas con comodines *, usados para validar el encabezado Host; las solicitudes por IP no se validan. Déjelo vacío para deshabilitar la validación"
