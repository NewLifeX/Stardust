"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust मॉनिटरिंग केंद्र: ITracer एप्लिकेशन ट्रेसिंग डेटा एकत्र और रिपोर्ट करता है, तथा API एंडपॉइंट, HTTP अनुरोध, डेटाबेस संचालन और Redis संचालन को स्वचालित रूप से इंस्ट्रुमेंट करता है। इसका उपयोग सिस्टम स्वास्थ्य की निगरानी तथा वितरित सिस्टम में कॉल चेन और प्रदर्शन अवरोधों का विश्लेषण करने के लिए किया जा सकता है।"
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust कॉन्फ़िगरेशन केंद्र: IConfigProvider कॉन्फ़िगरेशन का केंद्रीय प्रबंधन करता है, कॉन्फ़िगरेशन केंद्र से कॉन्फ़िगरेशन डेटा स्वचालित रूप से लोड करता है, और XCode डेटाबेस कनेक्शन स्ट्रिंग सहित परिवर्तनों का रीयल-टाइम वितरण समर्थित करता है। कॉन्फ़िगरेशन केंद्र प्रत्येक एप्लिकेशन इंस्टेंस को विशिष्ट WorkerId भी सौंपता है, जिससे Snowflake एल्गोरिद्म पूर्णतः विशिष्ट Snowflake ID उत्पन्न करता है।"
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust इवेंट बस: एप्लिकेशन ईवेंट WebSocket के माध्यम से StarServer को रिपोर्ट किए जाते हैं; StarServer के भीतर EventHub उन्हें विषय के अनुसार संबंधित ईवेंट बस पर वितरित करता है; उस विषय की सदस्यता लेने वाले अन्य WebSocket सत्र संदेशों को लक्ष्य एप्लिकेशन तक पहुँचाते हैं। एकल StarServer डिप्लॉयमेंट में आंतरिक बस इन-मेमोरी कार्यान्वयन का उपयोग करती है; क्लस्टर डिप्लॉयमेंट में आंतरिक बस Redis क्यू का उपयोग करती है।"
"Stardust probe: {0}": "Stardust प्रोब: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust रजिस्ट्री: IRegistry सेवा खोज प्रदान करती है; यह सेवा नाम के अनुसार सभी प्रदाताओं के नोड पते स्वचालित रूप से प्राप्त करती है और सेवा कॉल करने के लिए IApiClient बनाती है, तथा प्रदाताओं के ऑनलाइन या ऑफ़लाइन होने पर पते जोड़ती या हटाती है।"
