"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Stardust सर्वर पता। उदाहरण http://star.newlifex.com:6600; डिफ़ॉल्ट रूप से खाली"
"App key. English name used to register with the Stardust registry": "ऐप कुंजी। Stardust रजिस्ट्री में पंजीकरण के लिए उपयोग किया जाने वाला अंग्रेज़ी नाम"
"App secret. Used to register with the Stardust registry": "ऐप सीक्रेट। Stardust रजिस्ट्री में पंजीकरण के लिए उपयोग होता है"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "सेवा पता। अन्य URL बनाने के लिए उपयोग किए जाने वाले सार्वजनिक पते; कई पतों को कॉमा से अलग करें और अनुरोध आवृत्ति के अनुसार शीर्ष 5 का उपयोग होता है"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "अनुमत होस्ट। * वाइल्डकार्ड के साथ कॉमा से अलग किए गए होस्ट नाम, Host हेडर को सत्यापित करने के लिए उपयोग होते हैं; IP अनुरोध सत्यापित नहीं होते। सत्यापन अक्षम करने के लिए खाली छोड़ें"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "ट्रेस सैंपलिंग अवधि। Stardust को ट्रेस डेटा रिपोर्ट करने का अंतराल, डिफ़ॉल्ट 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "अधिकतम सामान्य नमूने। निर्भरता ग्राफ़ के लिए प्रति अवधि दर्ज अधिकतम सामान्य ईवेंट, डिफ़ॉल्ट 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "अधिकतम त्रुटि नमूने। प्रति अवधि दर्ज अधिकतम त्रुटि ईवेंट, डिफ़ॉल्ट 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "OpenTelemetry ट्रेस एकत्र करें। तृतीय-पक्ष घटक गतिविधियों को ट्रेस में बदलता है, डिफ़ॉल्ट true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "ट्रेस नाम उपसर्ग। परिवर्तनीय URL पथ खंड स्वचालित रूप से पहचाने जाते हैं; उपसर्गों को अर्धविराम से अलग करें और आवश्यकता होने पर मैन्युअल रूप से समायोजित करें"
