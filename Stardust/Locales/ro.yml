"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Centrul de monitorizare Stardust: ITracer colectează și raportează datele de urmărire ale aplicației, instrumentând automat punctele finale API, cererile HTTP, operațiile cu baza de date și operațiile Redis. Poate fi folosit pentru a monitoriza starea sistemului și a analiza lanțurile de apeluri și blocajele de performanță în sistemele distribuite."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Centrul de configurare Stardust: IConfigProvider administrează centralizat configurația, încarcă automat datele de configurare din centrul de configurare și acceptă livrarea modificărilor în timp real, inclusiv șirurile de conexiune la baza de date XCode. Centrul de configurare atribuie, de asemenea, un WorkerId unic fiecărei instanțe a aplicației, asigurând că algoritmul Snowflake generează ID-uri snowflake absolut unice."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Magistrală de evenimente Stardust: evenimentele aplicației sunt raportate către StarServer prin WebSocket; EventHub din interiorul StarServer le distribuie pe subiecte către magistrala de evenimente corespunzătoare; alte sesiuni WebSocket abonate la acel subiect livrează apoi mesajele aplicației țintă. Într-o implementare autonomă a StarServer, magistrala internă folosește o implementare în memorie; într-o implementare în cluster, magistrala internă folosește o coadă Redis."
