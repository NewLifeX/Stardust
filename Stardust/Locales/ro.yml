"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registru Stardust: IRegistry oferă descoperirea serviciilor; obține automat adresele nodurilor tuturor furnizorilor după numele serviciului și creează un IApiClient pentru apelarea serviciului, adăugând sau eliminând adrese pe măsură ce furnizorii devin online sau offline."
