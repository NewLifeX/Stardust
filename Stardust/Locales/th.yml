"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "ศูนย์ตรวจสอบ Stardust: ITracer รวบรวมและรายงานข้อมูลเทรซของแอปพลิเคชัน พร้อมติดตามเอนด์พอยต์ API คำขอ HTTP การทำงานกับฐานข้อมูล และการทำงานกับ Redis โดยอัตโนมัติ ใช้ตรวจสอบสถานะสุขภาพของระบบ และวิเคราะห์สายการเรียกและคอขวดด้านประสิทธิภาพในระบบกระจายได้"
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "ศูนย์การกำหนดค่า Stardust: IConfigProvider จัดการการกำหนดค่าแบบศูนย์กลาง โหลดข้อมูลการกำหนดค่าจากศูนย์การกำหนดค่าอัตโนมัติ และรองรับการส่งการเปลี่ยนแปลงแบบเรียลไทม์ รวมถึงสตริงการเชื่อมต่อฐานข้อมูล XCode ศูนย์การกำหนดค่ายังกำหนด WorkerId ที่ไม่ซ้ำให้แต่ละอินสแตนซ์แอปพลิเคชัน เพื่อให้อัลกอริทึม Snowflake สร้าง snowflake ID ที่ไม่ซ้ำกันอย่างแท้จริง"
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "บัสเหตุการณ์ Stardust: เหตุการณ์ของแอปพลิเคชันถูกรายงานไปยัง StarServer ผ่าน WebSocket; EventHub ภายใน StarServer จะกระจายตามหัวข้อไปยังบัสเหตุการณ์ที่เกี่ยวข้อง; เซสชัน WebSocket อื่นที่สมัครสมาชิกหัวข้อนั้นจะส่งข้อความต่อไปยังแอปพลิเคชันเป้าหมาย ในการติดตั้ง StarServer แบบเดี่ยว บัสภายในใช้การทำงานในหน่วยความจำ; ในการติดตั้งแบบคลัสเตอร์ บัสภายในใช้คิว Redis"
"Stardust probe: {0}": "ตรวจสอบ Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "รีจิสทรี Stardust: IRegistry ให้บริการค้นหาบริการ โดยดึงที่อยู่โหนดของผู้ให้บริการทั้งหมดตามชื่อบริการโดยอัตโนมัติ และสร้าง IApiClient สำหรับเรียกใช้บริการ เพิ่มหรือลบที่อยู่เมื่อผู้ให้บริการออนไลน์หรือออฟไลน์"
