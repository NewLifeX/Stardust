# 设置页字段（英文源文，中文提供译文，其余语言回退英文）
"Debug switch. Default false": "สวิตช์ดีบัก ค่าเริ่มต้น false"
"Disable strict SSH host key checking. Default false (checking enabled)": "ปิดการตรวจสอบคีย์โฮสต์ SSH แบบเข้มงวด ค่าเริ่มต้น false (เปิดการตรวจสอบ)"
"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "ที่อยู่เซิร์ฟเวอร์ Stardust ตัวอย่าง http://star.newlifex.com:6600 ค่าเริ่มต้นว่าง"
"App key. English name used to register with the Stardust registry": "คีย์แอปพลิเคชัน ชื่อภาษาอังกฤษที่ใช้ลงทะเบียนกับรีจิสทรี Stardust"
"App secret. Used to register with the Stardust registry": "ความลับของแอปพลิเคชัน ใช้ลงทะเบียนกับรีจิสทรี Stardust"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "ที่อยู่บริการ ที่อยู่สาธารณะที่ใช้สร้าง URL อื่น คั่นหลายที่อยู่ด้วยจุลภาค และใช้ 5 ที่อยู่ที่ถูกเรียกบ่อยที่สุด"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "โฮสต์ที่อนุญาต ชื่อโฮสต์คั่นด้วยจุลภาครองรับไวลด์การ์ด * ใช้ตรวจสอบส่วนหัว Host คำขอที่เป็น IP จะไม่ถูกตรวจสอบ เว้นว่างเพื่อปิดการตรวจสอบ"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "ระยะเวลาสุ่มตัวอย่างเทรซ ช่วงเวลาการรายงานข้อมูลเทรซไปยัง Stardust ค่าเริ่มต้น 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "จำนวนตัวอย่างปกติสูงสุด จำนวนเหตุการณ์ปกติสูงสุดต่อช่วงเวลาสำหรับกราฟการพึ่งพา ค่าเริ่มต้น 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "จำนวนตัวอย่างข้อผิดพลาดสูงสุด จำนวนเหตุการณ์ข้อผิดพลาดสูงสุดต่อช่วงเวลา ค่าเริ่มต้น 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "เก็บเทรซ OpenTelemetry แปลงกิจกรรมของคอมโพเนนต์บุคคลที่สามเป็นเทรซ ค่าเริ่มต้น true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "คำนำหน้าชื่อเทรซ ระบบตรวจหาส่วนพาธ URL ที่เปลี่ยนแปลงอัตโนมัติ คั่นคำนำหน้าด้วยอัฒภาคและปรับแต่งได้ตามต้องการ"
"Stardust settings": "การตั้งค่า Stardust"
