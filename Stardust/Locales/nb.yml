"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust-overvåkingssenter: ITracer samler inn og rapporterer sporingsdata fra applikasjoner og instrumenterer automatisk API-endepunkter, HTTP-forespørsler, databaseoperasjoner og Redis-operasjoner. Det kan brukes til å overvåke systemtilstanden og analysere kallkjeder og ytelsesflaskehalser i distribuerte systemer."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust-konfigurasjonssenter: IConfigProvider administrerer konfigurasjonen sentralt, laster automatisk inn konfigurasjonsdata fra konfigurasjonssenteret og støtter levering av endringer i sanntid, inkludert XCode-databasetilkoblingsstrenger. Konfigurasjonssenteret tildeler også en unik WorkerId til hver applikasjonsinstans, slik at Snowflake-algoritmen garantert genererer absolutt unike snowflake-ID-er."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust-hendelsesbuss: applikasjonshendelser rapporteres til StarServer via WebSocket; EventHub i StarServer fordeler dem etter emne til den tilsvarende hendelsesbussen; andre WebSocket-økter som abonnerer på emnet, leverer deretter meldingene til målapplikasjonen. I en frittstående StarServer-distribusjon bruker den interne bussen en minnebasert implementering; i en klyngedistribusjon bruker den interne bussen en Redis-kø."
"Stardust probe: {0}": "Stardust-sond: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust-register: IRegistry tilbyr tjenesteoppdagelse; det henter automatisk nodeadressene til alle tilbydere via tjenestenavn og oppretter en IApiClient for å kalle tjenesten, og legger til eller fjerner adresser når tilbydere kommer på nett eller går av nett."
