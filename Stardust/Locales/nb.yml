"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "Tillatte verter. Kommaseparerte vertsnavn med *-jokertegn, brukt til å validere Host-headeren; IP-forespørsler valideres ikke. La feltet stå tomt for å deaktivere validering"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "Sporingsprøveperiode. Intervall for rapportering av sporingsdata til Stardust, standard 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "Maksimalt antall normale prøver. Maksimalt antall normale hendelser som registreres per periode for avhengighetsgrafer, standard 1"
"Maximum error samples. Maximum error events recorded per period, default 10": "Maksimalt antall feilprøver. Maksimalt antall feilhendelser som registreres per periode, standard 10"
"Collect OpenTelemetry traces. Converts third-party component activities into traces, default true": "Samle inn OpenTelemetry-spor. Konverterer aktiviteter fra tredjepartskomponenter til spor, standard true"
"Trace name prefixes. Variable URL path segments are detected automatically; separate prefixes with semicolons and adjust manually if needed": "Prefikser for sporingsnavn. Variable URL-stisegmenter oppdages automatisk; skill prefikser med semikolon og juster manuelt ved behov"
"Stardust settings": "Stardust-innstillinger"
