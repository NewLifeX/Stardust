"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Centro de monitoramento Stardust: o ITracer coleta e reporta os dados de rastreamento da aplicação, instrumentando automaticamente endpoints de API, solicitações HTTP, operações de banco de dados e operações do Redis. Pode ser usado para monitorar a integridade do sistema e analisar cadeias de chamadas e gargalos de desempenho em sistemas distribuídos."
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Centro de configuração Stardust: o IConfigProvider gerencia a configuração de forma centralizada, carrega automaticamente os dados de configuração do centro de configuração e oferece suporte à entrega de alterações em tempo real, incluindo cadeias de conexão de banco de dados do XCode. O centro de configuração também atribui um WorkerId exclusivo a cada instância de aplicação, garantindo que o algoritmo Snowflake gere IDs snowflake absolutamente exclusivos."
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Barramento de eventos Stardust: os eventos da aplicação são reportados ao StarServer via WebSocket; o EventHub dentro do StarServer os despacha por tópico para o barramento de eventos correspondente; outras sessões WebSocket inscritas nesse tópico entregam então as mensagens à aplicação de destino. Em uma implantação autônoma do StarServer, o barramento interno usa uma implementação em memória; em uma implantação em cluster, o barramento interno usa uma fila do Redis."
"Stardust probe: {0}": "Sondagem Stardust: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Registro Stardust: o IRegistry fornece descoberta de serviços; obtém automaticamente os endereços de nó de todos os provedores pelo nome do serviço e cria um IApiClient para chamar o serviço, adicionando ou removendo endereços conforme os provedores ficam online ou offline."
