"Stardust server address. For example http://star.newlifex.com:6600; empty by default": "Stardust サーバーアドレス。例: http://star.newlifex.com:6600。既定では空です"
"App key. English name used to register with the Stardust registry": "アプリケーション識別子。Stardust レジストリへの登録に使用する英語名"
"App secret. Used to register with the Stardust registry": "アプリケーションシークレット。Stardust レジストリへの登録に使用します"
"Service address. Public addresses used to build other URLs; separate multiple addresses with commas and the top 5 by request frequency are used": "サービスアドレス。他の URL を構築するための公開アドレス。複数のアドレスはカンマで区切り、アクセス頻度の上位 5 件が使用されます"
"Allowed hosts. Comma-separated host names with * wildcards, used to validate the Host header; IP requests are not validated. Leave empty to disable validation": "許可ホスト。* ワイルドカードをサポートするホスト名をカンマで区切り、Host ヘッダーの検証に使用します。IP アドレスからの要求は検証しません。空の場合は検証しません"
"Trace sampling period. Interval for reporting trace data to Stardust, default 60s": "トレースサンプリング周期。Stardust へのトレースデータ報告間隔。既定は 60s"
"Maximum normal samples. Maximum normal events recorded per period for dependency graphs, default 1": "最大正常サンプル数。依存関係グラフのために期間内に記録する正常イベントの最大数。既定は 1"
