"Stardust monitoring center Server={0} AppId={1} ClientId={2}": "Stardust モニタリングセンター Server={0} AppId={1} ClientId={2}"
"Stardust monitoring center: ITracer collects and reports application tracing data, automatically instrumenting API endpoints, HTTP requests, database operations, and Redis operations. It can be used to monitor system health and analyze call chains and performance bottlenecks in distributed systems.": "Stardust モニタリングセンター: ITracer はアプリケーションのトレースデータを収集・報告し、API エンドポイント、HTTP リクエスト、データベース操作、Redis 操作を自動的に計測します。システムの健全性を監視し、分散システムにおける呼び出しチェーンとパフォーマンスのボトルネックを分析できます。"
"Stardust configuration center: IConfigProvider centrally manages configuration, automatically loads configuration data from the configuration center, and supports real-time change delivery, including XCode database connection strings. The configuration center also assigns a unique WorkerId to each application instance, ensuring that the Snowflake algorithm generates absolutely unique snowflake IDs.": "Stardust 構成センター: IConfigProvider は構成を一元管理し、構成センターから構成データを自動的に読み込み、XCode データベース接続文字列を含む変更のリアルタイム配信をサポートします。構成センターはまた、各アプリケーションインスタンスに一意の WorkerId を割り当て、スノーフレークアルゴリズムが絶対に一意なスノーフレーク ID を生成することを保証します。"
"Stardust event bus: application events are reported to StarServer over WebSocket; the EventHub inside StarServer dispatches them by topic to the corresponding event bus; other WebSocket sessions subscribed to that topic then deliver the messages to the target application. In a standalone StarServer deployment, the internal bus uses an in-memory implementation; in a clustered deployment, the internal bus uses a Redis queue.": "Stardust イベントバス: アプリケーションイベントは WebSocket 経由で StarServer に報告され、StarServer 内の EventHub がトピックごとに対応するイベントバスへ振り分け、そのトピックを購読している他の WebSocket セッションが対象アプリケーションへメッセージを届けます。単体の StarServer 配置では内部バスはメモリ実装を使用し、クラスター配置では内部バスは Redis キューを使用します。"
"Stardust probe: {0}": "Stardust プローブ: {0}"
"Stardust registry: IRegistry provides service discovery; it automatically obtains the node addresses of all providers by service name and creates an IApiClient for calling the service, adding or removing addresses as providers come online or go offline.": "Stardust レジストリ: IRegistry はサービスディスカバリを提供し、サービス名ですべての提供者のノードアドレスを自動取得してサービス呼び出し用の IApiClient を作成し、提供者のオンライン・オフラインに応じてアドレスを追加・削除します。"
