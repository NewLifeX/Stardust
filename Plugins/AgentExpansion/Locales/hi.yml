# Hindi translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0} प्रोब विफल: {1}"
"{0} SSH failed: {1}": "{0} SSH विफल: {1}"
"{0} Telnet failed: {1}": "{0} Telnet विफल: {1}"
"Package hash verification failed; expected {0}, actual {1}": "पैकेज हैश सत्यापन विफल; अपेक्षित {0}, वास्तविक {1}"
"Downloading the package over HTTP is risky; assess network security.": "HTTP के माध्यम से पैकेज डाउनलोड करना जोखिम भरा है; नेटवर्क सुरक्षा का आकलन करें।"
"Package download requires HTTPS or a configured PackageSha512.": "पैकेज डाउनलोड के लिए HTTPS या कॉन्फ़िगर किया गया PackageSha512 आवश्यक है।"
"Node {0} has no SSH fingerprint configured; skipping verification": "नोड {0} में कोई SSH फ़िंगरप्रिंट कॉन्फ़िगर नहीं है; सत्यापन छोड़ा जा रहा है"
"Node {0} already has StarAgent ({1})": "नोड {0} में पहले से StarAgent है ({1})"
"Installation command sent to node {0}": "नोड {0} को इंस्टॉलेशन कमांड भेजा गया"
"Telnet installation command sent to node {0}": "Telnet इंस्टॉलेशन कमांड नोड {0} को भेजा गया"
"Node {0} returned from the installation command: {1}": "नोड {0} ने इंस्टॉलेशन कमांड से लौटाया: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "नोड {0} के लिए SSH फ़िंगरप्रिंट में असंगति; अपेक्षित {1}, वास्तविक {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "नोड {0} के लिए HTTP के माध्यम से Telnet डाउनलोड जोखिम भरा है; नेटवर्क सुरक्षा का आकलन करें।"
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "नोड {0} के लिए Telnet डाउनलोड के लिए HTTPS या कॉन्फ़िगर किया गया PackageSha512 आवश्यक है।"
"StarServer is not configured; skipping automatic installation": "StarServer कॉन्फ़िगर नहीं है; स्वचालित इंस्टॉलेशन छोड़ा जा रहा है"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "लक्ष्य नेटवर्क {0} स्थानीय नेटवर्क पता नहीं है; अनदेखा किया गया"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "लक्ष्य पतों की संख्या सीमा {0} से अधिक है; इस दौर में केवल पहले {0} पते स्कैन किए जाएँगे। MaxHosts समायोजित करें या Networks संकीर्ण करें"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Stardust एजेंट के लिए LAN एक्सटेंशन जो नोड्स को खोजता है और StarAgent को स्वचालित रूप से इंस्टॉल करता है।"
"Enable": "सक्षम करें"
"Scan period. Unit: seconds, default 3600.": "स्कैन अवधि। सेकंड में, डिफ़ॉल्ट 3600।"
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "लक्ष्य सबनेट। 192.168.1.0/24 या 192.168.1.* का समर्थन करता है, खाली का अर्थ स्थानीय सबनेट है। केवल LAN सबनेट समर्थित हैं।"
"Account. Use env:NAME to reference an environment variable": "खाता। पर्यावरण चर का संदर्भ देने के लिए env:NAME का उपयोग करें"
"Password. Can reference an environment variable with env:NAME.": "पासवर्ड। env:NAME से पर्यावरण चर का संदर्भ दिया जा सकता है।"
"SSH port. Default 22": "SSH पोर्ट। डिफ़ॉल्ट 22"
"Telnet port. Default 23": "Telnet पोर्ट। डिफ़ॉल्ट 23"
"Connection timeout. Default 3000ms": "कनेक्शन टाइमआउट। डिफ़ॉल्ट 3000ms"
"Max concurrency. Default 64": "अधिकतम समवर्तीता। डिफ़ॉल्ट 64"
"Max scan hosts. Default 4096": "अधिकतम स्कैन होस्ट। डिफ़ॉल्ट 4096"
"Installation package URL. Leave blank to use PluginServer.": "इंस्टॉलेशन पैकेज URL। PluginServer उपयोग करने के लिए खाली छोड़ें।"
"Installation package hash. SHA512 string used to verify package integrity.": "इंस्टॉलेशन पैकेज हैश। पैकेज की अखंडता सत्यापित करने के लिए SHA512 स्ट्रिंग।"
"SSH host fingerprint. Used to verify SSH connections": "SSH होस्ट फ़िंगरप्रिंट। SSH कनेक्शन सत्यापित करने के लिए उपयोग किया जाता है"
"Installation directory. Leave blank to use the default path.": "इंस्टॉलेशन निर्देशिका। डिफ़ॉल्ट पथ उपयोग करने के लिए खाली छोड़ें।"
