# 繁體中文譯文。鍵為英文源文，缺失時運行期回退英文。
"{0} probe failed: {1}": "{0} 探測失敗：{1}"
"{0} SSH failed: {1}": "{0} SSH失敗：{1}"
"{0} Telnet failed: {1}": "{0} Telnet失敗：{1}"
"Package hash verification failed; expected {0}, actual {1}": "安裝包哈希校驗失敗，期望 {0} 實際 {1}"
"Downloading the package over HTTP is risky; assess network security.": "安裝包使用HTTP下載存在風險，請評估網絡安全"
"Package download requires HTTPS or a configured PackageSha512.": "安裝包下載需HTTPS或配置PackageSha512"
"Node {0} has no SSH fingerprint configured; skipping verification": "節點 {0} 未配置SSH指紋，跳過校驗"
"Node {0} already has StarAgent ({1})": "節點 {0} 已存在StarAgent({1})"
"Installation command sent to node {0}": "節點 {0} 已發送安裝命令"
"Telnet installation command sent to node {0}": "節點 {0} 已發送Telnet安裝命令"
"Node {0} returned from the installation command: {1}": "節點 {0} 執行安裝命令返回：{1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "節點 {0} SSH指紋不匹配，期望 {1} 實際 {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "節點 {0} Telnet使用HTTP下載存在風險，請評估網絡安全"
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "節點 {0} Telnet下載需HTTPS或配置PackageSha512"
"StarServer is not configured; skipping automatic installation": "未配置StarServer，跳過自動安裝"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "目標網段 {0} 不是區域網路位址，已忽略"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "目標位址超過上限 {0}，本輪僅掃描前 {0} 個位址，請調整MaxHosts或縮小Networks"
"Agent expansion": "代理擴充"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "星塵代理區域網路擴充，探測節點並自動安裝 StarAgent"
"Enable": "啟用"
"Scan period. Unit: seconds, default 3600.": "掃描週期。單位秒，預設3600"
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "目標網段。支援192.168.1.0/24或192.168.1.*，為空表示本機網段。僅支援區域網路網段"
"Account. Use env:NAME to reference an environment variable": "帳號。可使用env:NAME參照環境變數"
"Password. Can reference an environment variable with env:NAME.": "密碼。可使用env:NAME參照環境變數"
"SSH port. Default 22": "SSH連接埠。預設22"
"Telnet port. Default 23": "Telnet連接埠。預設23"
"Connection timeout. Default 3000ms": "連線逾時。預設3000ms"
"Max concurrency. Default 64": "最大並行數。預設64"
"Max scan hosts. Default 4096": "最大掃描主機數。預設4096"
"Installation package URL. Leave blank to use PluginServer.": "安裝套件位址。留空則使用PluginServer"
"Installation package hash. SHA512 string used to verify package integrity.": "安裝套件雜湊。SHA512字串，用於驗證套件完整性"
"SSH host fingerprint. Used to verify SSH connections": "SSH主機指紋。用於驗證SSH連線"
"Installation directory. Leave blank to use the default path.": "安裝目錄。留空使用預設路徑"
