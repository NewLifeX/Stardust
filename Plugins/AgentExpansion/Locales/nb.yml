# Norwegian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0}-sonden mislyktes: {1}"
"{0} SSH failed: {1}": "{0} SSH mislyktes: {1}"
"{0} Telnet failed: {1}": "{0} Telnet mislyktes: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Hashverifiseringen av pakken mislyktes; forventet {0}, fikk {1}"
"Downloading the package over HTTP is risky; assess network security.": "Det er risikabelt å laste ned pakken via HTTP; vurder nettverkssikkerheten."
"Package download requires HTTPS or a configured PackageSha512.": "Pakkenedlasting krever HTTPS eller en konfigurert PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "Node {0} har ikke konfigurert noe SSH-fingeravtrykk; hopper over verifiseringen"
"Node {0} already has StarAgent ({1})": "Node {0} har allerede StarAgent ({1})"
"Installation command sent to node {0}": "Installasjonskommandoen ble sendt til node {0}"
"Telnet installation command sent to node {0}": "Telnet-installasjonskommandoen ble sendt til node {0}"
"Node {0} returned from the installation command: {1}": "Node {0} svarte på installasjonskommandoen: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "SSH-fingeravtrykket stemmer ikke for node {0}; forventet {1}, fikk {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Telnet-nedlasting via HTTP for node {0} er risikabelt; vurder nettverkssikkerheten."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Telnet-nedlasting for node {0} krever HTTPS eller en konfigurert PackageSha512."
"StarServer is not configured; skipping automatic installation": "StarServer er ikke konfigurert; hopper over den automatiske installasjonen"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Målnettverket {0} er ikke en lokalnettverksadresse; ignoreres"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Antallet mål-adresser overskrider grensen {0}; bare de første {0} adressene skannes i denne runden. Juster MaxHosts eller begrens Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "LAN-utvidelse for Stardust-agenten som oppdager noder og installerer StarAgent automatisk."
"Enable": "Aktiver"
"Scan period. Unit: seconds, default 3600.": "Skanneperiode. I sekunder, standard 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Målnettverk. Støtter 192.168.1.0/24 eller 192.168.1.*, tom betyr det lokale nettverket. Bare LAN-nettverk støttes."
"Account. Use env:NAME to reference an environment variable": "Konto. Bruk env:NAME for å referere til en miljøvariabel"
"Password. Can reference an environment variable with env:NAME.": "Passord. Du kan referere til en miljøvariabel med env:NAME."
"SSH port. Default 22": "SSH-port. Standard 22"
"Telnet port. Default 23": "Telnet-port. Standard 23"
"Connection timeout. Default 3000ms": "Tilkoblingstidsavbrudd. Standard 3000ms"
"Max concurrency. Default 64": "Maksimal samtidighet. Standard 64"
"Max scan hosts. Default 4096": "Maksimalt antall skanneverter. Standard 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL for installasjonspakke. La stå tomt for å bruke PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash for installasjonspakke. SHA512-streng for å kontrollere pakkens integritet."
"SSH host fingerprint. Used to verify SSH connections": "SSH-vertens fingeravtrykk. Brukes til å verifisere SSH-tilkoblinger"
"Installation directory. Leave blank to use the default path.": "Installasjonskatalog. La stå tomt for å bruke standardbanen."
