"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "ノード {0} の SSH フィンガープリントが一致しません。期待値 {1}、実際 {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "ノード {0} の HTTP 経由の Telnet ダウンロードは危険です。ネットワークの安全性を評価してください。"
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "ノード {0} の Telnet ダウンロードには HTTPS または PackageSha512 の構成が必要です。"
"StarServer is not configured; skipping automatic installation": "StarServer が構成されていないため、自動インストールをスキップします"
