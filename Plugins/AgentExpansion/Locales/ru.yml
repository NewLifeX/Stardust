# Russian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Ошибка проверки {0}: {1}"
"{0} SSH failed: {1}": "Ошибка SSH ({0}): {1}"
"{0} Telnet failed: {1}": "Ошибка Telnet ({0}): {1}"
"Package hash verification failed; expected {0}, actual {1}": "Проверка хеша пакета не удалась; ожидалось {0}, получено {1}"
