"Node {0} already has StarAgent ({1})": "На узле {0} уже есть StarAgent ({1})"
"Installation command sent to node {0}": "Команда установки отправлена на узел {0}"
"Telnet installation command sent to node {0}": "Команда установки Telnet отправлена на узел {0}"
"Node {0} returned from the installation command: {1}": "Узел {0} вернул результат команды установки: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Несовпадение отпечатка SSH для узла {0}; ожидалось {1}, получено {2}"
