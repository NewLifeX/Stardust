"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Для скачивания через Telnet для узла {0} требуется HTTPS или настроенный PackageSha512."
"StarServer is not configured; skipping automatic installation": "StarServer не настроен; автоматическая установка пропущена"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Целевая сеть {0} не является адресом локальной сети; пропущено"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Количество целевых адресов превышает предел {0}; в этом цикле сканируются только первые {0} адресов. Настройте MaxHosts или сузьте Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Расширение LAN для агента Stardust, которое обнаруживает узлы и автоматически устанавливает StarAgent."
"Enable": "Включить"
"Scan period. Unit: seconds, default 3600.": "Период сканирования. В секундах, по умолчанию 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Целевая подсеть. Поддерживает 192.168.1.0/24 или 192.168.1.*, пустое значение означает локальную подсеть. Поддерживаются только подсети LAN."
"Account. Use env:NAME to reference an environment variable": "Учётная запись. Используйте env:NAME для ссылки на переменную среды"
"Password. Can reference an environment variable with env:NAME.": "Пароль. Можно указать переменную среды через env:NAME."
"SSH port. Default 22": "Порт SSH. По умолчанию 22"
"Telnet port. Default 23": "Порт Telnet. По умолчанию 23"
"Connection timeout. Default 3000ms": "Тайм-аут подключения. По умолчанию 3000ms"
"Max concurrency. Default 64": "Максимальная параллельность. По умолчанию 64"
"Max scan hosts. Default 4096": "Максимум узлов сканирования. По умолчанию 4096"
"Installation package URL. Leave blank to use PluginServer.": "Адрес пакета установки. Оставьте пустым для использования PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Хеш пакета установки. Строка SHA512 для проверки целостности пакета."
"SSH host fingerprint. Used to verify SSH connections": "Отпечаток хоста SSH. Используется для проверки SSH-подключений"
"Installation directory. Leave blank to use the default path.": "Каталог установки. Оставьте пустым для использования пути по умолчанию."
