"Installation command sent to node {0}": "Perintah instalasi dikirim ke node {0}"
"Telnet installation command sent to node {0}": "Perintah instalasi Telnet dikirim ke node {0}"
"Node {0} returned from the installation command: {1}": "Node {0} mengembalikan dari perintah instalasi: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Fingerprint SSH node {0} tidak cocok; diharapkan {1}, aktual {2}"
