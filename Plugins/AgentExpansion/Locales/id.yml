# Indonesian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Probe {0} gagal: {1}"
"{0} SSH failed: {1}": "SSH {0} gagal: {1}"
"{0} Telnet failed: {1}": "Telnet {0} gagal: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Verifikasi hash paket gagal; diharapkan {0}, aktual {1}"
"Downloading the package over HTTP is risky; assess network security.": "Mengunduh paket melalui HTTP berisiko; pertimbangkan keamanan jaringan."
"Package download requires HTTPS or a configured PackageSha512.": "Unduhan paket memerlukan HTTPS atau PackageSha512 yang dikonfigurasi."
"Node {0} has no SSH fingerprint configured; skipping verification": "Node {0} belum mengonfigurasi fingerprint SSH; melewati verifikasi"
"Node {0} already has StarAgent ({1})": "Node {0} sudah memiliki StarAgent ({1})"
"Installation command sent to node {0}": "Perintah instalasi dikirim ke node {0}"
"Telnet installation command sent to node {0}": "Perintah instalasi Telnet dikirim ke node {0}"
"Node {0} returned from the installation command: {1}": "Node {0} mengembalikan dari perintah instalasi: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Fingerprint SSH node {0} tidak cocok; diharapkan {1}, aktual {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Unduhan Telnet melalui HTTP untuk node {0} berisiko; pertimbangkan keamanan jaringan."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Unduhan Telnet untuk node {0} memerlukan HTTPS atau PackageSha512 yang dikonfigurasi."
"StarServer is not configured; skipping automatic installation": "StarServer belum dikonfigurasi; melewati pemasangan otomatis"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Jaringan tujuan {0} bukan alamat jaringan lokal; diabaikan"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Jumlah alamat tujuan melebihi batas {0}; pada putaran ini hanya {0} alamat pertama yang dipindai. Sesuaikan MaxHosts atau persempit Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Ekstensi LAN untuk agen Stardust yang menemukan node dan memasang StarAgent secara otomatis."
"Enable": "Aktifkan"
"Scan period. Unit: seconds, default 3600.": "Periode pemindaian. Dalam detik, default 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Subnet tujuan. Mendukung 192.168.1.0/24 atau 192.168.1.*, kosong berarti subnet lokal. Hanya subnet LAN yang didukung."
"Account. Use env:NAME to reference an environment variable": "Akun. Gunakan env:NAME untuk mereferensikan variabel lingkungan"
"Password. Can reference an environment variable with env:NAME.": "Kata sandi. Dapat mereferensikan variabel lingkungan dengan env:NAME."
"SSH port. Default 22": "Port SSH. Default 22"
"Telnet port. Default 23": "Port Telnet. Default 23"
"Connection timeout. Default 3000ms": "Batas waktu koneksi. Default 3000ms"
"Max concurrency. Default 64": "Konkurensi maksimum. Default 64"
"Max scan hosts. Default 4096": "Host pemindaian maksimum. Default 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL paket instalasi. Kosongkan untuk menggunakan PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash paket instalasi. String SHA512 untuk memverifikasi integritas paket."
"SSH host fingerprint. Used to verify SSH connections": "Sidik jari host SSH. Digunakan untuk memverifikasi koneksi SSH"
"Installation directory. Leave blank to use the default path.": "Direktori pemasangan. Kosongkan untuk menggunakan jalur default."
