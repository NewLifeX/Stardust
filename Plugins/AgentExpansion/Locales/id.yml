"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Unduhan Telnet untuk node {0} memerlukan HTTPS atau PackageSha512 yang dikonfigurasi."
"StarServer is not configured; skipping automatic installation": "StarServer belum dikonfigurasi; melewati pemasangan otomatis"
