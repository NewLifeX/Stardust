"{0} Telnet failed: {1}": "Telnet {0} gagal: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Verifikasi hash paket gagal; diharapkan {0}, aktual {1}"
"Downloading the package over HTTP is risky; assess network security.": "Mengunduh paket melalui HTTP berisiko; pertimbangkan keamanan jaringan."
"Package download requires HTTPS or a configured PackageSha512.": "Unduhan paket memerlukan HTTPS atau PackageSha512 yang dikonfigurasi."
"Node {0} has no SSH fingerprint configured; skipping verification": "Node {0} belum mengonfigurasi fingerprint SSH; melewati verifikasi"
