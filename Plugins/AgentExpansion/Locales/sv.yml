# Swedish translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0}-sonden misslyckades: {1}"
"{0} SSH failed: {1}": "{0} SSH misslyckades: {1}"
"{0} Telnet failed: {1}": "{0} Telnet misslyckades: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Hashverifieringen av paketet misslyckades; förväntade {0}, fick {1}"
"Downloading the package over HTTP is risky; assess network security.": "Det är riskabelt att ladda ner paketet via HTTP; bedöm nätverkssäkerheten."
"Package download requires HTTPS or a configured PackageSha512.": "Paketnedladdning kräver HTTPS eller en konfigurerad PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "Nod {0} har inget SSH-fingeravtryck konfigurerat; hoppar över verifieringen"
"Node {0} already has StarAgent ({1})": "Nod {0} har redan StarAgent ({1})"
"Installation command sent to node {0}": "Installationskommandot har skickats till nod {0}"
"Telnet installation command sent to node {0}": "Telnet-installationskommandot har skickats till nod {0}"
"Node {0} returned from the installation command: {1}": "Nod {0} svarade på installationskommandot: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "SSH-fingeravtrycket matchar inte för nod {0}; förväntade {1}, fick {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Telnet-nedladdning via HTTP för nod {0} är riskabel; bedöm nätverkssäkerheten."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Telnet-nedladdning för nod {0} kräver HTTPS eller en konfigurerad PackageSha512."
"StarServer is not configured; skipping automatic installation": "StarServer är inte konfigurerad; hoppar över den automatiska installationen"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Målnätverket {0} är inte en lokal nätverksadress; ignoreras"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Antalet måladdresser överskrider gränsen {0}; endast de första {0} adresserna genomsöks i den här omgången. Justera MaxHosts eller begränsa Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "LAN-tillägg för Stardust-agenten som identifierar noder och installerar StarAgent automatiskt."
"Enable": "Aktivera"
"Scan period. Unit: seconds, default 3600.": "Skanningsperiod. I sekunder, standard 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Målnätverk. Stöder 192.168.1.0/24 eller 192.168.1.*, tomt betyder det lokala nätet. Endast LAN-nätverk stöds."
"Account. Use env:NAME to reference an environment variable": "Konto. Använd env:NAME för att referera till en miljövariabel"
"Password. Can reference an environment variable with env:NAME.": "Lösenord. Du kan referera till en miljövariabel med env:NAME."
"SSH port. Default 22": "SSH-port. Standard 22"
"Telnet port. Default 23": "Telnet-port. Standard 23"
"Connection timeout. Default 3000ms": "Anslutningstidsgräns. Standard 3000ms"
"Max concurrency. Default 64": "Maximal samtidighet. Standard 64"
"Max scan hosts. Default 4096": "Maximalt antal skannade värdar. Standard 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL för installationspaket. Lämna tomt för att använda PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash för installationspaket. SHA512-sträng för att verifiera paketets integritet."
"SSH host fingerprint. Used to verify SSH connections": "SSH-värdens fingeravtryck. Används för att verifiera SSH-anslutningar"
"Installation directory. Leave blank to use the default path.": "Installationskatalog. Lämna tomt för att använda standardvägen."
