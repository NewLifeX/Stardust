# Hungarian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "A(z) {0} próba nem sikerült: {1}"
"{0} SSH failed: {1}": "A(z) {0} SSH nem sikerült: {1}"
"{0} Telnet failed: {1}": "A(z) {0} Telnet nem sikerült: {1}"
"Package hash verification failed; expected {0}, actual {1}": "A csomag hash-ellenőrzése nem sikerült; várt: {0}, tényleges: {1}"
"Downloading the package over HTTP is risky; assess network security.": "A csomag HTTP-n keresztüli letöltése kockázatos; mérje fel a hálózat biztonságát."
"Package download requires HTTPS or a configured PackageSha512.": "A csomag letöltése HTTPS-t vagy beállított PackageSha512-t igényel."
"Node {0} has no SSH fingerprint configured; skipping verification": "A(z) {0} csomóponton nincs beállítva SSH-ujjlenyomat; ellenőrzés kihagyása"
"Node {0} already has StarAgent ({1})": "A(z) {0} csomóponton már van StarAgent ({1})"
"Installation command sent to node {0}": "Telepítési parancs elküldve a(z) {0} csomópontnak"
"Telnet installation command sent to node {0}": "Telnet telepítési parancs elküldve a(z) {0} csomópontnak"
"Node {0} returned from the installation command: {1}": "A(z) {0} csomópont visszatért a telepítési parancsból: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "SSH-ujjlenyomat eltérés a(z) {0} csomópontnál; várt: {1}, tényleges: {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "A(z) {0} csomópont Telneten keresztüli HTTP-letöltése kockázatos; mérje fel a hálózat biztonságát."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "A(z) {0} csomópont Telnet-letöltése HTTPS-t vagy beállított PackageSha512-t igényel."
"StarServer is not configured; skipping automatic installation": "A StarServer nincs beállítva; az automatikus telepítés kihagyása"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "A(z) {0} célhálózat nem helyi hálózati cím; figyelmen kívül hagyva"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "A célcímek száma meghaladja a(z) {0} korlátot; ebben a körben csak az első {0} cím lesz átvizsgálva. Módosítsa a MaxHosts értéket, vagy szűkítse a Networks tartományt"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "LAN-bővítmény a Stardust ügynökhöz, amely felderíti a csomópontokat és automatikusan telepíti a StarAgentet."
"Enable": "Engedélyezés"
"Scan period. Unit: seconds, default 3600.": "Vizsgálati időköz. Másodpercben, alapértelmezett 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Cél alhálózat. Támogatja a 192.168.1.0/24 vagy 192.168.1.* formát, üresen a helyi alhálózatot jelenti. Csak LAN alhálózatok támogatottak."
"Account. Use env:NAME to reference an environment variable": "Fiók. Környezeti változó hivatkozásához használja az env:NAME formátumot"
"Password. Can reference an environment variable with env:NAME.": "Jelszó. Környezeti változóra az env:NAME használatával lehet hivatkozni."
"SSH port. Default 22": "SSH-port. Alapértelmezés 22"
"Telnet port. Default 23": "Telnet-port. Alapértelmezés 23"
"Connection timeout. Default 3000ms": "Kapcsolódási időtúllépés. Alapértelmezett 3000ms"
"Max concurrency. Default 64": "Maximális párhuzamosság. Alapértelmezés 64"
"Max scan hosts. Default 4096": "Maximális vizsgált gazdagép. Alapértelmezés 4096"
"Installation package URL. Leave blank to use PluginServer.": "Telepítőcsomag URL-je. Hagyja üresen a PluginServer használatához."
"Installation package hash. SHA512 string used to verify package integrity.": "Telepítőcsomag hash. SHA512 karakterlánc a csomag integritásának ellenőrzéséhez."
"SSH host fingerprint. Used to verify SSH connections": "SSH-gazdagép ujjlenyomata. SSH-kapcsolatok ellenőrzésére szolgál"
"Installation directory. Leave blank to use the default path.": "Telepítési könyvtár. Hagyja üresen az alapértelmezett útvonal használatához."
