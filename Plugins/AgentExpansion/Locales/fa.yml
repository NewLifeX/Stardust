# Persian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "کاوش {0} ناموفق بود: {1}"
"{0} SSH failed: {1}": "SSH {0} ناموفق بود: {1}"
"{0} Telnet failed: {1}": "Telnet {0} ناموفق بود: {1}"
"Package hash verification failed; expected {0}, actual {1}": "بررسی هش بسته ناموفق بود؛ مورد انتظار {0}، واقعی {1}"
"Downloading the package over HTTP is risky; assess network security.": "دانلود بسته از طریق HTTP پرخطر است؛ امنیت شبکه را ارزیابی کنید."
"Package download requires HTTPS or a configured PackageSha512.": "دانلود بسته به HTTPS یا PackageSha512 پیکربندی‌شده نیاز دارد."
"Node {0} has no SSH fingerprint configured; skipping verification": "گره {0} اثر انگشت SSH پیکربندی‌شده ندارد؛ بررسی نادیده گرفته می‌شود"
"Node {0} already has StarAgent ({1})": "گره {0} از قبل StarAgent دارد ({1})"
"Installation command sent to node {0}": "دستور نصب به گره {0} ارسال شد"
"Telnet installation command sent to node {0}": "دستور نصب Telnet به گره {0} ارسال شد"
"Node {0} returned from the installation command: {1}": "گره {0} از دستور نصب برگرداند: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "ناسازگاری اثر انگشت SSH برای گره {0}؛ مورد انتظار {1}، واقعی {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "دانلود Telnet از طریق HTTP برای گره {0} پرخطر است؛ امنیت شبکه را ارزیابی کنید."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "دانلود Telnet برای گره {0} به HTTPS یا PackageSha512 پیکربندی‌شده نیاز دارد."
"StarServer is not configured; skipping automatic installation": "StarServer پیکربندی نشده است؛ نصب خودکار نادیده گرفته می‌شود"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "شبکه مقصد {0} نشانی شبکه محلی نیست؛ نادیده گرفته شد"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "تعداد نشانی‌های مقصد از حد {0} بیشتر است؛ در این دور فقط {0} نشانی اول پیمایش می‌شود. MaxHosts را تنظیم کنید یا Networks را محدودتر کنید"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "افزونه LAN برای عامل Stardust که گره‌ها را کشف می‌کند و StarAgent را به‌طور خودکار نصب می‌کند."
"Enable": "فعال‌سازی"
"Scan period. Unit: seconds, default 3600.": "دوره اسکن. بر حسب ثانیه، پیش‌فرض 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "زیرشبکه هدف. از 192.168.1.0/24 یا 192.168.1.* پشتیبانی می‌کند؛ خالی به معنای زیرشبکه محلی است. فقط زیرشبکه‌های LAN پشتیبانی می‌شوند."
"Account. Use env:NAME to reference an environment variable": "حساب. برای ارجاع به متغیر محیطی از env:NAME استفاده کنید"
"Password. Can reference an environment variable with env:NAME.": "رمز عبور. می‌توان با env:NAME به متغیر محیطی ارجاع داد."
"SSH port. Default 22": "پورت SSH. پیش‌فرض 22"
"Telnet port. Default 23": "پورت Telnet. پیش‌فرض 23"
"Connection timeout. Default 3000ms": "مهلت اتصال. پیشفرض 3000ms"
"Max concurrency. Default 64": "حداکثر همزمانی. پیش‌فرض 64"
"Max scan hosts. Default 4096": "حداکثر میزبان‌های اسکن. پیش‌فرض 4096"
"Installation package URL. Leave blank to use PluginServer.": "نشانی بسته نصب. برای استفاده از PluginServer خالی بگذارید."
"Installation package hash. SHA512 string used to verify package integrity.": "هش بسته نصب. رشته SHA512 برای بررسی یکپارچگی بسته."
"SSH host fingerprint. Used to verify SSH connections": "اثر انگشت میزبان SSH. برای اعتبارسنجی اتصالات SSH استفاده می‌شود"
"Installation directory. Leave blank to use the default path.": "پوشه نصب. برای استفاده از مسیر پیش‌فرض خالی بگذارید."
