# Korean translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0} 프로브 실패: {1}"
"{0} SSH failed: {1}": "{0} SSH 실패: {1}"
"{0} Telnet failed: {1}": "{0} Telnet 실패: {1}"
"Package hash verification failed; expected {0}, actual {1}": "패키지 해시 검증에 실패했습니다. 예상 {0}, 실제 {1}"
"Downloading the package over HTTP is risky; assess network security.": "HTTP를 통한 패키지 다운로드는 위험합니다. 네트워크 보안을 평가하세요."
"Package download requires HTTPS or a configured PackageSha512.": "패키지 다운로드에는 HTTPS 또는 구성된 PackageSha512가 필요합니다."
"Node {0} has no SSH fingerprint configured; skipping verification": "노드 {0}에 SSH 지문이 구성되지 않아 검증을 건너뜁니다"
"Node {0} already has StarAgent ({1})": "노드 {0}에 이미 StarAgent가 있습니다({1})"
"Installation command sent to node {0}": "노드 {0}에 설치 명령을 보냈습니다"
"Telnet installation command sent to node {0}": "노드 {0}에 Telnet 설치 명령을 보냈습니다"
"Node {0} returned from the installation command: {1}": "노드 {0}의 설치 명령 응답: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "노드 {0}의 SSH 지문이 일치하지 않습니다. 예상 {1}, 실제 {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "노드 {0}의 Telnet HTTP 다운로드는 위험합니다. 네트워크 보안을 평가하세요."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "노드 {0}의 Telnet 다운로드에는 HTTPS 또는 구성된 PackageSha512가 필요합니다."
"StarServer is not configured; skipping automatic installation": "StarServer가 구성되지 않아 자동 설치를 건너뜁니다"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "대상 네트워크 {0}은(는) 로컬 네트워크 주소가 아니므로 무시합니다"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "대상 주소 수가 한도 {0}을(를) 초과했습니다. 이번에는 처음 {0}개 주소만 검사합니다. MaxHosts를 조정하거나 Networks를 좁히세요"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Stardust 에이전트용 LAN 확장으로, 노드를 검색하고 StarAgent를 자동으로 설치합니다."
"Enable": "사용"
"Scan period. Unit: seconds, default 3600.": "검색 주기. 단위는 초, 기본 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "대상 네트워크. 192.168.1.0/24 또는 192.168.1.*를 지원하며, 비어 있으면 로컬 네트워크를 의미합니다. LAN 네트워크만 지원합니다."
"Account. Use env:NAME to reference an environment variable": "계정. env:NAME을 사용하여 환경 변수를 참조할 수 있습니다"
"Password. Can reference an environment variable with env:NAME.": "암호. env:NAME으로 환경 변수를 참조할 수 있습니다."
"SSH port. Default 22": "SSH 포트. 기본값 22"
"Telnet port. Default 23": "Telnet 포트. 기본값 23"
"Connection timeout. Default 3000ms": "연결 시간 제한. 기본 3000ms"
"Max concurrency. Default 64": "최대 동시성. 기본값 64"
"Max scan hosts. Default 4096": "최대 검색 호스트 수. 기본값 4096"
"Installation package URL. Leave blank to use PluginServer.": "설치 패키지 URL입니다. 비워 두면 PluginServer를 사용합니다."
"Installation package hash. SHA512 string used to verify package integrity.": "설치 패키지 해시입니다. 패키지 무결성을 검증하는 SHA512 문자열입니다."
"SSH host fingerprint. Used to verify SSH connections": "SSH 호스트 지문. SSH 연결을 검증하는 데 사용됩니다"
"Installation directory. Leave blank to use the default path.": "설치 디렉터리입니다. 비워 두면 기본 경로를 사용합니다."
