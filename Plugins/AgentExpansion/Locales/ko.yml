# Korean translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0} 프로브 실패: {1}"
"{0} SSH failed: {1}": "{0} SSH 실패: {1}"
"{0} Telnet failed: {1}": "{0} Telnet 실패: {1}"
"Package hash verification failed; expected {0}, actual {1}": "패키지 해시 검증에 실패했습니다. 예상 {0}, 실제 {1}"
"Downloading the package over HTTP is risky; assess network security.": "HTTP를 통한 패키지 다운로드는 위험합니다. 네트워크 보안을 평가하세요."
"Package download requires HTTPS or a configured PackageSha512.": "패키지 다운로드에는 HTTPS 또는 구성된 PackageSha512가 필요합니다."
"Node {0} has no SSH fingerprint configured; skipping verification": "노드 {0}에 SSH 지문이 구성되지 않아 검증을 건너뜁니다"
"Node {0} already has StarAgent ({1})": "노드 {0}에 이미 StarAgent가 있습니다({1})"
"Installation command sent to node {0}": "노드 {0}에 설치 명령을 보냈습니다"
"Telnet installation command sent to node {0}": "노드 {0}에 Telnet 설치 명령을 보냈습니다"
"Node {0} returned from the installation command: {1}": "노드 {0}의 설치 명령 응답: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "노드 {0}의 SSH 지문이 일치하지 않습니다. 예상 {1}, 실제 {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "노드 {0}의 Telnet HTTP 다운로드는 위험합니다. 네트워크 보안을 평가하세요."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "노드 {0}의 Telnet 다운로드에는 HTTPS 또는 구성된 PackageSha512가 필요합니다."
"StarServer is not configured; skipping automatic installation": "StarServer가 구성되지 않아 자동 설치를 건너뜁니다"
