# Vietnamese translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Thăm dò {0} thất bại: {1}"
"{0} SSH failed: {1}": "SSH {0} thất bại: {1}"
"{0} Telnet failed: {1}": "Telnet {0} thất bại: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Xác minh băm gói thất bại; mong đợi {0}, thực tế {1}"
"Downloading the package over HTTP is risky; assess network security.": "Tải gói qua HTTP có rủi ro; hãy đánh giá bảo mật mạng."
"Package download requires HTTPS or a configured PackageSha512.": "Tải gói yêu cầu HTTPS hoặc cấu hình PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "Node {0} chưa cấu hình dấu vân tay SSH; bỏ qua xác minh"
"Node {0} already has StarAgent ({1})": "Node {0} đã có StarAgent ({1})"
"Installation command sent to node {0}": "Đã gửi lệnh cài đặt tới node {0}"
"Telnet installation command sent to node {0}": "Đã gửi lệnh cài đặt Telnet tới node {0}"
"Node {0} returned from the installation command: {1}": "Node {0} trả về từ lệnh cài đặt: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Dấu vân tay SSH của node {0} không khớp; mong đợi {1}, thực tế {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Tải xuống qua Telnet bằng HTTP cho node {0} có rủi ro; hãy đánh giá bảo mật mạng."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Tải xuống qua Telnet cho node {0} yêu cầu HTTPS hoặc cấu hình PackageSha512."
"StarServer is not configured; skipping automatic installation": "Chưa cấu hình StarServer; bỏ qua cài đặt tự động"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Mạng đích {0} không phải địa chỉ mạng cục bộ; đã bỏ qua"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Số lượng địa chỉ đích vượt quá giới hạn {0}; trong lượt này chỉ quét {0} địa chỉ đầu tiên. Hãy điều chỉnh MaxHosts hoặc thu hẹp Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Tiện ích mở rộng LAN cho tác nhân Stardust, tự động phát hiện nút và cài đặt StarAgent."
"Enable": "Bật"
"Scan period. Unit: seconds, default 3600.": "Chu kỳ quét. Đơn vị giây, mặc định 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Mạng đích. Hỗ trợ 192.168.1.0/24 hoặc 192.168.1.*, để trống nghĩa là mạng cục bộ. Chỉ hỗ trợ mạng LAN."
"Account. Use env:NAME to reference an environment variable": "Tài khoản. Dùng env:NAME để tham chiếu biến môi trường"
"Password. Can reference an environment variable with env:NAME.": "Mật khẩu. Có thể tham chiếu biến môi trường bằng env:NAME."
"SSH port. Default 22": "Cổng SSH. Mặc định 22"
"Telnet port. Default 23": "Cổng Telnet. Mặc định 23"
"Connection timeout. Default 3000ms": "Thời gian chờ kết nối. Mặc định 3000ms"
"Max concurrency. Default 64": "Đồng thời tối đa. Mặc định 64"
"Max scan hosts. Default 4096": "Số máy chủ quét tối đa. Mặc định 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL gói cài đặt. Để trống để dùng PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Mã băm gói cài đặt. Chuỗi SHA512 dùng để xác minh tính toàn vẹn của gói."
"SSH host fingerprint. Used to verify SSH connections": "Dấu vân tay máy chủ SSH. Dùng để xác minh kết nối SSH"
"Installation directory. Leave blank to use the default path.": "Thư mục cài đặt. Để trống để dùng đường dẫn mặc định."
