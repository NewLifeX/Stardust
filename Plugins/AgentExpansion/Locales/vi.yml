"{0} Telnet failed: {1}": "Telnet {0} thất bại: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Xác minh băm gói thất bại; mong đợi {0}, thực tế {1}"
"Downloading the package over HTTP is risky; assess network security.": "Tải gói qua HTTP có rủi ro; hãy đánh giá bảo mật mạng."
"Package download requires HTTPS or a configured PackageSha512.": "Tải gói yêu cầu HTTPS hoặc cấu hình PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "Node {0} chưa cấu hình dấu vân tay SSH; bỏ qua xác minh"
"Node {0} already has StarAgent ({1})": "Node {0} đã có StarAgent ({1})"
"Installation command sent to node {0}": "Đã gửi lệnh cài đặt tới node {0}"
"Telnet installation command sent to node {0}": "Đã gửi lệnh cài đặt Telnet tới node {0}"
"Node {0} returned from the installation command: {1}": "Node {0} trả về từ lệnh cài đặt: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Dấu vân tay SSH của node {0} không khớp; mong đợi {1}, thực tế {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Tải xuống qua Telnet bằng HTTP cho node {0} có rủi ro; hãy đánh giá bảo mật mạng."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Tải xuống qua Telnet cho node {0} yêu cầu HTTPS hoặc cấu hình PackageSha512."
"StarServer is not configured; skipping automatic installation": "Chưa cấu hình StarServer; bỏ qua cài đặt tự động"
