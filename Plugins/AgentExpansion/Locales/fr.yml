"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Le téléchargement Telnet pour le nœud {0} nécessite HTTPS ou un PackageSha512 configuré."
"StarServer is not configured; skipping automatic installation": "StarServer n'est pas configuré ; installation automatique ignorée"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Le réseau cible {0} n'est pas une adresse de réseau local ; ignoré"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Le nombre d'adresses cibles dépasse la limite {0} ; seules les {0} premières adresses sont analysées lors de ce passage. Ajustez MaxHosts ou réduisez Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Extension LAN pour l'agent Stardust, qui découvre les nœuds et installe StarAgent automatiquement."
"Enable": "Activer"
"Scan period. Unit: seconds, default 3600.": "Période d'analyse. En secondes, par défaut 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Sous-réseau cible. Prend en charge 192.168.1.0/24 ou 192.168.1.*, vide signifie le sous-réseau local. Seuls les sous-réseaux LAN sont pris en charge."
"Account. Use env:NAME to reference an environment variable": "Compte. Utilisez env:NAME pour référencer une variable d'environnement"
"Password. Can reference an environment variable with env:NAME.": "Mot de passe. Vous pouvez référencer une variable d'environnement avec env:NAME."
"SSH port. Default 22": "Port SSH. Par défaut 22"
"Telnet port. Default 23": "Port Telnet. Par défaut 23"
"Connection timeout. Default 3000ms": "Délai de connexion. Par défaut 3000ms"
"Max concurrency. Default 64": "Concurrence maximale. Par défaut 64"
"Max scan hosts. Default 4096": "Nombre maximal d'hôtes analysés. Par défaut 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL du package d'installation. Laissez vide pour utiliser PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hachage du package d'installation. Chaîne SHA512 pour vérifier l'intégrité du package."
"SSH host fingerprint. Used to verify SSH connections": "Empreinte de l'hôte SSH. Utilisée pour vérifier les connexions SSH"
"Installation directory. Leave blank to use the default path.": "Répertoire d'installation. Laissez vide pour utiliser le chemin par défaut."
