# French translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Échec de la sonde {0} : {1}"
"{0} SSH failed: {1}": "Échec de SSH {0} : {1}"
"{0} Telnet failed: {1}": "Échec de Telnet {0} : {1}"
"Package hash verification failed; expected {0}, actual {1}": "Échec de la vérification du hachage du package ; attendu {0}, réel {1}"
"Downloading the package over HTTP is risky; assess network security.": "Télécharger le package via HTTP est risqué ; évaluez la sécurité du réseau."
"Package download requires HTTPS or a configured PackageSha512.": "Le téléchargement du package nécessite HTTPS ou un PackageSha512 configuré."
"Node {0} has no SSH fingerprint configured; skipping verification": "Le nœud {0} n'a pas d'empreinte SSH configurée ; vérification ignorée"
"Node {0} already has StarAgent ({1})": "Le nœud {0} possède déjà StarAgent ({1})"
"Installation command sent to node {0}": "Commande d'installation envoyée au nœud {0}"
"Telnet installation command sent to node {0}": "Commande d'installation Telnet envoyée au nœud {0}"
"Node {0} returned from the installation command: {1}": "Le nœud {0} a renvoyé de la commande d'installation : {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Empreinte SSH différente pour le nœud {0} ; attendu {1}, réel {2}"
