# Romanian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Sonda {0} a eșuat: {1}"
"{0} SSH failed: {1}": "SSH a eșuat pentru {0}: {1}"
"{0} Telnet failed: {1}": "Telnet a eșuat pentru {0}: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Verificarea hash-ului pachetului a eșuat; așteptat {0}, real {1}"
"Downloading the package over HTTP is risky; assess network security.": "Descărcarea pachetului prin HTTP este riscantă; evaluați securitatea rețelei."
"Package download requires HTTPS or a configured PackageSha512.": "Descărcarea pachetului necesită HTTPS sau un PackageSha512 configurat."
"Node {0} has no SSH fingerprint configured; skipping verification": "Nodul {0} nu are amprentă SSH configurată; se omite verificarea"
"Node {0} already has StarAgent ({1})": "Nodul {0} are deja StarAgent ({1})"
"Installation command sent to node {0}": "Comandă de instalare trimisă către nodul {0}"
"Telnet installation command sent to node {0}": "Comandă de instalare prin Telnet trimisă către nodul {0}"
"Node {0} returned from the installation command: {1}": "Nodul {0} a returnat de la comanda de instalare: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Amprentă SSH nepotrivită pentru nodul {0}; așteptat {1}, real {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Descărcarea Telnet prin HTTP pentru nodul {0} este riscantă; evaluați securitatea rețelei."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Descărcarea Telnet pentru nodul {0} necesită HTTPS sau un PackageSha512 configurat."
"StarServer is not configured; skipping automatic installation": "StarServer nu este configurat; se omite instalarea automată"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Rețeaua țintă {0} nu este o adresă de rețea locală; este ignorată"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Numărul de adrese țintă depășește limita {0}; în această rundă sunt scanate doar primele {0} adrese. Ajustați MaxHosts sau restrângeți Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Extensie LAN pentru agentul Stardust care descoperă noduri și instalează automat StarAgent."
"Enable": "Activare"
"Scan period. Unit: seconds, default 3600.": "Perioada de scanare. În secunde, implicit 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Subrețeaua țintă. Acceptă 192.168.1.0/24 sau 192.168.1.*, gol înseamnă subrețeaua locală. Sunt acceptate numai subrețele LAN."
"Account. Use env:NAME to reference an environment variable": "Cont. Folosiți env:NAME pentru a face referire la o variabilă de mediu"
"Password. Can reference an environment variable with env:NAME.": "Parolă. Puteți face referire la o variabilă de mediu cu env:NAME."
"SSH port. Default 22": "Port SSH. Implicit 22"
"Telnet port. Default 23": "Port Telnet. Implicit 23"
"Connection timeout. Default 3000ms": "Timeout de conectare. Implicit 3000ms"
"Max concurrency. Default 64": "Concurență maximă. Implicit 64"
"Max scan hosts. Default 4096": "Număr maxim de gazde scanate. Implicit 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL-ul pachetului de instalare. Lăsați gol pentru a folosi PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash-ul pachetului de instalare. Șir SHA512 pentru verificarea integrității pachetului."
"SSH host fingerprint. Used to verify SSH connections": "Amprenta gazdei SSH. Folosită pentru verificarea conexiunilor SSH"
"Installation directory. Leave blank to use the default path.": "Directorul de instalare. Lăsați gol pentru a folosi calea implicită."
