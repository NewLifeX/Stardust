# Finnish translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0}-luotaus epäonnistui: {1}"
"{0} SSH failed: {1}": "{0} SSH epäonnistui: {1}"
"{0} Telnet failed: {1}": "{0} Telnet epäonnistui: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Paketin tiivisteen vahvistus epäonnistui; odotettiin {0}, saatiin {1}"
"Downloading the package over HTTP is risky; assess network security.": "Paketin lataaminen HTTP:n yli on riskialtista; arvioi verkon turvallisuus."
"Package download requires HTTPS or a configured PackageSha512.": "Paketin lataus vaatii HTTPS:n tai määritetyn PackageSha512:n."
"Node {0} has no SSH fingerprint configured; skipping verification": "Solmulle {0} ei ole määritetty SSH-sormenjälkeä; ohitetaan vahvistus"
"Node {0} already has StarAgent ({1})": "Solmulla {0} on jo StarAgent ({1})"
"Installation command sent to node {0}": "Asennuskomento lähetettiin solmulle {0}"
"Telnet installation command sent to node {0}": "Telnet-asennuskomento lähetettiin solmulle {0}"
"Node {0} returned from the installation command: {1}": "Solmu {0} vastasi asennuskomentoon: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Solmun {0} SSH-sormenjälki ei täsmää; odotettiin {1}, saatiin {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Solmun {0} Telnet-lataus HTTP:n yli on riskialtista; arvioi verkon turvallisuus."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Solmun {0} Telnet-lataus vaatii HTTPS:n tai määritetyn PackageSha512:n."
"StarServer is not configured; skipping automatic installation": "StarServeria ei ole määritetty; ohitetaan automaattinen asennus"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Kohdeverkko {0} ei ole paikallisverkon osoite; ohitetaan"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Kohdeosoitteiden määrä ylittää rajan {0}; tällä kierroksella skannataan vain ensimmäiset {0} osoitetta. Säädä MaxHosts-arvoa tai rajaa Networks-arvoa"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Stardust-agentin LAN-laajennus, joka löytää solmut ja asentaa StarAgentin automaattisesti."
"Enable": "Ota käyttöön"
"Scan period. Unit: seconds, default 3600.": "Skannausjakso. Sekunteina, oletus 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Kohdeverkko. Tukee muotoa 192.168.1.0/24 tai 192.168.1.*, tyhjä tarkoittaa paikallista verkkoa. Vain LAN-verkkoja tuetaan."
"Account. Use env:NAME to reference an environment variable": "Tili. Käytä env:NAME viittaamaan ympäristömuuttujaan"
"Password. Can reference an environment variable with env:NAME.": "Salasana. Ympäristömuuttujaan voi viitata muodossa env:NAME."
"SSH port. Default 22": "SSH-portti. Oletus 22"
"Telnet port. Default 23": "Telnet-portti. Oletus 23"
"Connection timeout. Default 3000ms": "Yhteyden aikakatkaisu. Oletus 3000ms"
"Max concurrency. Default 64": "Suurin samanaikaisuus. Oletus 64"
"Max scan hosts. Default 4096": "Skannattavien isäntien enimmäismäärä. Oletus 4096"
"Installation package URL. Leave blank to use PluginServer.": "Asennuspaketin URL-osoite. Jätä tyhjäksi, jos haluat käyttää PluginServer-palvelinta."
"Installation package hash. SHA512 string used to verify package integrity.": "Asennuspaketin hajautusarvo. SHA512-merkkijono paketin eheyden tarkistamiseen."
"SSH host fingerprint. Used to verify SSH connections": "SSH-isännän sormenjälki. Käytetään SSH-yhteyksien vahvistamiseen"
"Installation directory. Leave blank to use the default path.": "Asennushakemisto. Jätä tyhjäksi, jos haluat käyttää oletuspolkua."
