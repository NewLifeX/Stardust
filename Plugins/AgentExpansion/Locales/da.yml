# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Målnetværket {0} er ikke en lokalnetværksadresse; ignoreres"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Antallet mål-adresser overstiger grænsen {0}; kun de første {0} adresser scannes i denne runde. Juster MaxHosts eller indsnævr Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "LAN-udvidelse til Stardust-agenten, der finder noder og installerer StarAgent automatisk."
"Enable": "Aktivér"
"Scan period. Unit: seconds, default 3600.": "Scanningsperiode. I sekunder, standard 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Målnetværk. Understøtter 192.168.1.0/24 eller 192.168.1.*, tom betyder det lokale netværk. Kun LAN-netværk understøttes."
"Account. Use env:NAME to reference an environment variable": "Konto. Brug env:NAME til at referere til en miljøvariabel"
