"SSH port. Default 22": "SSH-port. Standard 22"
"Telnet port. Default 23": "Telnet-port. Standard 23"
"Connection timeout. Default 3000ms": "Forbindelsestimeout. Standard 3000ms"
"Max concurrency. Default 64": "Maksimal samtidighed. Standard 64"
"Max scan hosts. Default 4096": "Maksimalt antal scanningsværter. Standard 4096"
"Installation package URL. Leave blank to use PluginServer.": "Installationspakke-URL. Lad feltet være tomt for at bruge PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash for installationspakke. SHA512-streng til at kontrollere pakkens integritet."
"SSH host fingerprint. Used to verify SSH connections": "SSH-værtsfingeraftryk. Bruges til at verificere SSH-forbindelser"
