# Bengali translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0} প্রোব ব্যর্থ: {1}"
"{0} SSH failed: {1}": "{0} SSH ব্যর্থ: {1}"
"{0} Telnet failed: {1}": "{0} Telnet ব্যর্থ: {1}"
