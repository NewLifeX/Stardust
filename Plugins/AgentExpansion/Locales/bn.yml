"Telnet installation command sent to node {0}": "Telnet ইনস্টলেশন কমান্ড নোড {0} এ পাঠানো হয়েছে"
"Node {0} returned from the installation command: {1}": "নোড {0} ইনস্টলেশন কমান্ড থেকে ফিরিয়েছে: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "নোড {0} এর জন্য SSH ফিঙ্গারপ্রিন্ট মেলেনি; প্রত্যাশিত {1}, প্রকৃত {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "নোড {0} এর জন্য HTTP-এর মাধ্যমে Telnet ডাউনলোড ঝুঁকিপূর্ণ; নেটওয়ার্ক নিরাপত্তা মূল্যায়ন করুন।"
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "নোড {0} এর জন্য Telnet ডাউনলোডের জন্য HTTPS বা কনফিগার করা PackageSha512 প্রয়োজন।"
"StarServer is not configured; skipping automatic installation": "StarServer কনফিগার করা নেই; স্বয়ংক্রিয় ইনস্টলেশন বাদ দেওয়া হচ্ছে"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "লক্ষ্য নেটওয়ার্ক {0} স্থানীয় নেটওয়ার্ক ঠিকানা নয়; উপেক্ষা করা হয়েছে"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "লক্ষ্য ঠিকানার সংখ্যা সীমা {0} ছাড়িয়ে গেছে; এই রাউন্ডে শুধুমাত্র প্রথম {0} টি ঠিকানা স্ক্যান করা হবে। MaxHosts সামঞ্জস্য করুন বা Networks সংকীর্ণ করুন"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Stardust এজেন্টের জন্য LAN এক্সটেনশন যা নোড আবিষ্কার করে এবং স্বয়ংক্রিয়ভাবে StarAgent ইনস্টল করে।"
"Enable": "সক্ষম করুন"
"Scan period. Unit: seconds, default 3600.": "স্ক্যান সময়কাল। একক সেকেন্ড, ডিফল্ট 3600।"
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "লক্ষ্য সাবনেট। 192.168.1.0/24 বা 192.168.1.* সমর্থন করে, খালি মানে স্থানীয় সাবনেট। শুধুমাত্র LAN সাবনেট সমর্থিত।"
"Account. Use env:NAME to reference an environment variable": "অ্যাকাউন্ট। পরিবেশ ভেরিয়েবল উল্লেখ করতে env:NAME ব্যবহার করুন"
"Password. Can reference an environment variable with env:NAME.": "পাসওয়ার্ড। env:NAME ব্যবহার করে পরিবেশ ভেরিয়েবল রেফারেন্স করা যায়।"
"SSH port. Default 22": "SSH পোর্ট। ডিফল্ট 22"
"Telnet port. Default 23": "Telnet পোর্ট। ডিফল্ট 23"
"Connection timeout. Default 3000ms": "সংযোগ সময়সীমা। ডিফল্ট 3000ms"
"Max concurrency. Default 64": "সর্বোচ্চ সমবর্তন। ডিফল্ট 64"
"Max scan hosts. Default 4096": "সর্বোচ্চ স্ক্যান হোস্ট। ডিফল্ট 4096"
"Installation package URL. Leave blank to use PluginServer.": "ইনস্টলেশন প্যাকেজ URL। PluginServer ব্যবহার করতে খালি রাখুন।"
"Installation package hash. SHA512 string used to verify package integrity.": "ইনস্টলেশন প্যাকেজ হ্যাশ। প্যাকেজের অখণ্ডতা যাচাই করতে SHA512 স্ট্রিং।"
"SSH host fingerprint. Used to verify SSH connections": "SSH হোস্ট ফিঙ্গারপ্রিন্ট। SSH সংযোগ যাচাই করতে ব্যবহৃত হয়"
"Installation directory. Leave blank to use the default path.": "ইনস্টলেশন ডিরেক্টরি। ডিফল্ট পথ ব্যবহার করতে খালি রাখুন।"
