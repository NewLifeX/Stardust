"Downloading the package over HTTP is risky; assess network security.": "HTTP-এর মাধ্যমে প্যাকেজ ডাউনলোড ঝুঁকিপূর্ণ; নেটওয়ার্ক নিরাপত্তা মূল্যায়ন করুন।"
"Package download requires HTTPS or a configured PackageSha512.": "প্যাকেজ ডাউনলোডের জন্য HTTPS বা কনফিগার করা PackageSha512 প্রয়োজন।"
