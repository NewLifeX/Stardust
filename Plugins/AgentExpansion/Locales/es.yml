# Spanish translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Error en la sonda {0}: {1}"
"{0} SSH failed: {1}": "Error de SSH en {0}: {1}"
"{0} Telnet failed: {1}": "Error de Telnet en {0}: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Error en la verificación del hash del paquete; se esperaba {0}, se obtuvo {1}"
"Downloading the package over HTTP is risky; assess network security.": "Descargar el paquete por HTTP es riesgoso; evalúe la seguridad de la red."
"Package download requires HTTPS or a configured PackageSha512.": "La descarga del paquete requiere HTTPS o un PackageSha512 configurado."
"Node {0} has no SSH fingerprint configured; skipping verification": "El nodo {0} no tiene ninguna huella SSH configurada; se omite la verificación"
"Node {0} already has StarAgent ({1})": "El nodo {0} ya tiene StarAgent ({1})"
"Installation command sent to node {0}": "Comando de instalación enviado al nodo {0}"
"Telnet installation command sent to node {0}": "Comando de instalación por Telnet enviado al nodo {0}"
"Node {0} returned from the installation command: {1}": "El nodo {0} devolvió lo siguiente del comando de instalación: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "La huella SSH del nodo {0} no coincide; se esperaba {1}, se obtuvo {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "La descarga Telnet por HTTP para el nodo {0} es riesgosa; evalúe la seguridad de la red."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "La descarga Telnet para el nodo {0} requiere HTTPS o un PackageSha512 configurado."
"StarServer is not configured; skipping automatic installation": "StarServer no está configurado; se omite la instalación automática"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "La red de destino {0} no es una dirección de red local; se ignora"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "El número de direcciones de destino supera el límite {0}; en esta ronda solo se analizan las primeras {0} direcciones. Ajuste MaxHosts o restrinja Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Extensión de LAN para el agente de Stardust que descubre nodos e instala StarAgent automáticamente."
"Enable": "Habilitar"
"Scan period. Unit: seconds, default 3600.": "Período de escaneo. En segundos, predeterminado 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Subred de destino. Admite 192.168.1.0/24 o 192.168.1.*; vacío significa la subred local. Solo se admiten subredes LAN."
"Account. Use env:NAME to reference an environment variable": "Cuenta. Use env:NAME para hacer referencia a una variable de entorno"
"Password. Can reference an environment variable with env:NAME.": "Contraseña. Se puede hacer referencia a una variable de entorno con env:NAME."
"SSH port. Default 22": "Puerto SSH. Predeterminado 22"
"Telnet port. Default 23": "Puerto Telnet. Predeterminado 23"
"Connection timeout. Default 3000ms": "Tiempo de espera de conexión. Predeterminado 3000ms"
"Max concurrency. Default 64": "Simultaneidad máxima. Predeterminado 64"
"Max scan hosts. Default 4096": "Máximo de hosts de escaneo. Predeterminado 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL del paquete de instalación. Déjelo vacío para usar PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash del paquete de instalación. Cadena SHA512 para verificar la integridad del paquete."
"SSH host fingerprint. Used to verify SSH connections": "Huella del host SSH. Se usa para verificar conexiones SSH"
"Installation directory. Leave blank to use the default path.": "Directorio de instalación. Déjelo vacío para usar la ruta predeterminada."
