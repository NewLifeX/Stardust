# Dutch translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0} probe mislukt: {1}"
"{0} SSH failed: {1}": "{0} SSH mislukt: {1}"
"{0} Telnet failed: {1}": "{0} Telnet mislukt: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Hashverificatie van pakket mislukt; verwacht {0}, werkelijk {1}"
"Downloading the package over HTTP is risky; assess network security.": "Het pakket via HTTP downloaden is riskant; beoordeel de netwerkbeveiliging."
"Package download requires HTTPS or a configured PackageSha512.": "Pakketdownload vereist HTTPS of een geconfigureerde PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "Knooppunt {0} heeft geen SSH-vingerafdruk geconfigureerd; verificatie wordt overgeslagen"
"Node {0} already has StarAgent ({1})": "Knooppunt {0} heeft al StarAgent ({1})"
"Installation command sent to node {0}": "Installatieopdracht naar knooppunt {0} verzonden"
"Telnet installation command sent to node {0}": "Telnet-installatieopdracht naar knooppunt {0} verzonden"
"Node {0} returned from the installation command: {1}": "Knooppunt {0} heeft op de installatieopdracht gereageerd: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "SSH-vingerafdruk komt niet overeen voor knooppunt {0}; verwacht {1}, werkelijk {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Telnet-download via HTTP voor knooppunt {0} is riskant; beoordeel de netwerkbeveiliging."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Telnet-download voor knooppunt {0} vereist HTTPS of een geconfigureerde PackageSha512."
"StarServer is not configured; skipping automatic installation": "StarServer is niet geconfigureerd; automatische installatie wordt overgeslagen"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Doelnetwerk {0} is geen lokaal netwerkadres; genegeerd"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Het aantal doeladressen overschrijdt de limiet {0}; in deze ronde worden alleen de eerste {0} adressen gescand. Pas MaxHosts aan of beperk Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "LAN-uitbreiding voor de Stardust-agent die knooppunten ontdekt en StarAgent automatisch installeert."
"Enable": "Inschakelen"
"Scan period. Unit: seconds, default 3600.": "Scaninterval. In seconden, standaard 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Doelsubnet. Ondersteunt 192.168.1.0/24 of 192.168.1.*, leeg betekent het lokale subnet. Alleen LAN-subnetten worden ondersteund."
"Account. Use env:NAME to reference an environment variable": "Account. Gebruik env:NAME om naar een omgevingsvariabele te verwijzen"
"Password. Can reference an environment variable with env:NAME.": "Wachtwoord. U kunt met env:NAME verwijzen naar een omgevingsvariabele."
"SSH port. Default 22": "SSH-poort. Standaard 22"
"Telnet port. Default 23": "Telnet-poort. Standaard 23"
"Connection timeout. Default 3000ms": "Verbindingstime-out. Standaard 3000ms"
"Max concurrency. Default 64": "Maximale gelijktijdigheid. Standaard 64"
"Max scan hosts. Default 4096": "Maximaal aantal scanhosts. Standaard 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL van installatiepakket. Laat leeg om PluginServer te gebruiken."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash van installatiepakket. SHA512-tekenreeks om de integriteit van het pakket te verifiëren."
"SSH host fingerprint. Used to verify SSH connections": "SSH-hostvingerafdruk. Wordt gebruikt om SSH-verbindingen te verifiëren"
"Installation directory. Leave blank to use the default path.": "Installatiemap. Laat leeg om het standaardpad te gebruiken."
