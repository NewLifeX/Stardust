# Arabic translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "فشل فحص {0}: {1}"
"{0} SSH failed: {1}": "فشل SSH {0}: {1}"
"{0} Telnet failed: {1}": "فشل Telnet {0}: {1}"
"Package hash verification failed; expected {0}, actual {1}": "فشل التحقق من تجزئة الحزمة؛ المتوقع {0}، الفعلي {1}"
"Downloading the package over HTTP is risky; assess network security.": "تنزيل الحزمة عبر HTTP محفوف بالمخاطر؛ قيّم أمان الشبكة."
"Package download requires HTTPS or a configured PackageSha512.": "يتطلب تنزيل الحزمة HTTPS أو PackageSha512 مهيأ."
"Node {0} has no SSH fingerprint configured; skipping verification": "العقدة {0} بلا بصمة SSH مهيأة؛ جارٍ تخطي التحقق"
"Node {0} already has StarAgent ({1})": "العقدة {0} لديها StarAgent بالفعل ({1})"
"Installation command sent to node {0}": "تم إرسال أمر التثبيت إلى العقدة {0}"
"Telnet installation command sent to node {0}": "تم إرسال أمر التثبيت عبر Telnet إلى العقدة {0}"
"Node {0} returned from the installation command: {1}": "أعادت العقدة {0} من أمر التثبيت: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "عدم تطابق بصمة SSH للعقدة {0}؛ المتوقع {1}، الفعلي {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "تنزيل Telnet عبر HTTP للعقدة {0} محفوف بالمخاطر؛ قيّم أمان الشبكة."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "يتطلب تنزيل Telnet للعقدة {0} HTTPS أو PackageSha512 مهيأ."
"StarServer is not configured; skipping automatic installation": "لم يتم تهيئة StarServer؛ جارٍ تخطي التثبيت التلقائي"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "الشبكة الهدف {0} ليست عنوان شبكة محلية؛ تم تجاهلها"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "عدد العناوين الهدف يتجاوز الحد {0}؛ في هذه الجولة سيتم فحص أول {0} عنوان فقط. اضبط MaxHosts أو ضيّق Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "امتداد LAN لوكيل Stardust يكتشف العقد ويثبّت StarAgent تلقائيًا."
"Enable": "تمكين"
"Scan period. Unit: seconds, default 3600.": "فترة المسح. الوحدة ثانية، الافتراضي 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "الشبكة الفرعية الهدف. تدعم 192.168.1.0/24 أو 192.168.1.*، والقيمة الفارغة تعني الشبكة الفرعية المحلية. يتم دعم شبكات LAN فقط."
"Account. Use env:NAME to reference an environment variable": "الحساب. يمكنك استخدام env:NAME للإشارة إلى متغير بيئة"
"Password. Can reference an environment variable with env:NAME.": "كلمة المرور. يمكن استخدام env:NAME للإشارة إلى متغير بيئة."
"SSH port. Default 22": "منفذ SSH. الافتراضي 22"
"Telnet port. Default 23": "منفذ Telnet. الافتراضي 23"
"Connection timeout. Default 3000ms": "مهلة الاتصال. الافتراضي 3000ms"
"Max concurrency. Default 64": "أقصى تزامن. الافتراضي 64"
"Max scan hosts. Default 4096": "أقصى عدد مضيفين للمسح. الافتراضي 4096"
"Installation package URL. Leave blank to use PluginServer.": "عنوان حزمة التثبيت. اتركه فارغًا لاستخدام PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "تجزئة حزمة التثبيت. سلسلة SHA512 تُستخدم للتحقق من سلامة الحزمة."
"SSH host fingerprint. Used to verify SSH connections": "بصمة مضيف SSH. تُستخدم للتحقق من اتصالات SSH"
"Installation directory. Leave blank to use the default path.": "دليل التثبيت. اتركه فارغًا لاستخدام المسار الافتراضي."
