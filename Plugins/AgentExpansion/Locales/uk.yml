# Ukrainian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Помилка перевірки {0}: {1}"
"{0} SSH failed: {1}": "Помилка SSH ({0}): {1}"
"{0} Telnet failed: {1}": "Помилка Telnet ({0}): {1}"
"Package hash verification failed; expected {0}, actual {1}": "Перевірка хешу пакета не вдалася; очікувалося {0}, отримано {1}"
"Downloading the package over HTTP is risky; assess network security.": "Завантаження пакета через HTTP ризиковане; оцініть безпеку мережі."
"Package download requires HTTPS or a configured PackageSha512.": "Для завантаження пакета потрібен HTTPS або налаштований PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "У вузла {0} не налаштовано відбиток SSH; перевірку пропущено"
"Node {0} already has StarAgent ({1})": "На вузлі {0} вже є StarAgent ({1})"
"Installation command sent to node {0}": "Команду встановлення надіслано на вузол {0}"
"Telnet installation command sent to node {0}": "Команду встановлення Telnet надіслано на вузол {0}"
"Node {0} returned from the installation command: {1}": "Вузол {0} повернув результат команди встановлення: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Невідповідність відбитка SSH для вузла {0}; очікувалося {1}, отримано {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Завантаження через Telnet по HTTP для вузла {0} ризиковане; оцініть безпеку мережі."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Для завантаження через Telnet для вузла {0} потрібен HTTPS або налаштований PackageSha512."
"StarServer is not configured; skipping automatic installation": "StarServer не налаштовано; автоматичне встановлення пропущено"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Цільова мережа {0} не є адресою локальної мережі; пропущено"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Кількість цільових адрес перевищує ліміт {0}; у цьому циклі скануються лише перші {0} адрес. Налаштуйте MaxHosts або звузьте Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Розширення LAN для агента Stardust, яке виявляє вузли та автоматично встановлює StarAgent."
"Enable": "Увімкнути"
"Scan period. Unit: seconds, default 3600.": "Період сканування. У секундах, за замовчуванням 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Цільова підмережа. Підтримує 192.168.1.0/24 або 192.168.1.*, порожнє значення означає локальну підмережу. Підтримуються лише підмережі LAN."
"Account. Use env:NAME to reference an environment variable": "Обліковий запис. Використовуйте env:NAME для посилання на змінну середовища"
"Password. Can reference an environment variable with env:NAME.": "Пароль. Можна вказати змінну середовища через env:NAME."
"SSH port. Default 22": "Порт SSH. Типово 22"
"Telnet port. Default 23": "Порт Telnet. Типово 23"
"Connection timeout. Default 3000ms": "Час очікування з'єднання. За замовчуванням 3000ms"
"Max concurrency. Default 64": "Максимальна паралельність. Типово 64"
"Max scan hosts. Default 4096": "Максимум хостів сканування. Типово 4096"
"Installation package URL. Leave blank to use PluginServer.": "Адреса пакета встановлення. Залиште порожнім, щоб використовувати PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Хеш пакета встановлення. Рядок SHA512 для перевірки цілісності пакета."
"SSH host fingerprint. Used to verify SSH connections": "Відбиток хоста SSH. Використовується для перевірки SSH-з'єднань"
"Installation directory. Leave blank to use the default path.": "Каталог встановлення. Залиште порожнім для використання шляху за замовчуванням."
