# Italian translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Sonda {0} non riuscita: {1}"
"{0} SSH failed: {1}": "SSH non riuscito per {0}: {1}"
"{0} Telnet failed: {1}": "Telnet non riuscito per {0}: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Verifica dell'hash del pacchetto non riuscita; atteso {0}, effettivo {1}"
"Downloading the package over HTTP is risky; assess network security.": "Scaricare il pacchetto tramite HTTP è rischioso; valutare la sicurezza della rete."
"Package download requires HTTPS or a configured PackageSha512.": "Il download del pacchetto richiede HTTPS o un PackageSha512 configurato."
"Node {0} has no SSH fingerprint configured; skipping verification": "Il nodo {0} non ha un'impronta SSH configurata; verifica ignorata"
"Node {0} already has StarAgent ({1})": "Il nodo {0} ha già StarAgent ({1})"
"Installation command sent to node {0}": "Comando di installazione inviato al nodo {0}"
"Telnet installation command sent to node {0}": "Comando di installazione Telnet inviato al nodo {0}"
"Node {0} returned from the installation command: {1}": "Il nodo {0} ha restituito dal comando di installazione: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Impronta SSH non corrispondente per il nodo {0}; atteso {1}, effettivo {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Il download Telnet tramite HTTP per il nodo {0} è rischioso; valutare la sicurezza della rete."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Il download Telnet per il nodo {0} richiede HTTPS o un PackageSha512 configurato."
"StarServer is not configured; skipping automatic installation": "StarServer non è configurato; installazione automatica ignorata"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "La rete di destinazione {0} non è un indirizzo di rete locale; ignorata"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Il numero di indirizzi di destinazione supera il limite {0}; in questo ciclo vengono analizzati solo i primi {0} indirizzi. Modificare MaxHosts o restringere Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Estensione LAN per l'agente Stardust che rileva i nodi e installa StarAgent automaticamente."
"Enable": "Abilita"
"Scan period. Unit: seconds, default 3600.": "Periodo di scansione. In secondi, predefinito 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Sottorete di destinazione. Supporta 192.168.1.0/24 o 192.168.1.*, vuoto significa la sottorete locale. Sono supportate solo le sottoreti LAN."
"Account. Use env:NAME to reference an environment variable": "Account. Usa env:NAME per fare riferimento a una variabile d'ambiente"
"Password. Can reference an environment variable with env:NAME.": "Password. È possibile fare riferimento a una variabile di ambiente con env:NAME."
"SSH port. Default 22": "Porta SSH. Predefinito 22"
"Telnet port. Default 23": "Porta Telnet. Predefinito 23"
"Connection timeout. Default 3000ms": "Timeout di connessione. Predefinito 3000ms"
"Max concurrency. Default 64": "Concorrenza massima. Predefinito 64"
"Max scan hosts. Default 4096": "Numero massimo di host scansionati. Predefinito 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL del pacchetto di installazione. Lasciare vuoto per usare PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash del pacchetto di installazione. Stringa SHA512 per verificare l'integrità del pacchetto."
"SSH host fingerprint. Used to verify SSH connections": "Impronta dell'host SSH. Usata per verificare le connessioni SSH"
"Installation directory. Leave blank to use the default path.": "Directory di installazione. Lasciare vuoto per usare il percorso predefinito."
