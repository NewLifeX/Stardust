# Greek translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Η δοκιμή {0} απέτυχε: {1}"
"{0} SSH failed: {1}": "Το SSH {0} απέτυχε: {1}"
"{0} Telnet failed: {1}": "Το Telnet {0} απέτυχε: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Η επαλήθευση κατακερματισμού του πακέτου απέτυχε· αναμενόταν {0}, βρέθηκε {1}"
"Downloading the package over HTTP is risky; assess network security.": "Η λήψη του πακέτου μέσω HTTP είναι επισφαλής· αξιολογήστε την ασφάλεια του δικτύου."
"Package download requires HTTPS or a configured PackageSha512.": "Η λήψη πακέτου απαιτεί HTTPS ή διαμορφωμένο PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "Ο κόμβος {0} δεν έχει διαμορφωμένο αποτύπωμα SSH· παράλειψη επαλήθευσης"
"Node {0} already has StarAgent ({1})": "Ο κόμβος {0} έχει ήδη StarAgent ({1})"
"Installation command sent to node {0}": "Η εντολή εγκατάστασης στάλθηκε στον κόμβο {0}"
"Telnet installation command sent to node {0}": "Η εντολή εγκατάστασης Telnet στάλθηκε στον κόμβο {0}"
"Node {0} returned from the installation command: {1}": "Ο κόμβος {0} επέστρεψε από την εντολή εγκατάστασης: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Ασυμφωνία αποτυπώματος SSH για τον κόμβο {0}· αναμενόταν {1}, βρέθηκε {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Η λήψη μέσω Telnet πάνω από HTTP για τον κόμβο {0} είναι επισφαλής· αξιολογήστε την ασφάλεια του δικτύου."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Η λήψη μέσω Telnet για τον κόμβο {0} απαιτεί HTTPS ή διαμορφωμένο PackageSha512."
"StarServer is not configured; skipping automatic installation": "Ο StarServer δεν έχει διαμορφωθεί· παράλειψη αυτόματης εγκατάστασης"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Το δίκτυο προορισμού {0} δεν είναι διεύθυνση τοπικού δικτύου· αγνοείται"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Ο αριθμός των διευθύνσεων προορισμού υπερβαίνει το όριο {0}· σε αυτόν τον κύκλο σαρώνονται μόνο οι πρώτες {0} διευθύνσεις. Προσαρμόστε το MaxHosts ή περιορίστε το Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Επέκταση LAN για τον πράκτορα Stardust που εντοπίζει κόμβους και εγκαθιστά αυτόματα το StarAgent."
"Enable": "Ενεργοποίηση"
"Scan period. Unit: seconds, default 3600.": "Περίοδος σάρωσης. Σε δευτερόλεπτα, προεπιλογή 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Υποδίκτυο προορισμού. Υποστηρίζει 192.168.1.0/24 ή 192.168.1.*, κενό σημαίνει τοπικό υποδίκτυο. Υποστηρίζονται μόνο υποδίκτυα LAN."
"Account. Use env:NAME to reference an environment variable": "Λογαριασμός. Χρησιμοποιήστε env:NAME για να αναφερθείτε σε μια μεταβλητή περιβάλλοντος"
"Password. Can reference an environment variable with env:NAME.": "Κωδικός πρόσβασης. Μπορείτε να αναφέρετε μεταβλητή περιβάλλοντος με env:NAME."
"SSH port. Default 22": "Θύρα SSH. Προεπιλογή 22"
"Telnet port. Default 23": "Θύρα Telnet. Προεπιλογή 23"
"Connection timeout. Default 3000ms": "Χρονικό όριο σύνδεσης. Προεπιλογή 3000ms"
"Max concurrency. Default 64": "Μέγιστη ταυτόχρονη εκτέλεση. Προεπιλογή 64"
"Max scan hosts. Default 4096": "Μέγιστοι διακομιστές σάρωσης. Προεπιλογή 4096"
"Installation package URL. Leave blank to use PluginServer.": "Διεύθυνση πακέτου εγκατάστασης. Αφήστε κενό για χρήση του PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Κατακερματισμός πακέτου εγκατάστασης. Συμβολοσειρά SHA512 για επαλήθευση της ακεραιότητας του πακέτου."
"SSH host fingerprint. Used to verify SSH connections": "Αποτύπωμα κεντρικού υπολογιστή SSH. Χρησιμοποιείται για την επαλήθευση συνδέσεων SSH"
"Installation directory. Leave blank to use the default path.": "Κατάλογος εγκατάστασης. Αφήστε κενό για την προεπιλεγμένη διαδρομή."
