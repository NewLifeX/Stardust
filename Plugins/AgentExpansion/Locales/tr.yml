# Turkish translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "{0} yoklaması başarısız: {1}"
"{0} SSH failed: {1}": "{0} SSH başarısız: {1}"
"{0} Telnet failed: {1}": "{0} Telnet başarısız: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Paket karması doğrulaması başarısız; beklenen {0}, gerçek {1}"
"Downloading the package over HTTP is risky; assess network security.": "Paketi HTTP üzerinden indirmek risklidir; ağ güvenliğini değerlendirin."
"Package download requires HTTPS or a configured PackageSha512.": "Paket indirme, HTTPS veya yapılandırılmış bir PackageSha512 gerektirir."
"Node {0} has no SSH fingerprint configured; skipping verification": "{0} düğümünde SSH parmak izi yapılandırılmamış; doğrulama atlanıyor"
"Node {0} already has StarAgent ({1})": "{0} düğümünde zaten StarAgent var ({1})"
"Installation command sent to node {0}": "{0} düğümüne yükleme komutu gönderildi"
"Telnet installation command sent to node {0}": "{0} düğümüne Telnet yükleme komutu gönderildi"
"Node {0} returned from the installation command: {1}": "{0} düğümü yükleme komutundan döndü: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "{0} düğümü için SSH parmak izi uyuşmuyor; beklenen {1}, gerçek {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "{0} düğümü için Telnet üzerinden HTTP indirme risklidir; ağ güvenliğini değerlendirin."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "{0} düğümü için Telnet indirme, HTTPS veya yapılandırılmış bir PackageSha512 gerektirir."
"StarServer is not configured; skipping automatic installation": "StarServer yapılandırılmamış; otomatik yükleme atlanıyor"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Hedef ağ {0} yerel ağ adresi değil; yoksayıldı"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Hedef adres sayısı {0} sınırını aşıyor; bu turda yalnızca ilk {0} adres taranacak. MaxHosts değerini ayarlayın veya Networks değerini daraltın"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Stardust aracısı için düğümleri bulan ve StarAgent'ı otomatik olarak yükleyen LAN uzantısı."
"Enable": "Etkinleştir"
"Scan period. Unit: seconds, default 3600.": "Tarama dönemi. Saniye cinsinden, varsayılan 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Hedef ağ. 192.168.1.0/24 veya 192.168.1.* destekler, boş değer yerel ağı ifade eder. Yalnızca LAN ağları desteklenir."
"Account. Use env:NAME to reference an environment variable": "Hesap. Bir ortam değişkenine başvurmak için env:NAME kullanın"
"Password. Can reference an environment variable with env:NAME.": "Parola. env:NAME ile ortam değişkenine başvurulabilir."
"SSH port. Default 22": "SSH bağlantı noktası. Varsayılan 22"
"Telnet port. Default 23": "Telnet bağlantı noktası. Varsayılan 23"
"Connection timeout. Default 3000ms": "Bağlantı zaman aşımı. Varsayılan 3000ms"
"Max concurrency. Default 64": "Maksimum eşzamanlılık. Varsayılan 64"
"Max scan hosts. Default 4096": "Maksimum tarama ana bilgisayarı. Varsayılan 4096"
"Installation package URL. Leave blank to use PluginServer.": "Kurulum paketi URL'si. PluginServer kullanmak için boş bırakın."
"Installation package hash. SHA512 string used to verify package integrity.": "Kurulum paketi karması. Paket bütünlüğünü doğrulamak için SHA512 dizesi."
"SSH host fingerprint. Used to verify SSH connections": "SSH ana bilgisayar parmak izi. SSH bağlantılarını doğrulamak için kullanılır"
"Installation directory. Leave blank to use the default path.": "Kurulum dizini. Varsayılan yolu kullanmak için boş bırakın."
