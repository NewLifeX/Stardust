# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "目标网段 {0} 不是局域网地址，已忽略"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "目标地址超过上限 {0}，本轮仅扫描前 {0} 个地址，请调整MaxHosts或收窄Networks"
"Agent expansion": "代理扩展"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "星尘代理局域网扩展，探测节点并自动安装StarAgent"
"Enable": "启用"
"Scan period. Unit: seconds, default 3600.": "扫描周期。单位秒，默认3600"
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "目标网段。支持192.168.1.0/24或192.168.1.*，为空表示本地网段。仅支持局域网网段"
"Account. Use env:NAME to reference an environment variable": "账号。可使用env:NAME引用环境变量"
"Password. Can reference an environment variable with env:NAME.": "密码。可使用env:NAME引用环境变量"
"SSH port. Default 22": "SSH端口。默认22"
"Telnet port. Default 23": "Telnet端口。默认23"
"Connection timeout. Default 3000ms": "连接超时。默认3000ms"
"Max concurrency. Default 64": "最大并发。默认64"
"Max scan hosts. Default 4096": "最大扫描主机数。默认4096"
"Installation package URL. Leave blank to use PluginServer.": "安装包地址。留空则使用PluginServer"
"Installation package hash. SHA512 string used to verify package integrity.": "安装包哈希。SHA512字符串，用于校验包完整性"
"SSH host fingerprint. Used to verify SSH connections": "SSH主机指纹。用于校验SSH连接"
"Installation directory. Leave blank to use the default path.": "安装目录。留空使用默认路径"
