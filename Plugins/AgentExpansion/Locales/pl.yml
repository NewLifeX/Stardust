# Polish translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Test {0} nie powiódł się: {1}"
"{0} SSH failed: {1}": "Błąd SSH ({0}): {1}"
"{0} Telnet failed: {1}": "Błąd Telnet ({0}): {1}"
"Package hash verification failed; expected {0}, actual {1}": "Weryfikacja skrótu pakietu nie powiodła się; oczekiwano {0}, otrzymano {1}"
"Downloading the package over HTTP is risky; assess network security.": "Pobieranie pakietu przez HTTP jest ryzykowne; oceń bezpieczeństwo sieci."
"Package download requires HTTPS or a configured PackageSha512.": "Pobieranie pakietu wymaga HTTPS lub skonfigurowanego PackageSha512."
"Node {0} has no SSH fingerprint configured; skipping verification": "W węźle {0} nie skonfigurowano odcisku SSH; pomijanie weryfikacji"
"Node {0} already has StarAgent ({1})": "Węzeł {0} ma już StarAgent ({1})"
"Installation command sent to node {0}": "Wysłano polecenie instalacji do węzła {0}"
"Telnet installation command sent to node {0}": "Wysłano polecenie instalacji Telnet do węzła {0}"
"Node {0} returned from the installation command: {1}": "Węzeł {0} zwrócił wynik polecenia instalacji: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Niezgodność odcisku SSH dla węzła {0}; oczekiwano {1}, otrzymano {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "Pobieranie przez Telnet po HTTP dla węzła {0} jest ryzykowne; oceń bezpieczeństwo sieci."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "Pobieranie przez Telnet dla węzła {0} wymaga HTTPS lub skonfigurowanego PackageSha512."
"StarServer is not configured; skipping automatic installation": "StarServer nie jest skonfigurowany; pomijanie automatycznej instalacji"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "Sieć docelowa {0} nie jest adresem sieci lokalnej; pominięto"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "Liczba adresów docelowych przekracza limit {0}; w tej rundzie skanowanych jest tylko pierwszych {0} adresów. Dostosuj MaxHosts lub zawęź Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Rozszerzenie LAN dla agenta Stardust, które wykrywa węzły i automatycznie instaluje StarAgent."
"Enable": "Włącz"
"Scan period. Unit: seconds, default 3600.": "Okres skanowania. W sekundach, domyślnie 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Podsieć docelowa. Obsługuje 192.168.1.0/24 lub 192.168.1.*, puste oznacza podsieć lokalną. Obsługiwane są tylko podsieci LAN."
"Account. Use env:NAME to reference an environment variable": "Konto. Użyj env:NAME, aby odwołać się do zmiennej środowiskowej"
"Password. Can reference an environment variable with env:NAME.": "Hasło. Można odwołać się do zmiennej środowiskowej za pomocą env:NAME."
"SSH port. Default 22": "Port SSH. Domyślnie 22"
"Telnet port. Default 23": "Port Telnet. Domyślnie 23"
"Connection timeout. Default 3000ms": "Limit czasu połączenia. Domyślnie 3000ms"
"Max concurrency. Default 64": "Maksymalna współbieżność. Domyślnie 64"
"Max scan hosts. Default 4096": "Maksymalna liczba skanowanych hostów. Domyślnie 4096"
"Installation package URL. Leave blank to use PluginServer.": "Adres URL pakietu instalacyjnego. Pozostaw puste, aby użyć PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Skrót pakietu instalacyjnego. Ciąg SHA512 do weryfikacji integralności pakietu."
"SSH host fingerprint. Used to verify SSH connections": "Odcisk hosta SSH. Używany do weryfikacji połączeń SSH"
"Installation directory. Leave blank to use the default path.": "Katalog instalacji. Pozostaw puste, aby użyć domyślnej ścieżki."
