# Portuguese translation. Keys are English source texts; missing entries fall back to English at runtime.
"{0} probe failed: {1}": "Falha na sondagem {0}: {1}"
"{0} SSH failed: {1}": "Falha de SSH em {0}: {1}"
"{0} Telnet failed: {1}": "Falha de Telnet em {0}: {1}"
"Package hash verification failed; expected {0}, actual {1}": "Falha na verificação do hash do pacote; esperado {0}, obtido {1}"
"Downloading the package over HTTP is risky; assess network security.": "Baixar o pacote por HTTP é arriscado; avalie a segurança da rede."
"Package download requires HTTPS or a configured PackageSha512.": "O download do pacote requer HTTPS ou um PackageSha512 configurado."
"Node {0} has no SSH fingerprint configured; skipping verification": "O nó {0} não tem impressão digital SSH configurada; ignorando a verificação"
"Node {0} already has StarAgent ({1})": "O nó {0} já tem StarAgent ({1})"
"Installation command sent to node {0}": "Comando de instalação enviado ao nó {0}"
"Telnet installation command sent to node {0}": "Comando de instalação Telnet enviado ao nó {0}"
"Node {0} returned from the installation command: {1}": "O nó {0} retornou do comando de instalação: {1}"
"SSH fingerprint mismatch for node {0}; expected {1}, actual {2}": "Impressão digital SSH do nó {0} não corresponde; esperado {1}, obtido {2}"
"Telnet download over HTTP for node {0} is risky; assess network security.": "O download Telnet por HTTP para o nó {0} é arriscado; avalie a segurança da rede."
"Telnet download for node {0} requires HTTPS or a configured PackageSha512.": "O download Telnet para o nó {0} requer HTTPS ou um PackageSha512 configurado."
"StarServer is not configured; skipping automatic installation": "StarServer não está configurado; ignorando a instalação automática"
# 运行时消息补充词条
"Target network {0} is not a local network address; ignored": "A rede de destino {0} não é um endereço de rede local; ignorada"
"The number of target addresses exceeds the limit {0}; only the first {0} addresses are scanned in this round. Adjust MaxHosts or narrow Networks": "O número de endereços de destino excede o limite {0}; nesta rodada apenas os primeiros {0} endereços são verificados. Ajuste MaxHosts ou restrinja Networks"
"Agent expansion": "Agent expansion"
"LAN extension for the Stardust agent that discovers nodes and installs StarAgent automatically.": "Extensão de LAN para o agente Stardust que descobre nós e instala o StarAgent automaticamente."
"Enable": "Ativar"
"Scan period. Unit: seconds, default 3600.": "Período de varredura. Em segundos, padrão 3600."
"Target subnet. Supports 192.168.1.0/24 or 192.168.1.*; empty means the local subnet. Only LAN subnets are supported.": "Sub-rede de destino. Suporta 192.168.1.0/24 ou 192.168.1.*, vazio significa a sub-rede local. Apenas sub-redes LAN são suportadas."
"Account. Use env:NAME to reference an environment variable": "Conta. Use env:NAME para referenciar uma variável de ambiente"
"Password. Can reference an environment variable with env:NAME.": "Senha. Pode referenciar uma variável de ambiente com env:NAME."
"SSH port. Default 22": "Porta SSH. Padrão 22"
"Telnet port. Default 23": "Porta Telnet. Padrão 23"
"Connection timeout. Default 3000ms": "Tempo limite de conexão. Padrão 3000ms"
"Max concurrency. Default 64": "Simultaneidade máxima. Padrão 64"
"Max scan hosts. Default 4096": "Máximo de hosts de verificação. Padrão 4096"
"Installation package URL. Leave blank to use PluginServer.": "URL do pacote de instalação. Deixe em branco para usar o PluginServer."
"Installation package hash. SHA512 string used to verify package integrity.": "Hash do pacote de instalação. Cadeia SHA512 para verificar a integridade do pacote."
"SSH host fingerprint. Used to verify SSH connections": "Impressão digital do host SSH. Usada para verificar conexões SSH"
"Installation directory. Leave blank to use the default path.": "Diretório de instalação. Deixe em branco para usar o caminho padrão."
