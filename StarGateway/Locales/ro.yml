"Stardust gateway": "Gateway Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Proxy de gateway Stardust. Oferă redirecționare a traficului și proxy invers cu comutare dinamică a rutelor și colaborează cu registrul Stardust pentru descoperirea serviciilor și echilibrarea încărcării în scenarii de gateway pentru microservicii."
"Debug switch. Default true.": "Comutator depanare. Implicit true."
"Service port. Default 8800.": "Port de serviciu. Implicit 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Secretul tokenului. Algoritmul și secretul folosite pentru generarea tokenurilor JWT, de ex. HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Adresa serverului Stardust, de exemplu http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "Calea fișierului local de configurare. Configurație de rezervă folosită când StarServer nu este accesibil."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Token Admin API. Accesul non-loopback la /api/* necesită un token corespunzător; gol permite doar loopback local"
"Health check interval. In seconds, default 10 seconds": "Interval de verificare a stării. În secunde, implicit 10 secunde"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "Interval de reîmprospătare a configurației. În secunde, implicit 15 secunde."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "Timeout de inactivitate. În secunde; conexiunile backend fără trafic mai mult de acest interval sunt eliberate. Implicit 900 secunde (15 minute)"
