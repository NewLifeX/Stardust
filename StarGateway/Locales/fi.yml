"Configuration refresh interval. Unit: seconds, default 15 seconds.": "Kokoonpanon päivitysväli. Sekunteina, oletus 15 sekuntia."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "Lepoajan aikakatkaisu. Sekunteina; backend-yhteydet, joissa ei ole liikennettä pidempään, vapautetaan. Oletus 900 sekuntia (15 minuuttia)"
