"Stardust gateway": "Stardust-yhdyskäytävä"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Stardust-yhdyskäytävävälityspalvelin. Tarjoaa liikenteen edelleenlähetyksen ja käänteisen välityspalvelimen dynaamisella reitinvaihdolla, ja toimii Stardust-rekisterin kanssa palvelujen löytämiseksi ja kuorman tasaamiseksi mikropalvelu-yhdyskäytäväskenaarioissa."
"Debug switch. Default true.": "Virheenkorjauskytkin. Oletus true."
"Service port. Default 8800.": "Palveluportti. Oletus 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Tokenin salaisuus. Algoritmi ja salaisuus JWT-tokenien luontiin, esim. HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Stardust-palvelimen osoite, esim. http://star.newlifex.com:6600"
