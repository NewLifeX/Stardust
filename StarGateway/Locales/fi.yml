"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Admin API -tunniste. Muu kuin loopback-pääsy polkuun /api/* vaatii vastaavan tunnisteen; tyhjä sallii vain paikallisen loopbackin"
