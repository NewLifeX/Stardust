"Stardust gateway": "Stardust ゲートウェイ"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Stardust ゲートウェイプロキシ。動的なルート切り替えを備えたトラフィック転送とリバースプロキシを提供し、Stardust レジストリと連携して、マイクロサービスゲートウェイのシナリオでサービス検出と負荷分散を実現します。"
"Debug switch. Default true.": "デバッグスイッチ。既定値true。"
"Service port. Default 8800.": "サービスポート。既定値8800。"
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "トークンシークレット。JWT トークンの生成に使用するアルゴリズムとシークレット。例：HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Stardust サーバーアドレス。例：http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "ローカル構成ファイルのパス。StarServerに到達できない場合に使用するフォールバック構成。"
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Admin API トークン。/api/* への非ループバックアクセスには一致するトークンが必要です。空欄の場合はローカルループバックのみ許可"
"Health check interval. In seconds, default 10 seconds": "ヘルスチェック間隔。秒単位、既定 10 秒"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "構成の更新間隔。単位は秒、既定 15 秒。"
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "アイドルタイムアウト。秒単位。この時間を超えてトラフィックのないバックエンド接続は解放されます。既定 900 秒（15 分）"
