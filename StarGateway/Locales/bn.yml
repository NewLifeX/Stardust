"Stardust server address, e.g. http://star.newlifex.com:6600": "Stardust সার্ভার ঠিকানা, যেমন http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "স্থানীয় কনফিগারেশন ফাইলের পথ। StarServer-এ পৌঁছানো না গেলে ব্যবহৃত ফলব্যাক কনফিগারেশন।"
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Admin API টোকেন। /api/* এ নন-লুপব্যাক অ্যাক্সেসের জন্য মিলে যাওয়া টোকেন প্রয়োজন; খালি রাখলে শুধুমাত্র স্থানীয় লুপব্যাক অনুমোদিত"
"Health check interval. In seconds, default 10 seconds": "স্বাস্থ্য পরীক্ষার ব্যবধান। সেকেন্ডে, ডিফল্ট 10 সেকেন্ড"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "কনফিগারেশন রিফ্রেশ বিরতি। একক সেকেন্ড, ডিফল্ট 15 সেকেন্ড।"
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "নিষ্ক্রিয় সময়সীমা। সেকেন্ডে; এর চেয়ে বেশি সময় ধরে ট্রাফিকহীন ব্যাকএন্ড সংযোগ পুনরুদ্ধার করা হয়। ডিফল্ট 900 সেকেন্ড (15 মিনিট)"
