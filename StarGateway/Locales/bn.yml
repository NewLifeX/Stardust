"Stardust gateway": "Stardust গেটওয়ে"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Stardust গেটওয়ে প্রক্সি। ডায়নামিক রুট সুইচিং সহ ট্রাফিক ফরওয়ার্ডিং ও রিভার্স প্রক্সি প্রদান করে এবং মাইক্রোসার্ভিস গেটওয়ে পরিস্থিতিতে সার্ভিস ডিসকভারি ও লোড ব্যালেন্সিংয়ের জন্য Stardust রেজিস্ট্রির সাথে কাজ করে।"
