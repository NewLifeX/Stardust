"Failed to load configuration from {0}: {1}": "Falha ao carregar a configuração de {0}: {1}"
"StarServer is using plain HTTP. Remote certificate loading is refused for security because the private key password would be exposed on the wire; falling back to the database. Use HTTPS in production.": "O StarServer está usando HTTP sem criptografia. O carregamento remoto do certificado é recusado por segurança, pois a senha da chave privada ficaria exposta na rede; será usado o banco de dados. Use HTTPS em produção."
"Failed to fetch configuration from StarServer; falling back to the database: {0}": "Falha ao obter a configuração do StarServer; usando o banco de dados: {0}"
"Failed to load route configuration: {0}": "Falha ao carregar a configuração de rotas: {0}"
"Failed to start service {0} via StarAgent: {1}": "Falha ao iniciar o serviço {0} via StarAgent: {1}"
"Failed to stop service {0} via StarAgent: {1}": "Falha ao parar o serviço {0} via StarAgent: {1}"
"Idle recycle: {0} has been inactive for more than {1} seconds": "Reciclagem por inatividade: {0} está inativo há mais de {1} segundos"
"WebSocket is forbidden by route {0}: {1} {2}": "WebSocket é proibido pela rota {0}: {1} {2}"
"Static {0} {1} -> 404 {2}": "Estático {0} {1} -> 404 {2}"
"Route {0} has no available backend nodes": "A rota {0} não tem nós de backend disponíveis"
"Error handling request {0} {1}: {2}": "Erro ao processar a solicitação {0} {1}: {2}"
"WS upgrade succeeded: {0}": "Atualização de WS concluída: {0}"
"Cold start: trying to wake {0} (route: {1})": "Início a frio: tentando ativar {0} (rota: {1})"
"Failed to connect {0} to remote server {1}! elapsed {2}! {3}": "Falha ao conectar {0} ao servidor remoto {1}! duração {2}! {3}"
"Error forwarding to the client: {0}": "Erro ao encaminhar para o cliente: {0}"
"Directory: {0}": "Diretório: {0}"
"Failed to read directory: {0}": "Falha ao ler o diretório: {0}"
"Stardust gateway": "Gateway Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Proxy de gateway Stardust. Fornece encaminhamento de tráfego e proxy reverso com troca dinâmica de rotas, e atua em conjunto com o registro Stardust para descoberta de serviços e balanceamento de carga em cenários de gateway de microsserviços."
"Debug switch. Default true.": "Chave de depuração. Padrão true."
"Service port. Default 8800.": "Porta do serviço. Padrão 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Segredo do token. Algoritmo e segredo usados para gerar tokens JWT, por exemplo HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Endereço do servidor Stardust, por exemplo http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "Caminho do arquivo de configuração local. Configuração de fallback usada quando o StarServer não está acessível."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Token da Admin API. O acesso não loopback a /api/* requer um token correspondente; vazio permite apenas loopback local"
"Health check interval. In seconds, default 10 seconds": "Intervalo de verificação de integridade. Em segundos, padrão 10 segundos"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "Intervalo de atualização da configuração. Em segundos, padrão 15 segundos."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "Tempo limite de inatividade. Em segundos; as conexões de backend sem tráfego por mais tempo são liberadas. Padrão 900 segundos (15 minutos)"
