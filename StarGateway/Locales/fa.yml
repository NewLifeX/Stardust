"Stardust gateway": "دروازه Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "پروکسی دروازه Stardust. ارسال ترافیک و پروکسی معکوس با تغییر مسیر پویا را فراهم می‌کند و در سناریوهای دروازه میکروسرویس، برای کشف سرویس و توزیع بار با رجیستری Stardust همکاری می‌کند."
"Debug switch. Default true.": "کلید اشکال‌زدایی. پیش‌فرض true."
"Service port. Default 8800.": "درگاه سرویس. پیش‌فرض 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "کلید مخفی توکن. الگوریتم و کلید مورد استفاده برای تولید توکنهای JWT، مانند HS256:ABCD1234"
