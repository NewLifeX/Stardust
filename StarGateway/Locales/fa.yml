"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "توکن Admin API. دسترسی غیرلوکال‌بک به /api/* نیازمند توکن مطابق است؛ خالی گذاشتن فقط لوکال‌بک محلی را مجاز می‌کند"
"Health check interval. In seconds, default 10 seconds": "فاصله بررسی سلامت. بر حسب ثانیه، پیشفرض 10 ثانیه"
