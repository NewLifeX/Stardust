"StarServer is using plain HTTP. Remote certificate loading is refused for security because the private key password would be exposed on the wire; falling back to the database. Use HTTPS in production.": "StarServer використовує незашифрований HTTP. Завантаження сертифіката з віддаленого джерела відхилено з міркувань безпеки, оскільки пароль закритого ключа було б передано мережею; використовується база даних. У робочому середовищі використовуйте HTTPS."
