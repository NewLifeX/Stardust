"Stardust gateway": "Шлюз Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Проксі-шлюз Stardust. Забезпечує переспрямування трафіку та зворотне проксіювання з динамічним перемиканням маршрутів, а також взаємодіє з реєстром Stardust для виявлення сервісів і балансування навантаження в сценаріях шлюзу мікросервісів."
"Debug switch. Default true.": "Перемикач налагодження. За замовчуванням true."
"Service port. Default 8800.": "Порт служби. За замовчуванням 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Секрет токена. Алгоритм і ключ для створення токенів JWT, наприклад HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Адреса сервера Stardust, наприклад http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "Шлях до локального файлу конфігурації. Резервна конфігурація, коли StarServer недоступний."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Токен Admin API. Доступ до /api/* не через loopback потребує відповідного токена; порожнє значення дозволяє лише локальний loopback"
"Health check interval. In seconds, default 10 seconds": "Інтервал перевірки стану. У секундах, за замовчуванням 10 секунд"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "Інтервал оновлення конфігурації. У секундах, за замовчуванням 15 секунд."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "Час очікування простою. У секундах; backend-з'єднання без трафіку довше цього часу звільняються. За замовчуванням 900 секунд (15 хвилин)"
