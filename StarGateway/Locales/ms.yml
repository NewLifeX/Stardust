"WS upgrade succeeded: {0}": "Peningkatan WS berjaya: {0}"
"Cold start: trying to wake {0} (route: {1})": "Mula sejuk: cuba mengejutkan {0} (laluan: {1})"
"Failed to connect {0} to remote server {1}! elapsed {2}! {3}": "Gagal menyambung {0} ke pelayan jauh {1}! tempoh {2}! {3}"
"Error forwarding to the client: {0}": "Ralat semasa memajukan kepada klien: {0}"
"Directory: {0}": "Direktori: {0}"
"Failed to read directory: {0}": "Gagal membaca direktori: {0}"
"Stardust gateway": "Gerbang Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Proksi gerbang Stardust. Menyediakan pemajuan trafik dan proksi terbalik dengan pensuisan laluan dinamik, serta bekerjasama dengan pendaftaran Stardust untuk penemuan perkhidmatan dan pengimbangan beban dalam senario gerbang perkhidmatan mikro."
"Debug switch. Default true.": "Suis nyahpepijat. Lalai true."
"Service port. Default 8800.": "Port perkhidmatan. Lalai 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Rahsia token. Algoritma dan rahsia yang digunakan untuk menjana token JWT, cth. HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Alamat pelayan Stardust, contohnya http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "Laluan fail konfigurasi tempatan. Konfigurasi sandaran apabila StarServer tidak dapat dicapai."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Token Admin API. Akses bukan gelung balik ke /api/* memerlukan token yang sepadan; biarkan kosong untuk hanya membenarkan gelung balik setempat"
"Health check interval. In seconds, default 10 seconds": "Selang pemeriksaan kesihatan. Dalam saat, lalai 10 saat"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "Selang muat semula konfigurasi. Dalam saat, lalai 15 saat."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "Tamat masa melahu. Dalam saat; sambungan backend tanpa trafik lebih lama daripada ini akan dilepaskan. Lalai 900 saat (15 minit)"
