# 运行时消息补充词条
"Configuration refreshed.": "Konfigurasi disegarkan."
"Failed to load the SSL certificate configuration: {0}": "Gagal memuatkan konfigurasi sijil SSL: {0}"
"Failed to load certificate {0}: {1}": "Gagal memuatkan sijil {0}: {1}"
"Failed to load configuration from {0}: {1}": "Gagal memuatkan konfigurasi daripada {0}: {1}"
"StarServer is using plain HTTP. Remote certificate loading is refused for security because the private key password would be exposed on the wire; falling back to the database. Use HTTPS in production.": "StarServer menggunakan HTTP biasa. Pemuatan sijil dari jauh ditolak atas sebab keselamatan kerana kata laluan kunci peribadi akan terdedah pada rangkaian; beralih kepada pangkalan data. Gunakan HTTPS dalam pengeluaran."
"Failed to fetch configuration from StarServer; falling back to the database: {0}": "Gagal mendapatkan konfigurasi daripada StarServer; beralih kepada pangkalan data: {0}"
"Failed to load route configuration: {0}": "Gagal memuatkan konfigurasi laluan: {0}"
"Failed to start service {0} via StarAgent: {1}": "Gagal memulakan perkhidmatan {0} melalui StarAgent: {1}"
"Failed to stop service {0} via StarAgent: {1}": "Gagal menghentikan perkhidmatan {0} melalui StarAgent: {1}"
"Idle recycle: {0} has been inactive for more than {1} seconds": "Kitar semula melahu: {0} tidak aktif selama lebih daripada {1} saat"
"WebSocket is forbidden by route {0}: {1} {2}": "WebSocket dilarang oleh laluan {0}: {1} {2}"
"Static {0} {1} -> 404 {2}": "Statik {0} {1} -> 404 {2}"
"Route {0} has no available backend nodes": "Laluan {0} tiada nod backend yang tersedia"
