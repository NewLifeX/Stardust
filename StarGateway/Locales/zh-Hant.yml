# 繁體中文譯文。鍵為英文源文，缺失時運行期回退英文。
"Routes fetched from StarServer are empty; falling back to the database": "從 StarServer 拉取的路由為空，回退數據庫"
"Fetched route configuration from StarServer: {0} route(s)": "從 StarServer 拉取路由配置完成，共 {0} 條路由"
"Loaded route configuration from local file {0}: {1} route(s) (local fallback)": "從本地文件 {0} 加載路由配置，共 {1} 條（本地兜底）"
"Loaded route configuration from the database: {0} route(s)": "從數據庫加載路由配置完成，共 {0} 條路由"
"Failed to read static file: {0} - {1}": "讀取靜態文件失敗: {0} - {1}"
"Service [{0}] stop timed out; forcing shutdown": "服務 [{0}] 停止超時，強制關閉"
"Loading SSL certificate: {0} -> {1}": "加載SSL證書: {0} -> {1}"
"Health check: {0} -> {1}": "健康檢查: {0} -> {1}"
"No default page in static directory: {0}": "靜態目錄無默認頁: {0}"
"Static file not found: {0}": "靜態文件不存在: {0}"
"Static file root directory not found: {0}": "靜態文件根目錄不存在: {0}"
"Path traversal attack blocked: {0}": "路徑穿越攻擊被阻止: {0}"
"Database initialization completed": "數據庫初始化完成"
"No SSL certificate configured; only HTTP is supported": "未配置SSL證書，僅支持HTTP"
"Gracefully shutting down the service...": "正在優雅關閉服務……"
"HTTP reverse proxy started, listening on port {0}, route count: {1}": "Http反向代理啟動，監聽端口：{0}，路由數：{1}"
"NAT proxy => {0}": "NAT代理 => {0}"
"SPA fallback: {0} -> {1}": "SPA回退: {0} -> {1}"
"StarGateway has no StarServer configured; running in standalone mode (database + local configuration only)": "StarGateway 未配置 StarServer，將以獨立模式運行（僅數據庫 + 本地配置）"
"StarGateway connected to StarServer: {0}": "StarGateway 已連接 StarServer: {0}"
"StarGateway started, listening on port {0}, remote server {1}": "StarGateway 已啟動，監聽端口 {0}，遠程服務器 {1}"
# 运行时消息补充词条
"Configuration refreshed.": "設定已重新整理"
"Failed to load the SSL certificate configuration: {0}": "載入SSL憑證設定失敗：{0}"
"Failed to load certificate {0}: {1}": "載入憑證 {0} 失敗：{1}"
"Failed to load configuration from {0}: {1}": "從 {0} 載入設定失敗：{1}"
"StarServer is using plain HTTP. Remote certificate loading is refused for security because the private key password would be exposed on the wire; falling back to the database. Use HTTPS in production.": "StarServer 使用明文 http，出於安全考量拒絕從遠端載入憑證（私密金鑰密碼會在鏈路上暴露），憑證回復資料庫載入；生產環境請改用 https"
"Failed to fetch configuration from StarServer; falling back to the database: {0}": "從 StarServer 拉取設定失敗，回復資料庫：{0}"
"Failed to load route configuration: {0}": "載入路由設定失敗：{0}"
"Failed to start service {0} via StarAgent: {1}": "呼叫StarAgent啟動服務失敗 {0}：{1}"
"Failed to stop service {0} via StarAgent: {1}": "呼叫StarAgent停止服務失敗 {0}：{1}"
"Idle recycle: {0} has been inactive for more than {1} seconds": "閒置回收：{0} 超過 {1} 秒無活動"
"WebSocket is forbidden by route {0}: {1} {2}": "WebSocket被路由 {0} 禁止：{1} {2}"
"Static {0} {1} -> 404 {2}": "靜態 {0} {1} -> 404 {2}"
"Route {0} has no available backend nodes": "路由 {0} 沒有可用的後端節點"
"Error handling request {0} {1}: {2}": "處理請求異常 {0} {1}：{2}"
"WS upgrade succeeded: {0}": "WS 升級成功：{0}"
"Cold start: trying to wake {0} (route: {1})": "冷啟動：嘗試喚醒 {0}（路由：{1}）"
"Failed to connect {0} to remote server {1}! elapsed {2}! {3}": "無法為 {0} 連線遠端伺服器 {1}！耗時 {2}！{3}"
"Error forwarding to the client: {0}": "轉送給用戶端時發生錯誤：{0}"
"Directory: {0}": "目錄：{0}"
"Failed to read directory: {0}": "讀取目錄失敗：{0}"
"Stardust gateway": "星塵閘道"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "星塵閘道代理。提供流量轉發與反向代理能力，支援動態路由切換，可與星塵註冊中心協同實現服務探索與負載平衡，適用於微服務閘道情境。"
"Debug switch. Default true.": "偵錯開關。預設true"
"Service port. Default 8800.": "服務連接埠。預設8800"
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "權杖金鑰。用於產生JWT權杖的演算法和金鑰，如HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "星塵伺服器位址。如 http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "本機設定檔路徑。StarServer無法連線時的備援設定"
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Admin API 權杖。非回送位址存取 /api/* 需攜帶相符權杖；留空僅允許本機回送位址"
"Health check interval. In seconds, default 10 seconds": "健康檢查間隔。單位秒，預設10秒"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "設定重新整理間隔。單位秒，預設15秒"
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "閒置逾時。單位秒，後端超過該時間無流量的連線將被回收，預設900秒（15分鐘）"
