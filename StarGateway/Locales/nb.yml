"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "Sti til lokal konfigurasjonsfil. Reservekonfigurasjon som brukes når StarServer ikke er tilgjengelig."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Admin API-token. Tilgang utenom loopback til /api/* krever et samsvarende token; tomt tillater bare lokal loopback"
