"Stardust gateway": "Stardust-gateway"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Stardust-gatewayproxy. Gir trafikkvideresending og omvendt proxy med dynamisk rutesvitsj, og samarbeider med Stardust-registeret for tjenestefinning og lastbalansering i mikrotjeneste-gateway-scenarier."
"Debug switch. Default true.": "Feilsøkingsbryter. Standard true."
"Service port. Default 8800.": "Tjenesteport. Standard 8800."
