# 运行时消息补充词条
"Configuration refreshed.": "Đã làm mới cấu hình."
"Failed to load the SSL certificate configuration: {0}": "Không thể tải cấu hình chứng chỉ SSL: {0}"
"Failed to load certificate {0}: {1}": "Không thể tải chứng chỉ {0}: {1}"
"Failed to load configuration from {0}: {1}": "Không thể tải cấu hình từ {0}: {1}"
"StarServer is using plain HTTP. Remote certificate loading is refused for security because the private key password would be exposed on the wire; falling back to the database. Use HTTPS in production.": "StarServer đang dùng HTTP không mã hóa. Việc tải chứng chỉ từ xa bị từ chối vì lý do bảo mật do mật khẩu khóa riêng sẽ bị lộ trên đường truyền; sẽ dùng cơ sở dữ liệu. Hãy dùng HTTPS trong môi trường sản xuất."
"Failed to fetch configuration from StarServer; falling back to the database: {0}": "Không thể lấy cấu hình từ StarServer; chuyển sang cơ sở dữ liệu: {0}"
"Failed to load route configuration: {0}": "Không thể tải cấu hình tuyến: {0}"
"Failed to start service {0} via StarAgent: {1}": "Không thể khởi động dịch vụ {0} qua StarAgent: {1}"
"Failed to stop service {0} via StarAgent: {1}": "Không thể dừng dịch vụ {0} qua StarAgent: {1}"
"Idle recycle: {0} has been inactive for more than {1} seconds": "Thu hồi nhàn rỗi: {0} không hoạt động hơn {1} giây"
"WebSocket is forbidden by route {0}: {1} {2}": "WebSocket bị cấm bởi tuyến {0}: {1} {2}"
"Static {0} {1} -> 404 {2}": "Tĩnh {0} {1} -> 404 {2}"
"Route {0} has no available backend nodes": "Tuyến {0} không có nút phụ trợ khả dụng"
"Error handling request {0} {1}: {2}": "Lỗi khi xử lý yêu cầu {0} {1}: {2}"
"WS upgrade succeeded: {0}": "Nâng cấp WS thành công: {0}"
"Cold start: trying to wake {0} (route: {1})": "Khởi động nguội: đang thử đánh thức {0} (tuyến: {1})"
"Failed to connect {0} to remote server {1}! elapsed {2}! {3}": "Không thể kết nối {0} tới máy chủ từ xa {1}! thời gian {2}! {3}"
"Error forwarding to the client: {0}": "Lỗi khi chuyển tiếp tới máy khách: {0}"
"Directory: {0}": "Thư mục: {0}"
"Failed to read directory: {0}": "Không thể đọc thư mục: {0}"
"Stardust gateway": "Cổng kết nối Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Proxy cổng kết nối Stardust. Cung cấp chuyển tiếp lưu lượng và proxy ngược với chuyển tuyến động, đồng thời phối hợp với sổ đăng ký Stardust để khám phá dịch vụ và cân bằng tải trong các tình huống cổng kết nối vi dịch vụ."
"Debug switch. Default true.": "Công tắc gỡ lỗi. Mặc định true."
"Service port. Default 8800.": "Cổng dịch vụ. Mặc định 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Bí mật mã thông báo. Thuật toán và khóa dùng để tạo mã thông báo JWT, ví dụ HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Địa chỉ máy chủ Stardust, ví dụ http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "Đường dẫn tệp cấu hình cục bộ. Cấu hình dự phòng khi không truy cập được StarServer."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Token Admin API. Truy cập không qua loopback tới /api/* cần token khớp; để trống chỉ cho phép loopback cục bộ"
"Health check interval. In seconds, default 10 seconds": "Khoảng thời gian kiểm tra tình trạng. Tính bằng giây, mặc định 10 giây"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "Khoảng thời gian làm mới cấu hình. Đơn vị giây, mặc định 15 giây."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "Thời gian chờ nhàn rỗi. Tính bằng giây; các kết nối backend không có lưu lượng lâu hơn mức này sẽ được giải phóng. Mặc định 900 giây (15 phút)"
