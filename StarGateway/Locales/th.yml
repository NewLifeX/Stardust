# Thai translation. Keys are English source texts; missing entries fall back to English at runtime.
"Routes fetched from StarServer are empty; falling back to the database": "เส้นทางที่ดึงจาก StarServer ว่างเปล่า เปลี่ยนไปใช้ฐานข้อมูล"
