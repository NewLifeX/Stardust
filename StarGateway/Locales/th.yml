# 运行时消息补充词条
"Configuration refreshed.": "รีเฟรชการกำหนดค่าแล้ว"
"Failed to load the SSL certificate configuration: {0}": "โหลดการกำหนดค่าส่วนรับรอง SSL ไม่สำเร็จ: {0}"
"Failed to load certificate {0}: {1}": "โหลดส่วนรับรอง {0} ไม่สำเร็จ: {1}"
"Failed to load configuration from {0}: {1}": "โหลดการกำหนดค่าจาก {0} ไม่สำเร็จ: {1}"
"StarServer is using plain HTTP. Remote certificate loading is refused for security because the private key password would be exposed on the wire; falling back to the database. Use HTTPS in production.": "StarServer ใช้ HTTP แบบไม่เข้ารหัส ปฏิเสธการโหลดส่วนรับรองจากระยะไกลด้วยเหตุผลด้านความปลอดภัย เนื่องจากรหัสผ่านคีย์ส่วนตัวจะถูกเปิดเผยบนเครือข่าย จะใช้ฐานข้อมูลแทน โปรดใช้ HTTPS ในสภาพแวดล้อมการใช้งานจริง"
"Failed to fetch configuration from StarServer; falling back to the database: {0}": "ดึงการกำหนดค่าจาก StarServer ไม่สำเร็จ จะใช้ฐานข้อมูลแทน: {0}"
"Failed to load route configuration: {0}": "โหลดการกำหนดค่าเส้นทางไม่สำเร็จ: {0}"
"Failed to start service {0} via StarAgent: {1}": "เริ่มบริการ {0} ผ่าน StarAgent ไม่สำเร็จ: {1}"
"Failed to stop service {0} via StarAgent: {1}": "หยุดบริการ {0} ผ่าน StarAgent ไม่สำเร็จ: {1}"
"Idle recycle: {0} has been inactive for more than {1} seconds": "เรียกคืนขณะว่าง: {0} ไม่มีการใช้งานเกิน {1} วินาที"
"WebSocket is forbidden by route {0}: {1} {2}": "WebSocket ถูกห้ามโดยเส้นทาง {0}: {1} {2}"
"Static {0} {1} -> 404 {2}": "สแตติก {0} {1} -> 404 {2}"
"Route {0} has no available backend nodes": "เส้นทาง {0} ไม่มีโหนดแบ็กเอนด์ที่พร้อมใช้งาน"
"Error handling request {0} {1}: {2}": "เกิดข้อผิดพลาดขณะจัดการคำขอ {0} {1}: {2}"
"WS upgrade succeeded: {0}": "อัปเกรด WS สำเร็จ: {0}"
"Cold start: trying to wake {0} (route: {1})": "เริ่มแบบเย็น: กำลังพยายามปลุก {0} (เส้นทาง: {1})"
"Failed to connect {0} to remote server {1}! elapsed {2}! {3}": "เชื่อมต่อ {0} ไปยังเซิร์ฟเวอร์ระยะไกล {1} ไม่สำเร็จ! ใช้เวลา {2}! {3}"
"Error forwarding to the client: {0}": "เกิดข้อผิดพลาดขณะส่งต่อไปยังไคลเอนต์: {0}"
"Directory: {0}": "ไดเรกทอรี: {0}"
"Failed to read directory: {0}": "อ่านไดเรกทอรีไม่สำเร็จ: {0}"
"Stardust gateway": "เกตเวย์ Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "พร็อกซีเกตเวย์ Stardust ให้บริการส่งต่อทราฟฟิกและรีเวิร์สพร็อกซีพร้อมการสลับเส้นทางแบบไดนามิก และทำงานร่วมกับรีจิสทรี Stardust เพื่อการค้นหาบริการและการกระจายโหลดในสถานการณ์เกตเวย์ไมโครเซอร์วิส"
"Debug switch. Default true.": "สวิตช์ดีบัก ค่าเริ่มต้น true"
"Service port. Default 8800.": "พอร์ตบริการ ค่าเริ่มต้น 8800"
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "รหัสลับโทเค็น อัลกอริทึมและรหัสลับที่ใช้สร้างโทเค็น JWT เช่น HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "ที่อยู่เซิร์ฟเวอร์ Stardust เช่น http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "พาธไฟล์กำหนดค่าในเครื่อง การกำหนดค่าสำรองเมื่อเข้าถึง StarServer ไม่ได้"
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "โทเค็น Admin API การเข้าถึง /api/* ที่ไม่ใช่ลูปแบ็กต้องมีโทเค็นที่ตรงกัน เว้นว่างเพื่ออนุญาตเฉพาะลูปแบ็กภายในเครื่อง"
"Health check interval. In seconds, default 10 seconds": "ช่วงเวลาตรวจสอบสถานะ หน่วยเป็นวินาที ค่าเริ่มต้น 10 วินาที"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "ช่วงเวลาการรีเฟรชการกำหนดค่า หน่วยเป็นวินาที ค่าเริ่มต้น 15 วินาที"
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "หมดเวลาเมื่อไม่ได้ใช้งาน หน่วยเป็นวินาที การเชื่อมต่อฝั่ง backend ที่ไม่มีทราฟฟิกนานกว่านี้จะถูกเรียกคืน ค่าเริ่มต้น 900 วินาที (15 นาที)"
