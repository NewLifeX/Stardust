"Loaded route configuration from local file {0}: {1} route(s) (local fallback)": "โหลดการกำหนดค่าเส้นทางจากไฟล์ภายในเครื่อง {0}: {1} เส้นทาง (สำรองภายในเครื่อง)"
"Loaded route configuration from the database: {0} route(s)": "โหลดการกำหนดค่าเส้นทางจากฐานข้อมูล: {0} เส้นทาง"
"Failed to read static file: {0} - {1}": "อ่านไฟล์สแตติกไม่สำเร็จ: {0} - {1}"
