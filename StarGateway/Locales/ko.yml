# Korean translation. Keys are English source texts; missing entries fall back to English at runtime.
"Routes fetched from StarServer are empty; falling back to the database": "StarServer에서 가져온 경로가 비어 있어 데이터베이스로 대체합니다"
"Fetched route configuration from StarServer: {0} route(s)": "StarServer에서 경로 구성을 가져왔습니다: {0}개 경로"
"Loaded route configuration from local file {0}: {1} route(s) (local fallback)": "로컬 파일 {0}에서 경로 구성을 불러왔습니다: {1}개 경로(로컬 대체)"
"Loaded route configuration from the database: {0} route(s)": "데이터베이스에서 경로 구성을 불러왔습니다: {0}개 경로"
"Failed to read static file: {0} - {1}": "정적 파일을 읽지 못했습니다: {0} - {1}"
"Service [{0}] stop timed out; forcing shutdown": "[{0}] 서비스 중지가 시간 초과되어 강제 종료합니다"
"Loading SSL certificate: {0} -> {1}": "SSL 인증서 로드 중: {0} -> {1}"
"Health check: {0} -> {1}": "상태 확인: {0} -> {1}"
"No default page in static directory: {0}": "정적 디렉터리에 기본 페이지가 없습니다: {0}"
"Static file not found: {0}": "정적 파일을 찾을 수 없습니다: {0}"
"Static file root directory not found: {0}": "정적 파일 루트 디렉터리를 찾을 수 없습니다: {0}"
"Path traversal attack blocked: {0}": "경로 탐색 공격을 차단했습니다: {0}"
"Database initialization completed": "데이터베이스 초기화가 완료되었습니다"
"No SSL certificate configured; only HTTP is supported": "SSL 인증서가 구성되지 않아 HTTP만 지원됩니다"
"Gracefully shutting down the service...": "서비스를 정상 종료하는 중..."
"HTTP reverse proxy started, listening on port {0}, route count: {1}": "HTTP 역방향 프록시가 시작되었습니다. 포트 {0}에서 수신 중, 경로 수: {1}"
"NAT proxy => {0}": "NAT 프록시 => {0}"
"SPA fallback: {0} -> {1}": "SPA 대체: {0} -> {1}"
"StarGateway has no StarServer configured; running in standalone mode (database + local configuration only)": "StarGateway에 StarServer가 구성되지 않아 독립 모드(데이터베이스 + 로컬 구성만)로 실행합니다"
"StarGateway connected to StarServer: {0}": "StarGateway가 StarServer에 연결되었습니다: {0}"
"StarGateway started, listening on port {0}, remote server {1}": "StarGateway가 시작되었습니다. 포트 {0}에서 수신 중, 원격 서버 {1}"
# 运行时消息补充词条
"Configuration refreshed.": "구성을 새로 고쳤습니다."
"Failed to load the SSL certificate configuration: {0}": "SSL 인증서 구성을 로드하지 못했습니다: {0}"
"Failed to load certificate {0}: {1}": "인증서 {0}을(를) 로드하지 못했습니다: {1}"
"Failed to load configuration from {0}: {1}": "{0}에서 구성을 로드하지 못했습니다: {1}"
"StarServer is using plain HTTP. Remote certificate loading is refused for security because the private key password would be exposed on the wire; falling back to the database. Use HTTPS in production.": "StarServer가 일반 HTTP를 사용하고 있습니다. 개인 키 암호가 네트워크에서 노출될 수 있으므로 보안상 원격 인증서 로드를 거부하고 데이터베이스에서 로드합니다. 프로덕션 환경에서는 HTTPS를 사용하세요."
"Failed to fetch configuration from StarServer; falling back to the database: {0}": "StarServer에서 구성을 가져오지 못했습니다. 데이터베이스로 대체합니다: {0}"
"Failed to load route configuration: {0}": "경로 구성을 로드하지 못했습니다: {0}"
"Failed to start service {0} via StarAgent: {1}": "StarAgent를 통해 서비스 {0}을(를) 시작하지 못했습니다: {1}"
"Failed to stop service {0} via StarAgent: {1}": "StarAgent를 통해 서비스 {0}을(를) 중지하지 못했습니다: {1}"
"Idle recycle: {0} has been inactive for more than {1} seconds": "유휴 회수: {0}이(가) {1}초 넘게 비활성 상태입니다"
"WebSocket is forbidden by route {0}: {1} {2}": "경로 {0}에서 WebSocket이 금지되어 있습니다: {1} {2}"
"Static {0} {1} -> 404 {2}": "정적 {0} {1} -> 404 {2}"
"Route {0} has no available backend nodes": "경로 {0}에 사용 가능한 백엔드 노드가 없습니다"
"Error handling request {0} {1}: {2}": "요청 {0} {1} 처리 중 오류 발생: {2}"
"WS upgrade succeeded: {0}": "WS 업그레이드 성공: {0}"
"Cold start: trying to wake {0} (route: {1})": "콜드 스타트: {0} 깨우기 시도(경로: {1})"
"Failed to connect {0} to remote server {1}! elapsed {2}! {3}": "{0}을(를) 원격 서버 {1}에 연결하지 못했습니다! 경과 시간 {2}! {3}"
"Error forwarding to the client: {0}": "클라이언트로 전달 중 오류 발생: {0}"
"Directory: {0}": "디렉터리: {0}"
"Failed to read directory: {0}": "디렉터리를 읽지 못했습니다: {0}"
"Stardust gateway": "Stardust 게이트웨이"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Stardust 게이트웨이 프록시입니다. 동적 경로 전환이 포함된 트래픽 전달 및 역방향 프록시를 제공하며, Stardust 레지스트리와 연동하여 마이크로서비스 게이트웨이 시나리오에서 서비스 검색과 부하 분산을 지원합니다."
"Debug switch. Default true.": "디버그 스위치입니다. 기본값 true."
"Service port. Default 8800.": "서비스 포트입니다. 기본값 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "토큰 비밀. JWT 토큰을 생성하는 데 사용하는 알고리즘과 비밀 값입니다. 예: HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Stardust 서버 주소. 예: http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "로컬 구성 파일 경로입니다. StarServer에 연결할 수 없을 때 사용하는 대체 구성입니다."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Admin API 토큰. /api/*에 대한 비루프백 액세스에는 일치하는 토큰이 필요하며, 비워 두면 로컬 루프백만 허용됩니다"
"Health check interval. In seconds, default 10 seconds": "상태 확인 간격. 초 단위, 기본 10초"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "구성 새로 고침 간격. 단위는 초, 기본 15초."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "유휴 시간 제한. 초 단위이며, 이 시간보다 오래 트래픽이 없는 백엔드 연결은 회수됩니다. 기본 900초(15분)"
