"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "נתיב קובץ התצורה המקומי. תצורת גיבוי בשימוש כאשר אין גישה ל-StarServer."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "אסימון Admin API. גישה שאינה דרך loopback אל /api/* דורשת אסימון תואם; ריק מאפשר רק loopback מקומי"
"Health check interval. In seconds, default 10 seconds": "מרווח בדיקת תקינות. בשניות, ברירת מחדל 10 שניות"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "מרווח רענון התצורה. בשניות, ברירת מחדל 15 שניות."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "פסק זמן חוסר פעילות. בשניות; חיבורי backend ללא תעבורה לאורך זמן רב יותר משוחררים. ברירת מחדל 900 שניות (15 דקות)"
