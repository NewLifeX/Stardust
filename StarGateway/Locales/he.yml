"Stardust gateway": "שער Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "פרוקסי שער Stardust. מספק העברת תעבורה ופרוקסי הפוך עם החלפת נתיבים דינמית, ופועל עם הרישום של Stardust לגילוי שירותים ואיזון עומסים בתרחישי שער מיקרו-שירותים."
"Debug switch. Default true.": "מתג ניפוי באגים. ברירת מחדל true."
"Service port. Default 8800.": "יציאת השירות. ברירת מחדל 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "סוד אסימון. האלגוריתם והמפתח המשמשים ליצירת אסימוני JWT, כגון HS256:ABCD1234"
