"Stardust gateway": "Gerbang Stardust"
"Stardust gateway proxy. Provides traffic forwarding and reverse proxy with dynamic route switching, and works with the Stardust registry for service discovery and load balancing in microservice gateway scenarios.": "Proxy gerbang Stardust. Menyediakan penerusan lalu lintas dan proxy terbalik dengan pengalihan rute dinamis, serta bekerja sama dengan registri Stardust untuk penemuan layanan dan penyeimbangan beban dalam skenario gerbang layanan mikro."
"Debug switch. Default true.": "Sakelar debug. Default true."
"Service port. Default 8800.": "Port layanan. Default 8800."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Rahasia token. Algoritma dan rahasia yang digunakan untuk membuat token JWT, mis. HS256:ABCD1234"
"Stardust server address, e.g. http://star.newlifex.com:6600": "Alamat server Stardust, misalnya http://star.newlifex.com:6600"
"Local configuration file path. Fallback configuration used when StarServer is unreachable.": "Jalur file konfigurasi lokal. Konfigurasi cadangan saat StarServer tidak dapat dijangkau."
"Admin API token. Non-loopback access to /api/* requires a matching token; leave empty to allow only local loopback": "Token Admin API. Akses non-loopback ke /api/* memerlukan token yang cocok; kosongkan untuk hanya mengizinkan loopback lokal"
"Health check interval. In seconds, default 10 seconds": "Interval pemeriksaan kesehatan. Dalam detik, default 10 detik"
"Configuration refresh interval. Unit: seconds, default 15 seconds.": "Interval penyegaran konfigurasi. Dalam detik, default 15 detik."
"Idle timeout. In seconds; backend connections with no traffic longer than this are reclaimed. Default 900 seconds (15 minutes)": "Batas waktu diam. Dalam detik; koneksi backend tanpa lalu lintas lebih lama dari ini akan dilepas. Default 900 detik (15 menit)"
