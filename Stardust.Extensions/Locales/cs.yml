"ASP.NET Core extension library for the Stardust distributed service framework. Provides middleware and helpers such as AddStardust, UseStardust, RegisterService, and ConsumeService, simplifying service registration, discovery, and monitoring integration for Web and API applications.": "Rozšiřující knihovna ASP.NET Core pro distribuovaný servisní rámec Stardust. Poskytuje middleware a pomocné metody jako AddStardust, UseStardust, RegisterService a ConsumeService, což zjednodušuje registraci, zjišťování a integraci monitorování služeb pro aplikace Web a API."
