"Stardust build and deployment tool. Automatically downloads repositories, builds, packs, and pushes artifacts to the Stardust release center, with version management and multi-platform distribution, working with StarAgent for automated deployment pipelines.": "Stardust বিল্ড ও ডিপ্লয়মেন্ট টুল। স্বয়ংক্রিয়ভাবে রিপোজিটরি ডাউনলোড করে, বিল্ড করে, প্যাক করে এবং আর্টিফ্যাক্ট Stardust রিলিজ সেন্টারে পুশ করে, সাথে ভার্সন ব্যবস্থাপনা ও বহু-প্ল্যাটফর্ম বিতরণ, এবং স্বয়ংক্রিয় ডিপ্লয়মেন্ট পাইপলাইনের জন্য StarAgent-এর সাথে কাজ করে।"
