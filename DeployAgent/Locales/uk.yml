"Stardust deploy": "Stardust deploy"
"Stardust build and deployment tool. Automatically downloads repositories, builds, packs, and pushes artifacts to the Stardust release center, with version management and multi-platform distribution, working with StarAgent for automated deployment pipelines.": "Інструмент збирання та розгортання Stardust. Автоматично завантажує репозиторії, виконує збирання, пакування й надсилання артефактів до центру публікації Stardust, підтримує керування версіями та розповсюдження на кілька платформ, а також взаємодіє зі StarAgent для автоматизованих конвеєрів розгортання."
