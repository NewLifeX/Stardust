# Spanish translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Inicio de sesión correcto, código de nodo: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Iniciando el agente, servidor: {1}"
"[{0}] Startup failed: {1}": "[{0}] Error de inicio: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "La plataforma actual ({0}) no admite este comando"
"Parameter is empty.": "El parámetro está vacío."
"Stardust mobile agent core": "Núcleo del agente móvil de Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Núcleo compartido del agente de Stardust para plataformas móviles. Proporciona inicio de sesión, latido, recopilación de información del dispositivo y envío de comandos independientes de la plataforma para hosts Android e iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Dirección del servidor, por ejemplo http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Código de nodo. Si se deja vacío, el servidor lo asigna automáticamente"
"Node secret": "Secreto de nodo"
"Product code. Default StarAgent-Mobile.": "Código de producto. Predeterminado StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Nombre del proyecto. El proyecto al que se unen los nodos nuevos de forma predeterminada"
"Heartbeat interval. In seconds; default 60": "Intervalo de latido. En segundos; predeterminado 60"
"Update channel. Default Release.": "Canal de actualización. Predeterminado Release."
"Whether to enable file logging": "Si se habilita el registro en archivo"
