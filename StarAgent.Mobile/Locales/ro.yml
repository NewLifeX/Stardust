# Romanian translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Autentificare reușită, cod nod: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Se pornește agentul, server: {1}"
"[{0}] Startup failed: {1}": "[{0}] Pornirea a eșuat: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Platforma curentă ({0}) nu acceptă această comandă"
"Parameter is empty.": "Parametrul este gol."
"Stardust mobile agent core": "Nucleul agentului mobil Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Nucleu partajat al agentului Stardust pentru platforme mobile. Oferă autentificare, semnal de viață, colectarea informațiilor despre dispozitiv și trimiterea comenzilor independent de platformă pentru gazdele Android și iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Adresa serverului, de ex. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Cod nod. Dacă este lăsat gol, este atribuit automat de server"
"Node secret": "Secretul nodului"
"Product code. Default StarAgent-Mobile.": "Cod produs. Implicit StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Numele proiectului. Proiectul la care se alătură nodurile noi în mod implicit"
"Heartbeat interval. In seconds; default 60": "Intervalul bătăii inimii. În secunde; implicit 60"
"Update channel. Default Release.": "Canal de actualizare. Implicit Release."
"Whether to enable file logging": "Dacă se activează înregistrarea în fișier"
