# Portuguese translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Login bem-sucedido, código do nó: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Iniciando o agente, servidor: {1}"
"[{0}] Startup failed: {1}": "[{0}] Falha na inicialização: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "A plataforma atual ({0}) não suporta este comando"
"Parameter is empty.": "O parâmetro está vazio."
"Stardust mobile agent core": "Núcleo do agente móvel Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Núcleo compartilhado do agente Stardust para plataformas móveis. Fornece login, heartbeat, coleta de informações do dispositivo e envio de comandos independentes de plataforma para hosts Android e iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Endereço do servidor, por exemplo http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Código do nó. Se deixado em branco, é atribuído automaticamente pelo servidor"
"Node secret": "Segredo do nó"
"Product code. Default StarAgent-Mobile.": "Código do produto. Padrão StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Nome do projeto. O projeto ao qual os novos nós se associam por padrão"
"Heartbeat interval. In seconds; default 60": "Intervalo de heartbeat. Em segundos; padrão 60"
"Update channel. Default Release.": "Canal de atualização. Padrão Release."
"Whether to enable file logging": "Se deve ativar o registro em arquivo"
