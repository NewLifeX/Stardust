"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Stardust aracısının mobil platformlar için paylaşılan çekirdeği. Android ve iOS ana makineleri için platformdan bağımsız oturum açma, kalp atışı, cihaz bilgisi toplama ve komut gönderimi sağlar."
