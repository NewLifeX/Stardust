"Node secret": "Düğüm sırrı"
"Product code. Default StarAgent-Mobile.": "Ürün kodu. Varsayılan StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Proje adı. Yeni düğümlerin varsayılan olarak katıldığı proje"
"Heartbeat interval. In seconds; default 60": "Kalp atışı aralığı. Saniye cinsinden; varsayılan 60"
"Update channel. Default Release.": "Güncelleme kanalı. Varsayılan Release."
"Whether to enable file logging": "Dosya günlüğünün etkinleştirilip etkinleştirilmeyeceği"
