# Turkish translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Oturum açma başarılı, düğüm kodu: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Aracı başlatılıyor, sunucu: {1}"
