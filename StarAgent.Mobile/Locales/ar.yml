"The current platform ({0}) does not support this command": "المنصة الحالية ({0}) لا تدعم هذا الأمر"
"Parameter is empty.": "المعلمة فارغة."
"Stardust mobile agent core": "نواة وكيل Stardust للجوال"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "النواة المشتركة لوكيل Stardust لمنصات الجوال. توفر تسجيل الدخول ونبضات القلب وجمع معلومات الجهاز وإرسال الأوامر بشكل مستقل عن المنصة لمضيفي Android وiOS."
