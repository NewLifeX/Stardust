"Node code. When left empty, it is assigned automatically by the server": "رمز العقدة. عند تركه فارغًا يتم تعيينه تلقائيًا من الخادم"
"Node secret": "مفتاح العقدة"
"Product code. Default StarAgent-Mobile.": "رمز المنتج. الافتراضي StarAgent-Mobile."
"Project name. The project that new nodes join by default": "اسم المشروع. المشروع الذي تنضم إليه العقد الجديدة افتراضيًا"
"Heartbeat interval. In seconds; default 60": "فترة نبض القلب. بالثواني؛ الافتراضي 60"
"Update channel. Default Release.": "قناة التحديث. الافتراضي Release."
"Whether to enable file logging": "هل يتم تمكين تسجيل الملفات"
