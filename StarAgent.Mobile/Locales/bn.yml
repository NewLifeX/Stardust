"Parameter is empty.": "প্যারামিটার খালি।"
"Stardust mobile agent core": "Stardust মোবাইল এজেন্ট কোর"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "মোবাইল প্ল্যাটফর্মের জন্য Stardust এজেন্টের শেয়ার্ড কোর। Android ও iOS হোস্টের জন্য প্ল্যাটফর্ম-নিরপেক্ষ লগইন, হার্টবিট, ডিভাইস তথ্য সংগ্রহ এবং কমান্ড ডিসপ্যাচ প্রদান করে।"
"Server address, e.g. http://star.newlifex.com:6600": "সার্ভার ঠিকানা, যেমন http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "নোড কোড। খালি রাখলে সার্ভার স্বয়ংক্রিয়ভাবে বরাদ্দ করে"
"Node secret": "নোড গোপন কী"
"Product code. Default StarAgent-Mobile.": "পণ্য কোড। ডিফল্ট StarAgent-Mobile।"
"Project name. The project that new nodes join by default": "প্রকল্পের নাম। নতুন নোডগুলি ডিফল্টভাবে যে প্রকল্পে যোগ দেয়"
"Heartbeat interval. In seconds; default 60": "হার্টবিট বিরতি। সেকেন্ডে; ডিফল্ট 60"
"Update channel. Default Release.": "আপডেট চ্যানেল। ডিফল্ট Release।"
"Whether to enable file logging": "ফাইল লগিং সক্ষম করবেন কিনা"
