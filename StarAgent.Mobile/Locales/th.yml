# Thai translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] เข้าสู่ระบบสำเร็จ รหัสโหนด: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] กำลังเริ่มเอเจนต์ เซิร์ฟเวอร์: {1}"
"[{0}] Startup failed: {1}": "[{0}] เริ่มต้นล้มเหลว: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "แพลตฟอร์มปัจจุบัน ({0}) ไม่รองรับคำสั่งนี้"
"Parameter is empty.": "พารามิเตอร์ว่างเปล่า"
"Stardust mobile agent core": "แกนกลางเอเจนต์มือถือ Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "แกนกลางที่ใช้ร่วมกันของเอเจนต์ Stardust สำหรับแพลตฟอร์มมือถือ ให้การเข้าสู่ระบบ การเต้นของหัวใจ การเก็บข้อมูลอุปกรณ์ และการส่งคำสั่งที่ไม่ขึ้นกับแพลตฟอร์มสำหรับโฮสต์ Android และ iOS"
"Server address, e.g. http://star.newlifex.com:6600": "ที่อยู่เซิร์ฟเวอร์ เช่น http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "รหัสโหนด หากเว้นว่างไว้ เซิร์ฟเวอร์จะกำหนดให้โดยอัตโนมัติ"
"Node secret": "รหัสลับโหนด"
"Product code. Default StarAgent-Mobile.": "รหัสผลิตภัณฑ์ ค่าเริ่มต้น StarAgent-Mobile"
"Project name. The project that new nodes join by default": "ชื่อโปรเจกต์ โปรเจกต์ที่โหนดใหม่เข้าร่วมโดยค่าเริ่มต้น"
"Heartbeat interval. In seconds; default 60": "คาบการเต้นของหัวใจ หน่วยเป็นวินาที ค่าเริ่มต้น 60"
"Update channel. Default Release.": "ช่องทางการอัปเดต ค่าเริ่มต้น Release"
"Whether to enable file logging": "จะเปิดใช้งานการบันทึกไฟล์หรือไม่"
