# Ukrainian translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Вхід виконано, код вузла: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Запуск агента, сервер: {1}"
"[{0}] Startup failed: {1}": "[{0}] Помилка запуску: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Поточна платформа ({0}) не підтримує цю команду"
"Parameter is empty.": "Параметр порожній."
"Stardust mobile agent core": "Ядро мобільного агента Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Спільне ядро агента Stardust для мобільних платформ. Забезпечує незалежні від платформи вхід, сигнал активності, збирання відомостей про пристрій і доставку команд для хостів Android та iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Адреса сервера, наприклад http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Код вузла. Якщо залишити порожнім, він призначається сервером автоматично"
"Node secret": "Секрет вузла"
"Product code. Default StarAgent-Mobile.": "Код продукту. За замовчуванням StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Назва проєкту. Проєкт, до якого нові вузли приєднуються за замовчуванням"
"Heartbeat interval. In seconds; default 60": "Інтервал пульсу. У секундах; за замовчуванням 60"
"Update channel. Default Release.": "Канал оновлень. За замовчуванням Release."
"Whether to enable file logging": "Чи вмикати журналювання у файл"
