# Polish translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Zalogowano, kod węzła: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Uruchamianie agenta, serwer: {1}"
"[{0}] Startup failed: {1}": "[{0}] Uruchomienie nie powiodło się: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Bieżąca platforma ({0}) nie obsługuje tego polecenia"
"Parameter is empty.": "Parametr jest pusty."
"Stardust mobile agent core": "Rdzeń mobilnego agenta Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Wspólny rdzeń agenta Stardust dla platform mobilnych. Zapewnia niezależne od platformy logowanie, sygnał heartbeat, zbieranie informacji o urządzeniu i wysyłanie poleceń dla hostów Android i iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Adres serwera, np. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Kod węzła. Jeśli pozostanie pusty, zostanie automatycznie przydzielony przez serwer"
"Node secret": "Klucz tajny węzła"
"Product code. Default StarAgent-Mobile.": "Kod produktu. Domyślnie StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Nazwa projektu. Projekt, do którego domyślnie dołączają nowe węzły"
"Heartbeat interval. In seconds; default 60": "Interwał heartbeatu. W sekundach; domyślnie 60"
"Update channel. Default Release.": "Kanał aktualizacji. Domyślnie Release."
"Whether to enable file logging": "Czy włączyć rejestrowanie do pliku"
