"Node code. When left empty, it is assigned automatically by the server": "Kod nod. Jika dibiarkan kosong, ia diperuntukkan secara automatik oleh pelayan"
"Node secret": "Rahsia nod"
"Product code. Default StarAgent-Mobile.": "Kod produk. Lalai StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Nama projek. Projek yang disertai oleh nod baharu secara lalai"
"Heartbeat interval. In seconds; default 60": "Selang denyutan jantung. Dalam saat; lalai 60"
"Update channel. Default Release.": "Saluran kemas kini. Lalai Release."
"Whether to enable file logging": "Sama ada hendak mendayakan log fail"
