# Malay translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Log masuk berjaya, kod nod: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Memulakan ejen, pelayan: {1}"
"[{0}] Startup failed: {1}": "[{0}] Permulaan gagal: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Platform semasa ({0}) tidak menyokong arahan ini"
"Parameter is empty.": "Parameter kosong."
"Stardust mobile agent core": "Teras ejen mudah alih Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Teras kongsi ejen Stardust untuk platform mudah alih. Menyediakan log masuk, denyutan jantung, pengumpulan maklumat peranti dan penghantaran arahan yang bebas platform untuk hos Android dan iOS."
