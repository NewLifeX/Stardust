# Greek translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Η σύνδεση πέτυχε, κωδικός κόμβου: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Εκκίνηση πράκτορα, διακομιστής: {1}"
"[{0}] Startup failed: {1}": "[{0}] Η εκκίνηση απέτυχε: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Η τρέχουσα πλατφόρμα ({0}) δεν υποστηρίζει αυτήν την εντολή"
"Parameter is empty.": "Η παράμετρος είναι κενή."
"Stardust mobile agent core": "Πυρήνας κινητού πράκτορα Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Κοινός πυρήνας του πράκτορα Stardust για κινητές πλατφόρμες. Παρέχει σύνδεση, σήμα καρδιάς, συλλογή πληροφοριών συσκευής και αποστολή εντολών ανεξάρτητα από πλατφόρμα για υποδοχές Android και iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Διεύθυνση διακομιστή, π.χ. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Κωδικός κόμβου. Αν μείνει κενό, εκχωρείται αυτόματα από τον διακομιστή"
"Node secret": "Μυστικό κόμβου"
"Product code. Default StarAgent-Mobile.": "Κωδικός προϊόντος. Προεπιλογή StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Όνομα έργου. Το έργο στο οποίο εντάσσονται οι νέοι κόμβοι από προεπιλογή"
"Heartbeat interval. In seconds; default 60": "Διάστημα heartbeat. Σε δευτερόλεπτα· προεπιλογή 60"
"Update channel. Default Release.": "Κανάλι ενημερώσεων. Προεπιλογή Release."
"Whether to enable file logging": "Αν θα ενεργοποιηθεί η καταγραφή σε αρχείο"
