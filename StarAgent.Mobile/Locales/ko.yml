# Korean translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] 로그인 성공, 노드 코드: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] 에이전트 시작, 서버: {1}"
"[{0}] Startup failed: {1}": "[{0}] 시작 실패: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "현재 플랫폼({0})에서는 이 명령을 지원하지 않습니다"
"Parameter is empty.": "매개 변수가 비어 있습니다."
"Stardust mobile agent core": "Stardust 모바일 에이전트 코어"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "모바일 플랫폼용 Stardust 에이전트의 공유 코어입니다. Android 및 iOS 호스트를 위해 플랫폼 독립적인 로그인, 하트비트, 디바이스 정보 수집, 명령 전달을 제공합니다."
"Server address, e.g. http://star.newlifex.com:6600": "서버 주소입니다. 예: http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "노드 코드. 비워 두면 서버에서 자동으로 할당합니다"
"Node secret": "노드 비밀"
"Product code. Default StarAgent-Mobile.": "제품 코드입니다. 기본값 StarAgent-Mobile."
"Project name. The project that new nodes join by default": "프로젝트 이름. 새 노드가 기본적으로 가입하는 프로젝트입니다"
"Heartbeat interval. In seconds; default 60": "하트비트 주기. 단위는 초, 기본값 60"
"Update channel. Default Release.": "업데이트 채널입니다. 기본값 Release."
"Whether to enable file logging": "파일 로그 사용 여부"
