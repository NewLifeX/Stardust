"Node secret": "Nodegeheim"
"Product code. Default StarAgent-Mobile.": "Productcode. Standaard StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Projectnaam. Het project waar nieuwe knooppunten standaard aan deelnemen"
"Heartbeat interval. In seconds; default 60": "Heartbeat-interval. In seconden; standaard 60"
"Update channel. Default Release.": "Updatekanaal. Standaard Release."
