# Persian translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] ورود موفق، کد گره: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] راه‌اندازی عامل، سرور: {1}"
"[{0}] Startup failed: {1}": "[{0}] راه‌اندازی ناموفق: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "پلتفرم فعلی ({0}) از این فرمان پشتیبانی نمی‌کند"
"Parameter is empty.": "پارامتر خالی است."
"Stardust mobile agent core": "هسته عامل موبایل Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "هسته مشترک عامل Stardust برای سکوهای موبایل. ورود، ضربان قلب، جمع‌آوری اطلاعات دستگاه و ارسال فرمان را به‌صورت مستقل از سکو برای میزبان‌های Android و iOS فراهم می‌کند."
"Server address, e.g. http://star.newlifex.com:6600": "نشانی سرور، مثلاً http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "کد گره. در صورت خالی گذاشتن، بهصورت خودکار توسط سرور تخصیص مییابد"
"Node secret": "کلید مخفی گره"
"Product code. Default StarAgent-Mobile.": "کد محصول. پیش‌فرض StarAgent-Mobile."
"Project name. The project that new nodes join by default": "نام پروژه. پروژه‌ای که گره‌های جدید به‌طور پیش‌فرض به آن می‌پیوندند"
"Heartbeat interval. In seconds; default 60": "بازه ضربان. بر حسب ثانیه؛ پیش‌فرض 60"
"Update channel. Default Release.": "کانال به‌روزرسانی. پیش‌فرض Release."
"Whether to enable file logging": "آیا ثبت گزارش فایل فعال شود"
