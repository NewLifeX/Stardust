# Vietnamese translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Đăng nhập thành công, mã node: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Đang khởi động agent, máy chủ: {1}"
"[{0}] Startup failed: {1}": "[{0}] Khởi động thất bại: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Nền tảng hiện tại ({0}) không hỗ trợ lệnh này"
"Parameter is empty.": "Tham số trống."
"Stardust mobile agent core": "Lõi tác nhân di động Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Lõi dùng chung của tác nhân Stardust cho nền tảng di động. Cung cấp đăng nhập, nhịp tim, thu thập thông tin thiết bị và gửi lệnh độc lập nền tảng cho máy chủ Android và iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Địa chỉ máy chủ, ví dụ http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Mã nút. Nếu để trống, máy chủ sẽ tự động gán"
"Node secret": "Bí mật nút"
"Product code. Default StarAgent-Mobile.": "Mã sản phẩm. Mặc định StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Tên dự án. Dự án mà các nút mới tham gia theo mặc định"
"Heartbeat interval. In seconds; default 60": "Chu kỳ nhịp tim. Đơn vị giây; mặc định 60"
"Update channel. Default Release.": "Kênh cập nhật. Mặc định Release."
"Whether to enable file logging": "Có bật ghi nhật ký tệp hay không"
