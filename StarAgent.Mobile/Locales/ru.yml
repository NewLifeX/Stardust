# Russian translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Вход выполнен, код узла: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Запуск агента, сервер: {1}"
"[{0}] Startup failed: {1}": "[{0}] Запуск не удался: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Текущая платформа ({0}) не поддерживает эту команду"
"Parameter is empty.": "Параметр пуст."
"Stardust mobile agent core": "Ядро мобильного агента Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Общее ядро агента Stardust для мобильных платформ. Обеспечивает независимые от платформы вход, проверку активности, сбор сведений об устройстве и доставку команд для узлов Android и iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Адрес сервера, например http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Код узла. Если оставить пустым, он назначается сервером автоматически"
"Node secret": "Секрет узла"
"Product code. Default StarAgent-Mobile.": "Код продукта. По умолчанию StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Имя проекта. Проект, к которому новые узлы присоединяются по умолчанию"
"Heartbeat interval. In seconds; default 60": "Интервал пульса. В секундах; по умолчанию 60"
"Update channel. Default Release.": "Канал обновлений. По умолчанию Release."
"Whether to enable file logging": "Включить журналирование в файл"
