# French translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Connexion réussie, code du nœud : {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Démarrage de l'agent, serveur : {1}"
"[{0}] Startup failed: {1}": "[{0}] Échec du démarrage : {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "La plateforme actuelle ({0}) ne prend pas en charge cette commande"
"Parameter is empty.": "Le paramètre est vide."
"Stardust mobile agent core": "Cœur de l'agent mobile Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Cœur partagé de l'agent Stardust pour les plateformes mobiles. Fournit l'authentification, le battement de cœur, la collecte d'informations sur l'appareil et l'envoi de commandes de manière indépendante de la plateforme pour les hôtes Android et iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Adresse du serveur, ex. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Code de nœud. Si le champ est vide, il est attribué automatiquement par le serveur"
"Node secret": "Secret de nœud"
"Product code. Default StarAgent-Mobile.": "Code produit. Par défaut StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Nom du projet. Le projet que les nouveaux nœuds rejoignent par défaut"
"Heartbeat interval. In seconds; default 60": "Intervalle de pulsation. En secondes ; par défaut 60"
"Update channel. Default Release.": "Canal de mise à jour. Par défaut Release."
"Whether to enable file logging": "Activer ou non la journalisation dans un fichier"
