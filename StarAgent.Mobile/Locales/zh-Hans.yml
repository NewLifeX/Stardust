# 简体中文译文。键为英文源文，缺失时运行期回退英文。
"[{0}] Login succeeded, node code: {1}": "[{0}] 登录成功，节点编码：{1}"
"[{0}] Starting agent, server: {1}": "[{0}] 启动代理，服务端：{1}"
"[{0}] Startup failed: {1}": "[{0}] 启动失败：{1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "当前平台（{0}）不支持该指令"
"Parameter is empty.": "参数为空"
"Stardust mobile agent core": "星尘移动代理核心"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "星尘代理移动端共享核心。提供登录心跳、设备信息采集、命令下发的平台无关实现，供 Android 与 iOS 宿主复用。"
"Server address, e.g. http://star.newlifex.com:6600": "服务端地址。如 http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "节点编码。留空时由服务端自动分配"
"Node secret": "节点密钥"
"Product code. Default StarAgent-Mobile.": "产品编码。默认StarAgent-Mobile"
"Project name. The project that new nodes join by default": "项目名。新节点默认所要加入的项目"
"Heartbeat interval. In seconds; default 60": "心跳周期。单位秒，默认60"
"Update channel. Default Release.": "更新通道。默认Release"
"Whether to enable file logging": "是否启用文件日志"
