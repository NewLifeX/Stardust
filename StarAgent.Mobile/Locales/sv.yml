"Product code. Default StarAgent-Mobile.": "Produktkod. Standard StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Projektnamn. Projektet som nya noder ansluter till som standard"
"Heartbeat interval. In seconds; default 60": "Hjärtslagsintervall. I sekunder; standard 60"
