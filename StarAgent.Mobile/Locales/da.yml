"The current platform ({0}) does not support this command": "Den aktuelle platform ({0}) understøtter ikke denne kommando"
"Parameter is empty.": "Parameteren er tom."
"Stardust mobile agent core": "Stardust mobilagentkerne"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Delt kerne af Stardust-agenten til mobile platforme. Leverer platformsuafhængig login, heartbeat, indsamling af enhedsoplysninger og kommandoudsendelse til Android- og iOS-værter."
"Server address, e.g. http://star.newlifex.com:6600": "Serveradresse, f.eks. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Nodekode. Hvis den lades tom, tildeles den automatisk af serveren"
"Node secret": "Nodehemmelighed"
"Product code. Default StarAgent-Mobile.": "Produktkode. Standard StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Projektnavn. Det projekt, som nye noder tilslutter sig som standard"
"Heartbeat interval. In seconds; default 60": "Heartbeat-interval. I sekunder; standard 60"
"Update channel. Default Release.": "Opdateringskanal. Standard Release."
"Whether to enable file logging": "Om fillogning skal aktiveres"
