# Danish translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Login lykkedes, nodekode: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Starter agenten, server: {1}"
