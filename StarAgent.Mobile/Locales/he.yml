# Hebrew translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] הכניסה הצליחה, קוד צומת: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] מפעיל סוכן, שרת: {1}"
"[{0}] Startup failed: {1}": "[{0}] ההפעלה נכשלה: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "הפלטפורמה הנוכחית ({0}) אינה תומכת בפקודה זו"
"Parameter is empty.": "הפרמטר ריק."
"Stardust mobile agent core": "ליבת סוכן הנייד של Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "ליבה משותפת של סוכן Stardust לפלטפורמות ניידות. מספקת התחברות, פעימת לב, איסוף מידע על המכשיר ושליחת פקודות בלתי תלויות בפלטפורמה עבור מארחי Android ו-iOS."
"Server address, e.g. http://star.newlifex.com:6600": "כתובת השרת, לדוגמה http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "קוד צומת. אם יישאר ריק, השרת יקצה אותו אוטומטית"
"Node secret": "סוד צומת"
"Product code. Default StarAgent-Mobile.": "קוד מוצר. ברירת מחדל StarAgent-Mobile."
"Project name. The project that new nodes join by default": "שם הפרויקט. הפרויקט שאליו מצטרפים צמתים חדשים כברירת מחדל"
"Heartbeat interval. In seconds; default 60": "מרווח פעימות לב. בשניות; ברירת מחדל 60"
"Update channel. Default Release.": "ערוץ עדכונים. ברירת מחדל Release."
"Whether to enable file logging": "האם להפעיל רישום לקובץ"
