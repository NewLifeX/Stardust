# Japanese translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] ログインに成功しました。ノードコード: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] エージェントを起動しています。サーバー: {1}"
"[{0}] Startup failed: {1}": "[{0}] 起動に失敗しました: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "現在のプラットフォーム（{0}）はこのコマンドをサポートしていません"
"Parameter is empty.": "パラメーターが空です。"
"Stardust mobile agent core": "Stardust モバイルエージェントコア"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "モバイルプラットフォーム向け Stardust エージェントの共有コア。Android および iOS ホスト向けに、プラットフォーム非依存のログイン、ハートビート、デバイス情報収集、コマンド配信を提供します。"
"Server address, e.g. http://star.newlifex.com:6600": "サーバーアドレス。例: http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "ノードコード。空欄の場合、サーバーが自動的に割り当てます"
"Node secret": "ノードシークレット"
"Product code. Default StarAgent-Mobile.": "製品コード。既定値StarAgent-Mobile。"
"Project name. The project that new nodes join by default": "プロジェクト名。新しいノードが既定で参加するプロジェクトです"
"Heartbeat interval. In seconds; default 60": "ハートビート周期。単位は秒、既定値は 60"
"Update channel. Default Release.": "更新チャネル。既定値Release。"
"Whether to enable file logging": "ファイルログを有効にするか"
