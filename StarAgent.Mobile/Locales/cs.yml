# Czech translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Přihlášení úspěšné, kód uzlu: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Spouštění agenta, server: {1}"
"[{0}] Startup failed: {1}": "[{0}] Spuštění selhalo: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Aktuální platforma ({0}) tento příkaz nepodporuje"
"Parameter is empty.": "Parametr je prázdný."
"Stardust mobile agent core": "Jádro mobilního agenta Stardust"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Sdílené jádro agenta Stardust pro mobilní platformy. Poskytuje na platformě nezávislé přihlášení, heartbeaty, sběr informací o zařízení a odesílání příkazů pro hostitele Android a iOS."
"Server address, e.g. http://star.newlifex.com:6600": "Adresa serveru, např. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Kód uzlu. Při ponechání prázdného pole jej server přiřadí automaticky"
"Node secret": "Tajný klíč uzlu"
"Product code. Default StarAgent-Mobile.": "Kód produktu. Výchozí StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Název projektu. Projekt, do kterého se nové uzly ve výchozím nastavení připojují"
"Heartbeat interval. In seconds; default 60": "Interval srdečního tepu. V sekundách; výchozí 60"
"Update channel. Default Release.": "Kanál aktualizací. Výchozí Release."
"Whether to enable file logging": "Zda povolit protokolování do souboru"
