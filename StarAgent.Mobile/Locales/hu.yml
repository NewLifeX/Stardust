# Hungarian translation. Keys are English source texts; missing entries fall back to English at runtime.
"[{0}] Login succeeded, node code: {1}": "[{0}] Bejelentkezés sikeres, csomópontkód: {1}"
"[{0}] Starting agent, server: {1}": "[{0}] Ügynök indítása, kiszolgáló: {1}"
"[{0}] Startup failed: {1}": "[{0}] Az indítás nem sikerült: {1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "A jelenlegi platform ({0}) nem támogatja ezt a parancsot"
"Parameter is empty.": "A paraméter üres."
"Stardust mobile agent core": "Stardust mobilügynök-mag"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "A Stardust ügynök megosztott magja mobilplatformokhoz. Platformfüggetlen bejelentkezést, szívverést, eszközinformáció-gyűjtést és parancsküldést biztosít Android- és iOS-gazdagépekhez."
"Server address, e.g. http://star.newlifex.com:6600": "Kiszolgáló címe, pl. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Csomópontkód. Üresen hagyva a kiszolgáló automatikusan hozzárendeli"
"Node secret": "Csomóponttitok"
"Product code. Default StarAgent-Mobile.": "Termékkód. Alapértelmezett StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Projektnév. Az a projekt, amelyhez az új csomópontok alapértelmezés szerint csatlakoznak"
"Heartbeat interval. In seconds; default 60": "Szívverés időköze. Másodpercben; alapértelmezett 60"
"Update channel. Default Release.": "Frissítési csatorna. Alapértelmezett Release."
"Whether to enable file logging": "Engedélyezze-e a fájlnaplózást"
