# 运行时消息补充词条
"The current platform ({0}) does not support this command": "Nykyinen alusta ({0}) ei tue tätä komentoa"
"Parameter is empty.": "Parametri on tyhjä."
"Stardust mobile agent core": "Stardustin mobiiliagentin ydin"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "Stardust-agentin jaettu ydin mobiilialustoille. Tarjoaa alustariippumattoman kirjautumisen, sydämenlyönnit, laitetietojen keruun ja komentojen välityksen Android- ja iOS-isäntäohjelmille."
"Server address, e.g. http://star.newlifex.com:6600": "Palvelimen osoite, esim. http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "Solmun koodi. Jos kenttä jätetään tyhjäksi, palvelin määrittää sen automaattisesti"
"Node secret": "Solmun salaisuus"
"Product code. Default StarAgent-Mobile.": "Tuotekoodi. Oletus StarAgent-Mobile."
"Project name. The project that new nodes join by default": "Projektin nimi. Projekti, johon uudet solmut liittyvät oletuksena"
"Heartbeat interval. In seconds; default 60": "Sydämenlyöntien väli. Sekunteina; oletus 60"
"Update channel. Default Release.": "Päivityskanava. Oletus Release."
"Whether to enable file logging": "Otetaanko tiedostolokitus käyttöön"
