# 繁體中文譯文。鍵為英文源文，缺失時運行期回退英文。
"[{0}] Login succeeded, node code: {1}": "[{0}] 登錄成功，節點編碼：{1}"
"[{0}] Starting agent, server: {1}": "[{0}] 啟動代理，服務端：{1}"
"[{0}] Startup failed: {1}": "[{0}] 啟動失敗：{1}"
# 运行时消息补充词条
"The current platform ({0}) does not support this command": "目前平台（{0}）不支援該指令"
"Parameter is empty.": "參數為空"
"Stardust mobile agent core": "星塵行動代理核心"
"Shared core of the Stardust agent for mobile platforms. Provides platform-independent login, heartbeat, device information collection, and command dispatch for Android and iOS hosts.": "星塵代理行動端共用核心。提供登入心跳、裝置資訊採集、命令下發的平台無關實作，供 Android 與 iOS 主機重用。"
"Server address, e.g. http://star.newlifex.com:6600": "伺服器位址。如 http://star.newlifex.com:6600"
"Node code. When left empty, it is assigned automatically by the server": "節點代碼。留空時由伺服器自動分配"
"Node secret": "節點金鑰"
"Product code. Default StarAgent-Mobile.": "產品代碼。預設StarAgent-Mobile"
"Project name. The project that new nodes join by default": "專案名稱。新節點預設要加入的專案"
"Heartbeat interval. In seconds; default 60": "心跳週期。單位秒，預設60"
"Update channel. Default Release.": "更新通道。預設Release"
"Whether to enable file logging": "是否啟用檔案記錄"
