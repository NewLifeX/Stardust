"The node has no MAC address and cannot be woken.": "節點沒有 MAC 位址，無法喚醒。"
"No online node in the same LAN; unable to wake the node.": "同一區域網路內沒有線上節點，無法喚醒。"
"Wake-on-LAN command sent to {0} node(s).": "喚醒命令已傳送到 {0} 個節點。"
