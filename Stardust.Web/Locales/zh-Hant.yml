"上报日志": "上報日誌"
"Reported {0} ({1:n0} bytes, {2} lines). Opening the log list.": "已上报 {0}（{1:n0} 字节，{2} 行），正在打开日志列表。"
"Log report requested. Opening the log list.": "已要求实例上报日志，正在打开日志列表。"
"Pipeline queue timed out.": "流水線排隊逾時。"
