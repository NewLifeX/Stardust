"No reply.": "Brak odpowiedzi."
"级别：": "Level:"
"Log report finished: {0} succeeded, {1} failed, {2} offline skipped.": "Raport logów zakończony: {0} sukcesów, {1} niepowodzeń, {2} pominiętych offline."
"No log lines were recognized; check the log format.": "Nie rozpoznano żadnych wierszy logu; sprawdź format logu."
"The instance SDK version is too old to report logs. Please upgrade Stardust.": "Wersja SDK instancji jest zbyt stara do raportowania logów. Zaktualizuj Stardust."
"客户端：": "Client:"
"上报日志": "Report logs"
"Reported {0} ({1:n0} bytes, {2} lines). Opening the log list.": "Zgłoszono {0} ({1:n0} bajtów, {2} wierszy). Otwieranie listy logów."
"Log report requested. Opening the log list.": "Zażądano raportu logów. Otwieranie listy logów."
"Pipeline queue timed out.": "Przekroczono limit czasu kolejki potoku."
"Pipeline build timed out.": "Przekroczono limit czasu kompilacji potoku."
"Pipeline deploy timed out.": "Przekroczono limit czasu wdrożenia potoku."
"The pipeline queue is full ({0}); wait for the running tasks to finish.": "Kolejka potoku jest pełna ({0}); poczekaj na zakończenie uruchomionych zadań."
"Run is already in a terminal state.": "Uruchomienie jest już w stanie końcowym."
"The node has no MAC address and cannot be woken.": "Węzeł nie ma adresu MAC i nie można go wybudzić."
"No online node in the same LAN; unable to wake the node.": "Brak węzła online w tej samej sieci LAN; nie można wybudzić węzła."
"Wake-on-LAN command sent to {0} node(s).": "Wysłano polecenie Wake-on-LAN do {0} węzłów."
