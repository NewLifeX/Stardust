"Starting auto deploy, run={0}, version={1}": "Rozpoczynanie automatycznego wdrożenia, run={0}, wersja={1}"
"Failed to dispatch the deploy command.": "Nie udało się wysłać polecenia wdrożenia."
"No deployable node was found; check the pipeline deploy node configuration.": "Nie znaleziono węzła do wdrożenia; sprawdź konfigurację węzłów wdrożeniowych potoku."
"Auto deploy was not triggered: no deploy node is selected for the pipeline.": "Automatyczne wdrożenie nie zostało uruchomione: dla potoku nie wybrano żadnego węzła wdrożeniowego."
"Deploy command dispatched to node {0} (CommandId={1}).": "Wysłano polecenie wdrożenia do węzła {0} (CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "Nie udało się wysłać polecenia wdrożenia do węzła {0}: {1}"
"Application authentication": "Uwierzytelnianie aplikacji"
"Node authentication": "Uwierzytelnianie węzła"
"Offline timeout": "Wyłączono po przekroczeniu czasu"
"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "Aplikacja z pustym sekretem nie może się zalogować. Ustaw Secret dla tej aplikacji w rejestrze lub włącz ponowną rejestrację."
"Secret validation failed.": "Walidacja sekretu nie powiodła się."
"[{0}] re-registered in [{1}] mode; secret issued": "[{0}] zarejestrowano ponownie w trybie [{1}]; sekret wydany"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "[{0}] zarejestrowano ponownie w trybie [{1}]; sekret wydany, UUID={2}"
"[{0}] registered successfully.": "[{0}] zarejestrowano pomyślnie."
"[{0}] registration failed: {1}": "Rejestracja [{0}] nie powiodła się: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] uwierzytelniono {2}"
"Registered service [{0}] {1}": "Zarejestrowano usługę [{0}] {1}"
"Service [{0}] went offline: {1}": "Usługa [{0}] przeszła w tryb offline: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "[{0}] niezgodność sekretu; dozwolone przez tryb [{1}]"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] klient przesyła teraz prawidłowy sekret; okno konwergencji zostało automatycznie zamknięte"
"Hardware information changed too much.": "Informacje o sprzęcie zmieniły się zbyt mocno."
"Unique identifier mismatch (new != old): {0} != {1}": "Niezgodność unikalnego identyfikatora (nowy != stary): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "Niezgodność identyfikatora maszyny (nowy != stary): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "Niezgodność numeru seryjnego komputera (nowy != stary): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "Niezgodność płyty głównej (nowy != stary): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "Niezgodność kodu produktu (nowy != stary): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Niezgodność nazwy maszyny (nowy != stary): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "Niezgodność adresu MAC (nowy != stary): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Niezgodność numeru seryjnego dysku (nowy != stary): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Wersja={0} Rozmiar={1:n0} Węzeł={2}"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] zalogowano o {2}, ostatnia aktywność o {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Węzeł [{0}/{1}] jest bardzo podobny do istniejącego węzła [{2}]; używany jest istniejący węzeł"
"Stardust service platform": "Platforma usług Stardust"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Rdzeń zaplecza rozproszonej platformy Stardust. Udostępnia interfejsy API dla węzłów, aplikacji, konfiguracji, rejestru, monitoringu i alertów, wdrożeń, bramy i MCP oraz agregację metryk, statystyki i zadania zaplanowane."
"Service port. Default 6600.": "Port usługi. Domyślnie 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Klucz tajny tokenu. Algorytm i klucz używane do generowania tokenów JWT, np. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Okres ważności tokenu. Domyślnie 2*3600 sekund."
"Session timeout. Default 600 seconds": "Limit czasu sesji. Domyślnie 600 sekund"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Czas odchylenia soli. Klienci używają bieżącego czasu jako soli podczas logowania; zbyt duża różnica czasu względem serwera powoduje niepowodzenie weryfikacji klucza; domyślnie 600 sekund"
"Auto-register. Allow node clients to register automatically, default true": "Automatyczna rejestracja. Zezwól klientom węzłów na automatyczną rejestrację, domyślnie true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatyczna rejestracja aplikacji. Zezwalaj klientom aplikacji na automatyczną rejestrację; domyślnie true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Biała lista dostępu. Jeśli podano, rejestrować mogą się tylko węzły spełniające warunki IP, wiele wpisów oddziel przecinkami, obsługiwane dopasowanie wieloznaczne *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formuła kodu węzła. Wybiera, które informacje o sprzęcie w NodeInfo są używane do obliczenia kodu węzła. Obsługuje Crc/Crc16/MD5/MD5_16, domyślnie Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Próg identyfikacji kodu węzła. UUID+Guid+SerialNumber+DiskId+MAC; jeśli kilka z nich się zgadza, węzeł jest uznawany za ten sam, domyślnie 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Okres statystyk strumienia monitorowania. Domyślnie 5 sekund. Przetwarza kolejkę w pamięci w celu obliczenia statystyk na poziomie minut; mniejsze wartości poprawiają aktualność, ale zwiększają użycie CPU, większe wartości zmniejszają użycie CPU, ale zwiększają opóźnienie alertów"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Okres statystyk wsadowych monitorowania. Domyślnie 30 sekund. Koryguje dane przez agregację z bazy danych; mniejsze wartości przyspieszają korektę, ale zwiększają obciążenie IO, większe wartości zmniejszają obciążenie, ale opóźniają korektę"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Okres zapisu monitorowania. Domyślnie 300 sekund. Okres wsadowego zatwierdzania kolejki opóźnionych statystyk; alerty odczytują wartości czasu rzeczywistego z pamięci i nie są objęte zmianą. Większe wartości znacznie zmniejszają obciążenie UPDATE bazy danych"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Okres kontroli monitorowania. Domyślnie 600 sekund. Okresowo przelicza statystyki godzinowe/dzienne dla mało popularnych aplikacji zamiast pełnego przeliczania w każdym cyklu wsadowym, co zmniejsza wzmocnienie zapisów"
"Monitoring alert period. Default 30 seconds": "Okres alertów monitorowania. Domyślnie 30 sekund"
"Console address. Used for monitoring alert addresses": "Adres konsoli. Używany do adresów alertów monitorowania"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Okres przechowywania danych. Szczegóły próbek i statystyki na poziomie minut; domyślnie 3 dni."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Czas przechowywania danych o średniej ziarnistości. Dane wydajnościowe i statystyki godzinowe, domyślnie 30 dni"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Okres przechowywania danych gruboziarnistych. Dane historyczne i statystyki dzienne, domyślnie 300 dni."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Tryb czyszczenia danych. Obsługuje wydajny Truncate lub Delete bez DDL. Domyślnie Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Katalog przesyłania. Przechowuje pakiety aktualizacji i musi być tym samym katalogiem skonfigurowanym dla StarWeb. Domyślnie ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maksymalny rozmiar pakietu do przesłania. Dotyczy tylko maksymalnej dozwolonej liczby bajtów treści żądania punktu końcowego Deploy/UploadBuildFile; domyślnie 100000000 (100MB), 0 oznacza użycie domyślnego limitu Kestrel, maksymalnie 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Katalog pamięci podręcznej plików. Przechowuje pliki pamięci podręcznej, np. sterowniki baz danych; wyłączony, gdy pusty; domyślnie ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Lista dozwolonych pamięci podręcznej plików. Jeśli określona, tylko pasujące źródła IP mogą uzyskać dostęp do pamięci podręcznej plików; wiele wpisów oddziel przecinkami; obsługuje symbole wieloznaczne *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Usługa magazynu plików. Czy odpowiadać na żądania pobrania plików od innych węzłów. Domyślnie true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Pobieranie z magazynu plików. Czy aktywnie pobierać nowe pliki publikowane przez inne węzły. Domyślnie false."
"Upstream server. Reports data synchronously to the upstream server.": "Serwer nadrzędny. Synchronicznie raportuje dane do serwera nadrzędnego."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Stałe miasto. Domyślnie miasto jest obliczane automatycznie na podstawie IP. Po włączeniu obliczanie automatyczne jest wyłączane, a miasto ustawiane ręcznie"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Zezwalaj na anonimowy dostęp do śledzenia. Umożliwia niezalogowanym użytkownikom dostęp do strony śledzenia /trace; dane monitoringu mogą zawierać poufne informacje. Domyślnie false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Interwał synchronizacji dotNet. Pobieraj informacje o instalatorze .NET runtime z oficjalnej witryny, 0 wyłącza, jednostka sekundy, domyślnie 43200 (12 godzin)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Adres synchronizacji dotNet. Oficjalny adres API do pobierania wersji środowiska .NET runtime, obsługuje symbol zastępczy {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Bazowy adres pobierania zasobów Stardust. Bazowy URL instalatorów/skryptów StarAgent; domyślnie adres oficjalny"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Zezwalaj, gdy węzły sterowalne są puste. Czy zezwalać na operacje, gdy AllowControlNodes jest puste, domyślnie false (tryb bezpieczny, węzły sterowalne trzeba skonfigurować jawnie). W środowiskach wewnętrznych można ustawić true dla zgodności ze starymi danymi"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Włącz usługę MCP. Domyślnie wyłączona; po włączeniu udostępnia punkt końcowy POST /mcp do wywołań LLM/agentów."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Zestaw akcji MCP. Nazwy modułów oddzielone przecinkami (node/app/config/deploy/gateway/monitor/system), * oznacza włączenie wszystkich"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Prefiksy ścieżek ograniczania szybkości. Oddzielone przecinkami; pasujące ścieżki są ograniczane według IP; domyślnie punkty końcowe uwierzytelniania, np. login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Liczba ograniczeń szybkości. Liczba dozwolonych żądań na IP na minutę; domyślnie 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Zezwalaj na anonimowe raportowanie telemetrii. Wymagane dla wielopoziomowej kaskady lub minimalnego SDK; domyślnie false (bezpieczne)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Dozwolone źródła CORS. Oddzielone przecinkami; puste zezwala na dowolne źródło; po podaniu tylko źródła z białej listy mogą wykonywać cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Uwierzytelnianie pobierania załączników. Czy weryfikować token pobierania załączników dla /cube/file. Domyślnie false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Kategorie publicznych załączników bez logowania. Oddzielone przecinkami, pasujące elementy można pobrać anonimowo."
"Attachment download token validity. Seconds, default 600.": "Ważność tokenu pobierania załączników. Sekundy, domyślnie 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService synchronizuje {0}"
"DotNetSyncService failed to sync {0}: {1}": "Nie udało się zsynchronizować {0} w DotNetSyncService: {1}"
"DotNetSyncService.Error {0}": "Błąd DotNetSyncService: {0}"
"Default language. Pushed to clients on login and heartbeat, e.g. zh-Hans or en; application channel skips Desktop/Mobile/Frontend kinds; empty uses the core configuration DefaultLanguage.": "Domyślny język. Wysyłany do klientów podczas logowania i heartbeatu, np. zh-Hans lub en; pusta wartość używa DefaultLanguage z konfiguracji podstawowej."
"Please select at least one item.": "Wybierz co najmniej jeden element."
"Command cannot be empty.": "Polecenie nie może być puste."
"Dispatched {0}, replied {1}, no reply {2}": "Wysłano {0}, odpowiedziało {1}, bez odpowiedzi {2}"
"Dispatched {0}; awaiting node confirmation": "Wysłano {0}; oczekiwanie na potwierdzenie węzła"
"Skipped {0} offline": "Pominięto {0} w trybie offline"
"The specified version does not exist.": "Podana wersja nie istnieje."
"No matched package for the selected nodes; skipped {0}": "Brak pasującego pakietu dla wybranych węzłów; pominięto {0}"
"The telemetry payload is too large.": "Ładunek telemetrii jest zbyt duży."
