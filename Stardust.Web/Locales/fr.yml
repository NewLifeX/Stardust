"Machine name mismatch (new != old): {0} != {1}": "Nom de machine différent (nouveau != ancien) : {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "Adresse MAC différente (nouveau != ancien) : {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Numéro de série du disque différent (nouveau != ancien) : {0} != {1}"
