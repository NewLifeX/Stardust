"Stardust service platform": "Stardust-tjenesteplattform"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Backendkjernen i den distribuerte Stardust-plattformen. Leverer API-er for noder, applikasjoner, konfigurasjon, register, overvåking og varsler, utgivelser, gateway og MCP, samt metrikkaggregering, statistikk og planlagte oppgaver."
"Service port. Default 6600.": "Tjenesteport. Standard 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Tokenhemmelighet. Algoritme og hemmelighet som brukes til å generere JWT-tokener, f.eks. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Tokenets gyldighetsperiode. Standard 2*3600 sekunder."
"Session timeout. Default 600 seconds": "Tidsavbrudd for økt. Standard 600 sekunder"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Saltsavvikelsestid. Klienter bruker gjeldende tid som salt ved pålogging; for stor tidsforskjell fra serveren gjør at nøkkelverifiseringen mislykkes; standard 600 sekunder"
"Auto-register. Allow node clients to register automatically, default true": "Automatisk registrering. Tillat at nodeklienter registrerer seg automatisk, standard true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatisk applikasjonsregistrering. Tillat at appklienter registrerer seg automatisk; standard true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Adgangshviteliste. Hvis angitt, kan bare noder som oppfyller IP-betingelsene registrere seg; skill flere med komma; støtter *-jokertegn"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formel for nodekode. Velger hvilke maskinvareopplysninger i NodeInfo som brukes til å beregne nodekoden. Støtter Crc/Crc16/MD5/MD5_16, standard Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Terskel for nodekodeidentifikasjon. UUID+Guid+SerialNumber+DiskId+MAC; hvis flere av dem samsvarer, anses noden som den samme, standard 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Statistikkperiode for overvåkingsstrøm. Standard 5 sekunder. Behandler køen i minnet for å beregne statistikk på minuttnivå; mindre verdier forbedrer sanntiden, men øker CPU-bruken, større verdier reduserer CPU-bruken, men øker varslingsforsinkelsen"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Batch-statistikkperiode for overvåking. Standard 30 sekunder. Korrigerer data ved å aggregere fra databasen; mindre verdier fremskynder korrigeringen, men øker IO-belastningen, større verdier reduserer belastningen, men forsinker korrigeringen"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Lagringsperiode for overvåking. Standard 300 sekunder. Batch-innsendingsperiode for statistikkforsinkelseskøen; varsler leser sanntidsverdier i minnet og påvirkes ikke. Større verdier reduserer UPDATE-belastningen på databasen betydelig"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Inspeksjonsperiode for overvåking. Standard 600 sekunder. Beregner time-/dagsstatistikk på nytt for lite brukte applikasjoner periodisk i stedet for full omberegning i hver batchsyklus, noe som reduserer skriveforsterkning"
"Monitoring alert period. Default 30 seconds": "Varslingsperiode for overvåking. Standard 30 sekunder"
"Console address. Used for monitoring alert addresses": "Konsolladresse. Brukes for varslingsadresser for overvåking"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Dataoppbevaringsperiode. Prøvedetaljer og statistikk på minuttnivå; standard 3 dager."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Oppbevaringstid for data med middels granularitet. Ytelsesdata og timesstatistikk, standard 30 dager"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Oppbevaringsperiode for grovkornede data. Historiske data og daglig statistikk, standard 300 dager."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Ryddemodus for data. Støtter effektiv Truncate eller Delete uten DDL. Standard Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Opplastingsmappe. Lagrer oppgraderingspakker og må være samme mappe som er konfigurert for StarWeb. Standard ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maksimal opplastingspakningsstørrelse. Gjelder bare for maksimalt tillatte byte i forespørselsorganet for Deploy/UploadBuildFile-endepunktet; standard 100000000 (100MB), 0 betyr bruk Kestrels standardgrense, maks 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Katalog for filbuffer. Lagrer bufferfiler som databasedrivere; deaktivert når tom; standard ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Hvitliste for filbuffer. Hvis angitt, har bare samsvarende IP-kilder tilgang til filbufferen; skill flere oppføringer med komma; støtter * jokertegn"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Fillagringstjeneste. Om det skal svares på filnedlastingsforespørsler fra andre noder. Standard true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Fillagringsuttrekk. Om nye filer publisert av andre noder skal hentes aktivt. Standard false."
"Upstream server. Reports data synchronously to the upstream server.": "Overordnet server. Rapporterer data synkront til den overordnede serveren."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Fast by. Som standard beregnes byen automatisk fra IP-adressen. Når dette er aktivert, beregnes den ikke lenger automatisk, og byen angis manuelt"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Tillat anonym sporingsakses. La brukere som ikke er logget på, få tilgang til sporingssiden /trace; overvåkningsdata kan inneholde sensitive opplysninger. Standard false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet-synkroniseringsintervall. Hent .NET runtime-installasjonsinformasjon fra det offisielle nettstedet, 0 deaktiverer, enhet sekunder, standard 43200 (12 timer)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet-synkroniseringsadresse. Offisiell API-adresse for å hente .NET runtime-versjoner, støtter plassholderen {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Basisadresse for nedlasting av Stardust-ressurser. Basis-URL for StarAgent-installasjonsprogrammer/skript; standard den offisielle adressen"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Tillat når styrbare noder er tomme. Om operasjoner er tillatt når AllowControlNodes er tom, standard false (sikker modus, styrbare noder må konfigureres eksplisitt). Interne miljøer kan sette den til true for kompatibilitet med eldre data"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Aktiver MCP-tjenesten. Deaktivert som standard; når den er aktivert, eksponeres POST /mcp-endepunktet for LLM-/agentkall."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP-handlingssett. Kommaseparerte modulnavn (node/app/config/deploy/gateway/monitor/system), * betyr at alle er aktivert"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Stiforstier for hastighetsbegrensning. Kommaseparert; samsvarende stier begrenses per IP; standard er autentiseringsendepunkter som login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Antall hastighetsbegrensninger. Antall tillatte forespørsler per IP per minutt; standard 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Tillat anonym telemetrirapportering. Påkrevd for flertrinns kaskadering eller minimal SDK; standard false (sikkert)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Tillatte CORS-opprinnelser. Kommaseparert; tom tillater enhver opprinnelse; når angitt kan bare hvitlistede opprinnelser bruke cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Godkjenning av vedleggsnedlasting. Om nedlastingstokenet for vedlegg skal kontrolleres for /cube/file. Standard false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Offentlige vedleggskategorier uten innlogging. Kommaseparert, treff kan lastes ned anonymt."
"Attachment download token validity. Seconds, default 600.": "Gyldighet for nedlastingstoken for vedlegg. Sekunder, standard 600."
