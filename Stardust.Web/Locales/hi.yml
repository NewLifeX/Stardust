"Token validity period. Default 2*3600 seconds.": "टोकन वैधता अवधि। डिफ़ॉल्ट 2*3600 सेकंड।"
"Session timeout. Default 600 seconds": "सत्र टाइमआउट। डिफ़ॉल्ट 600 सेकंड"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "सॉल्ट विचलन समय। क्लाइंट लॉगिन करते समय वर्तमान समय को सॉल्ट के रूप में उपयोग करते हैं; सर्वर से समय का अंतर बहुत अधिक होने पर कुंजी सत्यापन विफल हो जाएगा; डिफ़ॉल्ट 600 सेकंड"
"Auto-register. Allow node clients to register automatically, default true": "स्वचालित पंजीकरण। नोड क्लाइंट को स्वचालित रूप से पंजीकरण करने दें, डिफ़ॉल्ट true"
"Application auto-registration. Allow app clients to register automatically; default true": "अनुप्रयोग स्वतः पंजीकरण। ऐप क्लाइंट को स्वचालित रूप से पंजीकृत होने दें; डिफ़ॉल्ट true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "प्रवेश श्वेतसूची। यदि निर्दिष्ट हो, तो केवल IP शर्तों से मेल खाने वाले नोड ही पंजीकरण कर सकते हैं, कई प्रविष्टियाँ कॉमा से अलग करें, * वाइल्डकार्ड मिलान समर्थित"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "नोड कोड सूत्र। चुनता है कि NodeInfo में कौन-सी हार्डवेयर जानकारी नोड कोड की गणना के लिए उपयोग होती है। Crc/Crc16/MD5/MD5_16 समर्थित, डिफ़ॉल्ट Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "नोड कोड पहचान सीमा। UUID+Guid+SerialNumber+DiskId+MAC; यदि इनमें से कई मेल खाते हैं, तो नोड को समान माना जाता है, डिफ़ॉल्ट 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "निगरानी स्ट्रीम सांख्यिकी अवधि। डिफ़ॉल्ट 5 सेकंड। मिनट-स्तरीय सांख्यिकी की गणना के लिए इन-मेमोरी कतार को संसाधित करता है; छोटे मान रीयल-टाइम प्रतिक्रिया बढ़ाते हैं पर CPU उपयोग बढ़ाते हैं, बड़े मान CPU उपयोग घटाते हैं पर अलर्ट विलंब बढ़ाते हैं"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "निगरानी बैच सांख्यिकी अवधि। डिफ़ॉल्ट 30 सेकंड। डेटाबेस से एकत्र करके डेटा सुधारता है; छोटे मान सुधार गति बढ़ाते हैं पर IO दबाव बढ़ाते हैं, बड़े मान दबाव घटाते हैं पर सुधार में देरी करते हैं"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "निगरानी फ़्लश अवधि। डिफ़ॉल्ट 300 सेकंड। सांख्यिकी विलंब कतार की बैच कमिट अवधि; अलर्ट मेमोरी से रीयल-टाइम मान पढ़ते हैं और प्रभावित नहीं होते। बड़े मान डेटाबेस UPDATE दबाव को उल्लेखनीय रूप से घटाते हैं"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "निगरानी निरीक्षण अवधि। डिफ़ॉल्ट 600 सेकंड। गैर-लोकप्रिय अनुप्रयोगों के लिए प्रति बैच चक्र में पूर्ण पुनर्गणना के बजाय समय-समय पर घंटे/दिन की सांख्यिकी की पुनर्गणना करता है, जिससे राइट एम्प्लिफिकेशन कम होता है"
"Monitoring alert period. Default 30 seconds": "निगरानी अलर्ट अवधि। डिफ़ॉल्ट 30 सेकंड"
"Console address. Used for monitoring alert addresses": "कंसोल पता। निगरानी अलर्ट पतों के लिए उपयोग किया जाता है"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "डेटा प्रतिधारण अवधि। नमूना विवरण और मिनट-स्तरीय आँकड़े; डिफ़ॉल्ट 3 दिन।"
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "मध्यम ग्रैन्युलैरिटी डेटा प्रतिधारण समय। प्रदर्शन डेटा और प्रति घंटा आँकड़े, डिफ़ॉल्ट 30 दिन"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "मोटे दाने वाले डेटा की प्रतिधारण अवधि। ऐतिहासिक डेटा और दैनिक आँकड़े, डिफ़ॉल्ट 300 दिन।"
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "डेटा सफ़ाई मोड। कुशल Truncate या बिना DDL वाले Delete का समर्थन करता है। डिफ़ॉल्ट Truncate।"
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "अपलोड निर्देशिका। अपग्रेड पैकेज संग्रहीत करती है और StarWeb के लिए कॉन्फ़िगर की गई वही निर्देशिका होनी चाहिए। डिफ़ॉल्ट ../Uploads।"
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "अधिकतम अपलोड पैकेज आकार। केवल Deploy/UploadBuildFile एंडपॉइंट के लिए अनुमत अधिकतम अनुरोध बॉडी बाइट्स पर लागू होता है; डिफ़ॉल्ट 100000000 (100MB), 0 का अर्थ Kestrel की डिफ़ॉल्ट सीमा का उपयोग करना है, अधिकतम 1GB।"
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "फ़ाइल कैशे निर्देशिका। डेटाबेस ड्राइवर जैसी कैशे फ़ाइलें संग्रहीत करती है; खाली होने पर अक्षम रहती है; डिफ़ॉल्ट ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "फ़ाइल कैशे व्हाइटलिस्ट। यदि निर्दिष्ट हो, तो केवल मेल खाते IP स्रोत ही फ़ाइल कैशे तक पहुँच सकते हैं; कई प्रविष्टियों को कॉमा से अलग करें; * वाइल्डकार्ड का समर्थन करता है"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "फ़ाइल संग्रहण सेवा। क्या अन्य नोड्स के फ़ाइल डाउनलोड अनुरोधों का उत्तर दें। डिफ़ॉल्ट true।"
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "फ़ाइल संग्रहण पुल। क्या अन्य नोड्स द्वारा प्रकाशित नई फ़ाइलों को सक्रिय रूप से खींचें। डिफ़ॉल्ट false।"
"Upstream server. Reports data synchronously to the upstream server.": "अपस्ट्रीम सर्वर। अपस्ट्रीम सर्वर को डेटा समकालिक रूप से रिपोर्ट करता है।"
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "निश्चित शहर। डिफ़ॉल्ट रूप से शहर IP से स्वतः गणना किया जाता है। सक्षम करने पर स्वतः गणना बंद हो जाती है और शहर मैन्युअल रूप से सेट किया जाता है"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "अनाम ट्रेस एक्सेस की अनुमति दें। बिना लॉगिन किए उपयोगकर्ताओं को /trace ट्रेस पृष्ठ तक पहुँचने दें; निगरानी डेटा में संवेदनशील जानकारी हो सकती है। डिफ़ॉल्ट false।"
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet सिंक अंतराल। आधिकारिक साइट से .NET रनटाइम इंस्टॉलर जानकारी प्राप्त करें, 0 का अर्थ अक्षम, इकाई सेकंड, डिफ़ॉल्ट 43200 (12 घंटे)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet सिंक पता। .NET रनटाइम संस्करण प्राप्त करने के लिए आधिकारिक API पता, {major} प्लेसहोल्डर समर्थित"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Stardust संसाधन डाउनलोड आधार पता। StarAgent इंस्टॉलर/स्क्रिप्ट के लिए आधार URL; डिफ़ॉल्ट आधिकारिक पता"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "नियंत्रणीय नोड खाली होने पर अनुमति दें। AllowControlNodes खाली होने पर संचालन की अनुमति है या नहीं, डिफ़ॉल्ट false (सुरक्षित मोड, नियंत्रणीय नोड स्पष्ट रूप से कॉन्फ़िगर करने होंगे)। आंतरिक वातावरण में पुराने डेटा के साथ संगतता के लिए true सेट किया जा सकता है"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP सेवा सक्षम करें। डिफ़ॉल्ट रूप से बंद, सक्षम होने पर LLM/एजेंट कॉल के लिए POST /mcp एंडपॉइंट उजागर करता है।"
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP एक्शन सेट। कॉमा से अलग मॉड्यूल नाम (node/app/config/deploy/gateway/monitor/system), * का अर्थ सभी सक्षम"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "दर सीमा पथ उपसर्ग। कॉमा से अलग; मेल खाते पथ IP के अनुसार दर-सीमित होते हैं; डिफ़ॉल्ट login/token जैसे प्रमाणीकरण एंडपॉइंट"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "दर सीमा संख्या। प्रति IP प्रति मिनट अनुमत अनुरोधों की संख्या; डिफ़ॉल्ट 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "अनाम टेलीमेट्री रिपोर्टिंग की अनुमति दें। बहु-स्तरीय कैस्केडिंग या न्यूनतम SDK के लिए आवश्यक; डिफ़ॉल्ट false (सुरक्षित)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "CORS अनुमत मूल। कॉमा से अलग; खाली होने पर कोई भी मूल अनुमत; निर्दिष्ट होने पर केवल श्वेतसूचीबद्ध मूल ही क्रॉस-ओरिजिन कर सकते हैं"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "अटैचमेंट डाउनलोड प्रमाणीकरण। /cube/file के लिए अटैचमेंट डाउनलोड टोकन सत्यापित करना है या नहीं। डिफ़ॉल्ट false।"
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "बिना लॉगिन वाली सार्वजनिक अनुलग्नक श्रेणियाँ। अल्पविराम से अलग, मेल खाने वाले आइटम अनाम रूप से डाउनलोड किए जा सकते हैं।"
"Attachment download token validity. Seconds, default 600.": "अटैचमेंट डाउनलोड टोकन की वैधता। सेकंड, डिफ़ॉल्ट 600।"
"DotNetSyncService.Sync {0}": "DotNetSyncService {0} को सिंक कर रहा है"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService {0} को सिंक नहीं कर सका: {1}"
"DotNetSyncService.Error {0}": "DotNetSyncService त्रुटि: {0}"
"Default language. Pushed to clients on login and heartbeat, e.g. zh-Hans or en; application channel skips Desktop/Mobile/Frontend kinds; empty uses the core configuration DefaultLanguage.": "डिफ़ॉल्ट भाषा। लॉगिन और हार्टबीट पर क्लाइंट को भेजी जाती है, जैसे zh-Hans या en; खाली होने पर कोर कॉन्फ़िगरेशन का DefaultLanguage उपयोग होता है।"
"Please select at least one item.": "कृपया कम से कम एक आइटम चुनें।"
"Command cannot be empty.": "कमांड खाली नहीं हो सकता।"
"Dispatched {0}, replied {1}, no reply {2}": "भेजे गए {0}, उत्तर {1}, कोई उत्तर नहीं {2}"
"Dispatched {0}; awaiting node confirmation": "भेजे गए {0}; नोड पुष्टि की प्रतीक्षा में"
"Skipped {0} offline": "{0} ऑफ़लाइन छोड़े गए"
"The specified version does not exist.": "निर्दिष्ट संस्करण मौजूद नहीं है।"
"No matched package for the selected nodes; skipped {0}": "चयनित नोड्स के लिए कोई मेल खाता पैकेज नहीं; {0} छोड़े गए"
"The telemetry payload is too large.": "टेलीमेट्री पेलोड बहुत बड़ा है।"
# 运行时消息补充词条
"No reply.": "कोई उत्तर नहीं।"
"级别：": "Level:"
"Log report finished: {0} succeeded, {1} failed, {2} offline skipped.": "लॉग रिपोर्ट पूर्ण: {0} सफल, {1} विफल, {2} ऑफ़लाइन छोड़े गए।"
"No log lines were recognized; check the log format.": "कोई लॉग पंक्ति पहचानी नहीं गई; लॉग प्रारूप जाँचें।"
"The instance SDK version is too old to report logs. Please upgrade Stardust.": "इंस्टेंस का SDK संस्करण लॉग रिपोर्ट करने के लिए बहुत पुराना है। कृपया Stardust अपग्रेड करें।"
"客户端：": "Client:"
"上报日志": "Report logs"
"Reported {0} ({1:n0} bytes, {2} lines). Opening the log list.": "{0} रिपोर्ट किए गए ({1:n0} बाइट, {2} पंक्तियाँ)। लॉग सूची खोली जा रही है।"
"Log report requested. Opening the log list.": "लॉग रिपोर्ट का अनुरोध किया गया। लॉग सूची खोली जा रही है।"
"Pipeline queue timed out.": "पाइपलाइन कतार का समय समाप्त हो गया।"
"Pipeline build timed out.": "पाइपलाइन बिल्ड का समय समाप्त हो गया।"
"Pipeline deploy timed out.": "पाइपलाइन डिप्लॉय का समय समाप्त हो गया।"
"The pipeline queue is full ({0}); wait for the running tasks to finish.": "पाइपलाइन कतार भरी है ({0}); चल रहे कार्यों के पूरा होने की प्रतीक्षा करें।"
"Run is already in a terminal state.": "रन पहले से ही अंतिम स्थिति में है।"
"The node has no MAC address and cannot be woken.": "नोड के पास MAC पता नहीं है और उसे जगाया नहीं जा सकता।"
"No online node in the same LAN; unable to wake the node.": "एक ही LAN में कोई ऑनलाइन नोड नहीं; नोड को जगाया नहीं जा सकता।"
"Wake-on-LAN command sent to {0} node(s).": "{0} नोड्स को Wake-on-LAN कमांड भेजा गया।"
