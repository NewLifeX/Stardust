"Node [{0}] does not exist.": "Knoten [{0}] existiert nicht."
"Too many requests; please try again later.": "Zu viele Anforderungen; bitte versuchen Sie es später erneut."
"Build completed, run={0}": "Build abgeschlossen, run={0}"
"Using version {0} (Id={1})": "Version {0} wird verwendet (Id={1})"
"No deployable version was found.": "Es wurde keine bereitstellbare Version gefunden."
"The pipeline configuration does not exist.": "Die Pipelinekonfiguration existiert nicht."
"Auto deploy is disabled; the pipeline ends.": "Die automatische Bereitstellung ist deaktiviert; die Pipeline endet."
"The build succeeded but produced no deployable version (upload may be disabled); auto deploy is not possible.": "Der Build war erfolgreich, hat aber keine bereitstellbare Version erzeugt (Upload möglicherweise deaktiviert); eine automatische Bereitstellung ist nicht möglich."
"Starting auto deploy, run={0}, version={1}": "Automatische Bereitstellung wird gestartet, run={0}, Version={1}"
"Failed to dispatch the deploy command.": "Der Bereitstellungsbefehl konnte nicht gesendet werden."
"No deployable node was found; check the pipeline deploy node configuration.": "Es wurde kein bereitstellbarer Knoten gefunden; prüfen Sie die Konfiguration der Pipeline-Bereitstellungsknoten."
"Auto deploy was not triggered: no deploy node is selected for the pipeline.": "Die automatische Bereitstellung wurde nicht ausgelöst: Für die Pipeline ist kein Bereitstellungsknoten ausgewählt."
"Deploy command dispatched to node {0} (CommandId={1}).": "Bereitstellungsbefehl an Knoten {0} gesendet (CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "Bereitstellungsbefehl an Knoten {0} konnte nicht gesendet werden: {1}"
"Application authentication": "Anwendungsauthentifizierung"
"Node authentication": "Knotenauthentifizierung"
"Timed out offline": "Wegen Zeitüberschreitung offline"
"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "Eine Anwendung mit leerem Geheimnis kann sich nicht anmelden. Legen Sie im Registrierungszentrum ein Secret für diese Anwendung fest oder aktivieren Sie die Neuregistrierung."
"Secret validation failed.": "Geheimnisvalidierung fehlgeschlagen."
"[{0}] re-registered in [{1}] mode; secret issued": "[{0}] hat sich im Modus [{1}] neu registriert; Geheimnis ausgestellt"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "[{0}] hat sich im Modus [{1}] neu registriert; Geheimnis ausgestellt, UUID={2}"
"[{0}] registered successfully.": "[{0}] erfolgreich registriert."
"[{0}] registration failed: {1}": "[{0}] Registrierung fehlgeschlagen: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] authentifiziert {2}"
"Registered service [{0}] {1}": "Dienst [{0}] registriert {1}"
"Service [{0}] went offline: {1}": "Dienst [{0}] ist offline gegangen: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "[{0}] Geheimnis stimmt nicht überein; durch Modus [{1}] zugelassen"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] Der Client führt nun das korrekte Geheimnis; das Konvergenzfenster wird automatisch geschlossen"
"Hardware information changed too much.": "Die Hardwareinformationen haben sich zu stark geändert."
"Unique identifier mismatch (new != old): {0} != {1}": "Eindeutige Kennung stimmt nicht überein (neu != alt): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "Maschinenkennung stimmt nicht überein (neu != alt): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "Computerseriennummer stimmt nicht überein (neu != alt): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "Hauptplatine stimmt nicht überein (neu != alt): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "Produktcode stimmt nicht überein (neu != alt): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Maschinenname stimmt nicht überein (neu != alt): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "MAC-Adresse stimmt nicht überein (neu != alt): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Festplattenseriennummer stimmt nicht überein (neu != alt): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Version={0} Größe={1:n0} Knoten={2}"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] angemeldet um {2}, zuletzt aktiv um {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Knoten [{0}/{1}] ist dem vorhandenen Knoten [{2}] sehr ähnlich; der vorhandene Knoten wird verwendet"
"Stardust service platform": "Stardust-Dienstplattform"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Backend-Kern der verteilten Stardust-Plattform. Bietet APIs für Knoten, Anwendungen, Konfiguration, Registry, Monitoring und Alarme, Releases, Gateway und MCP sowie Metrik-Aggregation, Statistiken und geplante Aufgaben."
"Service port. Default 6600.": "Dienstport. Standard 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Token-Geheimnis. Algorithmus und Schlüssel zur Erzeugung von JWT-Token, z. B. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Gültigkeitsdauer des Tokens. Standard 2*3600 Sekunden."
"Session timeout. Default 600 seconds": "Sitzungszeitlimit. Standard 600 Sekunden"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Salz-Abweichungszeit. Clients verwenden beim Anmelden die aktuelle Zeit als Salt; eine zu große Zeitdifferenz zum Server führt zum Fehlschlagen der Schlüsselprüfung; Standard 600 Sekunden"
"Auto-register. Allow node clients to register automatically, default true": "Automatische Registrierung. Knotenclients dürfen sich automatisch registrieren, Standard true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatische Anwendungsregistrierung. Erlaubt App-Clients die automatische Registrierung; Standard true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Zulassungs-Whitelist. Wenn angegeben, dürfen sich nur Knoten registrieren, die den IP-Bedingungen entsprechen; mehrere durch Kommas trennen; unterstützt *-Platzhalter"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formel für den Knotencode. Legt fest, welche Hardwareinformationen aus NodeInfo zur Berechnung des Knotencodes verwendet werden. Unterstützt Crc/Crc16/MD5/MD5_16, Standard Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Schwellenwert für die Knotencode-Erkennung. UUID+Guid+SerialNumber+DiskId+MAC; stimmen mehrere davon überein, gilt der Knoten als derselbe, Standard 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Statistikintervall für Überwachungsdatenstrom. Standard 5 Sekunden. Verarbeitet die In-Memory-Warteschlange zur Berechnung von Statistiken auf Minutenebene; kleinere Werte verbessern die Echtzeit, erhöhen aber die CPU-Last, größere Werte senken die CPU-Last, erhöhen aber die Alarmverzögerung"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Batch-Statistikintervall der Überwachung. Standard 30 Sekunden. Korrigiert Daten durch Aggregation aus der Datenbank; kleinere Werte beschleunigen die Korrektur, erhöhen aber die IO-Last, größere Werte senken die Last, verzögern aber die Korrektur"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Intervall für Überwachungs-Persistierung. Standard 300 Sekunden. Batch-Commit-Intervall der Statistik-Verzögerungswarteschlange; Alarme lesen Echtzeitwerte aus dem Speicher und sind nicht betroffen. Größere Werte reduzieren den UPDATE-Druck auf die Datenbank erheblich"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Prüfintervall der Überwachung. Standard 600 Sekunden. Berechnet Stunden-/Tagesstatistiken für nicht stark genutzte Anwendungen periodisch neu, anstatt sie in jedem Batch-Zyklus vollständig neu zu berechnen, und reduziert so die Write Amplification"
"Monitoring alert period. Default 30 seconds": "Überwachungsalarmintervall. Standard 30 Sekunden"
"Console address. Used for monitoring alert addresses": "Konsolenadresse. Wird für Überwachungsalarm-Adressen verwendet"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Datenaufbewahrungszeit. Stichprobendetails und Statistiken auf Minutenebene; Standard 3 Tage."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Aufbewahrungszeit für Daten mittlerer Granularität. Leistungsdaten und Stundenstatistiken, Standard 30 Tage"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Aufbewahrungsdauer für grobgranulare Daten. Historische Daten und Tagesstatistiken, Standard 300 Tage."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Datenbereinigungsmodus. Unterstützt effizientes Truncate oder Delete ohne DDL. Standard Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Upload-Verzeichnis. Speichert Upgradepakete und muss dasselbe für StarWeb konfigurierte Verzeichnis sein. Standard ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maximale Größe des Upload-Pakets. Gilt nur für die maximal zulässigen Bytes des Anforderungstexts des Endpunkts Deploy/UploadBuildFile; Standard 100000000 (100MB), 0 bedeutet Standardlimit von Kestrel verwenden, max. 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Dateicache-Verzeichnis. Speichert Cache-Dateien wie Datenbanktreiber; bei leerem Wert deaktiviert; Standard ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Whitelist für Dateicache. Wenn angegeben, dürfen nur passende IP-Quellen auf den Dateicache zugreifen; mehrere Einträge durch Kommas trennen; unterstützt * Platzhalter"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Dateispeicher-Dienst. Ob auf Dateidownload-Anfragen anderer Knoten geantwortet wird. Standard true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Dateispeicher-Abruf. Ob neue, von anderen Knoten veröffentlichte Dateien aktiv abgerufen werden. Standard false."
"Upstream server. Reports data synchronously to the upstream server.": "Übergeordneter Server. Meldet Daten synchron an den übergeordneten Server."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Feste Stadt. Standardmäßig wird die Stadt automatisch anhand der IP ermittelt. Wenn aktiviert, entfällt die automatische Ermittlung und die Stadt wird manuell festgelegt"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Anonymen Trace-Zugriff zulassen. Nicht angemeldeten Benutzern den Zugriff auf die /trace-Trace-Seite erlauben; Überwachungsdaten können sensible Informationen enthalten. Standard false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet-Synchronisierungsintervall. .NET Runtime-Installerinformationen von der offiziellen Website abrufen, 0 deaktiviert, Einheit Sekunden, Standard 43200 (12 Stunden)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet-Synchronisierungsadresse. Offizielle API-Adresse zum Abrufen der .NET-Runtimeversionen, unterstützt den Platzhalter {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Basisadresse für Stardust-Ressourcendownloads. Basis-URL für StarAgent-Installationspakete/-Skripte; Standard ist die offizielle Adresse"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Zulassen bei leeren steuerbaren Knoten. Ob Vorgänge erlaubt sind, wenn AllowControlNodes leer ist, Standard false (Sicherheitsmodus, steuerbare Knoten müssen explizit konfiguriert werden). In internen Umgebungen kann true gesetzt werden, um alte Daten zu unterstützen"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP-Dienst aktivieren. Standardmäßig deaktiviert; nach Aktivierung wird der Endpunkt POST /mcp für LLM-/Agent-Aufrufe bereitgestellt."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP-Aktionssatz. Kommagetrennte Modulnamen (node/app/config/deploy/gateway/monitor/system), * aktiviert alle"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Pfadpräfixe für Ratenbegrenzung. Durch Kommas getrennt; passende Pfade werden pro IP begrenzt; Standard sind Authentifizierungsendpunkte wie login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Ratenbegrenzung. Anzahl zulässiger Anforderungen pro IP und Minute; Standard 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Anonyme Telemetrie-Berichterstattung zulassen. Erforderlich für mehrstufige Kaskadierung oder minimales SDK; Standard false (sicher)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Erlaubte CORS-Ursprünge. Kommagetrennt; leer erlaubt jeden Ursprung; wenn angegeben, dürfen nur freigegebene Ursprünge Cross-Origin-Zugriffe ausführen"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Authentifizierung von Anhang-Downloads. Ob das Download-Token für Anhänge bei /cube/file geprüft wird. Standard false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Öffentliche Anhangskategorien ohne Anmeldung. Durch Kommas getrennt, Treffer können anonym heruntergeladen werden."
"Attachment download token validity. Seconds, default 600.": "Gültigkeit des Anhang-Download-Tokens. Sekunden, Standard 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService synchronisiert {0}"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService konnte {0} nicht synchronisieren: {1}"
"DotNetSyncService.Error {0}": "DotNetSyncService-Fehler: {0}"
