"Stardust service platform": "Plataforma de servicios Stardust"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Núcleo del backend de la plataforma de servicios distribuidos Stardust. Proporciona API para nodos, aplicaciones, configuración, registro, monitorización y alertas, despliegues, pasarela y MCP, con agregación de métricas, estadísticas y tareas programadas."
"Service port. Default 6600.": "Puerto de servicio. Predeterminado 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Secreto del token. Algoritmo y secreto usados para generar tokens JWT, p. ej. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Período de validez del token. Predeterminado 2*3600 segundos."
"Session timeout. Default 600 seconds": "Tiempo de espera de la sesión. Predeterminado 600 segundos"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Tiempo de desviación de salt. Los clientes usan la hora actual como salt al iniciar sesión; una diferencia horaria demasiado grande con el servidor provoca un fallo en la verificación de la clave; predeterminado 600 segundos"
"Auto-register. Allow node clients to register automatically, default true": "Registro automático. Permite que los clientes de nodo se registren automáticamente, predeterminado true"
"Application auto-registration. Allow app clients to register automatically; default true": "Registro automático de aplicaciones. Permite que los clientes de aplicaciones se registren automáticamente; predeterminado true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Lista blanca de admisión. Si se especifica, solo los nodos que cumplan las condiciones de IP podrán registrarse; separe varias entradas con comas; admite coincidencia comodín *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Fórmula del código de nodo. Selecciona qué información de hardware de NodeInfo se usa para calcular el código de nodo. Admite Crc/Crc16/MD5/MD5_16, predeterminado Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Umbral de identificación del código de nodo. UUID+Guid+SerialNumber+DiskId+MAC; si coinciden varios de ellos, se considera el mismo nodo, predeterminado 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Período de estadísticas de flujo de supervisión. Predeterminado 5 segundos. Procesa la cola en memoria para calcular estadísticas por minuto; los valores más pequeños mejoran la inmediatez pero aumentan el uso de CPU, los valores más grandes reducen el uso de CPU pero aumentan la latencia de las alertas"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Período de estadísticas por lotes de supervisión. Predeterminado 30 segundos. Corrige los datos agregando desde la base de datos; los valores más pequeños aceleran la corrección pero aumentan la presión de IO, los valores más grandes reducen la presión pero retrasan la corrección"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Período de persistencia de supervisión. Predeterminado 300 segundos. Período de envío por lotes de la cola de estadísticas diferidas; las alertas leen valores en tiempo real desde memoria y no se ven afectadas. Los valores más grandes reducen considerablemente la presión de UPDATE en la base de datos"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Período de inspección de supervisión. Predeterminado 600 segundos. Recalcula las estadísticas horarias/diarias de las aplicaciones no populares de forma periódica en lugar de un recálculo completo en cada ciclo por lotes, lo que reduce la amplificación de escritura"
"Monitoring alert period. Default 30 seconds": "Período de alerta de supervisión. Predeterminado 30 segundos"
"Console address. Used for monitoring alert addresses": "Dirección de la consola. Se usa para las direcciones de alertas de supervisión"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Período de retención de datos. Detalles de muestras y estadísticas por minuto; predeterminado 3 días."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Tiempo de retención de datos de granularidad media. Datos de rendimiento y estadísticas por hora, predeterminado 30 días"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Periodo de retención de datos de grano grueso. Datos históricos y estadísticas diarias, predeterminado 300 días."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Modo de limpieza de datos. Admite Truncate eficiente o Delete sin DDL. Predeterminado Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Directorio de carga. Almacena paquetes de actualización y debe ser el mismo directorio configurado para StarWeb. Predeterminado ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Tamaño máximo del paquete de carga. Solo se aplica al máximo de bytes del cuerpo de la solicitud permitido por el punto de conexión Deploy/UploadBuildFile; predeterminado 100000000 (100MB), 0 significa usar el límite predeterminado de Kestrel, máximo 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Directorio de caché de archivos. Almacena archivos de caché como controladores de base de datos; se desactiva si está vacío; predeterminado ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Lista blanca de caché de archivos. Si se especifica, solo las fuentes IP coincidentes pueden acceder a la caché de archivos; separe varias entradas con comas; admite comodines *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Servicio de almacenamiento de archivos. Si se responden las solicitudes de descarga de archivos de otros nodos. Predeterminado true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Extracción del almacenamiento de archivos. Si se extraen activamente los nuevos archivos publicados por otros nodos. Predeterminado false."
"Upstream server. Reports data synchronously to the upstream server.": "Servidor superior. Informa los datos de forma sincronizada al servidor superior."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Ciudad fija. De forma predeterminada, la ciudad se calcula automáticamente a partir de la IP. Al activarlo, se deja de calcular automáticamente y se establece manualmente"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Permitir acceso anónimo al rastreo. Permite que usuarios no autenticados accedan a la página de rastreo /trace; los datos de supervisión pueden contener información confidencial. Predeterminado false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Intervalo de sincronización de dotNet. Obtiene información del instalador de .NET runtime del sitio oficial, 0 desactiva, unidad segundos, predeterminado 43200 (12 horas)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Dirección de sincronización de dotNet. Dirección oficial de la API para obtener versiones de .NET runtime, admite el marcador {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Dirección base de descarga de recursos de Stardust. URL base para instaladores/scripts de StarAgent; por defecto, la dirección oficial"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Permitir cuando los nodos controlables estén vacíos. Indica si se permiten operaciones cuando AllowControlNodes está vacío, predeterminado false (modo seguro, los nodos controlables deben configurarse explícitamente). En entornos internos se puede establecer en true para mantener compatibilidad con datos antiguos"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Habilitar el servicio MCP. Deshabilitado de forma predeterminada; al habilitarlo, expone el punto de conexión POST /mcp para llamadas de LLM/agente."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Conjunto de acciones MCP. Nombres de módulos separados por comas (node/app/config/deploy/gateway/monitor/system), * activa todos"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Prefijos de ruta del límite de velocidad. Separados por comas; las rutas coincidentes se limitan por IP; por defecto, endpoints de autenticación como login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Límite de velocidad. Número de solicitudes permitidas por IP por minuto; predeterminado 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Permitir informes de telemetría anónimos. Necesario para la cascada multinivel o un SDK mínimo; predeterminado false (seguro)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Orígenes permitidos de CORS. Separados por comas; vacío permite cualquier origen; si se especifica, solo los orígenes en la lista podrán hacer cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Autenticación de descarga de adjuntos. Indica si se verifica el token de descarga de adjuntos para /cube/file. Predeterminado false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Categorías de adjuntos públicos sin inicio de sesión. Separadas por comas; los elementos coincidentes se pueden descargar de forma anónima."
"Attachment download token validity. Seconds, default 600.": "Validez del token de descarga de adjuntos. Segundos, predeterminado 600."
