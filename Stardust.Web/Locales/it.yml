"Deploy command dispatched to node {0} (CommandId={1}).": "Comando di distribuzione inviato al nodo {0} (CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "Impossibile inviare il comando di distribuzione al nodo {0}: {1}"
"Application authentication": "Autenticazione applicazione"
"Node authentication": "Autenticazione nodo"
"Timed out offline": "Offline per timeout"
"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "Un'applicazione con un segreto vuoto non può accedere. Impostare un segreto per questa applicazione nel registro o abilitare la nuova registrazione."
"Secret validation failed.": "Convalida del segreto non riuscita."
"[{0}] re-registered in [{1}] mode; secret issued": "[{0}] registrato di nuovo in modalità [{1}]; segreto emesso"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "[{0}] registrato di nuovo in modalità [{1}]; segreto emesso, UUID={2}"
"[{0}] registered successfully.": "[{0}] registrato correttamente."
"[{0}] registration failed: {1}": "[{0}] registrazione non riuscita: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] autenticato {2}"
"Registered service [{0}] {1}": "Servizio registrato [{0}] {1}"
"Service [{0}] went offline: {1}": "Il servizio [{0}] è andato offline: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "[{0}] segreto non corrispondente; consentito dalla modalità [{1}]"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] il client ora presenta il segreto corretto; la finestra di convergenza viene chiusa automaticamente"
"Hardware information changed too much.": "Le informazioni hardware sono cambiate troppo."
"Unique identifier mismatch (new != old): {0} != {1}": "Identificatore univoco non corrispondente (nuovo != vecchio): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "Identificatore macchina non corrispondente (nuovo != vecchio): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "Numero di serie del computer non corrispondente (nuovo != vecchio): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "Scheda madre non corrispondente (nuovo != vecchio): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "Codice prodotto non corrispondente (nuovo != vecchio): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Nome macchina non corrispondente (nuovo != vecchio): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "Indirizzo MAC non corrispondente (nuovo != vecchio): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Numero di serie del disco non corrispondente (nuovo != vecchio): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Versione={0} Dimensione={1:n0} Nodo={2}"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] ha effettuato l'accesso alle {2}, ultima attività alle {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Il nodo [{0}/{1}] è molto simile al nodo esistente [{2}]; viene usato il nodo esistente"
"Stardust service platform": "Piattaforma di servizi Stardust"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Core backend della piattaforma di servizi distribuiti Stardust. Fornisce API per nodi, applicazioni, configurazione, registro, monitoraggio e avvisi, rilasci, gateway e MCP, con aggregazione delle metriche, statistiche e attività pianificate."
"Service port. Default 6600.": "Porta del servizio. Predefinito 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Segreto del token. Algoritmo e segreto usati per generare i token JWT, ad es. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Periodo di validità del token. Predefinito 2*3600 secondi."
"Session timeout. Default 600 seconds": "Timeout della sessione. Predefinito 600 secondi"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Tempo di tolleranza del salt. I client usano l'ora corrente come salt al momento dell'accesso; una differenza troppo grande con l'ora del server causa la mancata verifica della chiave; predefinito 600 secondi"
"Auto-register. Allow node clients to register automatically, default true": "Registrazione automatica. Consenti ai client dei nodi di registrarsi automaticamente, predefinito true"
"Application auto-registration. Allow app clients to register automatically; default true": "Registrazione automatica delle applicazioni. Consenti ai client delle applicazioni di registrarsi automaticamente; predefinito true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Whitelist di ammissione. Se specificata, solo i nodi che soddisfano le condizioni IP possono registrarsi; separare più voci con virgole; supporta la corrispondenza con carattere jolly *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formula del codice nodo. Seleziona quali informazioni hardware in NodeInfo vengono usate per calcolare il codice nodo. Supporta Crc/Crc16/MD5/MD5_16, predefinito Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Soglia di identificazione del codice nodo. UUID+Guid+SerialNumber+DiskId+MAC; se diversi di essi coincidono, il nodo è considerato lo stesso, predefinito 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Periodo delle statistiche del flusso di monitoraggio. Predefinito 5 secondi. Elabora la coda in memoria per calcolare statistiche al minuto; valori più piccoli migliorano la tempestività ma aumentano l'uso della CPU, valori più grandi riducono l'uso della CPU ma aumentano la latenza degli avvisi"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Periodo delle statistiche batch di monitoraggio. Predefinito 30 secondi. Corregge i dati aggregando dal database; valori più piccoli velocizzano la correzione ma aumentano la pressione IO, valori più grandi riducono la pressione ma ritardano la correzione"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Periodo di persistenza del monitoraggio. Predefinito 300 secondi. Periodo di invio in batch della coda delle statistiche ritardate; gli avvisi leggono i valori in tempo reale dalla memoria e non sono influenzati. Valori più grandi riducono notevolmente la pressione di UPDATE sul database"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Periodo di ispezione del monitoraggio. Predefinito 600 secondi. Ricalcola periodicamente le statistiche orarie/giornaliere delle applicazioni non popolari invece di un ricalcolo completo in ogni ciclo batch, riducendo l'amplificazione in scrittura"
"Monitoring alert period. Default 30 seconds": "Periodo di avviso di monitoraggio. Predefinito 30 secondi"
"Console address. Used for monitoring alert addresses": "Indirizzo della console. Usato per gli indirizzi degli avvisi di monitoraggio"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Periodo di conservazione dei dati. Dettagli dei campioni e statistiche a livello di minuto; predefinito 3 giorni."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Tempo di conservazione dei dati a granularità media. Dati sulle prestazioni e statistiche orarie, predefinito 30 giorni"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Periodo di conservazione dei dati a grana grossa. Dati storici e statistiche giornaliere, predefinito 300 giorni."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Modalità di pulizia dei dati. Supporta Truncate efficiente o Delete senza DDL. Predefinito Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Directory di caricamento. Archivia i pacchetti di aggiornamento e deve essere la stessa directory configurata per StarWeb. Predefinito ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Dimensione massima del pacchetto di caricamento. Si applica solo al numero massimo di byte del corpo della richiesta consentito dall'endpoint Deploy/UploadBuildFile; predefinito 100000000 (100MB), 0 significa usare il limite predefinito di Kestrel, massimo 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Directory della cache dei file. Archivia file di cache come driver di database; disabilitata se vuota; predefinito ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Whitelist della cache dei file. Se specificata, solo le origini IP corrispondenti possono accedere alla cache dei file; separare più voci con virgole; supporta caratteri jolly *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Servizio di archiviazione file. Se rispondere alle richieste di download dei file dagli altri nodi. Predefinito true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Download dell'archivio file. Se scaricare attivamente i nuovi file pubblicati dagli altri nodi. Predefinito false."
"Upstream server. Reports data synchronously to the upstream server.": "Server superiore. Segnala i dati in modo sincrono al server superiore."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Città fissa. Per impostazione predefinita la città viene calcolata automaticamente dall'IP. Se attivato, il calcolo automatico viene disattivato e la città viene impostata manualmente"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Consenti accesso anonimo al tracciamento. Consente agli utenti non autenticati di accedere alla pagina di tracciamento /trace; i dati di monitoraggio possono contenere informazioni sensibili. Predefinito false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Intervallo di sincronizzazione dotNet. Recupera le informazioni sul programma di installazione di .NET runtime dal sito ufficiale, 0 disabilita, unità secondi, predefinito 43200 (12 ore)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Indirizzo di sincronizzazione dotNet. Indirizzo API ufficiale per recuperare le versioni di .NET runtime, supporta il segnaposto {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Indirizzo di base per il download delle risorse Stardust. URL di base per installer/script StarAgent; predefinito l'indirizzo ufficiale"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Consenti quando i nodi controllabili sono vuoti. Indica se le operazioni sono consentite quando AllowControlNodes è vuoto, predefinito false (modalità sicura, i nodi controllabili devono essere configurati esplicitamente). Gli ambienti interni possono impostarlo su true per la compatibilità con i dati esistenti"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Abilita il servizio MCP. Disattivato per impostazione predefinita; se abilitato espone l'endpoint POST /mcp alle chiamate LLM/agente."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Set di azioni MCP. Nomi di modulo separati da virgole (node/app/config/deploy/gateway/monitor/system), * abilita tutto"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Prefissi di percorso per la limitazione di frequenza. Separati da virgole; i percorsi corrispondenti sono limitati per IP; predefiniti gli endpoint di autenticazione come login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Limite di frequenza. Numero di richieste consentite per IP al minuto; predefinito 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Consenti segnalazione anonima di telemetria. Necessario per la cascata multilivello o SDK minimale; predefinito false (sicuro)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Origini CORS consentite. Separate da virgole; vuoto consente qualsiasi origine; se specificato, solo le origini in whitelist possono effettuare cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Autenticazione del download degli allegati. Indica se verificare il token di download degli allegati per /cube/file. Predefinito false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Categorie di allegati pubblici senza accesso. Separate da virgole; gli elementi corrispondenti possono essere scaricati in modo anonimo."
"Attachment download token validity. Seconds, default 600.": "Validità del token di download degli allegati. Secondi, predefinito 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService sta sincronizzando {0}"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService non è riuscito a sincronizzare {0}: {1}"
"DotNetSyncService.Error {0}": "Errore di DotNetSyncService: {0}"
