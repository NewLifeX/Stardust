"No deployable node was found; check the pipeline deploy node configuration.": "Dağıtılabilir düğüm bulunamadı; işlem hattı dağıtım düğümü yapılandırmasını kontrol edin."
"Auto deploy was not triggered: no deploy node is selected for the pipeline.": "Otomatik dağıtım tetiklenmedi: işlem hattı için dağıtım düğümü seçilmemiş."
"Deploy command dispatched to node {0} (CommandId={1}).": "Dağıtım komutu {0} düğümüne gönderildi (CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "Dağıtım komutu {0} düğümüne gönderilemedi: {1}"
