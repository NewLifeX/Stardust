"The build succeeded but produced no deployable version (upload may be disabled); auto deploy is not possible.": "Derleme başarılı oldu ancak dağıtılabilir sürüm üretmedi (yükleme devre dışı olabilir); otomatik dağıtım yapılamıyor."
"Starting auto deploy, run={0}, version={1}": "Otomatik dağıtım başlatılıyor, run={0}, sürüm={1}"
