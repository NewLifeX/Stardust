"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "Sovellus, jonka salaisuus on tyhjä, ei voi kirjautua sisään. Aseta tälle sovellukselle salaisuus rekisterissä tai ota uudelleenrekisteröinti käyttöön."
