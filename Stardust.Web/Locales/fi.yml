"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] asiakkaalla on nyt oikea salaisuus; konvergenssi-ikkuna suljetaan automaattisesti"
"Hardware information changed too much.": "Laitteistotiedot muuttuivat liikaa."
