"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] kirjautui sisään {2}, viimeksi aktiivinen {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Solmu [{0}/{1}] muistuttaa hyvin paljon olemassa olevaa solmua [{2}]; käytetään olemassa olevaa solmua"
"Stardust service platform": "Stardust-palvelualusta"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Stardust-hajautetun palvelualustan taustaydin. Tarjoaa rajapinnat solmuille, sovelluksille, kokoonpanolle, rekisterille, valvonnalle ja hälytyksille, julkaisuille, yhdyskäytävälle ja MCP:lle sekä mittareiden koostamisen, tilastot ja ajoitetut tehtävät."
"Service port. Default 6600.": "Palveluportti. Oletus 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Tokenin salaisuus. Algoritmi ja salaisuus JWT-tokenien luontiin, esim. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Tokenin voimassaoloaika. Oletus 2*3600 sekuntia."
"Session timeout. Default 600 seconds": "Istunnon aikakatkaisu. Oletus 600 sekuntia"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Salt-poikkeaman aika. Asiakkaat käyttävät nykyistä aikaa salt-arvona kirjautuessaan; liian suuri aikaväli palvelimeen aiheuttaa avainten vahvistuksen epäonnistumisen; oletus 600 sekuntia"
"Auto-register. Allow node clients to register automatically, default true": "Automaattinen rekisteröinti. Salli solmujen asiakasohjelmien rekisteröityä automaattisesti, oletus true"
"Application auto-registration. Allow app clients to register automatically; default true": "Sovellusten automaattinen rekisteröinti. Salli sovellusasiakkaiden rekisteröityä automaattisesti; oletus true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Pääsyn sallittujen lista. Jos määritetty, vain IP-ehdot täyttävät solmut voivat rekisteröityä, erota useat pilkulla, tukee *-jokerimerkkisovitusta"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Solmun koodin kaava. Valitsee, mitä NodeInfon laitteistotietoja käytetään solmun koodin laskentaan. Tukee: Crc/Crc16/MD5/MD5_16, oletus Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Solmun koodin tunnistuskynnys. UUID+Guid+SerialNumber+DiskId+MAC; jos useampi niistä täsmää, solmun katsotaan olevan sama, oletus 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Valvontavirran tilastojakso. Oletus 5 sekuntia. Käsittelee muistijonon minuuttitason tilastojen laskentaa varten; pienemmät arvot parantavat reaaliaikaisuutta mutta lisäävät CPU:n käyttöä, suuremmat arvot vähentävät CPU:n käyttöä mutta lisäävät hälytyksen viivettä"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Valvonnan erätilastojakso. Oletus 30 sekuntia. Korjaa tietoja kokoamalla tietokannasta; pienemmät arvot nopeuttavat korjausta mutta lisäävät IO-kuormitusta, suuremmat arvot vähentävät kuormitusta mutta viivästyttävät korjausta"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Valvonnan tallennusjakso. Oletus 300 sekuntia. Tilastojen viivejonon eräkohtainen lähetysjakso; hälytykset lukevat reaaliaikaisia arvoja muistista eikä niihin vaikuta. Suuremmat arvot vähentävät merkittävästi tietokannan UPDATE-kuormitusta"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Valvonnan tarkistusjakso. Oletus 600 sekuntia. Laskee uudelleen tunti-/päivätilastot vähän käytetyille sovelluksille jaksoittain sen sijaan, että ne laskettaisiin kokonaan uudelleen joka eräjaksossa, mikä vähentää kirjoituksen vahvistumista"
"Monitoring alert period. Default 30 seconds": "Valvontahälytyksen jakso. Oletus 30 sekuntia"
"Console address. Used for monitoring alert addresses": "Konsolin osoite. Käytetään valvontahälytysten osoitteisiin"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Tietojen säilytysaika. Näytteiden tiedot ja minuuttitason tilastot; oletus 3 päivää."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Keskitarkkuuksien tietojen säilytysaika. Suorituskykytiedot ja tuntitilastot, oletus 30 päivää"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Karkeiden tietojen säilytysaika. Historialliset tiedot ja päivittäiset tilastot, oletus 300 päivää."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Tietojen siivoustila. Tukee tehokasta Truncate-toimintoa tai Delete-toimintoa ilman DDL:ää. Oletus Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Lataushakemisto. Tallentaa päivityspaketit ja sen on oltava sama hakemisto, joka on määritetty StarWebille. Oletus ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Latauspaketin enimmäiskoko. Koskee vain Deploy/UploadBuildFile-päätepisteen sallittua pyynnön rungon enimmäistavumäärää; oletus 100000000 (100MB), 0 tarkoittaa Kestrelin oletusrajaa, enintään 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Tiedostovälimuistin hakemisto. Tallentaa välimuistitiedostoja, kuten tietokanta-ajurit; pois käytöstä, jos tyhjä; oletus ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Tiedostovälimuistin sallittujen luettelo. Jos määritetty, vain täsmäävät IP-lähteet voivat käyttää tiedostovälimuistia; erota useat merkinnät pilkuilla; tukee * jokerimerkkejä"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Tiedostovarastopalvelu. Vastataanko muiden solmujen tiedostolatauspyyntöihin. Oletus true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Tiedostovaraston haku. Haetaanko muiden solmujen julkaisemat uudet tiedostot aktiivisesti. Oletus false."
"Upstream server. Reports data synchronously to the upstream server.": "Ylätason palvelin. Raportoi tiedot synkronisesti ylätason palvelimelle."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Kiinteä kaupunki. Oletuksena kaupunki lasketaan automaattisesti IP-osoitteesta. Kun asetus on käytössä, automaattinen laskenta poistuu käytöstä ja kaupunki asetetaan manuaalisesti"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Salli nimetön jäljityskäyttö. Salli kirjautumattomien käyttäjien käyttää /trace-jäljityssivua; valvontatiedot voivat sisältää arkaluontoisia tietoja. Oletus false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet-synkronointiväli. Hae .NET-ajoympäristön asennustiedot viralliselta sivustolta, 0 poistaa käytöstä, yksikkö sekuntia, oletus 43200 (12 tuntia)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet-synkronointiosoite. Virallinen API-osoite .NET-ajoympäristön versioiden hakemiseen, tukee {major}-paikkamerkkiä"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Stardust-resurssien latauksen perusosoite. StarAgentin asennusohjelmien/skriptien perus-URL; oletuksena virallinen osoite"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Salli, kun ohjattavat solmut ovat tyhjiä. Sallitaanko toiminnot, kun AllowControlNodes on tyhjä, oletus false (suojattu tila, ohjattavat solmut on määritettävä erikseen). Sisäisissä ympäristöissä arvoksi voi asettaa true vanhojen tietojen yhteensopivuuden vuoksi"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Ota MCP-palvelu käyttöön. Oletuksena pois päältä; käyttöönotettuna paljastaa POST /mcp -päätepisteen LLM-/agenttikutsuja varten."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP-toimintojoukko. Pilkulla erotetut moduulien nimet (node/app/config/deploy/gateway/monitor/system), * tarkoittaa kaikkien käyttöönottoa"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Nopeusrajoituksen polkuliitteet. Pilkuilla erotetut; täsmääviä polkuja rajoitetaan IP-kohtaisesti; oletuksena todennuspalvelut, kuten login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Nopeusrajoituksen määrä. Sallittujen pyyntöjen määrä IP-osoitetta ja minuuttia kohden; oletus 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Salli anonyymi telemetriaraportointi. Tarvitaan monitasoiseen kaskadointiin tai minimaaliseen SDK:hon; oletus false (turvallinen)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Sallitut CORS-alkuperät. Pilkulla erotetut; tyhjä sallii minkä tahansa alkuperän; kun määritetty, vain sallitut alkuperät voivat tehdä cross-origin-pyyntöjä"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Liitteiden latauksen todentaminen. Tarkistetaanko liitteen lataustunnus polulle /cube/file. Oletus false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Julkiset liiteliitteiden luokat ilman kirjautumista. Pilkuilla erotettu, osumat voi ladata nimettömästi."
"Attachment download token validity. Seconds, default 600.": "Liitteen lataustunnuksen voimassaolo. Sekunteja, oletus 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService synkronoi kohteen {0}"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService ei voinut synkronoida kohdetta {0}: {1}"
"DotNetSyncService.Error {0}": "DotNetSyncService-virhe: {0}"
"Default language. Pushed to clients on login and heartbeat, e.g. zh-Hans or en; application channel skips Desktop/Mobile/Frontend kinds; empty uses the core configuration DefaultLanguage.": "Oletuskieli. Lähetetään asiakkaille kirjautumisen ja sydämenlyönnin yhteydessä, esim. zh-Hans tai en; tyhjä käyttää ydinmäärityksen DefaultLanguage-arvoa."
"Please select at least one item.": "Valitse vähintään yksi kohde."
"Command cannot be empty.": "Komento ei voi olla tyhjä."
