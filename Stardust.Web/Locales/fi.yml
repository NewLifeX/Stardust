"Product code mismatch (new != old): {0} != {1}": "Tuotekoodi ei täsmää (uusi != vanha): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Laitteen nimi ei täsmää (uusi != vanha): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "MAC-osoite ei täsmää (uusi != vanha): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Levyn sarjanumero ei täsmää (uusi != vanha): {0} != {1}"
