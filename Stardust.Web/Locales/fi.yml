"Dispatched {0}; awaiting node confirmation": "Lähetetty {0}; odotetaan solmun vahvistusta"
"Skipped {0} offline": "Ohitettiin {0} offline-tilassa"
"The specified version does not exist.": "Määritettyä versiota ei ole."
"No matched package for the selected nodes; skipped {0}": "Valituille solmuille ei löytynyt vastaavaa pakettia; ohitettiin {0}"
