"[{0}] is not allowed to operate node [{1}].\nFor security, applications cannot send control commands to arbitrary nodes by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all nodes.": "[{0}] لا يسمح له بتشغيل العقدة [{1}].\nلأسباب أمنية، لا يمكن للتطبيقات افتراضيًا إرسال أوامر تحكم إلى عقد عشوائية.\nفي السجل، حرّر العقد القابلة للتحكم الخاصة بـ [{0}]، أضف [{2}]، أو عيّنها إلى * لجميع العقد."
"[{0}] is not allowed to operate application [{1}].\nFor security, applications cannot send control commands to other applications by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all applications.": "[{0}] لا يسمح له بتشغيل التطبيق [{1}].\nلأسباب أمنية، لا يمكن للتطبيقات افتراضيًا إرسال أوامر تحكم إلى تطبيقات أخرى.\nفي السجل، حرّر العقد القابلة للتحكم الخاصة بـ [{0}]، أضف [{2}]، أو عيّنها إلى * لجميع التطبيقات."
"[{0}] attempted to reply to command [{1}] that belongs to node [{2}]": "حاول [{0}] الرد على الأمر [{1}] الذي ينتمي إلى العقدة [{2}]"
"Deployment succeeded: {0}": "نجح النشر: {0}"
"Deployment failed: {0}": "فشل النشر: {0}"
"Deployment completed: succeeded={0}, failed={1}": "اكتمل النشر: النجاح={0}، الفشل={1}"
"Service [{0}] is disabled.": "الخدمة [{0}] معطّلة."
"Compatible with the legacy XCoder (2020), installPath: {0}": "متوافق مع XCoder القديم (2020)، installPath: {0}"
"Node [{0}] is not a build/deploy node of deployment set [{1}]; uploading build artifacts is forbidden. Configure this node in the deployment set.": "العقدة [{0}] ليست عقدة بناء/نشر لمجموعة النشر [{1}]؛ رفع مخرجات البناء ممنوع. هيّئ هذه العقدة في مجموعة النشر."
"Resolved {0} target host(s)": "تم تحليل {0} مضيف هدف"
"Failed to parse CIDR: {0}, {1}": "فشل تحليل CIDR: {0}، {1}"
"Starting deployment to {0}": "جارٍ بدء النشر إلى {0}"
"Token subject [{0}] does not match the target application [{1}]; cross-application configuration access is forbidden.": "موضوع الرمز [{0}] لا يطابق التطبيق الهدف [{1}]؛ الوصول إلى تهيئة تطبيق آخر ممنوع."
"Token subject [{0}] does not match the reporting application [{1}].": "موضوع الرمز [{0}] لا يطابق التطبيق المُبلِّغ [{1}]."
"Command execution timed out ({0} ms).": "انتهت مهلة تنفيذ الأمر ({0} ms)."
"Generated script file: {0}": "تم إنشاء ملف البرنامج النصي: {0}"
"Received remote deployment request: Hosts={0}, User={1}, OS={2}, Server={3}": "تم استلام طلب نشر عن بُعد: Hosts={0}, User={1}, OS={2}, Server={3}"
"Unsupported grant_type={0}": "grant_type={0} غير مدعوم"
"Consuming service [{0}] {1}": "جارٍ استهلاك الخدمة [{0}] {1}"
"Application [{0}] is in read-only mode; modification is forbidden.": "التطبيق [{0}] في وضع القراءة فقط؛ التعديل ممنوع."
"Application [{0}] already exists; reusing the old identity for dynamic registration is forbidden. Check the secret or contact the administrator. To enable automatic instance onboarding, adjust the application's re-registration mode (convergence window/trusted access/open).": "التطبيق [{0}] موجود بالفعل؛ إعادة استخدام الهوية القديمة للتسجيل الديناميكي ممنوعة. تحقق من السر أو اتصل بالمسؤول. لتمكين انضمام النسخ تلقائيًا، عدّل وضع إعادة التسجيل للتطبيق (نافذة التقارب/الوصول الموثوق/المفتوح)."
"[{0}] attempted to access the service of [{1}] without permission": "حاول [{0}] الوصول إلى خدمة [{1}] دون إذن"
"Connection timed out.": "انتهت مهلة الاتصال."
"Connected.": "تم الاتصال."
"Connection failed: {0}": "فشل الاتصال: {0}"
"Deployment succeeded.": "نجح النشر."
"Deployment failed; check the output logs.": "فشل النشر؛ راجع سجلات الإخراج."
"Deployment node [{0}] does not exist.": "عقدة النشر [{0}] غير موجودة."
"Deployment node [{0}] is disabled.": "عقدة النشر [{0}] معطّلة."
"Deployment node [{0}] DeployId mismatch.": "عقدة النشر [{0}] DeployId غير مطابق."
"Node [{0}] does not exist.": "العقدة [{0}] غير موجودة."
"Too many requests; please try again later.": "طلبات كثيرة جدًا؛ يُرجى المحاولة لاحقًا."
"Build completed, run={0}": "اكتمل البناء، run={0}"
"Using version {0} (Id={1})": "استخدام الإصدار {0} (Id={1})"
"No deployable version was found.": "لم يتم العثور على إصدار قابل للنشر."
"The pipeline configuration does not exist.": "تهيئة خط الأنابيب غير موجودة."
"Auto deploy is disabled; the pipeline ends.": "النشر التلقائي معطّل؛ ينتهي خط الأنابيب."
"The build succeeded but produced no deployable version (upload may be disabled); auto deploy is not possible.": "نجح البناء لكنه لم يُنتج إصدارًا قابلًا للنشر (قد يكون الرفع معطّلًا)؛ النشر التلقائي غير ممكن."
"Starting auto deploy, run={0}, version={1}": "جارٍ بدء النشر التلقائي، run={0}، الإصدار={1}"
"Failed to dispatch the deploy command.": "فشل إرسال أمر النشر."
"No deployable node was found; check the pipeline deploy node configuration.": "لم يتم العثور على عقدة قابلة للنشر؛ تحقق من تهيئة عقدة النشر في خط الأنابيب."
"Auto deploy was not triggered: no deploy node is selected for the pipeline.": "لم يتم تفعيل النشر التلقائي: لم يتم تحديد عقدة نشر لخط الأنابيب."
"Deploy command dispatched to node {0} (CommandId={1}).": "تم إرسال أمر النشر إلى العقدة {0} (CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "فشل إرسال أمر النشر إلى العقدة {0}: {1}"
"Application authentication": "مصادقة التطبيق"
"Node authentication": "مصادقة العقدة"
"Timed out offline": "انتهت المهلة في وضع عدم الاتصال"
"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "لا يمكن لتطبيق له سر فارغ تسجيل الدخول. عيّن سرًا لهذا التطبيق في السجل أو فعّل إعادة التسجيل."
"Secret validation failed.": "فشل التحقق من السر."
"[{0}] re-registered in [{1}] mode; secret issued": "[{0}] أعاد التسجيل بوضع [{1}]؛ تم إصدار سر"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "[{0}] أعاد التسجيل بوضع [{1}]؛ تم إصدار سر، UUID={2}"
"[{0}] registered successfully.": "تم تسجيل [{0}] بنجاح."
"[{0}] registration failed: {1}": "فشل تسجيل [{0}]: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] تمت مصادقة {2}"
"Registered service [{0}] {1}": "تم تسجيل الخدمة [{0}] {1}"
"Service [{0}] went offline: {1}": "الخدمة [{0}] أصبحت غير متصلة: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "[{0}] عدم تطابق السر؛ مسموح بوضع [{1}]"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] أصبح العميل يحمل السر الصحيح؛ تُغلق نافذة التقارب تلقائيًا"
"Hardware information changed too much.": "تغيّرت معلومات الأجهزة بشكل مفرط."
"Unique identifier mismatch (new != old): {0} != {1}": "عدم تطابق المعرف الفريد (الجديد != القديم): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "عدم تطابق معرف الجهاز (الجديد != القديم): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "عدم تطابق الرقم التسلسلي للحاسوب (الجديد != القديم): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "عدم تطابق اللوحة الأم (الجديد != القديم): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "عدم تطابق رمز المنتج (الجديد != القديم): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "عدم تطابق اسم الجهاز (الجديد != القديم): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "عدم تطابق عنوان MAC (الجديد != القديم): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "عدم تطابق الرقم التسلسلي للقرص (الجديد != القديم): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "الإصدار={0} الحجم={1:n0} العقدة={2}"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] سجّل الدخول في {2}، آخر نشاط في {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "العقدة [{0}/{1}] شديدة التشابه بالعقدة الموجودة [{2}]؛ سيتم استخدام العقدة الموجودة"
"Stardust service platform": "منصة خدمات Stardust"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "النواة الخلفية لمنصة الخدمات الموزعة Stardust. توفر واجهات برمجة للعقد والتطبيقات والتهيئة والسجل والمراقبة والتنبيهات والإصدارات والبوابة وMCP، مع تجميع المقاييس والإحصاءات والمهام المجدولة."
"Service port. Default 6600.": "منفذ الخدمة. الافتراضي 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "مفتاح الرمز المميز. الخوارزمية والمفتاح المستخدمان لإنشاء رموز JWT المميزة، مثل HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "مدة صلاحية الرمز. الافتراضي 2*3600 ثانية."
"Session timeout. Default 600 seconds": "مهلة الجلسة. الافتراضي 600 ثانية"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "وقت انحراف الملح. يستخدم العميل الوقت الحالي كملح عند تسجيل الدخول؛ إذا كان فرق الوقت مع الخادم كبيرًا جدًا ستفشل عملية التحقق من المفتاح؛ الافتراضي 600 ثانية"
"Auto-register. Allow node clients to register automatically, default true": "التسجيل التلقائي. السماح لعملاء العُقد بالتسجيل تلقائيًا، الافتراضي true"
"Application auto-registration. Allow app clients to register automatically; default true": "التسجيل التلقائي للتطبيقات. السماح لعملاء التطبيقات بالتسجيل تلقائيًا؛ الافتراضي true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "القائمة البيضاء للقبول. إذا تم تحديدها، يُسمح فقط للعُقد المطابقة لشروط IP بالتسجيل، افصل بين عدة إدخالات بفواصل، يدعم المطابقة الضبابية *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "صيغة رمز العقدة. تحدد معلومات الأجهزة في NodeInfo المستخدمة لحساب رمز العقدة. تدعم Crc/Crc16/MD5/MD5_16، الافتراضي Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "حد التعرف على رمز العقدة. UUID+Guid+SerialNumber+DiskId+MAC؛ إذا تطابق عدد منها، تُعتبر العقدة نفسها، الافتراضي 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "دورة إحصاءات تدفق المراقبة. الافتراضي 5 ثوانٍ. تعالج قائمة الانتظار في الذاكرة لحساب الإحصاءات على مستوى الدقيقة؛ القيم الأصغر تحسن الاستجابة الفورية لكنها تزيد استهلاك CPU، والقيم الأكبر تقلل استهلاك CPU لكنها تزيد تأخر التنبيه"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "دورة إحصاءات الدفعات للمراقبة. الافتراضي 30 ثانية. يصحح البيانات بالتجميع من قاعدة البيانات؛ القيم الأصغر تسرع التصحيح لكنها تزيد ضغط IO، والقيم الأكبر تقلل الضغط لكنها تؤخر التصحيح"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "دورة حفظ بيانات المراقبة. الافتراضي 300 ثانية. دورة الإرسال الدفعي لقائمة انتظار تأخير الإحصاءات؛ التنبيهات تقرأ القيم الفورية في الذاكرة ولا تتأثر. القيم الأكبر تقلل بشكل كبير ضغط UPDATE على قاعدة البيانات"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "دورة فحص المراقبة. الافتراضي 600 ثانية. يعيد حساب الإحصاءات الساعية/اليومية للتطبيقات غير الشائعة على فترات بدلاً من إعادة الحساب الكامل في كل دورة دفعة، مما يقلل تضخيم الكتابة"
"Monitoring alert period. Default 30 seconds": "دورة تنبيه المراقبة. الافتراضي 30 ثانية"
"Console address. Used for monitoring alert addresses": "عنوان وحدة التحكم. يُستخدم لعناوين تنبيهات المراقبة"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "مدة الاحتفاظ بالبيانات. تفاصيل العينات وإحصاءات على مستوى الدقيقة؛ الافتراضي 3 أيام."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "مدة الاحتفاظ بالبيانات متوسطة الدقة. بيانات الأداء والإحصاءات الساعية، الافتراضي 30 يومًا"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "مدة الاحتفاظ بالبيانات الإجمالية. البيانات التاريخية والإحصاءات اليومية، الافتراضي 300 يوم."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "وضع تنظيف البيانات. يدعم Truncate الفعال أو Delete دون DDL. الافتراضي Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "دليل التحميل. يخزن حزم الترقية ويجب أن يكون نفس الدليل المهيأ لـ StarWeb. الافتراضي ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "الحد الأقصى لحجم حزمة التحميل. ينطبق فقط على الحد الأقصى لوحدات بايت جسم الطلب المسموح بها لنقطة النهاية Deploy/UploadBuildFile؛ الافتراضي 100000000 (100MB)، والقيمة 0 تعني استخدام حد Kestrel الافتراضي، بحد أقصى 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "دليل ذاكرة الملفات المؤقتة. يخزّن ملفات مؤقتة مثل برامج تشغيل قواعد البيانات؛ يُعطَّل عند تركه فارغًا؛ الافتراضي ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "القائمة البيضاء لذاكرة الملفات المؤقتة. عند تحديدها، لا يُسمح إلا لمصادر IP المطابقة بالوصول إلى ذاكرة الملفات المؤقتة؛ افصل بين المدخلات المتعددة بفواصل؛ تدعم مطابقة *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "خدمة تخزين الملفات. هل يتم الاستجابة لطلبات تنزيل الملفات من العقد الأخرى. الافتراضي true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "سحب تخزين الملفات. هل يتم سحب الملفات الجديدة المنشورة من العقد الأخرى بشكل نشط. الافتراضي false."
"Upstream server. Reports data synchronously to the upstream server.": "الخادم الأعلى. يبلغ البيانات بشكل متزامن إلى الخادم الأعلى."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "مدينة ثابتة. افتراضيًا يتم حساب المدينة تلقائيًا من IP. عند التفعيل يتوقف الحساب التلقائي ويتم تعيين المدينة يدويًا"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "السماح بالوصول المجهول إلى التتبع. السماح للمستخدمين غير المسجلين بالوصول إلى صفحة التتبع /trace؛ قد تحتوي بيانات المراقبة على معلومات حساسة. الافتراضي false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "فترة مزامنة dotNet. جلب معلومات حزمة تثبيت .NET runtime من الموقع الرسمي، 0 يعني التعطيل، الوحدة بالثواني، الافتراضي 43200 (12 ساعة)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "عنوان مزامنة dotNet. عنوان API الرسمي لجلب إصدارات .NET runtime، يدعم العنصر النائب {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "عنوان أساسي لتنزيل موارد Stardust. URL أساسي لحزم/نصوص تثبيت StarAgent؛ الافتراضي العنوان الرسمي"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "السماح عند فراغ العقد القابلة للتحكم. هل يُسمح بالعمليات عندما يكون AllowControlNodes فارغًا، الافتراضي false (الوضع الآمن، يتطلب تكوين العقد القابلة للتحكم صراحةً). يمكن ضبطه على true في البيئات الداخلية للتوافق مع البيانات القديمة"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "تمكين خدمة MCP. معطلة افتراضيًا؛ عند التمكين يتم كشف نقطة النهاية POST /mcp لاستدعاءات LLM/الوكيل."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "مجموعة إجراءات MCP. أسماء وحدات مفصولة بفواصل (node/app/config/deploy/gateway/monitor/system)، * تعني تمكين الكل"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "بادئات مسارات تحديد المعدل. مفصولة بفواصل؛ تُحدَّد المسارات المطابقة حسب IP؛ الافتراضي نقاط نهاية المصادقة مثل login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "عدد تحديد المعدل. عدد الطلبات المسموح بها لكل IP في الدقيقة؛ الافتراضي 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "السماح بالإبلاغ المجهول عن القياسات. مطلوب للتسلسل متعدد المستويات أو SDK المبسط؛ الافتراضي false (آمن)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "مصادر CORS المسموح بها. مفصولة بفواصل؛ فارغة تسمح بأي مصدر؛ عند التحديد يُسمح فقط للمصادر المدرجة في القائمة البيضاء بالوصول العابر"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "مصادقة تنزيل المرفقات. هل يتم التحقق من رمز تنزيل المرفقات لمسار /cube/file. الافتراضي false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "فئات المرفقات العامة التي لا تتطلب تسجيل الدخول. مفصولة بفواصل، ويمكن تنزيل العناصر المطابقة دون الكشف عن الهوية."
"Attachment download token validity. Seconds, default 600.": "صلاحية رمز تنزيل المرفقات. بالثواني، الافتراضي 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService يقوم بمزامنة {0}"
"DotNetSyncService failed to sync {0}: {1}": "فشل DotNetSyncService في مزامنة {0}: {1}"
"DotNetSyncService.Error {0}": "خطأ DotNetSyncService: {0}"
"Default language. Pushed to clients on login and heartbeat, e.g. zh-Hans or en; empty uses the core configuration DefaultLanguage.": "اللغة الافتراضية. تُرسل إلى العملاء عند تسجيل الدخول ونبضات القلب، مثل zh-Hans أو en؛ عند تركها فارغة تُستخدم DefaultLanguage من التكوين الأساسي."
