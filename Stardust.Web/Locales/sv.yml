"Stardust service platform": "Stardust-tjänsteplattform"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Backendkärnan i den distribuerade Stardust-tjänsteplattformen. Tillhandahåller centrala API-tjänster för konfigurationscenter, register, tjänsteidentifiering, fjärrdistribution, prestandaövervakning och loggcenter, stöder applikationsregistrering, konfigurationsdistribution, aggregering av mätvärden, statistikberäkningar och aktivitetsschemaläggning samt kan skalas horisontellt."
"Service port. Default 6600.": "Tjänsteport. Standard 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Tokenhemlighet. Algoritm och hemlighet som används för att generera JWT-token, t.ex. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Tokens giltighetstid. Standard 2*3600 sekunder."
"Session timeout. Default 600 seconds": "Sessions-timeout. Standard 600 sekunder"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Saltavvikelsetid. Klienter använder aktuell tid som salt vid inloggning; för stor tidsskillnad mot servern gör att nyckelverifieringen misslyckas; standard 600 sekunder"
"Auto-register. Allow node clients to register automatically, default true": "Automatisk registrering. Tillåt nodklienter att registrera sig automatiskt, standard true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatisk applikationsregistrering. Tillåt att appklienter registrerar sig automatiskt; standard true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Vitlista för åtkomst. Om angivet kan endast noder som matchar IP-villkoren registrera sig, separera flera poster med kommatecken, stöder *-jokertecken"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formel för nodkod. Väljer vilken maskinvaruinformation i NodeInfo som används för att beräkna nodkoden. Stöder Crc/Crc16/MD5/MD5_16, standard Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Tröskel för nodkodidentifiering. UUID+Guid+SerialNumber+DiskId+MAC; om flera av dem stämmer överens anses noden vara samma, standard 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Statistikperiod för övervakningsström. Standard 5 sekunder. Bearbetar kön i minnet för att beräkna statistik på minutnivå; mindre värden förbättrar realtiden men ökar CPU-användningen, större värden minskar CPU-användningen men ökar larmfördröjningen"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Batchstatistikperiod för övervakning. Standard 30 sekunder. Korrigerar data genom aggregering från databasen; mindre värden snabbar upp korrigeringen men ökar IO-belastningen, större värden minskar belastningen men fördröjer korrigeringen"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Skrivningsperiod för övervakning. Standard 300 sekunder. Batchperiod för statistikfördröjningskön; larm läser realtidsvärden i minnet och påverkas inte. Större värden minskar UPDATE-belastningen på databasen avsevärt"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Inspektionsperiod för övervakning. Standard 600 sekunder. Beräknar om tim-/dygnsstatistik för icke-populära program periodiskt i stället för full omberäkning i varje batchcykel, vilket minskar skrivförstärkningen"
"Monitoring alert period. Default 30 seconds": "Larmperiod för övervakning. Standard 30 sekunder"
"Console address. Used for monitoring alert addresses": "Konsoladress. Används för larmadresser för övervakning"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Datalagringsperiod. Provdetaljer och statistik på minutnivå; standard 3 dagar."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Lagringstid för data med medelhög granularitet. Prestandadata och timstatistik, standard 30 dagar"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Bevarandeperiod för grovkornig data. Historisk data och daglig statistik, standard 300 dagar."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Rensningsläge för data. Stöder effektiv Truncate eller Delete utan DDL. Standard Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Uppladdningskatalog. Lagrar uppgraderingspaket och måste vara samma katalog som konfigurerats för StarWeb. Standard ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maximal storlek på uppladdningspaket. Gäller endast maximalt tillåtna byte i begärandetexten för Deploy/UploadBuildFile-slutpunkten; standard 100000000 (100MB), 0 betyder använd Kestrels standardgräns, max 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Katalog för filcache. Lagrar cachefiler som databasdrivrutiner; inaktiverat när tomt; standard ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Vitlista för filcache. Om angivet har endast matchande IP-källor åtkomst till filcachen; separera flera poster med kommatecken; stöder * jokertecken"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Fillagringstjänst. Om filnedladdningsförfrågningar från andra noder ska besvaras. Standard true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Hämtning från fillagring. Om nya filer som publiceras av andra noder ska hämtas aktivt. Standard false."
"Upstream server. Reports data synchronously to the upstream server.": "Överordnad server. Rapporterar data synkront till den överordnade servern."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Fast stad. Som standard beräknas staden automatiskt från IP-adressen. När det är aktiverat beräknas den inte längre automatiskt, utan staden anges manuellt"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Tillåt anonym spårningsåtkomst. Låt utloggade användare komma åt spårningssidan /trace; övervakningsdata kan innehålla känslig information. Standard false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet-synkroniseringsintervall. Hämta .NET runtime-installationsinformation från den officiella webbplatsen, 0 inaktiverar, enhet sekunder, standard 43200 (12 timmar)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet-synkroniseringsadress. Officiell API-adress för att hämta .NET runtime-versioner, stöder platshållaren {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Basadress för nedladdning av Stardust-resurser. Bas-URL för StarAgent-installationsprogram/skript; standard den officiella adressen"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Tillåt när styrbara noder är tomma. Om åtgärder tillåts när AllowControlNodes är tom, standard false (säkert läge, styrbara noder måste konfigureras explicit). Interna miljöer kan sätta den till true för kompatibilitet med äldre data"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Aktivera MCP-tjänsten. Inaktiverad som standard; när den är aktiverad exponeras POST /mcp-slutpunkten för LLM-/agentanrop."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP-åtgärdsuppsättning. Kommaseparerade modulnamn (node/app/config/deploy/gateway/monitor/system), * betyder att alla aktiveras"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Sökvägsprefix för begärandebegränsning. Kommaseparerade; matchande sökvägar begränsas per IP; standard är autentiseringsslutpunkter som login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Gräns för begärandefrekvens. Antal tillåtna förfrågningar per IP per minut; standard 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Tillåt anonym telemetrirapportering. Krävs för flernivåkaskadering eller minimal SDK; standard false (säkert)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Tillåtna CORS-ursprung. Kommaseparerade; tomt tillåter alla ursprung; när angivet får endast vitlistade ursprung göra cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Autentisering av bilagsnedladdning. Om nedladdningstoken för bilagor ska verifieras för /cube/file. Standard false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Offentliga bilagekategorier utan inloggning. Kommaseparerade, matchande objekt kan laddas ned anonymt."
"Attachment download token validity. Seconds, default 600.": "Giltighet för nedladdningstoken för bilagor. Sekunder, standard 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService synkroniserar {0}"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService kunde inte synkronisera {0}: {1}"
"DotNetSyncService.Error {0}": "Fel i DotNetSyncService: {0}"
