"Starting deployment to {0}": "Üzembe helyezés indítása ide: {0}"
"Token subject [{0}] does not match the target application [{1}]; cross-application configuration access is forbidden.": "A token tulajdonosa [{0}] nem egyezik a célalkalmazással [{1}]; az alkalmazások közötti konfigurációhozzáférés tilos."
"Token subject [{0}] does not match the reporting application [{1}].": "A token tulajdonosa [{0}] nem egyezik a jelentést tevő alkalmazással [{1}]."
"Command execution timed out ({0} ms).": "A parancs végrehajtása időtúllépés miatt leállt ({0} ms)."
