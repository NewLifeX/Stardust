"Received remote deployment request: Hosts={0}, User={1}, OS={2}, Server={3}": "Távoli üzembe helyezési kérés érkezett: Hosts={0}, User={1}, OS={2}, Server={3}"
"Unsupported grant_type={0}": "Nem támogatott grant_type={0}"
"Consuming service [{0}] {1}": "[{0}] szolgáltatás hívása {1}"
"Application [{0}] is in read-only mode; modification is forbidden.": "A(z) [{0}] alkalmazás csak olvasható módban van; a módosítás tilos."
"Application [{0}] already exists; reusing the old identity for dynamic registration is forbidden. Check the secret or contact the administrator. To enable automatic instance onboarding, adjust the application's re-registration mode (convergence window/trusted access/open).": "A(z) [{0}] alkalmazás már létezik; a régi identitás újrafelhasználása dinamikus regisztrációhoz tilos. Ellenőrizze a titkot, vagy forduljon a rendszergazdához. A példányok automatikus csatlakoztatásához módosítsa az alkalmazás újraregisztrációs módját (konvergenciaablak/megbízható hozzáférés/nyitott)."
"[{0}] attempted to access the service of [{1}] without permission": "A(z) [{0}] jogosulatlanul próbált hozzáférni a(z) [{1}] szolgáltatásához"
"Connection timed out.": "A kapcsolat időtúllépés miatt leállt."
"Connected.": "Csatlakozva."
"Connection failed: {0}": "A kapcsolódás nem sikerült: {0}"
"Deployment succeeded.": "Az üzembe helyezés sikeres."
"Deployment failed; check the output logs.": "Az üzembe helyezés nem sikerült; ellenőrizze a kimeneti naplókat."
"Deployment node [{0}] does not exist.": "A(z) [{0}] üzembe helyezési csomópont nem létezik."
"Deployment node [{0}] is disabled.": "A(z) [{0}] üzembe helyezési csomópont le van tiltva."
"Deployment node [{0}] DeployId mismatch.": "A(z) [{0}] üzembe helyezési csomópont DeployId eltérése."
"Node [{0}] does not exist.": "A(z) [{0}] csomópont nem létezik."
"Too many requests; please try again later.": "Túl sok kérés; próbálja újra később."
"Build completed, run={0}": "Az összeállítás befejeződött, run={0}"
"Using version {0} (Id={1})": "{0} verzió használata (Id={1})"
"No deployable version was found.": "Nem található telepíthető verzió."
"The pipeline configuration does not exist.": "A folyamatkonfiguráció nem létezik."
"Auto deploy is disabled; the pipeline ends.": "Az automatikus üzembe helyezés le van tiltva; a folyamat véget ér."
"The build succeeded but produced no deployable version (upload may be disabled); auto deploy is not possible.": "Az összeállítás sikeres volt, de nem hozott létre telepíthető verziót (a feltöltés le lehet tiltva); az automatikus üzembe helyezés nem lehetséges."
"Starting auto deploy, run={0}, version={1}": "Automatikus üzembe helyezés indítása, run={0}, verzió={1}"
"Failed to dispatch the deploy command.": "Nem sikerült elküldeni az üzembe helyezési parancsot."
"No deployable node was found; check the pipeline deploy node configuration.": "Nem található telepíthető csomópont; ellenőrizze a folyamat telepítési csomópont konfigurációját."
"Auto deploy was not triggered: no deploy node is selected for the pipeline.": "Az automatikus üzembe helyezés nem indult el: nincs telepítési csomópont kiválasztva a folyamathoz."
"Deploy command dispatched to node {0} (CommandId={1}).": "Az üzembe helyezési parancs elküldve a(z) {0} csomópontnak (CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "Nem sikerült elküldeni az üzembe helyezési parancsot a(z) {0} csomópontnak: {1}"
"Application authentication": "Alkalmazás-hitelesítés"
"Node authentication": "Csomópont-hitelesítés"
"Offline timeout": "Offline állapotban időtúllépés"
"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "Üres titokkal rendelkező alkalmazás nem tud bejelentkezni. Állítson be egy Secretet ehhez az alkalmazáshoz a nyilvántartásban, vagy engedélyezze az újraregisztrációt."
"Secret validation failed.": "A titok ellenőrzése nem sikerült."
"[{0}] re-registered in [{1}] mode; secret issued": "A(z) [{0}] újraregisztrált [{1}] módban; titok kiadva"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "A(z) [{0}] újraregisztrált [{1}] módban; titok kiadva, UUID={2}"
"[{0}] registered successfully.": "A(z) [{0}] sikeresen regisztrálva."
"[{0}] registration failed: {1}": "A(z) [{0}] regisztrációja nem sikerült: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] hitelesítve: {2}"
"Registered service [{0}] {1}": "Regisztrált szolgáltatás [{0}] {1}"
"Service [{0}] went offline: {1}": "A(z) [{0}] szolgáltatás offline állapotba került: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "A(z) [{0}] titok eltérés; a(z) [{1}] mód engedélyezte"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "A(z) [{0}] az ügyfél most már a megfelelő titkot hordozza; a konvergenciaablak automatikusan bezárult"
"Hardware information changed too much.": "A hardverinformációk túlságosan megváltoztak."
"Unique identifier mismatch (new != old): {0} != {1}": "Egyedi azonosító eltérés (új != régi): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "Gépazonosító eltérés (új != régi): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "Számítógép sorozatszám eltérés (új != régi): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "Alaplap eltérés (új != régi): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "Termékkód eltérés (új != régi): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Gépnév eltérés (új != régi): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "MAC-cím eltérés (új != régi): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Lemez sorozatszám eltérés (új != régi): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Verzió={0} Méret={1:n0} Csomópont={2}"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] bejelentkezett: {2}, utolsó aktivitás: {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "A(z) [{0}/{1}] csomópont nagyon hasonlít a meglévő [{2}] csomópontra; a meglévő csomópont lesz használva"
"Stardust service platform": "Stardust szolgáltatási platform"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "A Stardust elosztott szolgáltatásplatform backend magja. API-kat biztosít csomópontokhoz, alkalmazásokhoz, konfigurációhoz, névjegyzékhez, monitorozáshoz és riasztásokhoz, kiadásokhoz, átjáróhoz és MCP-hez, valamint metrikaösszesítést, statisztikákat és ütemezett feladatokat."
"Service port. Default 6600.": "Szolgáltatási port. Alapértelmezett 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Token titka. A JWT-tokenek előállításához használt algoritmus és titok, pl. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Token érvényességi idő. Alapértelmezett 2*3600 másodperc."
"Session timeout. Default 600 seconds": "Munkamenet időtúllépés. Alapértelmezett 600 másodperc"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Salt-eltérés idő. A kliensek bejelentkezéskor az aktuális időt használják saltként; a kiszolgálótól való túl nagy időeltérés a kulcs ellenőrzésének hibáját okozza; alapértelmezett 600 másodperc"
"Auto-register. Allow node clients to register automatically, default true": "Automatikus regisztráció. Engedélyezze a csomópontkliensek automatikus regisztrációját, alapértelmezés true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatikus alkalmazásregisztráció. Engedélyezi az alkalmazáskliensek automatikus regisztrációját; alapértelmezett true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Belépési engedélyezési lista. Ha meg van adva, csak az IP-feltételeknek megfelelő csomópontok regisztrálhatnak, több bejegyzést vesszővel válasszon el, * helyettesítő egyeztetés támogatott"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Csomópontkód-képlet. Kiválasztja, hogy a NodeInfo mely hardverinformációit használja a csomópontkód kiszámításához. Támogatja: Crc/Crc16/MD5/MD5_16, alapértelmezett Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Csomópontkód-azonosítási küszöb. UUID+Guid+SerialNumber+DiskId+MAC; ha ezek közül több is egyezik, a csomópont azonosnak tekinthető, alapértelmezett 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Megfigyelési adatfolyam-statisztika időköz. Alapértelmezett 5 másodperc. A memóriabeli sort dolgozza fel a perces szintű statisztikák kiszámításához; a kisebb értékek javítják a valós idejűséget, de növelik a CPU-használatot, a nagyobb értékek csökkentik a CPU-használatot, de növelik a riasztási késleltetést"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Megfigyelési kötegstatisztika időköz. Alapértelmezett 30 másodperc. Az adatbázisból történő összesítéssel javítja az adatokat; a kisebb értékek gyorsítják a javítást, de növelik az IO-terhelést, a nagyobb értékek csökkentik a terhelést, de késleltetik a javítást"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Megfigyelési mentési időköz. Alapértelmezett 300 másodperc. A statisztikai késleltetési sor kötegelt beküldési időköze; a riasztások a memóriából olvassák a valós idejű értékeket, és nincsenek hatással rá. A nagyobb értékek jelentősen csökkentik az adatbázis UPDATE-terhelését"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Megfigyelési ellenőrzési időköz. Alapértelmezett 600 másodperc. A nem népszerű alkalmazások órás/napi statisztikáit időszakonként újraszámolja a kötegciklusonkénti teljes újraszámítás helyett, csökkentve az írási felerősödést"
"Monitoring alert period. Default 30 seconds": "Megfigyelési riasztási időköz. Alapértelmezett 30 másodperc"
"Console address. Used for monitoring alert addresses": "Konzolcím. A megfigyelési riasztások címéhez használatos"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Adatmegőrzési idő. Mintarészletek és perces szintű statisztikák; alapértelmezett 3 nap."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Közepes granularitású adatok megőrzési ideje. Teljesítményadatok és óránkénti statisztikák, alapértelmezés 30 nap"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Durva adatok megőrzési ideje. Előzményadatok és napi statisztikák, alapértelmezett 300 nap."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Adattisztítási mód. Hatékony Truncate vagy DDL nélküli Delete támogatása. Alapértelmezett Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Feltöltési könyvtár. A frissítési csomagokat tárolja, és ugyanannak a könyvtárnak kell lennie, amely a StarWeb számára be van állítva. Alapértelmezett ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Feltöltési csomag maximális mérete. Csak a Deploy/UploadBuildFile végpont által engedélyezett maximális kéréstörzs-bájtra vonatkozik; alapértelmezett 100000000 (100MB), a 0 a Kestrel alapértelmezett korlátját jelenti, maximum 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Fájl-gyorsítótár könyvtára. Gyorsítótár-fájlokat, például adatbázis-illesztőprogramokat tárol; üres esetén letiltva; alapértelmezett ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Fájl-gyorsítótár engedélyezési lista. Ha meg van adva, csak az egyező IP-források érhetik el a fájl-gyorsítótárat; több bejegyzést vesszővel válasszon el; támogatja a * helyettesítő karaktereket"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Fájltároló szolgáltatás. Válaszol-e a többi csomópont fájllekérési kéréseire. Alapértelmezett true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Fájltároló lekérés. Aktívan lekéri-e a többi csomópont által közzétett új fájlokat. Alapértelmezett false."
"Upstream server. Reports data synchronously to the upstream server.": "Felsőbb szintű kiszolgáló. Szinkron módon jelenti az adatokat a felsőbb szintű kiszolgálónak."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Rögzített város. Alapértelmezés szerint a város az IP-címből automatikusan kerül meghatározásra. Engedélyezésekor az automatikus meghatározás megszűnik, és a város manuálisan állítható be"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Névtelen nyomkövetési hozzáférés engedélyezése. Engedélyezi a be nem jelentkezett felhasználóknak a /trace nyomkövetési oldal elérését; a megfigyelési adatok érzékeny információkat tartalmazhatnak. Alapértelmezett false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet szinkronizációs intervallum. A .NET futtatókörnyezet telepítőinformációinak lekérése a hivatalos oldalról, 0 letiltja, mértékegység másodperc, alapértelmezés 43200 (12 óra)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet szinkronizációs cím. Hivatalos API-cím a .NET futtatókörnyezet verzióinak lekéréséhez, támogatja a {major} helyőrzőt"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Stardust-erőforrások letöltési alapcíme. A StarAgent telepítőinek/szkriptjeinek alap URL-je; alapértelmezés a hivatalos cím"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Engedélyezés üres vezérelhető csomópontok esetén. Engedélyezettek-e a műveletek, ha az AllowControlNodes üres, alapértelmezett false (biztonságos mód, a vezérelhető csomópontokat explicit módon kell beállítani). Belső környezetekben true értékre állítható a régi adatok kompatibilitása érdekében"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP szolgáltatás engedélyezése. Alapértelmezésben kikapcsolva; engedélyezve közzéteszi a POST /mcp végpontot LLM/ügynök hívásokhoz."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP műveletkészlet. Vesszővel elválasztott modulnevek (node/app/config/deploy/gateway/monitor/system), * az összes engedélyezését jelenti"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Sebességkorlát útvonal-előtagjai. Vesszővel elválasztva; az egyező útvonalakra IP-alapú korlát érvényes; alapértelmezés a login/token típusú hitelesítési végpontok"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Sebességkorlát értéke. IP-címenként és percenként engedélyezett kérések száma; alapértelmezett 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Névtelen telemetria-jelentés engedélyezése. Többszintű kaszkádoláshoz vagy minimális SDK-hoz szükséges; alapértelmezett false (biztonságos)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Engedélyezett CORS-források. Vesszővel elválasztva; üresen bármely forrás engedélyezett; megadás esetén csak a listán szereplő források végezhetnek cross-origin kérést"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Mellékletletöltés hitelesítése. Ellenőrizze-e a melléklet letöltési tokenjét a /cube/file útvonalon. Alapértelmezett false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Bejelentkezés nélküli nyilvános mellékletkategóriák. Vesszővel elválasztva, az egyező elemek névtelenül letölthetők."
"Attachment download token validity. Seconds, default 600.": "Melléklet letöltési token érvényessége. Másodperc, alapértelmezett 600."
"DotNetSyncService.Sync {0}": "A DotNetSyncService szinkronizálja a következőt: {0}"
"DotNetSyncService failed to sync {0}: {1}": "A DotNetSyncService nem tudta szinkronizálni a következőt: {0}: {1}"
"DotNetSyncService.Error {0}": "DotNetSyncService hiba: {0}"
"Default language. Pushed to clients on login and heartbeat, e.g. zh-Hans or en; application channel skips Desktop/Mobile/Frontend kinds; empty uses the core configuration DefaultLanguage.": "Alapértelmezett nyelv. A bejelentkezéskor és szívveréskor kerül az ügyfelekhez, pl. zh-Hans vagy en; üres esetén a magkonfiguráció DefaultLanguage értéke érvényes."
"Please select at least one item.": "Válasszon ki legalább egy elemet."
"Command cannot be empty.": "A parancs nem lehet üres."
"Dispatched {0}, replied {1}, no reply {2}": "Elküldve {0}, válaszolt {1}, válasz nélkül {2}"
"Dispatched {0}; awaiting node confirmation": "Elküldve {0}; várakozás a csomópont visszaigazolására"
"Skipped {0} offline": "{0} offline kihagyva"
"The specified version does not exist.": "A megadott verzió nem létezik."
"No matched package for the selected nodes; skipped {0}": "Nincs megfelelő csomag a kiválasztott csomópontokhoz; {0} kihagyva"
"The telemetry payload is too large.": "A telemetriai adatcsomag túl nagy."
# 运行时消息补充词条
"No reply.": "Nincs válasz."
"级别：": "Level:"
"Log report finished: {0} succeeded, {1} failed, {2} offline skipped.": "Naplójelentés kész: {0} sikeres, {1} sikertelen, {2} offline kihagyva."
"No log lines were recognized; check the log format.": "Nem ismerhető fel naplósor; ellenőrizze a naplóformátumot."
"The instance SDK version is too old to report logs. Please upgrade Stardust.": "A példány SDK-verziója túl régi a naplók jelentéséhez. Frissítse a Stardustot."
"客户端：": "Client:"
"上报日志": "Report logs"
"Reported {0} ({1:n0} bytes, {2} lines). Opening the log list.": "{0} jelentve ({1:n0} bájt, {2} sor). Naplólista megnyitása."
"Log report requested. Opening the log list.": "Naplójelentés kérve. Naplólista megnyitása."
