"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] klient nyní předává správný tajný klíč; okno konvergence bylo automaticky uzavřeno"
"Hardware information changed too much.": "Informace o hardwaru se příliš změnily."
"Unique identifier mismatch (new != old): {0} != {1}": "Nesoulad jedinečného identifikátoru (nový != starý): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "Nesoulad identifikátoru počítače (nový != starý): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "Nesoulad sériového čísla počítače (nový != starý): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "Nesoulad základní desky (nový != starý): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "Nesoulad kódu produktu (nový != starý): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Nesoulad názvu počítače (nový != starý): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "Nesoulad MAC adresy (nový != starý): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Nesoulad sériového čísla disku (nový != starý): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Verze={0} Velikost={1:n0} Uzel={2}"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] přihlášen v {2}, naposledy aktivní v {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Uzel [{0}/{1}] je velmi podobný existujícímu uzlu [{2}]; použije se existující uzel"
"Stardust service platform": "Servisní platforma Stardust"
"Backend core of the Stardust distributed service platform. Provides APIs for node management, application center, configuration center, registry and service discovery, monitoring and alerting, release center, gateway and MCP, together with metric aggregation, statistics and scheduled tasks; scales horizontally.": "Backendové jádro distribuované platformy Stardust. Poskytuje rozhraní API pro uzly, aplikace, konfiguraci, registr, monitoring a upozornění, vydání, bránu a MCP, včetně agregace metrik, statistik a plánovaných úloh."
"Service port. Default 6600.": "Port služby. Výchozí 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Tajný klíč tokenu. Algoritmus a klíč pro generování tokenů JWT, např. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Doba platnosti tokenu. Výchozí 2*3600 sekund."
"Session timeout. Default 600 seconds": "Časový limit relace. Výchozí 600 sekund"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Doba odchylky soli. Klient při přihlášení používá aktuální čas jako sůl; příliš velký časový rozdíl vůči serveru způsobí selhání ověření klíče; výchozí 600 sekund"
"Auto-register. Allow node clients to register automatically, default true": "Automatická registrace. Povolit klientským uzlům automatickou registraci, výchozí true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatická registrace aplikací. Povolit automatickou registraci klientských aplikací; výchozí true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Seznam povolených pro přijetí. Je-li zadán, mohou se registrovat pouze uzly splňující podmínky IP, více položek oddělte čárkami, podporováno zástupné porovnání *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Vzorec kódu uzlu. Určuje, které hardwarové informace z NodeInfo se použijí pro výpočet kódu uzlu. Podporuje Crc/Crc16/MD5/MD5_16, výchozí Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Práh rozpoznání kódu uzlu. UUID+Guid+SerialNumber+DiskId+MAC; pokud se jich několik shoduje, považuje se uzel za stejný, výchozí 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Perioda statistiky monitorovacího streamu. Výchozí 5 sekund. Zpracovává frontu v paměti pro výpočet statistik na úrovni minut; menší hodnoty zlepšují aktuálnost, ale zvyšují zatížení CPU, větší hodnoty snižují zatížení CPU, ale zvyšují zpoždění upozornění"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Perioda dávkové statistiky monitoringu. Výchozí 30 sekund. Opravuje data agregací z databáze; menší hodnoty zrychlují opravu, ale zvyšují zátěž IO, větší hodnoty snižují zátěž, ale oddalují opravu"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Perioda ukládání monitoringu. Výchozí 300 sekund. Perioda dávkového odesílání fronty zpožděné statistiky; upozornění čtou hodnoty v reálném čase z paměti a nejsou ovlivněna. Větší hodnoty výrazně snižují tlak na UPDATE databáze"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Perioda kontroly monitoringu. Výchozí 600 sekund. Přepočítává hodinové/denní statistiky u neaktivních aplikací periodicky místo plného přepočtu v každém dávkovém cyklu, čímž snižuje write amplification"
"Monitoring alert period. Default 30 seconds": "Perioda monitorovacích upozornění. Výchozí 30 sekund"
"Console address. Used for monitoring alert addresses": "Adresa konzole. Používá se pro adresy monitorovacích upozornění"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Doba uchovávání dat. Podrobnosti vzorků a statistiky na úrovni minut; výchozí 3 dny."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Doba uchování dat střední granularity. Výkonnostní data a hodinové statistiky, výchozí 30 dní"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Doba uchování hrubých dat. Historická data a denní statistiky, výchozí 300 dní."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Režim čištění dat. Podporuje efektivní Truncate nebo Delete bez DDL. Výchozí Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Adresář pro nahrávání. Ukládá balíčky aktualizací a musí být stejný adresář nakonfigurovaný pro StarWeb. Výchozí ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maximální velikost balíčku pro nahrání. Platí pouze pro maximální povolený počet bajtů těla požadavku koncového bodu Deploy/UploadBuildFile; výchozí 100000000 (100MB), 0 znamená výchozí limit Kestrel, max. 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Adresář mezipaměti souborů. Ukládá soubory mezipaměti, např. databázové ovladače; je-li prázdný, je vypnut; výchozí ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Whitelist mezipaměti souborů. Je-li zadán, mohou k mezipaměti souborů přistupovat pouze odpovídající zdroje IP; více položek oddělte čárkami; podporuje zástupné znaky *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Služba souborového úložiště. Zda reagovat na požadavky jiných uzlů na stažení souborů. Výchozí true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Stahování souborového úložiště. Zda aktivně stahovat nové soubory publikované jinými uzly. Výchozí false."
"Upstream server. Reports data synchronously to the upstream server.": "Nadřazený server. Synchronně hlásí data nadřazenému serveru."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Pevné město. Ve výchozím nastavení se město počítá automaticky z IP. Po zapnutí se automatický výpočet vypne a město se nastavuje ručně"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace page; intended only for intranet or public demo deployments. Monitoring data includes request parameters, exception stacks and client IPs. Default false.": "Povolit anonymní přístup k trasování. Umožnit nepřihlášeným uživatelům přístup na stránku trasování /trace; data monitorování mohou obsahovat citlivé informace. Výchozí false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Interval synchronizace dotNet. Načítání informací o instalátoru .NET runtime z oficiálního webu, 0 znamená zakázáno, jednotka sekundy, výchozí 43200 (12 hodin)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Adresa synchronizace dotNet. Oficiální adresa API pro načtení verzí .NET runtime, podporuje zástupný symbol {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Základní adresa pro stahování prostředků Stardust. Základní URL pro instalátory/skripty StarAgent; výchozí oficiální adresa"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Povolit při prázdných ovladatelných uzlech. Zda povolit operace, když je AllowControlNodes prázdné, výchozí false (bezpečný režim, ovladatelné uzly je nutné nakonfigurovat explicitně). V interních prostředích lze nastavit na true pro kompatibilitu se starými daty"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Povolit službu MCP. Ve výchozím nastavení vypnuto; po povolení zpřístupní koncový bod POST /mcp pro volání LLM/agentů."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Sada akcí MCP. Názvy modulů oddělené čárkami (node/app/config/deploy/gateway/monitor/system), * znamená vše povoleno"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Předpony cest omezení rychlosti. Oddělené čárkami; odpovídající cesty jsou omezeny podle IP; výchozí jsou ověřovací koncové body jako login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Počet omezení rychlosti. Počet požadavků povolených na IP za minutu; výchozí 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Povolit anonymní telemetrii. Vyžadováno pro vícestupňové kaskádování nebo minimální SDK; výchozí false (bezpečné)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Povolené zdroje CORS. Oddělené čárkami; prázdné povolí jakýkoli zdroj; po zadání mohou cross-origin přistupovat pouze zdroje na seznamu"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Ověřování stahování příloh. Zda ověřovat token pro stahování příloh u /cube/file. Výchozí false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Kategorie veřejných příloh bez přihlášení. Odděleno čárkami, odpovídající položky lze stáhnout anonymně."
"Attachment download token validity. Seconds, default 600.": "Platnost tokenu pro stahování příloh. Sekundy, výchozí 600."
"DotNetSyncService.Sync {0}": "DotNetSyncService synchronizuje {0}"
"DotNetSyncService failed to sync {0}: {1}": "DotNetSyncService nedokázal synchronizovat {0}: {1}"
"DotNetSyncService.Error {0}": "Chyba DotNetSyncService: {0}"
"Default language. Pushed to clients on login and heartbeat, e.g. zh-Hans or en; application channel skips Desktop/Mobile/Frontend kinds; empty uses the core configuration DefaultLanguage.": "Výchozí jazyk. Odesílá se klientům při přihlášení a srdečním tepu, např. zh-Hans nebo en; prázdná hodnota použije DefaultLanguage ze základní konfigurace."
"Please select at least one item.": "Vyberte prosím alespoň jednu položku."
"Command cannot be empty.": "Příkaz nesmí být prázdný."
"Dispatched {0}, replied {1}, no reply {2}": "Odesláno {0}, odpovědělo {1}, bez odpovědi {2}"
"Dispatched {0}; awaiting node confirmation": "Odesláno {0}; čeká se na potvrzení uzlu"
"Skipped {0} offline": "Přeskočeno {0} offline"
"The specified version does not exist.": "Zadaná verze neexistuje."
"No matched package for the selected nodes; skipped {0}": "Pro vybrané uzly není žádný odpovídající balíček; přeskočeno {0}"
"The telemetry payload is too large.": "Datová zátěž telemetrie je příliš velká."
