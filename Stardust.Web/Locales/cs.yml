"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "Aplikace s prázdným tajným klíčem se nemůže přihlásit. Nastavte Secret pro tuto aplikaci v registru nebo povolte opětovnou registraci."
"Secret validation failed.": "Ověření tajného klíče selhalo."
