"Application [{0}] already exists; reusing the old identity for dynamic registration is forbidden. Check the secret or contact the administrator. To enable automatic instance onboarding, adjust the application's re-registration mode (convergence window/trusted access/open).": "[{0}] 애플리케이션이 이미 있습니다. 동적 등록을 위해 이전 ID를 재사용하는 것은 금지됩니다. 비밀 키를 확인하거나 관리자에게 문의하세요. 인스턴스 자동 참여를 사용하려면 애플리케이션의 재등록 모드(수렴 기간/신뢰 액세스/개방)를 조정하세요."
