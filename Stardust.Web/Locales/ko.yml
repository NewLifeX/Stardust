"[{0}] has no secret configured; node commands are forbidden. Set a Secret for this application in the registry.": "[{0}]에 비밀 키가 구성되지 않아 노드 명령이 금지됩니다. 레지스트리에서 이 애플리케이션의 Secret을 설정하세요."
"[{0}] has no secret configured; control commands are forbidden. Set a Secret for this application in the registry.": "[{0}]에 비밀 키가 구성되지 않아 제어 명령이 금지됩니다. 레지스트리에서 이 애플리케이션의 Secret을 설정하세요."
"[{0}] has no secret configured; remote deployment is forbidden. Set a Secret for this application in the registry.": "[{0}]에 비밀 키가 구성되지 않아 원격 배포가 금지됩니다. 레지스트리에서 이 애플리케이션의 Secret을 설정하세요."
"[{0}] has no control permission; remote deployment is forbidden.": "[{0}]에 제어 권한이 없어 원격 배포가 금지됩니다."
"[{0}] is not allowed to operate node [{1}].\nFor security, applications cannot send control commands to arbitrary nodes by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all nodes.": "[{0}]이(가) [{1}] 노드를 조작할 수 없습니다.\n보안을 위해 애플리케이션은 기본적으로 임의 노드에 제어 명령을 보낼 수 없습니다.\n레지스트리에서 [{0}]의 제어 가능 노드를 편집하고 [{2}]을 추가하거나 모든 노드에 대해 *로 설정하세요."
"[{0}] is not allowed to operate application [{1}].\nFor security, applications cannot send control commands to other applications by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all applications.": "[{0}]이(가) [{1}] 애플리케이션을 조작할 수 없습니다.\n보안을 위해 애플리케이션은 기본적으로 다른 애플리케이션에 제어 명령을 보낼 수 없습니다.\n레지스트리에서 [{0}]의 제어 가능 노드를 편집하고 [{2}]을 추가하거나 모든 애플리케이션에 대해 *로 설정하세요."
"[{0}] attempted to reply to command [{1}] that belongs to node [{2}]": "[{0}]이(가) [{2}] 노드에 속한 [{1}] 명령에 응답하려고 했습니다"
