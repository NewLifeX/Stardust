<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安装 StarAgent · 星尘</title>
<style>
    :root {
        --ink: #0f172a;
        --ink-2: #334155;
        --muted: #64748b;
        --line: #e2e8f0;
        --surface: #ffffff;
        --bg: #f6f8fb;
        --brand: #4f46e5;
        --brand-2: #0ea5e9;
        --radius: 16px;
        --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 32px -18px rgba(15, 23, 42, .28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }

    /* 顶栏 */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
    .brand .mark {
        width: 30px; height: 30px; border-radius: 9px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 700;
    }
    .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: 0; }
    .ghost {
        appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
        padding: 7px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: .15s;
    }
    .ghost:hover { border-color: #cbd5e1; color: var(--ink); }

    /* 主视觉 */
    .hero {
        position: relative; overflow: hidden; border-radius: 22px; color: #eef2ff;
        background:
            radial-gradient(900px 420px at 88% -20%, rgba(14, 165, 233, .45), transparent 60%),
            radial-gradient(700px 380px at 12% 120%, rgba(79, 70, 229, .55), transparent 62%),
            linear-gradient(135deg, #0b1220, #141e35 55%, #16233f);
        padding: 38px 36px 34px;
        box-shadow: 0 30px 60px -40px rgba(9, 13, 26, .8);
        display: grid; grid-template-columns: 1.05fr .95fr; gap: 32px; align-items: center;
    }
    .eyebrow {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #a5b4fc;
    }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: #6366f1; }
    .hero h1 { margin: 12px 0 10px; font-size: 34px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
    .hero .lead { margin: 0 0 22px; color: #b8c4dc; font-size: 15px; max-width: 42ch; }
    .server-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .server-row .label { font-size: 12px; color: #94a3b8; }
    .server-row code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px;
        background: rgba(148, 163, 184, .16); border: 1px solid rgba(148, 163, 184, .22);
        color: #e2e8f0; padding: 5px 10px; border-radius: 8px; word-break: break-all;
    }

    .cmd {
        background: rgba(8, 12, 24, .62); border: 1px solid rgba(148, 163, 184, .18);
        border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(6px);
    }
    .cmd-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; }
    .cmd pre {
        margin: 10px 0 0; padding: 0; background: none; color: #d7e0f0;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px;
        line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
    }
    .cmd-foot { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    .field {
        appearance: none; border: 1px solid rgba(148, 163, 184, .26); background: rgba(15, 23, 42, .55);
        color: #e2e8f0; border-radius: 9px; padding: 6px 10px; font-size: 12.5px; cursor: pointer;
    }
    .field option { color: #0f172a; }
    .primary {
        appearance: none; border: none; cursor: pointer; font-size: 12.5px; font-weight: 600;
        color: #0b1220; background: linear-gradient(135deg, #a5b4fc, #7dd3fc);
        padding: 7px 14px; border-radius: 9px; transition: .15s;
    }
    .primary:hover { filter: brightness(1.06); }
    .tip { font-size: 12px; color: #7dd3fc; min-height: 16px; }

    /* 卡片 */
    .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 22px 24px 24px; margin-top: 20px; box-shadow: var(--shadow);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
    .card h2 { margin: 0; font-size: 16.5px; font-weight: 620; letter-spacing: -.01em; }
    .card h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
    .card h2 span:first-child { color: var(--ink); font-weight: 620; font-size: 16.5px; margin-right: 8px; }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .select {
        appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
        border-radius: 9px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    }
    .select:hover { border-color: #cbd5e1; }

    .table-wrap { margin-top: 14px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th {
        text-align: left; font-weight: 500; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
        color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    tbody td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tbody tr:hover { background: #fafbfe; }
    tbody tr:last-child td { border-bottom: none; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; color: var(--ink-2); }
    .num { text-align: right; color: var(--muted); white-space: nowrap; }
    .pill {
        display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
        font-size: 12px; background: #eef2ff; color: #4338ca; border: 1px solid #e0e7ff;
    }
    .pill.grey { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .pill.green { background: #ecfdf5; color: #047857; border-color: #d1fae5; }
    .link {
        display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
        color: var(--brand); font-weight: 560; font-size: 13px; white-space: nowrap;
    }
    .link:hover { color: #3730a3; }
    .empty { color: var(--muted); font-size: 13px; padding: 18px 4px; }

    details.mirror { margin-top: 20px; }
    details.mirror summary {
        cursor: pointer; list-style: none; color: var(--muted); font-size: 13px;
        padding: 14px 18px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px;
    }
    details.mirror summary::-webkit-details-marker { display: none; }
    details.mirror summary:hover { color: var(--ink-2); border-color: #cbd5e1; }

    footer { text-align: center; color: #94a3b8; font-size: 12px; padding-top: 28px; }

    @media (max-width: 860px) {
        .hero { grid-template-columns: 1fr; padding: 28px 22px; }
        .hero h1 { font-size: 27px; }
        .card { padding: 18px 16px; }
    }
</style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="brand">
            <div class="mark">星</div>
            <div>星尘 StarAgent<small data-i18n="brandSub">节点代理安装</small></div>
        </div>
        <button class="ghost" id="langBtn">English</button>
    </div>

    <section class="hero">
        <div>
            <div class="eyebrow">Stardust Agent</div>
            <h1 data-i18n="title">安装 StarAgent</h1>
            <p class="lead" data-i18n="lead">选择平台与版本下载安装包，或复制一条命令完成安装。安装后代理会自动注册到本服务端。</p>
            <div class="server-row">
                <span class="label" data-i18n="server">服务端</span>
                <code id="server">-</code>
            </div>
        </div>

        <div class="cmd">
            <div class="cmd-head">
                <span data-i18n="command">一键安装</span>
                <span id="cmdHint">Linux / macOS</span>
            </div>
            <pre id="command">-</pre>
            <div class="cmd-foot">
                <select class="field" id="osSel">
                    <option value="linux">Linux</option>
                    <option value="windows">Windows</option>
                </select>
                <select class="field" id="archSel">
                    <option value="x64">x64</option>
                    <option value="arm64">arm64</option>
                    <option value="arm">arm</option>
                    <option value="loongarch64">loongarch64</option>
                    <option value="mips64">mips64</option>
                </select>
                <button class="primary" id="copyBtn" data-i18n="copy">复制命令</button>
                <span class="tip" id="copyTip"></span>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="card-head">
            <h2><span id="versionName">-</span><span data-i18n="packages">安装包</span></h2>
            <div class="tools">
                <select class="select" id="channelSel">
                    <option value="release">Release</option>
                    <option value="beta">Beta</option>
                    <option value="develop">Develop</option>
                </select>
                <select class="select" id="versionSel"></select>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="colOS">平台</th>
                        <th data-i18n="colArch">架构</th>
                        <th data-i18n="colRuntime">运行时</th>
                        <th data-i18n="colFile">文件</th>
                        <th class="num" data-i18n="colSize">大小</th>
                        <th data-i18n="colAction">下载</th>
                    </tr>
                </thead>
                <tbody id="agentTable"></tbody>
            </table>
            <div class="empty" id="agentEmpty" hidden data-i18n="empty">该版本暂未发布安装包</div>
        </div>
    </section>

    <section class="card" id="nativeCard" hidden>
        <div class="card-head">
            <h2><span data-i18n="native">原生 Agent</span></h2>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="colOS">平台</th>
                        <th data-i18n="colArch">架构</th>
                        <th data-i18n="colRuntime">运行时</th>
                        <th data-i18n="colFile">文件</th>
                        <th class="num" data-i18n="colSize">大小</th>
                        <th data-i18n="colAction">下载</th>
                    </tr>
                </thead>
                <tbody id="nativeTable"></tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <div class="card-head">
            <h2><span data-i18n="runtime">.NET 运行时</span></h2>
            <span class="pill grey" data-i18n="runtimeHint">每个平台保留最近的主版本</span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="colVersion">版本</th>
                        <th data-i18n="colOS">平台</th>
                        <th data-i18n="colArch">架构</th>
                        <th data-i18n="colFile">文件</th>
                        <th class="num" data-i18n="colSize">大小</th>
                        <th data-i18n="colAction">下载</th>
                    </tr>
                </thead>
                <tbody id="runtimeTable"></tbody>
            </table>
            <div class="empty" id="runtimeEmpty" hidden data-i18n="empty">该版本暂未发布安装包</div>
        </div>
    </section>

    <details class="mirror">
        <summary data-i18n="mirror">公共镜像（服务端未维护安装包时兜底）</summary>
        <div class="card" style="margin-top:12px">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="colRuntime">运行时</th>
                            <th data-i18n="colOS">平台</th>
                            <th data-i18n="colArch">架构</th>
                            <th data-i18n="colFile">文件</th>
                            <th data-i18n="colAction">下载</th>
                        </tr>
                    </thead>
                    <tbody id="mirrorTable"></tbody>
                </table>
            </div>
        </div>
    </details>

    <footer><span data-i18n="footer">StarServer 安装引导</span><span id="updateTime"></span></footer>
</div>

<script>
const I18N = {
    zh: {
        brandSub: "节点代理安装",
        title: "安装 StarAgent",
        lead: "选择平台与版本下载安装包，或复制一条命令完成安装。安装后代理会自动注册到本服务端。",
        server: "服务端",
        command: "一键安装",
        copy: "复制命令",
        copied: "已复制到剪贴板",
        packages: "安装包",
        native: "原生 Agent",
        runtime: ".NET 运行时",
        runtimeHint: "每个平台保留最近的主版本",
        mirror: "公共镜像（服务端未维护安装包时兜底）",
        colOS: "平台", colArch: "架构", colRuntime: "运行时", colFile: "文件",
        colSize: "大小", colAction: "下载", colVersion: "版本",
        download: "下载", empty: "该版本暂未发布安装包", footer: "StarServer 安装引导",
        suggest: "推荐", local: "本站", remote: "镜像",
    },
    en: {
        brandSub: "Node agent installation",
        title: "Install StarAgent",
        lead: "Download a package for your platform, or run a single command. The agent registers to this server automatically.",
        server: "Server",
        command: "One-line install",
        copy: "Copy",
        copied: "Copied to clipboard",
        packages: "Packages",
        native: "Native agents",
        runtime: ".NET runtime",
        runtimeHint: "Latest major versions per platform",
        mirror: "Public mirror (fallback when nothing is published here)",
        colOS: "Platform", colArch: "Arch", colRuntime: "Runtime", colFile: "File",
        colSize: "Size", colAction: "Download", colVersion: "Version",
        download: "Download", empty: "No package published for this version", footer: "StarServer install guide",
        suggest: "Latest", local: "Local", remote: "Mirror",
    },
};

let lang = (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
let manifest = null;
let channel = "release";

const $ = id => document.getElementById(id);
const t = key => (I18N[lang] && I18N[lang][key]) || key;

function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    $("langBtn").textContent = lang === "zh" ? "English" : "中文";
    render();
}

function abs(url) {
    if (!url) return "";
    if (/^https?:\/\//i.test(url)) return url;
    const server = (manifest && manifest.server) || "";
    return server.replace(/\/+$/, "") + "/" + String(url).replace(/^\/+/, "");
}

function sizeText(size) {
    if (!size) return "-";
    const units = ["B", "KB", "MB", "GB"];
    let value = size, i = 0;
    while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
    return value.toFixed(i === 0 ? 0 : 1) + " " + units[i];
}

function cell(text, className) {
    const td = document.createElement("td");
    td.textContent = text == null || text === "" ? "-" : text;
    if (className) td.className = className;
    return td;
}

function platformCell(pkg) {
    const td = document.createElement("td");
    const span = document.createElement("span");
    span.className = "pill" + (pkg.os === "Any" || !pkg.os ? " grey" : "");
    span.textContent = pkg.os && pkg.os !== "Any" ? pkg.os : "Any";
    td.appendChild(span);
    return td;
}

function downloadCell(pkg) {
    const td = document.createElement("td");
    const a = document.createElement("a");
    a.className = "link";
    a.href = abs(pkg.url);
    a.textContent = t("download") + " ↓";
    td.appendChild(a);
    return td;
}

function row(pkg, withVersion) {
    const tr = document.createElement("tr");
    if (withVersion) tr.appendChild(cell(pkg.version, "mono"));
    tr.appendChild(platformCell(pkg));
    tr.appendChild(cell(pkg.arch));
    // 运行时表的列里已经有版本，不再重复显示运行时列，与表头保持一致
    if (!withVersion) tr.appendChild(cell(pkg.runtime || "-", "mono"));
    tr.appendChild(cell(pkg.fileName, "mono"));
    tr.appendChild(cell(sizeText(pkg.size), "num"));
    tr.appendChild(downloadCell(pkg));
    return tr;
}

function fill(tbodyId, emptyId, list, withVersion) {
    const body = $(tbodyId);
    body.innerHTML = "";
    (list || []).forEach(pkg => body.appendChild(row(pkg, withVersion)));
    if (emptyId) $(emptyId).hidden = (list || []).length > 0;
}

function currentVersion() {
    if (!manifest || !manifest.versions || manifest.versions.length === 0) return null;
    const id = parseInt($("versionSel").value, 10);
    return manifest.versions.find(e => e.id === id) || manifest.versions[0];
}

function renderVersions() {
    const sel = $("versionSel");
    sel.innerHTML = "";
    const versions = (manifest && manifest.versions) || [];
    if (versions.length === 0) {
        const opt = document.createElement("option");
        opt.value = "0";
        opt.textContent = "-";
        sel.appendChild(opt);
        return;
    }
    versions.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = v.id;
        opt.textContent = v.version + (i === 0 ? " · " + t("suggest") : "");
        sel.appendChild(opt);
    });
}

function renderCommand() {
    if (!manifest) return;
    const server = (manifest.server || "").replace(/\/+$/, "");
    const os = $("osSel").value;
    const arch = $("archSel").value;
    $("cmdHint").textContent = os === "windows" ? "Windows PowerShell" : "Linux / macOS";

    if (os === "windows") {
        const url = server + "/install.ps1?os=windows&arch=" + arch + "&channel=" + channel;
        $("command").textContent =
            "powershell -NoProfile -ExecutionPolicy Bypass -Command \"iwr '" + url + "' -UseBasicParsing | iex\"";
    } else {
        const url = server + "/install.sh?os=linux&arch=" + arch + "&channel=" + channel;
        $("command").textContent = "curl -fsSL '" + url + "' | sudo bash";
    }
}

function render() {
    if (!manifest) return;
    $("server").textContent = manifest.server || "-";
    $("updateTime").textContent = manifest.updateTime ? " · " + manifest.updateTime : "";
    renderVersions();

    const ver = currentVersion();
    const packages = (ver && ver.packages) || [];
    const agent = packages.filter(e => !e.kind || e.kind === "agent");
    const native = packages.filter(e => e.kind === "native");

    $("versionName").textContent = ver ? ver.version : "-";
    fill("agentTable", "agentEmpty", agent, false);

    $("nativeCard").hidden = native.length === 0;
    if (native.length > 0) fill("nativeTable", null, native, false);

    fill("runtimeTable", "runtimeEmpty", manifest.runtimes, true);
    fill("mirrorTable", null, manifest.mirror, false);

    renderCommand();
}

async function load() {
    const resp = await fetch("install?format=json&channel=" + encodeURIComponent(channel), {
        headers: { "Accept": "application/json" },
    });
    manifest = await resp.json();
    render();
}

$("langBtn").addEventListener("click", () => { lang = lang === "zh" ? "en" : "zh"; applyLang(); });
$("channelSel").addEventListener("change", e => { channel = e.target.value; load(); });
$("versionSel").addEventListener("change", render);
$("osSel").addEventListener("change", renderCommand);
$("archSel").addEventListener("change", renderCommand);
$("copyBtn").addEventListener("click", async () => {
    const text = $("command").textContent;
    try {
        await navigator.clipboard.writeText(text);
    } catch {
        const range = document.createRange();
        range.selectNodeContents($("command"));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand && document.execCommand("copy");
    }
    $("copyTip").textContent = t("copied");
    setTimeout(() => { $("copyTip").textContent = ""; }, 1800);
});

applyLang();
load().catch(err => { $("command").textContent = String(err); });
</script>
</body>
</html>
