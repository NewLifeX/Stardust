"Token validity period. Default 2*3600 seconds.": "權杖有效期間。預設2*3600秒"
"Session timeout. Default 600 seconds": "工作階段逾時。預設600秒"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "鹽值偏差時間。用戶端登入時使用目前時間加鹽，如果與伺服器時間差距過大，將導致金鑰驗證失敗，預設600秒"
"Auto-register. Allow node clients to register automatically, default true": "自動註冊。允許節點用戶端自動註冊，預設true"
"Application auto-registration. Allow app clients to register automatically; default true": "應用程式自動註冊。允許應用程式用戶端自動註冊，預設true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "准入白名單。若指定，僅允許符合IP條件的節點進行註冊，多個以逗號隔開，支援*模糊比對"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "節點代碼公式。選擇NodeInfo哪些硬體資訊來計算節點代碼，支援Crc/Crc16/MD5/MD5_16，預設Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "節點代碼辨識度。UUID+Guid+SerialNumber+DiskId+MAC，只要其中幾個相同，就認為是同一個節點，預設2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "監控串流統計週期。預設5秒。處理記憶體佇列計算分鐘級統計，調小可提高即時性但增加CPU使用率，調大則降低CPU但增加告警延遲"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "監控批次統計週期。預設30秒。從資料庫彙總修正資料，調小可提高修正速度但增加IO壓力，調大則降低壓力但延遲修正"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "監控寫入磁碟週期。預設300秒。統計延遲佇列批次提交週期，告警讀取記憶體即時值不受影響，調大顯著降低資料庫UPDATE壓力"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "監控巡檢週期。預設600秒。非熱門應用程式依週期重算小時/日統計，取代每個批次週期的全量重算，降低寫入放大"
"Monitoring alert period. Default 30 seconds": "監控告警週期。預設30秒"
"Console address. Used for monitoring alert addresses": "主控台位址。用於監控告警位址"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "資料保留時間。取樣明細及分鐘級統計資料，預設3天"
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "中顆粒度資料保留時間。效能資料及小時級統計資料，預設30天"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "大顆粒度資料保留時間。歷史資料及每日統計資料，預設300天"
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "資料清理模式。支援高效Truncate，或無需DDL的Delete，預設Truncate"
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "上傳目錄。存放升級套件，需要與StarWeb設定為同一個目錄，預設../Uploads"
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "上傳套件大小上限。僅作用於 Deploy/UploadBuildFile 介面允許的請求主體位元組數上限，預設100000000（100MB），0表示使用Kestrel預設限制，最大不超過1GB"
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "檔案快取目錄。存放資料庫驅動程式等快取檔案，為空時不啟用，預設../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "檔案快取白名單。若指定，僅允許符合條件的IP來源存取檔案快取，多個以逗號隔開，支援*模糊比對"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "檔案儲存提供服務。是否回應其他節點的檔案下載請求，預設true"
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "檔案儲存拉取檔案。是否主動拉取其他節點發佈的新檔案，預設false"
"Upstream server. Reports data synchronously to the upstream server.": "上層伺服器。同步向上層回報資料"
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "固定城市。預設自動根據IP計算所在城市，開啟後不再自動計算，改為手動設定"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "呼叫鏈允許匿名。允許未登入使用者存取/trace呼叫鏈頁面，監控資料可能含敏感資訊，預設false"
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet同步週期。從官網擷取.NET執行階段安裝套件資訊，0表示停用，單位秒，預設43200（12小時）"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet同步位址。擷取.NET執行階段版本的官方API位址，支援{major}預留位置"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "星塵資源下載基礎位址。StarAgent安裝套件/指令碼的基礎URL，預設官方位址"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "可控節點為空時放行。AllowControlNodes為空時是否允許操作，預設false（安全模式，需明確設定可控節點）。內部環境可設為true以相容舊資料"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "啟用MCP服務。預設關閉，啟用後會暴露 POST /mcp 端點供 LLM/智慧代理呼叫"
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP動作集。逗號分隔的模組名稱（node/app/config/deploy/gateway/monitor/system），*表示全部啟用"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "限流路徑前置詞。逗號分隔，命中則依IP限流，預設登入/權杖等認證介面"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "限流次數。每IP每分鐘允許存取次數，預設60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "允許匿名埋點上報。多層級級聯或極簡SDK需要，預設false（安全）"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "CORS允許的來源。逗號分隔，為空時允許任意來源，指定後僅白名單可跨網域"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "附件下載驗證。是否驗證/cube/file附件下載權杖，預設false"
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "免登入公開附件分類。逗號分隔，命中可匿名下載"
"Attachment download token validity. Seconds, default 600.": "附件下載權杖有效期間。秒，預設600"
