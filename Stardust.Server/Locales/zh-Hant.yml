"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "星塵分散式服務平台後端核心。提供設定中心、註冊中心、服務探索、遠端發佈、效能監控、日誌中心等核心 API 服務，支援應用程式註冊、設定下發、指標彙總、統計計算與工作排程，可橫向擴充。"
"Service port. Default 6600.": "服務連接埠。預設6600"
