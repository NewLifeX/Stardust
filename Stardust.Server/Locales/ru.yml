"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Узел [{0}/{1}] очень похож на существующий узел [{2}]; используется существующий узел"
"Stardust service platform": "Платформа сервисов Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Бэкенд-ядро распределённой платформы сервисов Stardust. Предоставляет основные API-сервисы для центра конфигурации, реестра, обнаружения сервисов, удалённого развёртывания, мониторинга производительности и центра журналов; поддерживает регистрацию приложений, доставку конфигурации, агрегацию метрик, статистические расчёты и планирование задач, а также масштабируется горизонтально."
"Service port. Default 6600.": "Порт службы. По умолчанию 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Секрет токена. Алгоритм и ключ для создания токенов JWT, например HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Срок действия токена. По умолчанию 2*3600 секунд."
"Session timeout. Default 600 seconds": "Тайм-аут сеанса. По умолчанию 600 секунд"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Допустимое отклонение времени для соли. Клиенты используют текущее время как соль при входе; слишком большая разница со временем сервера приведёт к ошибке проверки ключа; по умолчанию 600 секунд"
"Auto-register. Allow node clients to register automatically, default true": "Автоматическая регистрация. Разрешить клиентам узлов регистрироваться автоматически, по умолчанию true"
"Application auto-registration. Allow app clients to register automatically; default true": "Автоматическая регистрация приложений. Разрешить клиентам приложений регистрироваться автоматически; по умолчанию true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Белый список допуска. Если задан, регистрироваться могут только узлы, соответствующие условиям IP, несколько записей через запятую, поддерживается подстановка *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Формула кода узла. Определяет, какая информация об оборудовании в NodeInfo используется для вычисления кода узла. Поддерживаются Crc/Crc16/MD5/MD5_16, по умолчанию Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Порог идентификации кода узла. UUID+Guid+SerialNumber+DiskId+MAC; если несколько из них совпадают, узел считается тем же, по умолчанию 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Период статистики потока мониторинга. По умолчанию 5 секунд. Обрабатывает очередь в памяти для расчёта поминутной статистики; меньшие значения повышают оперативность, но увеличивают нагрузку на CPU, большие значения снижают нагрузку на CPU, но увеличивают задержку оповещений"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Период пакетной статистики мониторинга. По умолчанию 30 секунд. Корректирует данные путём агрегации из базы данных; меньшие значения ускоряют корректировку, но увеличивают нагрузку на IO, большие значения снижают нагрузку, но задерживают корректировку"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Период сохранения мониторинга. По умолчанию 300 секунд. Период пакетной отправки очереди отложенной статистики; оповещения читают актуальные значения из памяти и не затрагиваются. Большие значения значительно снижают нагрузку UPDATE на базу данных"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Период обхода мониторинга. По умолчанию 600 секунд. Периодически пересчитывает почасовую/суточную статистику для непопулярных приложений вместо полного пересчёта в каждом пакетном цикле, снижая усиление записи"
"Monitoring alert period. Default 30 seconds": "Период оповещения мониторинга. По умолчанию 30 секунд"
"Console address. Used for monitoring alert addresses": "Адрес консоли. Используется для адресов оповещений мониторинга"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Срок хранения данных. Детали выборок и статистика с минутной гранулярностью; по умолчанию 3 дня."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Время хранения данных средней детализации. Данные производительности и почасовая статистика, по умолчанию 30 дней"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Срок хранения крупнозернистых данных. Исторические данные и суточная статистика, по умолчанию 300 дней."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Режим очистки данных. Поддерживает эффективный Truncate или Delete без DDL. По умолчанию Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Каталог загрузки. Хранит пакеты обновления и должен совпадать с каталогом, настроенным для StarWeb. По умолчанию ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Максимальный размер пакета загрузки. Применяется только к максимально допустимому числу байт тела запроса конечной точки Deploy/UploadBuildFile; по умолчанию 100000000 (100MB), 0 означает использование ограничения Kestrel по умолчанию, максимум 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Каталог кэша файлов. Хранит файлы кэша, например драйверы баз данных; при пустом значении отключён; по умолчанию ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Белый список кэша файлов. Если указан, доступ к кэшу файлов разрешён только соответствующим источникам IP; несколько записей разделяйте запятыми; поддерживаются подстановочные знаки *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Служба файлового хранилища. Отвечать на запросы других узлов на скачивание файлов. По умолчанию true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Загрузка из файлового хранилища. Активно загружать новые файлы, опубликованные другими узлами. По умолчанию false."
"Upstream server. Reports data synchronously to the upstream server.": "Вышестоящий сервер. Синхронно передаёт данные вышестоящему серверу."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Фиксированный город. По умолчанию город определяется автоматически по IP. При включении автоматический расчёт отключается, и город задаётся вручную"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Разрешить анонимный доступ к трассировке. Разрешает неавторизованным пользователям открывать страницу трассировки /trace; данные мониторинга могут содержать конфиденциальную информацию. По умолчанию false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Интервал синхронизации dotNet. Получение сведений об установщике .NET runtime с официального сайта, 0 — отключено, единица — секунды, по умолчанию 43200 (12 часов)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Адрес синхронизации dotNet. Официальный адрес API для получения версий .NET runtime, поддерживает подстановку {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Базовый адрес загрузки ресурсов Stardust. Базовый URL для установщиков/скриптов StarAgent; по умолчанию официальный адрес"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Разрешать при пустых управляемых узлах. Разрешать ли операции, когда AllowControlNodes пуст, по умолчанию false (безопасный режим, управляемые узлы нужно задать явно). Во внутренних средах можно установить true для совместимости со старыми данными"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Включить службу MCP. По умолчанию отключена; после включения предоставляет конечную точку POST /mcp для вызовов LLM/агентов."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Набор действий MCP. Имена модулей через запятую (node/app/config/deploy/gateway/monitor/system), * — включить все"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Префиксы путей для ограничения частоты. Через запятую; для совпадающих путей применяется ограничение по IP; по умолчанию — эндпоинты аутентификации, такие как login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Ограничение частоты. Количество разрешённых запросов на IP в минуту; по умолчанию 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Разрешить анонимную отправку телеметрии. Требуется для многоуровневого каскадирования или минимального SDK; по умолчанию false (безопасно)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Разрешённые источники CORS. Через запятую; пусто разрешает любой источник; после указания cross-origin разрешён только источникам из белого списка"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Аутентификация скачивания вложений. Проверять ли токен скачивания вложений для /cube/file. По умолчанию false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Общедоступные категории вложений без входа. Через запятую, совпавшие элементы можно скачать анонимно."
"Attachment download token validity. Seconds, default 600.": "Срок действия токена скачивания вложений. Секунды, по умолчанию 600."
