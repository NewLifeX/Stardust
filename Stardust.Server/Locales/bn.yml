"Session timeout. Default 600 seconds": "সেশন টাইমআউট। ডিফল্ট 600 সেকেন্ড"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "সল বিচ্যুতি সময়। ক্লায়েন্ট লগইন করার সময় বর্তমান সময়কে সল হিসেবে ব্যবহার করে; সার্ভারের সাথে সময়ের ব্যবধান বেশি হলে কী যাচাইকরণ ব্যর্থ হবে; ডিফল্ট 600 সেকেন্ড"
"Auto-register. Allow node clients to register automatically, default true": "স্বয়ংক্রিয় নিবন্ধন। নোড ক্লায়েন্টদের স্বয়ংক্রিয়ভাবে নিবন্ধন করতে দিন, ডিফল্ট true"
"Application auto-registration. Allow app clients to register automatically; default true": "অ্যাপ্লিকেশন স্বয়ংক্রিয় নিবন্ধন। অ্যাপ ক্লায়েন্টদের স্বয়ংক্রিয়ভাবে নিবন্ধন করার অনুমতি দিন; ডিফল্ট true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "ভর্তি হোয়াইটলিস্ট। নির্দিষ্ট করা হলে, শুধুমাত্র IP শর্ত পূরণকারী নোড নিবন্ধন করতে পারবে, একাধিক কমা দিয়ে আলাদা করুন, * ওয়াইল্ডকার্ড মিলন সমর্থিত"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "নোড কোড সূত্র। NodeInfo-এর কোন হার্ডওয়্যার তথ্য নোড কোড গণনার জন্য ব্যবহার হবে তা নির্বাচন করে। Crc/Crc16/MD5/MD5_16 সমর্থিত, ডিফল্ট Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "নোড কোড শনাক্তকরণ থ্রেশহোল্ড। UUID+Guid+SerialNumber+DiskId+MAC; এর মধ্যে কয়েকটি মিললে একই নোড হিসাবে ধরা হয়, ডিফল্ট 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "মনিটরিং স্ট্রিম পরিসংখ্যানের সময়কাল। ডিফল্ট 5 সেকেন্ড। মিনিট-স্তরের পরিসংখ্যান গণনার জন্য ইন-মেমরি সারি প্রক্রিয়া করে; ছোট মান রিয়েল-টাইম প্রতিক্রিয়া বাড়ায় কিন্তু CPU ব্যবহার বাড়ায়, বড় মান CPU ব্যবহার কমায় কিন্তু সতর্কতার বিলম্ব বাড়ায়"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "মনিটরিং ব্যাচ পরিসংখ্যান সময়কাল। ডিফল্ট 30 সেকেন্ড। ডাটাবেস থেকে একত্রিত করে ডেটা সংশোধন করে; ছোট মান সংশোধন দ্রুত করে কিন্তু IO চাপ বাড়ায়, বড় মান চাপ কমায় কিন্তু সংশোধন বিলম্বিত করে"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "মনিটরিং ফ্লাশ সময়কাল। ডিফল্ট 300 সেকেন্ড। পরিসংখ্যান বিলম্ব সারির ব্যাচ কমিট সময়কাল; সতর্কতাগুলি মেমোরির রিয়েল-টাইম মান পড়ে এবং প্রভাবিত হয় না। বড় মান ডাটাবেস UPDATE চাপ উল্লেখযোগ্যভাবে কমায়"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "মনিটরিং পরিদর্শন সময়কাল। ডিফল্ট 600 সেকেন্ড। জনপ্রিয় নয় এমন অ্যাপ্লিকেশনগুলির জন্য ঘণ্টা/দিনের পরিসংখ্যান পর্যায়ক্রমে পুনরায় গণনা করে, প্রতিটি ব্যাচ চক্রে সম্পূর্ণ পুনরায় গণনার পরিবর্তে, যা রাইট অ্যামপ্লিফিকেশন কমায়"
"Monitoring alert period. Default 30 seconds": "মনিটরিং সতর্কতার সময়কাল। ডিফল্ট 30 সেকেন্ড"
"Console address. Used for monitoring alert addresses": "কনসোল ঠিকানা। মনিটরিং সতর্কতা ঠিকানার জন্য ব্যবহৃত হয়"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "ডেটা ধারণ সময়কাল। নমুনা বিশদ এবং মিনিট-স্তরের পরিসংখ্যান; ডিফল্ট 3 দিন।"
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "মাঝারি দানার ডেটা ধারণকাল। পারফরম্যান্স ডেটা ও ঘণ্টাভিত্তিক পরিসংখ্যান, ডিফল্ট 30 দিন"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "স্থূল দানার ডেটা সংরক্ষণের সময়কাল। ঐতিহাসিক ডেটা ও দৈনিক পরিসংখ্যান, ডিফল্ট 300 দিন।"
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "ডেটা পরিষ্কার মোড। দক্ষ Truncate বা DDL ছাড়া Delete সমর্থন করে। ডিফল্ট Truncate।"
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "আপলোড ডিরেক্টরি। আপগ্রেড প্যাকেজ সংরক্ষণ করে এবং StarWeb-এর জন্য কনফিগার করা একই ডিরেক্টরি হতে হবে। ডিফল্ট ../Uploads।"
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "সর্বোচ্চ আপলোড প্যাকেজ আকার। শুধুমাত্র Deploy/UploadBuildFile এন্ডপয়েন্টের জন্য অনুমোদিত সর্বোচ্চ রিকোয়েস্ট বডি বাইটে প্রযোজ্য; ডিফল্ট 100000000 (100MB), 0 মানে Kestrel ডিফল্ট সীমা ব্যবহার, সর্বোচ্চ 1GB।"
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "ফাইল ক্যাশে ডিরেক্টরি। ডেটাবেস ড্রাইভার ইত্যাদি ক্যাশে ফাইল সংরক্ষণ করে; খালি থাকলে সক্রিয় হয় না; ডিফল্ট ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "ফাইল ক্যাশে হোয়াইটলিস্ট। নির্দিষ্ট করা হলে, শুধুমাত্র মিলে যাওয়া IP উৎসগুলি ফাইল ক্যাশে অ্যাক্সেস করতে পারবে; একাধিক এন্ট্রি কমা দিয়ে আলাদা করুন; * ওয়াইল্ডকার্ড সমর্থন করে"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "ফাইল স্টোরেজ পরিষেবা। অন্য নোডের ফাইল ডাউনলোড অনুরোধে সাড়া দেবে কিনা। ডিফল্ট true।"
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "ফাইল স্টোরেজ পুল। অন্য নোড দ্বারা প্রকাশিত নতুন ফাইল সক্রিয়ভাবে পুল করবেন কিনা। ডিফল্ট false।"
"Upstream server. Reports data synchronously to the upstream server.": "আপস্ট্রিম সার্ভার। আপস্ট্রিম সার্ভারে সমকালীনভাবে ডেটা রিপোর্ট করে।"
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "নির্দিষ্ট শহর। ডিফল্টভাবে IP থেকে শহর স্বয়ংক্রিয়ভাবে গণনা করা হয়। সক্রিয় করলে স্বয়ংক্রিয় গণনা বন্ধ হয়ে শহরটি ম্যানুয়ালি সেট করা হয়"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "বেনামী ট্রেস অ্যাক্সেসের অনুমতি দিন। লগইন না করা ব্যবহারকারীদের /trace ট্রেস পৃষ্ঠা দেখার অনুমতি দিন; মনিটরিং ডেটায় সংবেদনশীল তথ্য থাকতে পারে। ডিফল্ট false।"
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet সিঙ্ক ব্যবধান। অফিসিয়াল সাইট থেকে .NET রানটাইম ইনস্টলার তথ্য আনুন, 0 মানে নিষ্ক্রিয়, একক সেকেন্ড, ডিফল্ট 43200 (12 ঘণ্টা)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet সিঙ্ক ঠিকানা। .NET রানটাইম সংস্করণ আনতে অফিসিয়াল API ঠিকানা, {major} প্লেসহোল্ডার সমর্থিত"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Stardust রিসোর্স ডাউনলোড বেস ঠিকানা। StarAgent ইনস্টলার/স্ক্রিপ্টের বেস URL; ডিফল্ট অফিসিয়াল ঠিকানা"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "নিয়ন্ত্রণযোগ্য নোড খালি থাকলে অনুমতি দিন। AllowControlNodes খালি থাকলে অপারেশন অনুমোদিত হবে কিনা, ডিফল্ট false (নিরাপদ মোড, নিয়ন্ত্রণযোগ্য নোড স্পষ্টভাবে কনফিগার করতে হবে)। পুরোনো ডেটার সাথে সামঞ্জস্যের জন্য অভ্যন্তরীণ পরিবেশে true সেট করা যায়"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP পরিষেবা সক্ষম করুন। ডিফল্টভাবে বন্ধ, সক্ষম করলে LLM/এজেন্ট কলের জন্য POST /mcp এন্ডপয়েন্ট প্রকাশ করে।"
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP অ্যাকশন সেট। কমা দিয়ে আলাদা মডিউল নাম (node/app/config/deploy/gateway/monitor/system), * মানে সব সক্রিয়"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "রেট লিমিট পাথ প্রিফিক্স। কমা দিয়ে আলাদা; মিলে যাওয়া পাথগুলি IP অনুযায়ী রেট-লিমিট করা হয়; ডিফল্ট login/token ইত্যাদি প্রমাণীকরণ এন্ডপয়েন্ট"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "রেট লিমিট সংখ্যা। প্রতি IP প্রতি মিনিটে অনুমোদিত অনুরোধের সংখ্যা; ডিফল্ট 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "বেনামি টেলিমেট্রি রিপোর্টিং অনুমোদন করুন। বহু-স্তরের ক্যাসকেডিং বা ন্যূনতম SDK-এর জন্য প্রয়োজন; ডিফল্ট false (নিরাপদ)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "CORS অনুমোদিত উৎস। কমা দিয়ে আলাদা; খালি হলে যেকোনো উৎস অনুমোদিত; নির্দিষ্ট করলে শুধুমাত্র হোয়াইটলিস্টভুক্ত উৎস ক্রস-অরিজিন করতে পারবে"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "সংযুক্তি ডাউনলোড প্রমাণীকরণ। /cube/file-এর জন্য সংযুক্তি ডাউনলোড টোকেন যাচাই করা হবে কি না। ডিফল্ট false।"
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "লগইন ছাড়াই প্রকাশ্য সংযুক্তির শ্রেণি। কমা দিয়ে পৃথক, মিলে যাওয়া আইটেম বেনামে ডাউনলোড করা যায়।"
"Attachment download token validity. Seconds, default 600.": "সংযুক্তি ডাউনলোড টোকেনের বৈধতা। সেকেন্ড, ডিফল্ট 600।"
