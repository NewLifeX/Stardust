"The pipeline configuration does not exist.": "파이프라인 구성이 없습니다."
"Auto deploy is disabled; the pipeline ends.": "자동 배포가 비활성화되어 파이프라인을 종료합니다."
"The build succeeded but produced no deployable version (upload may be disabled); auto deploy is not possible.": "빌드는 성공했지만 배포 가능한 버전이 생성되지 않았습니다(업로드가 비활성화되었을 수 있음). 자동 배포를 할 수 없습니다."
"Starting auto deploy, run={0}, version={1}": "자동 배포 시작, run={0}, 버전={1}"
"Failed to dispatch the deploy command.": "배포 명령을 보내지 못했습니다."
"No deployable node was found; check the pipeline deploy node configuration.": "배포 가능한 노드를 찾지 못했습니다. 파이프라인 배포 노드 구성을 확인하세요."
"Deployment completed.": "배포가 완료되었습니다."
"Auto deploy was not triggered: no deploy node is selected for the pipeline.": "자동 배포가 트리거되지 않았습니다. 파이프라인에 배포 노드가 선택되지 않았습니다."
"Deploy command dispatched to node {0} (CommandId={1}).": "노드 {0}에 배포 명령을 보냈습니다(CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "노드 {0}에 배포 명령을 보내지 못했습니다: {1}"
"Application authentication": "애플리케이션 인증"
"Application re-registered": "애플리케이션 재등록됨"
"Application registered": "애플리케이션 등록됨"
"Node authentication": "노드 인증"
"Login validation": "로그인 검증"
"Matched existing node": "기존 노드와 일치"
"Auto update": "자동 업데이트"
"Push dotNet": "dotNet 푸시"
"Timed out offline": "오프라인 시간 초과"
"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "비밀 키가 비어 있는 애플리케이션은 로그인할 수 없습니다. 레지스트리에서 이 애플리케이션의 Secret을 설정하거나 재등록을 활성화하세요."
"Secret validation failed.": "비밀 키 검증에 실패했습니다."
"[{0}] re-registered in [{1}] mode; secret issued": "[{0}]이(가) [{1}] 모드로 재등록되었습니다. 비밀 키가 발급되었습니다"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "[{0}]이(가) [{1}] 모드로 재등록되었습니다. 비밀 키가 발급되었습니다, UUID={2}"
"[{0}] registered successfully.": "[{0}] 등록에 성공했습니다."
"[{0}] registration failed: {1}": "[{0}] 등록 실패: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] 인증됨 {2}"
"Registered service [{0}] {1}": "등록된 서비스 [{0}] {1}"
"Service [{0}] went offline: {1}": "[{0}] 서비스가 오프라인 상태가 되었습니다: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "[{0}] 비밀 키가 일치하지 않지만 [{1}] 모드에서 허용되었습니다"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] 클라이언트가 이제 올바른 비밀 키를 가지고 있어 수렴 기간이 자동으로 닫혔습니다"
"Hardware information changed too much.": "하드웨어 정보가 너무 많이 변경되었습니다."
"Unique identifier mismatch (new != old): {0} != {1}": "고유 식별자 불일치(신규 != 기존): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "시스템 식별자 불일치(신규 != 기존): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "컴퓨터 일련 번호 불일치(신규 != 기존): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "마더보드 불일치(신규 != 기존): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "제품 코드 불일치(신규 != 기존): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "시스템 이름 불일치(신규 != 기존): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "MAC 주소 불일치(신규 != 기존): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "디스크 일련 번호 불일치(신규 != 기존): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "버전={0} 크기={1:n0} 노드={2}"
"Associated online": "온라인 연결됨"
"Dynamic registration": "동적 등록"
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to detect from each request in web hosts and to follow the system language otherwise": "UI 언어입니다(예: zh-Hans, zh-Hant, en, ja). 웹 호스트에서는 각 요청에서 감지하도록 비워 두고, 그 외에는 시스템 언어를 따릅니다"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] 로그인 시간 {2}, 마지막 활동 {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "노드 [{0}/{1}]이(가) 기존 노드 [{2}]와 매우 유사하여 기존 노드를 사용합니다"
"Stardust service platform": "Stardust 서비스 플랫폼"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Stardust 분산 서비스 플랫폼의 백엔드 코어입니다. 구성 센터, 레지스트리, 서비스 검색, 원격 배포, 성능 모니터링, 로그 센터를 위한 핵심 API 서비스를 제공하며, 애플리케이션 등록, 구성 배포, 메트릭 집계, 통계 계산, 작업 예약을 지원하고 수평 확장이 가능합니다."
"Service port. Default 6600.": "서비스 포트입니다. 기본값 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "토큰 비밀. JWT 토큰을 생성하는 데 사용하는 알고리즘과 비밀 값입니다. 예: HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "토큰 유효 기간. 기본 2*3600초."
"Session timeout. Default 600 seconds": "세션 시간 제한. 기본 600초"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "솔트 편차 시간. 클라이언트는 로그인 시 현재 시간을 솔트로 사용합니다. 서버와 시간 차이가 너무 크면 키 검증이 실패합니다. 기본값 600초"
"Auto-register. Allow node clients to register automatically, default true": "자동 등록. 노드 클라이언트의 자동 등록 허용, 기본값 true"
"Application auto-registration. Allow app clients to register automatically; default true": "애플리케이션 자동 등록. 앱 클라이언트의 자동 등록을 허용합니다. 기본값 true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "승인 화이트리스트. 지정하면 IP 조건에 맞는 노드만 등록할 수 있으며, 여러 개는 쉼표로 구분하고 * 와일드카드 일치를 지원합니다"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "노드 코드 수식. 노드 코드 계산에 NodeInfo의 어떤 하드웨어 정보를 사용할지 선택합니다. Crc/Crc16/MD5/MD5_16 지원, 기본 Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "노드 코드 식별 임계값. UUID+Guid+SerialNumber+DiskId+MAC 중 몇 개가 일치하면 동일한 노드로 간주합니다. 기본 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "모니터링 스트림 통계 주기. 기본 5초. 메모리 내 큐를 처리하여 분 단위 통계를 계산합니다. 값을 작게 하면 실시간성이 향상되지만 CPU 사용량이 늘고, 크게 하면 CPU 사용량은 줄지만 경보 지연이 늘어납니다"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "모니터링 배치 통계 주기. 기본 30초. 데이터베이스에서 집계하여 데이터를 보정합니다. 값을 작게 하면 보정 속도가 빨라지지만 IO 부하가 늘고, 크게 하면 부하는 줄지만 보정이 지연됩니다"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "모니터링 기록 주기. 기본 300초. 통계 지연 큐의 일괄 커밋 주기입니다. 경보는 메모리의 실시간 값을 읽으므로 영향을 받지 않습니다. 값을 크게 하면 데이터베이스 UPDATE 부하가 크게 줄어듭니다"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "모니터링 점검 주기. 기본 600초. 인기 없는 애플리케이션의 시간/일 통계를 각 배치 주기의 전체 재계산 대신 주기적으로 재계산하여 쓰기 증폭을 줄입니다"
"Monitoring alert period. Default 30 seconds": "모니터링 경보 주기. 기본 30초"
"Console address. Used for monitoring alert addresses": "콘솔 주소. 모니터링 경보 주소에 사용됩니다"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "데이터 보존 기간. 샘플 상세 및 분 단위 통계 데이터, 기본 3일."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "중간 단위 데이터 보존 기간. 성능 데이터 및 시간별 통계, 기본값 30일"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "대용량 데이터 보존 기간입니다. 이력 데이터 및 일별 통계, 기본값 300일."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "데이터 정리 모드. 효율적인 Truncate 또는 DDL이 필요 없는 Delete를 지원합니다. 기본 Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "업로드 디렉터리. 업그레이드 패키지를 저장하며 StarWeb에 구성된 것과 동일한 디렉터리여야 합니다. 기본 ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "최대 업로드 패키지 크기. Deploy/UploadBuildFile 엔드포인트에서 허용되는 최대 요청 본문 바이트에만 적용됩니다. 기본 100000000(100MB), 0은 Kestrel 기본 제한 사용, 최대 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "파일 캐시 디렉터리. 데이터베이스 드라이버 등의 캐시 파일을 저장합니다. 비어 있으면 비활성화됩니다. 기본값 ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "파일 캐시 허용 목록. 지정하면 일치하는 IP 출처만 파일 캐시에 접근할 수 있습니다. 여러 항목은 쉼표로 구분합니다. * 와일드카드를 지원합니다"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "파일 저장소 제공. 다른 노드의 파일 다운로드 요청에 응답할지 여부. 기본 true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "파일 저장소 가져오기. 다른 노드가 게시한 새 파일을 능동적으로 가져올지 여부. 기본 false."
"Upstream server. Reports data synchronously to the upstream server.": "상위 서버. 데이터를 상위 서버로 동기 보고합니다."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "고정 도시. 기본적으로 IP에서 도시를 자동 계산합니다. 활성화하면 자동 계산을 중단하고 수동으로 설정합니다"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "익명 추적 액세스를 허용합니다. 로그인하지 않은 사용자가 /trace 추적 페이지에 액세스할 수 있도록 합니다. 모니터링 데이터에 민감한 정보가 포함될 수 있습니다. 기본값 false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet 동기화 주기. 공식 사이트에서 .NET 런타임 설치 프로그램 정보를 가져오며, 0은 비활성화, 단위는 초, 기본값 43200(12시간)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet 동기화 주소. .NET 런타임 버전을 가져오는 공식 API 주소이며 {major} 자리 표시자를 지원합니다"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Stardust 리소스 다운로드 기본 주소. StarAgent 설치 프로그램/스크립트의 기본 URL입니다. 기본값은 공식 주소입니다"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "제어 가능 노드가 비어 있을 때 허용. AllowControlNodes가 비어 있을 때 작업을 허용할지 여부입니다. 기본 false(보안 모드, 제어 가능 노드를 명시적으로 구성해야 함). 내부 환경에서는 이전 데이터와의 호환성을 위해 true로 설정할 수 있습니다"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP 서비스 사용. 기본적으로 꺼져 있으며, 사용하면 LLM/에이전트 호출용 POST /mcp 엔드포인트를 노출합니다."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP 액션 집합. 쉼표로 구분된 모듈 이름(node/app/config/deploy/gateway/monitor/system)이며, *는 모두 활성화를 의미합니다"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "속도 제한 경로 접두사. 쉼표로 구분합니다. 일치하는 경로는 IP별로 속도 제한됩니다. 기본값은 login/token 등의 인증 엔드포인트입니다"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "속도 제한 횟수. IP당 분당 허용되는 요청 수입니다. 기본값 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "익명 원격 측정 보고를 허용합니다. 다단계 계단식 연결이나 최소 SDK에 필요합니다. 기본값 false(안전)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "CORS 허용 원본. 쉼표로 구분하며, 비워 두면 모든 원본을 허용하고, 지정하면 화이트리스트에 있는 원본만 교차 출처를 허용합니다"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "첨부 파일 다운로드 인증입니다. /cube/file의 첨부 파일 다운로드 토큰을 확인할지 여부입니다. 기본값 false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "로그인 없이 사용할 수 있는 공개 첨부 파일 분류. 쉼표로 구분하며, 일치하는 항목은 익명으로 다운로드할 수 있습니다."
"Attachment download token validity. Seconds, default 600.": "첨부 파일 다운로드 토큰 유효 기간입니다. 초, 기본값 600."
