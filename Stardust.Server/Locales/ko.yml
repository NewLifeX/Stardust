"The build succeeded but produced no deployable version (upload may be disabled); auto deploy is not possible.": "빌드는 성공했지만 배포 가능한 버전이 생성되지 않았습니다(업로드가 비활성화되었을 수 있음). 자동 배포를 할 수 없습니다."
"Starting auto deploy, run={0}, version={1}": "자동 배포 시작, run={0}, 버전={1}"
"Failed to dispatch the deploy command.": "배포 명령을 보내지 못했습니다."
"No deployable node was found; check the pipeline deploy node configuration.": "배포 가능한 노드를 찾지 못했습니다. 파이프라인 배포 노드 구성을 확인하세요."
"Deployment completed.": "배포가 완료되었습니다."
"Auto deploy was not triggered: no deploy node is selected for the pipeline.": "자동 배포가 트리거되지 않았습니다. 파이프라인에 배포 노드가 선택되지 않았습니다."
"Deploy command dispatched to node {0} (CommandId={1}).": "노드 {0}에 배포 명령을 보냈습니다(CommandId={1})."
"Failed to dispatch the deploy command to node {0}: {1}": "노드 {0}에 배포 명령을 보내지 못했습니다: {1}"
