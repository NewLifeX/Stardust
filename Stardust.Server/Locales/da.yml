"Stardust service platform": "Stardust-serviceplatform"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Backendkernen i den distribuerede Stardust-serviceplatform. Leverer centrale API-tjenester til konfigurationscenter, register, tjenestefinding, fjernudrulning, ydeevneovervågning og logcenter, understøtter applikationsregistrering, konfigurationsudrulning, metrikaggregering, statistikberegning og opgaveplanlægning og kan skalere horisontalt."
"Service port. Default 6600.": "Tjenesteport. Standard 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Tokenhemmelighed. Algoritme og hemmelighed, der bruges til at generere JWT-tokener, f.eks. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Tokens gyldighedsperiode. Standard 2*3600 sekunder."
"Session timeout. Default 600 seconds": "Sessionstimeout. Standard 600 sekunder"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Saltafvigelsestid. Klienten bruger aktuel tid som salt ved login; for stor tidsforskel fra serveren får nøgleverificeringen til at fejle; standard 600 sekunder"
"Auto-register. Allow node clients to register automatically, default true": "Automatisk registrering. Tillad nodeklienter at registrere sig automatisk, standard true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatisk applikationsregistrering. Tillad, at appklienter registrerer sig automatisk; standard true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Adgangs-hvidliste. Hvis angivet, kan kun noder, der matcher IP-betingelserne, registrere sig; adskil flere med komma; understøtter *-jokertegn"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formel for nodekode. Vælger hvilke hardwareoplysninger i NodeInfo der bruges til at beregne nodekoden. Understøtter Crc/Crc16/MD5/MD5_16, standard Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Grænse for nodekodeidentifikation. UUID+Guid+SerialNumber+DiskId+MAC; hvis flere af dem matcher, betragtes noden som den samme, standard 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Statistikperiode for overvågningsstrøm. Standard 5 sekunder. Behandler køen i hukommelsen for at beregne statistik på minuteniveau; mindre værdier forbedrer realtiden, men øger CPU-forbruget, større værdier reducerer CPU-forbruget, men øger alarmforsinkelsen"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Batch-statistikperiode for overvågning. Standard 30 sekunder. Retter data ved at aggregere fra databasen; mindre værdier fremskynder rettelsen, men øger IO-belastningen, større værdier reducerer belastningen, men forsinker rettelsen"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Periode for overvågningslagring. Standard 300 sekunder. Batch-commitperiode for statistikforsinkelseskøen; alarmer læser realtidsværdier i hukommelsen og påvirkes ikke. Større værdier reducerer database-UPDATE-belastningen betydeligt"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Inspektionsperiode for overvågning. Standard 600 sekunder. Genberegner time-/dagsstatistik for ikke-populære applikationer periodisk i stedet for fuld genberegning i hver batch-cyklus, hvilket reducerer write amplification"
"Monitoring alert period. Default 30 seconds": "Overvågningsalarmperiode. Standard 30 sekunder"
"Console address. Used for monitoring alert addresses": "Konsoladresse. Bruges til overvågningsalarmadresser"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Dataopbevaringsperiode. Prøvedetaljer og statistik på minuteniveau; standard 3 dage."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Opbevaringstid for data med mellem granularitet. Ydelsesdata og timestatistik, standard 30 dage"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Opbevaringsperiode for grovkornede data. Historiske data og daglig statistik, standard 300 dage."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Rydningstilstand for data. Understøtter effektiv Truncate eller Delete uden DDL. Standard Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Uploadmappe. Gemmer opgraderingspakker og skal være den samme mappe, der er konfigureret til StarWeb. Standard ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maksimal uploadpakningsstørrelse. Gælder kun for det maksimalt tilladte antal byte i anmodningsteksten for Deploy/UploadBuildFile-endpointet; standard 100000000 (100MB), 0 betyder brug Kestrels standardgrænse, maks. 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Bibliotek til filcache. Gemmer cachefiler som databasedrivere; deaktiveret når tom; standard ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Hvidliste for filcache. Hvis angivet, har kun matchende IP-kilder adgang til filcachen; adskil flere poster med kommaer; understøtter * jokertegn"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Fillagringstjeneste. Om der skal svares på filDownloadanmodninger fra andre noder. Standard true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "FilLagringsudtræk. Om der aktivt skal hentes nye filer udgivet af andre noder. Standard false."
"Upstream server. Reports data synchronously to the upstream server.": "Overordnet server. Rapporterer data synkront til den overordnede server."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Fast by. Som standard beregnes byen automatisk ud fra IP'en. Når den er aktiveret, beregnes byen ikke længere automatisk, og den angives manuelt"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Tillad anonym sporingsadgang. Tillad ikke-loggede brugere at få adgang til sporingssiden /trace; overvågningsdata kan indeholde følsomme oplysninger. Standard false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet-synkroniseringsinterval. Hent .NET runtime-installationsinformation fra det officielle websted, 0 deaktiverer, enhed sekunder, standard 43200 (12 timer)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet-synkroniseringsadresse. Officiel API-adresse til hentning af .NET-runtimeversioner, understøtter pladsholderen {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Basisadresse for download af Stardust-ressourcer. Basis-URL til StarAgent-installationsprogrammer/script; standard den officielle adresse"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Tillad når styrbare noder er tomme. Om handlinger er tilladt, når AllowControlNodes er tom, standard false (sikker tilstand, styrbare noder skal konfigureres eksplicit). Interne miljøer kan sætte den til true for kompatibilitet med ældre data"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Aktivér MCP-tjenesten. Deaktiveret som standard; når den er aktiveret, eksponeres POST /mcp-endpointet til LLM/agent-kald."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP-handlingssæt. Kommaseparerede modulnavne (node/app/config/deploy/gateway/monitor/system), * betyder alle aktiveret"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Stiforstier for hastighedsgrænse. Kommasepareret; matchende stier begrænses efter IP; standard er godkendelsesendepunkter som login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Grænseværdi for hastighed. Antal tilladte anmodninger pr. IP pr. minut; standard 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Tillad anonym telemetrirapportering. Påkrævet for flertrins-kaskadering eller minimal SDK; standard false (sikkert)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Tilladte CORS-oprindelser. Kommasepareret; tom tillader enhver oprindelse; når angivet, må kun hvidlistede oprindelser bruge cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Godkendelse af vedhæftningsdownload. Om downloadtoken for vedhæftninger skal kontrolleres for /cube/file. Standard false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Offentlige vedhæftningskategorier uden login. Kommasepareret, matchende elementer kan downloades anonymt."
"Attachment download token validity. Seconds, default 600.": "Gyldighed for downloadtoken til vedhæftninger. Sekunder, standard 600."
