"[{0}] is not allowed to operate application [{1}].\nFor security, applications cannot send control commands to other applications by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all applications.": "[{0}] tidak dibenarkan mengendalikan aplikasi [{1}].\nDemi keselamatan, aplikasi tidak boleh menghantar arahan kawalan kepada aplikasi lain secara lalai.\nDalam pendaftaran, edit nod yang boleh dikawal oleh [{0}], tambah [{2}], atau tetapkan kepada * untuk semua aplikasi."
