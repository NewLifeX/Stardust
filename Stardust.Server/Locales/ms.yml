"Stardust service platform": "Platform perkhidmatan Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Teras backend platform perkhidmatan teragih Stardust. Menyediakan perkhidmatan API teras untuk pusat konfigurasi, pendaftaran, penemuan perkhidmatan, penggunaan jauh, pemantauan prestasi dan pusat log; menyokong pendaftaran aplikasi, penghantaran konfigurasi, pengagregatan metrik, pengiraan statistik dan penjadualan tugas, serta boleh diskalakan secara mendatar."
"Service port. Default 6600.": "Port perkhidmatan. Lalai 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Rahsia token. Algoritma dan rahsia yang digunakan untuk menjana token JWT, cth. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Tempoh sah token. Lalai 2*3600 saat."
"Session timeout. Default 600 seconds": "Tamat masa sesi. Lalai 600 saat"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Masa sisihan salt. Klien menggunakan masa semasa sebagai salt semasa log masuk; perbezaan masa yang terlalu besar dengan pelayan menyebabkan pengesahan kunci gagal; lalai 600 saat"
"Auto-register. Allow node clients to register automatically, default true": "Pendaftaran automatik. Benarkan klien nod mendaftar secara automatik, lalai true"
"Application auto-registration. Allow app clients to register automatically; default true": "Pendaftaran automatik aplikasi. Benarkan klien aplikasi mendaftar secara automatik; lalai true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Senarai putih kemasukan. Jika dinyatakan, hanya nod yang memenuhi syarat IP boleh mendaftar, pisahkan berbilang entri dengan koma, menyokong padanan kad bebas *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formula kod nod. Memilih maklumat perkakasan mana dalam NodeInfo yang digunakan untuk mengira kod nod. Menyokong Crc/Crc16/MD5/MD5_16, lalai Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Ambang pengenalan kod nod. UUID+Guid+SerialNumber+DiskId+MAC; jika beberapa daripadanya sepadan, nod dianggap sama, lalai 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Tempoh statistik strim pemantauan. Lalai 5 saat. Memproses baris gilir dalam memori untuk mengira statistik tahap minit; nilai lebih kecil meningkatkan kemas kini masa nyata tetapi menambah penggunaan CPU, nilai lebih besar mengurangkan penggunaan CPU tetapi menambah kependaman amaran"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Tempoh statistik kelompok pemantauan. Lalai 30 saat. Membetulkan data dengan agregasi daripada pangkalan data; nilai lebih kecil mempercepat pembetulan tetapi menambah tekanan IO, nilai lebih besar mengurangkan tekanan tetapi melambatkan pembetulan"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Tempoh simpanan pemantauan. Lalai 300 saat. Tempoh komit kelompok baris gilir kelewatan statistik; amaran membaca nilai masa nyata dalam memori dan tidak terjejas. Nilai lebih besar mengurangkan tekanan UPDATE pangkalan data dengan ketara"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Tempoh pemeriksaan pemantauan. Lalai 600 saat. Mengira semula statistik setiap jam/harian untuk aplikasi tidak popular secara berkala dan bukannya pengiraan semula penuh dalam setiap kitaran kelompok, sekali gus mengurangkan penguatan tulisan"
"Monitoring alert period. Default 30 seconds": "Tempoh amaran pemantauan. Lalai 30 saat"
"Console address. Used for monitoring alert addresses": "Alamat konsol. Digunakan untuk alamat amaran pemantauan"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Tempoh penyimpanan data. Butiran sampel dan statistik tahap minit; lalai 3 hari."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Tempoh simpan data berbutir sederhana. Data prestasi dan statistik setiap jam, lalai 30 hari"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Tempoh penyimpanan data berbutir kasar. Data sejarah dan statistik harian, lalai 300 hari."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Mod pembersihan data. Menyokong Truncate cekap atau Delete tanpa DDL. Lalai Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Direktori muat naik. Menyimpan pakej peningkatan dan mesti direktori yang sama dikonfigurasikan untuk StarWeb. Lalai ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Saiz maksimum pakej muat naik. Hanya terpakai kepada bilangan bait badan permintaan maksimum yang dibenarkan oleh titik akhir Deploy/UploadBuildFile; lalai 100000000 (100MB), 0 bermaksud guna had lalai Kestrel, maksimum 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Direktori cache fail. Menyimpan fail cache seperti pemacu pangkalan data; dinyahdayakan jika kosong; lalai ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Senarai putih cache fail. Jika dinyatakan, hanya sumber IP yang sepadan boleh mengakses cache fail; pisahkan berbilang entri dengan koma; menyokong wildcard *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Perkhidmatan storan fail. Sama ada hendak membalas permintaan muat turun fail daripada nod lain. Lalai true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Tarikan storan fail. Sama ada hendak menarik fail baharu yang diterbitkan oleh nod lain secara aktif. Lalai false."
"Upstream server. Reports data synchronously to the upstream server.": "Pelayan huluan. Melaporkan data secara segerak kepada pelayan huluan."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Bandar tetap. Secara lalai bandar dikira secara automatik daripada IP. Apabila didayakan, pengiraan automatik dihentikan dan bandar ditetapkan secara manual"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Benarkan akses jejak tanpa nama. Benarkan pengguna yang tidak log masuk mengakses halaman jejak /trace; data pemantauan mungkin mengandungi maklumat sensitif. Lalai false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Selang penyegerakan dotNet. Dapatkan maklumat pemasang .NET runtime daripada laman rasmi, 0 bermaksud dinyahdayakan, unit saat, lalai 43200 (12 jam)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Alamat penyegerakan dotNet. Alamat API rasmi untuk mendapatkan versi .NET runtime, menyokong pemegang tempat {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Alamat asas muat turun sumber Stardust. URL asas untuk pemasang/skrip StarAgent; lalai alamat rasmi"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Benarkan apabila nod boleh kawal kosong. Sama ada operasi dibenarkan apabila AllowControlNodes kosong, lalai false (mod selamat, nod boleh kawal mesti dikonfigurasikan secara eksplisit). Persekitaran dalaman boleh menetapkannya kepada true untuk keserasian dengan data lama"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Dayakan perkhidmatan MCP. Dinyahdayakan secara lalai; apabila didayakan, mendedahkan titik akhir POST /mcp untuk panggilan LLM/ejen."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Set tindakan MCP. Nama modul dipisahkan koma (node/app/config/deploy/gateway/monitor/system), * bermaksud semua diaktifkan"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Awalan laluan had kadar. Dipisahkan koma; laluan yang sepadan dihadkan kadar mengikut IP; lalai titik akhir pengesahan seperti login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Bilangan had kadar. Bilangan permintaan yang dibenarkan setiap IP seminit; lalai 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Benarkan pelaporan telemetri tanpa nama. Diperlukan untuk lata bertingkat atau SDK minimum; lalai false (selamat)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Asal CORS yang dibenarkan. Dipisahkan koma; kosong membenarkan mana-mana asal; apabila ditentukan, hanya asal dalam senarai putih boleh membuat silang asal"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Pengesahan muat turun lampiran. Sama ada mengesahkan token muat turun lampiran bagi /cube/file. Lalai false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Kategori lampiran awam tanpa log masuk. Dipisahkan koma, item yang sepadan boleh dimuat turun secara tanpa nama."
"Attachment download token validity. Seconds, default 600.": "Tempoh sah token muat turun lampiran. Saat, lalai 600."
