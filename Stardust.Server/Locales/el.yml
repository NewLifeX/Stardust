"Push dotNet": "Αποστολή dotNet"
"Timed out offline": "Λήξη χρόνου εκτός σύνδεσης"
"An application with an empty secret cannot log in. Set a Secret for this application in the registry or enable re-registration.": "Μια εφαρμογή με κενό μυστικό δεν μπορεί να συνδεθεί. Ορίστε ένα Secret για αυτή την εφαρμογή στο μητρώο ή ενεργοποιήστε την επανεγγραφή."
"Secret validation failed.": "Η επικύρωση του μυστικού απέτυχε."
"[{0}] re-registered in [{1}] mode; secret issued": "Το [{0}] επανεγγράφηκε σε λειτουργία [{1}]· εκδόθηκε μυστικό"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "Το [{0}] επανεγγράφηκε σε λειτουργία [{1}]· εκδόθηκε μυστικό, UUID={2}"
"[{0}] registered successfully.": "Το [{0}] εγγράφηκε με επιτυχία."
"[{0}] registration failed: {1}": "Η εγγραφή του [{0}] απέτυχε: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] πιστοποιήθηκε {2}"
"Registered service [{0}] {1}": "Καταχωρίστηκε υπηρεσία [{0}] {1}"
"Service [{0}] went offline: {1}": "Η υπηρεσία [{0}] αποσυνδέθηκε: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "Το [{0}] έχει ασυμφωνία μυστικού· επιτράπηκε από τη λειτουργία [{1}]"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "Το [{0}] ο πελάτης φέρει πλέον το σωστό μυστικό· το παράθυρο σύγκλισης έκλεισε αυτόματα"
"Hardware information changed too much.": "Οι πληροφορίες υλικού άλλαξαν υπερβολικά."
"Unique identifier mismatch (new != old): {0} != {1}": "Ασυμφωνία μοναδικού αναγνωριστικού (νέο != παλιό): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "Ασυμφωνία αναγνωριστικού μηχανήματος (νέο != παλιό): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "Ασυμφωνία σειριακού αριθμού υπολογιστή (νέο != παλιό): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "Ασυμφωνία μητρικής κάρτας (νέο != παλιό): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "Ασυμφωνία κωδικού προϊόντος (νέο != παλιό): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Ασυμφωνία ονόματος μηχανήματος (νέο != παλιό): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "Ασυμφωνία διεύθυνσης MAC (νέο != παλιό): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Ασυμφωνία σειριακού αριθμού δίσκου (νέο != παλιό): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Έκδοση={0} Μέγεθος={1:n0} Κόμβος={2}"
"Associated online": "Συσχετίστηκε σε σύνδεση"
"Dynamic registration": "Δυναμική εγγραφή"
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to detect from each request in web hosts and to follow the system language otherwise": "Γλώσσα διεπαφής, για παράδειγμα zh-Hans, zh-Hant, en ή ja· αφήστε κενό για ανίχνευση από κάθε αίτημα σε κεντρικούς υπολογιστές web και για να ακολουθείται η γλώσσα του συστήματος σε άλλες περιπτώσεις"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] συνδέθηκε στις {2}, τελευταία δραστηριότητα στις {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Ο κόμβος [{0}/{1}] είναι πολύ παρόμοιος με τον υπάρχοντα κόμβο [{2}]· χρησιμοποιείται ο υπάρχων κόμβος"
"Stardust service platform": "Πλατφόρμα υπηρεσιών Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Πυρήνας backend της κατανεμημένης πλατφόρμας υπηρεσιών Stardust. Παρέχει βασικές υπηρεσίες API για κέντρο διαμόρφωσης, μητρώο, ανακάλυψη υπηρεσιών, απομακρυσμένη ανάπτυξη, παρακολούθηση απόδοσης και κέντρο καταγραφών, υποστηρίζει καταχώριση εφαρμογών, διανομή διαμόρφωσης, συγκέντρωση μετρικών, στατιστικούς υπολογισμούς και χρονοπρογραμματισμό εργασιών και κλιμακώνεται οριζόντια."
"Service port. Default 6600.": "Θύρα υπηρεσίας. Προεπιλογή 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Μυστικό διακριτικού. Αλγόριθμος και κλειδί για τη δημιουργία διακριτικών JWT, π.χ. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Περίοδος ισχύος διακριτικού. Προεπιλογή 2*3600 δευτερόλεπτα."
"Session timeout. Default 600 seconds": "Χρονικό όριο συνεδρίας. Προεπιλογή 600 δευτερόλεπτα"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Χρόνος απόκλισης salt. Οι πελάτες χρησιμοποιούν την τρέχουσα ώρα ως salt κατά τη σύνδεση· μεγάλη διαφορά ώρας από τον διακομιστή προκαλεί αποτυχία επαλήθευσης κλειδιού· προεπιλογή 600 δευτερόλεπτα"
"Auto-register. Allow node clients to register automatically, default true": "Αυτόματη εγγραφή. Να επιτρέπεται στους πελάτες κόμβων να εγγράφονται αυτόματα, προεπιλογή true"
"Application auto-registration. Allow app clients to register automatically; default true": "Αυτόματη καταχώριση εφαρμογών. Να επιτρέπεται στους πελάτες εφαρμογών η αυτόματη καταχώριση· προεπιλογή true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Λίστα επιτρεπόμενων εισόδου. Εάν καθοριστεί, μόνο κόμβοι που πληρούν τις συνθήκες IP μπορούν να εγγραφούν, διαχωρίστε πολλαπλές εγγραφές με κόμμα, υποστηρίζεται αντιστοίχιση μπαλαντέρ *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Τύπος κωδικού κόμβου. Επιλέγει ποιες πληροφορίες υλικού στο NodeInfo χρησιμοποιούνται για τον υπολογισμό του κωδικού κόμβου. Υποστηρίζει Crc/Crc16/MD5/MD5_16, προεπιλογή Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Όριο αναγνώρισης κωδικού κόμβου. UUID+Guid+SerialNumber+DiskId+MAC· αν συμφωνούν αρκετά από αυτά, ο κόμβος θεωρείται ο ίδιος, προεπιλογή 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Περίοδος στατιστικών ροής παρακολούθησης. Προεπιλογή 5 δευτερόλεπτα. Επεξεργάζεται την ουρά στη μνήμη για υπολογισμό στατιστικών σε επίπεδο λεπτού· μικρότερες τιμές βελτιώνουν την αμεσότητα αλλά αυξάνουν τη χρήση CPU, μεγαλύτερες τιμές μειώνουν τη χρήση CPU αλλά αυξάνουν την καθυστέρηση ειδοποίησης"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Περίοδος στατιστικών παρτίδων παρακολούθησης. Προεπιλογή 30 δευτερόλεπτα. Διορθώνει δεδομένα συγκεντρώνοντας από τη βάση δεδομένων· μικρότερες τιμές επιταχύνουν τη διόρθωση αλλά αυξάνουν την πίεση IO, μεγαλύτερες τιμές μειώνουν την πίεση αλλά καθυστερούν τη διόρθωση"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Περίοδος αποθήκευσης παρακολούθησης. Προεπιλογή 300 δευτερόλεπτα. Περίοδος μαζικής υποβολής της ουράς καθυστέρησης στατιστικών· οι ειδοποιήσεις διαβάζουν τιμές σε πραγματικό χρόνο από τη μνήμη και δεν επηρεάζονται. Μεγαλύτερες τιμές μειώνουν σημαντικά την πίεση UPDATE στη βάση δεδομένων"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Περίοδος επιθεώρησης παρακολούθησης. Προεπιλογή 600 δευτερόλεπτα. Επανυπολογίζει ωριαία/ημερήσια στατιστικά για μη δημοφιλείς εφαρμογές περιοδικά αντί για πλήρη επανυπολογισμό σε κάθε κύκλο παρτίδας, μειώνοντας το write amplification"
"Monitoring alert period. Default 30 seconds": "Περίοδος ειδοποίησης παρακολούθησης. Προεπιλογή 30 δευτερόλεπτα"
"Console address. Used for monitoring alert addresses": "Διεύθυνση κονσόλας. Χρησιμοποιείται για διευθύνσεις ειδοποιήσεων παρακολούθησης"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Περίοδος διατήρησης δεδομένων. Λεπτομέρειες δειγμάτων και στατιστικά ανά λεπτό· προεπιλογή 3 ημέρες."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Χρόνος διατήρησης δεδομένων μεσαίας κοκκώδους ανάλυσης. Δεδομένα απόδοσης και ωριαία στατιστικά, προεπιλογή 30 ημέρες"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Διάρκεια διατήρησης δεδομένων χονδρικής κοκκίας. Ιστορικά δεδομένα και ημερήσια στατιστικά, προεπιλογή 300 ημέρες."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Λειτουργία εκκαθάρισης δεδομένων. Υποστηρίζει αποδοτικό Truncate ή Delete χωρίς DDL. Προεπιλογή Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Κατάλογος μεταφόρτωσης. Αποθηκεύει πακέτα αναβάθμισης και πρέπει να είναι ο ίδιος κατάλογος που έχει ρυθμιστεί για το StarWeb. Προεπιλογή ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Μέγιστο μέγεθος πακέτου μεταφόρτωσης. Ισχύει μόνο για τα μέγιστα επιτρεπόμενα byte σώματος αιτήματος του τελικού σημείου Deploy/UploadBuildFile· προεπιλογή 100000000 (100MB), 0 σημαίνει χρήση του προεπιλεγμένου ορίου Kestrel, μέγιστο 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Κατάλογος προσωρινής μνήμης αρχείων. Αποθηκεύει αρχεία προσωρινής μνήμης, όπως προγράμματα οδήγησης βάσεων δεδομένων· απενεργοποιείται όταν είναι κενός· προεπιλογή ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Λίστα επιτρεπόμενων προσωρινής μνήμης αρχείων. Αν οριστεί, μόνο συμβατές πηγές IP μπορούν να έχουν πρόσβαση στην προσωρινή μνήμη αρχείων· διαχωρίστε πολλές καταχωρήσεις με κόμματα· υποστηρίζει μπαλαντέρ *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Υπηρεσία χώρου αρχείων. Αν θα απαντά σε αιτήματα λήψης αρχείων από άλλους κόμβους. Προεπιλογή true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Λήψη χώρου αρχείων. Αν θα γίνεται ενεργή λήψη νέων αρχείων που δημοσιεύουν άλλοι κόμβοι. Προεπιλογή false."
"Upstream server. Reports data synchronously to the upstream server.": "Ανώτερος διακομιστής. Αναφέρει δεδομένα συγχρονισμένα στον ανώτερο διακομιστή."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Σταθερή πόλη. Από προεπιλογή η πόλη υπολογίζεται αυτόματα από τη διεύθυνση IP. Όταν ενεργοποιηθεί, ο αυτόματος υπολογισμός απενεργοποιείται και η πόλη ορίζεται χειροκίνητα"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Να επιτρέπεται η ανώνυμη πρόσβαση στην ανίχνευση. Επιτρέπει σε μη συνδεδεμένους χρήστες την πρόσβαση στη σελίδα ανίχνευσης /trace· τα δεδομένα παρακολούθησης μπορεί να περιέχουν ευαίσθητες πληροφορίες. Προεπιλογή false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Διάστημα συγχρονισμού dotNet. Λήψη πληροφοριών εγκατάστασης .NET runtime από τον επίσημο ιστότοπο, 0 απενεργοποιεί, μονάδα δευτερόλεπτα, προεπιλογή 43200 (12 ώρες)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Διεύθυνση συγχρονισμού dotNet. Επίσημη διεύθυνση API για λήψη εκδόσεων του .NET runtime, υποστηρίζει το σύμβολο κράτησης {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Βασική διεύθυνση λήψης πόρων Stardust. Βασικό URL για πακέτα/σενάρια εγκατάστασης StarAgent· προεπιλογή η επίσημη διεύθυνση"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Αποδοχή όταν οι ελεγχόμενοι κόμβοι είναι κενοί. Αν επιτρέπονται οι λειτουργίες όταν το AllowControlNodes είναι κενό, προεπιλογή false (ασφαλής λειτουργία, απαιτείται ρητή διαμόρφωση ελεγχόμενων κόμβων). Σε εσωτερικά περιβάλλοντα μπορεί να οριστεί σε true για συμβατότητα με παλιά δεδομένα"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Ενεργοποίηση υπηρεσίας MCP. Απενεργοποιημένη από προεπιλογή· όταν ενεργοποιηθεί, εκθέτει το τελικό σημείο POST /mcp για κλήσεις LLM/πράκτορα."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Σύνολο ενεργειών MCP. Ονόματα μονάδων χωρισμένα με κόμμα (node/app/config/deploy/gateway/monitor/system), * σημαίνει ενεργοποίηση όλων"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Προθέματα διαδρομής ορίου ρυθμού. Χωρισμένα με κόμμα· οι διαδρομές που ταιριάζουν περιορίζονται ανά IP· προεπιλογή τα σημεία ελέγχου ταυτότητας όπως login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Όριο ρυθμού. Αριθμός αιτημάτων που επιτρέπονται ανά IP ανά λεπτό· προεπιλογή 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Να επιτρέπεται ανώνυμη αναφορά τηλεμετρίας. Απαιτείται για πολυεπίπεδη αλληλουχία ή ελάχιστο SDK· προεπιλογή false (ασφαλές)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Επιτρεπόμενες προελεύσεις CORS. Διαχωρισμένες με κόμμα· κενό επιτρέπει οποιαδήποτε προέλευση· όταν οριστεί, μόνο οι προελεύσεις της λίστας επιτρέπονται για cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Έλεγχος ταυτότητας λήψης συνημμένων. Αν γίνεται επαλήθευση του διακριτικού λήψης συνημμένων για το /cube/file. Προεπιλογή false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Κατηγορίες δημόσιων συνημμένων χωρίς σύνδεση. Διαχωρισμένες με κόμμα, τα αντιστοιχισμένα στοιχεία μπορούν να ληφθούν ανώνυμα."
"Attachment download token validity. Seconds, default 600.": "Ισχύς διακριτικού λήψης συνημμένων. Δευτερόλεπτα, προεπιλογή 600."
