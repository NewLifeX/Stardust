"Secret validation failed.": "اعتبارسنجی کلید محرمانه ناموفق بود."
"[{0}] re-registered in [{1}] mode; secret issued": "[{0}] در حالت [{1}] مجدداً ثبت شد؛ کلید محرمانه صادر شد"
"[{0}] re-registered in [{1}] mode; secret issued, UUID={2}": "[{0}] در حالت [{1}] مجدداً ثبت شد؛ کلید محرمانه صادر شد، UUID={2}"
"[{0}] registered successfully.": "[{0}] با موفقیت ثبت شد."
"[{0}] registration failed: {1}": "ثبت [{0}] ناموفق بود: {1}"
"[{0}/{1}] authenticated {2}": "[{0}/{1}] احراز هویت شد {2}"
"Registered service [{0}] {1}": "سرویس ثبت‌شده [{0}] {1}"
"Service [{0}] went offline: {1}": "سرویس [{0}] آفلاین شد: {1}"
"[{0}] secret mismatch; allowed by [{1}] mode": "[{0}] عدم تطابق کلید محرمانه؛ مجاز در حالت [{1}]"
"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] اکنون کلاینت کلید محرمانه صحیح را دارد؛ پنجره همگرایی به‌طور خودکار بسته می‌شود"
"Hardware information changed too much.": "اطلاعات سخت‌افزاری بیش از حد تغییر کرده است."
"Unique identifier mismatch (new != old): {0} != {1}": "ناسازگاری شناسه یکتا (جدید != قدیم): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "ناسازگاری شناسه ماشین (جدید != قدیم): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "ناسازگاری شماره سریال رایانه (جدید != قدیم): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "ناسازگاری مادربورد (جدید != قدیم): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "ناسازگاری کد محصول (جدید != قدیم): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "ناسازگاری نام ماشین (جدید != قدیم): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "ناسازگاری آدرس MAC (جدید != قدیم): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "ناسازگاری شماره سریال دیسک (جدید != قدیم): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "نسخه={0} اندازه={1:n0} گره={2}"
"Associated online": "مرتبط و آنلاین"
"Dynamic registration": "ثبت پویا"
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to detect from each request in web hosts and to follow the system language otherwise": "زبان رابط کاربری، مثلاً zh-Hans، zh-Hant، en یا ja؛ برای تشخیص از هر درخواست در میزبان‌های وب و در غیر این صورت پیروی از زبان سیستم خالی بگذارید"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] در {2} وارد شد، آخرین فعالیت در {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "گره [{0}/{1}] بسیار شبیه به گره موجود [{2}] است؛ از گره موجود استفاده می‌شود"
"Stardust service platform": "پلتفرم سرویس Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "هسته بک‌اند پلتفرم سرویس توزیع‌شده Stardust. سرویس‌های API اصلی برای مرکز پیکربندی، رجیستری، کشف سرویس، استقرار از راه دور، پایش عملکرد و مرکز گزارش‌ها فراهم می‌کند و از ثبت برنامه، توزیع پیکربندی، تجمیع معیارها، محاسبات آماری و زمان‌بندی وظایف پشتیبانی می‌کند و قابلیت مقیاس‌پذیری افقی دارد."
"Service port. Default 6600.": "درگاه سرویس. پیش‌فرض 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "کلید مخفی توکن. الگوریتم و کلید مورد استفاده برای تولید توکنهای JWT، مانند HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "مدت اعتبار توکن. پیش‌فرض 2*3600 ثانیه."
"Session timeout. Default 600 seconds": "مهلت نشست. پیشفرض 600 ثانیه"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "زمان انحراف salt. کلاینت‌ها هنگام ورود از زمان فعلی به‌عنوان salt استفاده می‌کنند؛ اختلاف زمانی زیاد با سرور باعث شکست در تأیید کلید می‌شود؛ پیش‌فرض 600 ثانیه"
"Auto-register. Allow node clients to register automatically, default true": "ثبت‌نام خودکار. اجازه دادن به کلاینت‌های گره برای ثبت‌نام خودکار، پیش‌فرض true"
"Application auto-registration. Allow app clients to register automatically; default true": "ثبت خودکار برنامه. اجازه دادن به کلاینت‌های برنامه برای ثبت خودکار؛ پیش‌فرض true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "فهرست سفید پذیرش. در صورت تعیین، فقط گره‌هایی که شرایط IP را دارند می‌توانند ثبت‌نام کنند، چند مورد را با کاما جدا کنید، تطبیق کاراکتر * پشتیبانی می‌شود"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "فرمول کد گره. انتخاب میکند کدام اطلاعات سختافزاری در NodeInfo برای محاسبه کد گره استفاده شود. پشتیبانی از Crc/Crc16/MD5/MD5_16، پیشفرض Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "آستانه شناسایی کد گره. UUID+Guid+SerialNumber+DiskId+MAC؛ اگر چند مورد از آنها یکسان باشد، گره یکسان در نظر گرفته میشود، پیشفرض 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "دوره آمار جریان پایش. پیشفرض 5 ثانیه. صف درونحافظهای را برای محاسبه آمار در سطح دقیقه پردازش میکند؛ مقادیر کوچکتر بهروزرسانی لحظهای را بهبود میدهد اما مصرف CPU را افزایش میدهد، و مقادیر بزرگتر مصرف CPU را کاهش میدهد اما تأخیر هشدار را افزایش میدهد"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "دوره آمار دستهای پایش. پیشفرض 30 ثانیه. دادهها را با تجمیع از پایگاه داده اصلاح میکند؛ مقادیر کوچکتر سرعت اصلاح را افزایش میدهد اما فشار IO را بالا میبرد، مقادیر بزرگتر فشار را کاهش میدهد اما اصلاح را به تأخیر میاندازد"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "دوره ذخیرهسازی پایش. پیشفرض 300 ثانیه. دوره ارسال دستهای صف تأخیر آمار؛ هشدارها مقادیر لحظهای درونحافظه را میخوانند و تحت تأثیر قرار نمیگیرند. مقادیر بزرگتر فشار UPDATE پایگاه داده را بهطور قابل توجهی کاهش میدهد"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "دوره بازرسی پایش. پیشفرض 600 ثانیه. آمار ساعتی/روزانه برنامههای غیرپرمصرف را بهصورت دورهای بازمحاسبه میکند، بهجای بازمحاسبه کامل در هر چرخه دستهای، و بدین ترتیب نوشتن تقویتیافته را کاهش میدهد"
"Monitoring alert period. Default 30 seconds": "دوره هشدار پایش. پیشفرض 30 ثانیه"
"Console address. Used for monitoring alert addresses": "آدرس کنسول. برای آدرسهای هشدار پایش استفاده میشود"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "مدت نگهداری داده‌ها. جزئیات نمونه‌ها و آمار در سطح دقیقه؛ پیش‌فرض 3 روز."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "مدت نگهداری داده‌های با دانه‌بندی متوسط. داده‌های عملکرد و آمار ساعتی، پیش‌فرض ۳۰ روز"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "مدت نگهداری داده‌های درشت‌دانه. داده‌های تاریخی و آمار روزانه، پیش‌فرض 300 روز."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "حالت پاک‌سازی داده. از Truncate کارآمد یا Delete بدون DDL پشتیبانی می‌کند. پیش‌فرض Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "پوشه بارگذاری. بسته‌های ارتقا را ذخیره می‌کند و باید همان پوشه پیکربندی‌شده برای StarWeb باشد. پیش‌فرض ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "حداکثر اندازه بسته بارگذاری. فقط بر حداکثر بایت‌های مجاز بدنه درخواست نقطه پایانی Deploy/UploadBuildFile اعمال می‌شود؛ پیش‌فرض 100000000 (100MB)، مقدار 0 یعنی استفاده از محدودیت پیش‌فرض Kestrel، حداکثر 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "پوشه حافظه نهان فایل. فایل‌های نهان مانند درایورهای پایگاه داده را ذخیره می‌کند؛ اگر خالی باشد غیرفعال است؛ پیش‌فرض ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "لیست سفید حافظه نهان فایل. در صورت تعیین، فقط منابع IP منطبق می‌توانند به حافظه نهان فایل دسترسی داشته باشند؛ چند مورد را با کاما جدا کنید؛ از wildcard * پشتیبانی می‌کند"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "سرویس ذخیره‌سازی فایل. آیا به درخواست‌های دانلود فایل گره‌های دیگر پاسخ داده شود. پیش‌فرض true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "واکشی ذخیره‌سازی فایل. آیا فایل‌های جدید منتشرشده توسط گره‌های دیگر به‌طور فعال واکشی شوند. پیش‌فرض false."
"Upstream server. Reports data synchronously to the upstream server.": "سرور بالادست. داده‌ها را به‌صورت همگام به سرور بالادست گزارش می‌دهد."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "شهر ثابت. بهطور پیشفرض شهر بهصورت خودکار از IP محاسبه میشود. با فعالسازی، محاسبه خودکار متوقف و شهر بهصورت دستی تنظیم میشود"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "اجازه دسترسی ناشناس به ردیابی. به کاربران واردنشده اجازه دسترسی به صفحه ردیابی /trace را می‌دهد؛ داده‌های پایش ممکن است حاوی اطلاعات حساس باشند. پیش‌فرض false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "بازه همگام‌سازی dotNet. دریافت اطلاعات نصب‌کننده .NET runtime از سایت رسمی، ۰ یعنی غیرفعال، واحد ثانیه، پیش‌فرض 43200 (۱۲ ساعت)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "نشانی همگام‌سازی dotNet. نشانی API رسمی برای دریافت نسخه‌های .NET runtime، از جای‌نگهدار {major} پشتیبانی می‌کند"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "آدرس پایه دانلود منابع Stardust. URL پایه برای بسته‌های نصب/اسکریپت‌های StarAgent؛ پیش‌فرض آدرس رسمی"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "اجازه هنگام خالی بودن گرههای قابل کنترل. آیا هنگام خالی بودن AllowControlNodes اجازه عملیات داده میشود، پیشفرض false (حالت امن، پیکربندی صریح گرههای قابل کنترل لازم است). در محیطهای داخلی میتوان برای سازگاری با دادههای قدیمی آن را true کرد"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "فعال‌سازی سرویس MCP. به‌طور پیش‌فرض خاموش است؛ پس از فعال‌سازی، نقطه پایانی POST /mcp را برای فراخوانی LLM/عامل ارائه می‌دهد."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "مجموعه اقدامات MCP. نام ماژول‌ها با کاما جدا شده (node/app/config/deploy/gateway/monitor/system)، * یعنی فعال‌سازی همه"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "پیشوندهای مسیر محدودیت نرخ. جداشده با کاما؛ مسیرهای منطبق بر اساس IP محدود می‌شوند؛ پیش‌فرض نقاط پایانی احراز هویت مانند login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "تعداد محدودیت نرخ. تعداد درخواست‌های مجاز برای هر IP در دقیقه؛ پیش‌فرض 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "اجازه گزارش تله‌متری ناشناس. برای آبشاری چندسطحی یا SDK مینیمال لازم است؛ پیش‌فرض false (امن)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "مبدأهای مجاز CORS. با کاما جدا شده؛ خالی یعنی هر مبدأیی مجاز است؛ پس از تعیین، فقط مبدأهای فهرست سفید می‌توانند cross-origin انجام دهند"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "احراز هویت دانلود پیوست. اینکه توکن دانلود پیوست برای /cube/file بررسی شود یا نه. پیش‌فرض false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "دسته‌های پیوست عمومی بدون ورود. با ویرگول جدا می‌شوند و موارد منطبق به‌صورت ناشناس قابل دانلود هستند."
"Attachment download token validity. Seconds, default 600.": "اعتبار توکن دانلود پیوست. ثانیه، پیش‌فرض 600."
