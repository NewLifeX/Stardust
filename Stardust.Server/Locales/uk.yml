"Product code mismatch (new != old): {0} != {1}": "Невідповідність коду продукту (новий != старий): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "Невідповідність імені машини (новий != старий): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "Невідповідність MAC-адреси (новий != старий): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Невідповідність серійного номера диска (новий != старий): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Версія={0} Розмір={1:n0} Вузол={2}"
"Associated online": "Пов'язано онлайн"
"Dynamic registration": "Динамічна реєстрація"
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to detect from each request in web hosts and to follow the system language otherwise": "Мова інтерфейсу, наприклад zh-Hans, zh-Hant, en або ja; залиште порожнім, щоб веб-хости визначали її за кожним запитом, а в інших випадках дотримувалися системної мови"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] увійшов о {2}, остання активність о {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Вузол [{0}/{1}] дуже схожий на наявний вузол [{2}]; використовується наявний вузол"
"Stardust service platform": "Платформа сервісів Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Бекенд-ядро розподіленої платформи сервісів Stardust. Надає основні API-сервіси для центру конфігурації, реєстру, виявлення сервісів, віддаленого розгортання, моніторингу продуктивності та центру журналів; підтримує реєстрацію застосунків, доставку конфігурації, агрегацію метрик, статистичні обчислення й планування завдань, а також масштабується горизонтально."
"Service port. Default 6600.": "Порт служби. За замовчуванням 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Секрет токена. Алгоритм і ключ для створення токенів JWT, наприклад HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Термін дії токена. За замовчуванням 2*3600 секунд."
"Session timeout. Default 600 seconds": "Час очікування сеансу. За замовчуванням 600 секунд"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Час відхилення солі. Клієнти використовують поточний час як сіль під час входу; занадто велика різниця з часом сервера призведе до помилки перевірки ключа; за замовчуванням 600 секунд"
"Auto-register. Allow node clients to register automatically, default true": "Автоматична реєстрація. Дозволити клієнтам вузлів реєструватися автоматично, типово true"
"Application auto-registration. Allow app clients to register automatically; default true": "Автоматична реєстрація застосунків. Дозволити клієнтам застосунків реєструватися автоматично; за замовчуванням true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Білий список допуску. Якщо задано, реєструватися можуть лише вузли, що відповідають умовам IP, кілька записів через кому, підтримується підстановка *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Формула коду вузла. Визначає, яка апаратна інформація в NodeInfo використовується для обчислення коду вузла. Підтримуються Crc/Crc16/MD5/MD5_16, за замовчуванням Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Поріг ідентифікації коду вузла. UUID+Guid+SerialNumber+DiskId+MAC; якщо кілька з них збігаються, вузол вважається тим самим, за замовчуванням 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Період статистики потоку моніторингу. За замовчуванням 5 секунд. Обробляє чергу в пам'яті для обчислення статистики з хвилинною деталізацією; менші значення підвищують оперативність, але збільшують навантаження на CPU, більші значення знижують навантаження на CPU, але збільшують затримку оповіщень"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Період пакетної статистики моніторингу. За замовчуванням 30 секунд. Коригує дані шляхом агрегації з бази даних; менші значення прискорюють коригування, але збільшують навантаження на IO, більші значення знижують навантаження, але затримують коригування"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Період збереження моніторингу. За замовчуванням 300 секунд. Період пакетного надсилання черги відкладеної статистики; оповіщення читають актуальні значення з пам'яті й не зачіпаються. Більші значення суттєво знижують навантаження UPDATE на базу даних"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Період обходу моніторингу. За замовчуванням 600 секунд. Періодично перераховує погодинну/добову статистику для непопулярних застосунків замість повного перерахунку в кожному пакетному циклі, знижуючи підсилення запису"
"Monitoring alert period. Default 30 seconds": "Період оповіщень моніторингу. За замовчуванням 30 секунд"
"Console address. Used for monitoring alert addresses": "Адреса консолі. Використовується для адрес оповіщень моніторингу"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Термін зберігання даних. Деталі вибірок і статистика з хвилинною гранулярністю; за замовчуванням 3 дні."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Час зберігання даних середньої деталізації. Дані продуктивності та погодинна статистика, типово 30 днів"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Термін зберігання великозернистих даних. Історичні дані та добова статистика, за замовчуванням 300 днів."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Режим очищення даних. Підтримує ефективний Truncate або Delete без DDL. За замовчуванням Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Каталог завантаження. Зберігає пакети оновлення і має бути тим самим каталогом, що налаштований для StarWeb. За замовчуванням ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Максимальний розмір пакета завантаження. Застосовується лише до максимально дозволеної кількості байтів тіла запиту кінцевої точки Deploy/UploadBuildFile; за замовчуванням 100000000 (100MB), 0 означає використання стандартного обмеження Kestrel, максимум 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Каталог кешу файлів. Зберігає файли кешу, наприклад драйвери баз даних; якщо порожній — вимкнено; за замовчуванням ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Білий список кешу файлів. Якщо вказано, доступ до кешу файлів дозволено лише відповідним джерелам IP; кілька записів розділяйте комами; підтримуються символи підстановки *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Служба файлового сховища. Чи відповідати на запити інших вузлів на завантаження файлів. За замовчуванням true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Отримання з файлового сховища. Чи активно завантажувати нові файли, опубліковані іншими вузлами. За замовчуванням false."
"Upstream server. Reports data synchronously to the upstream server.": "Вищий сервер. Синхронно передає дані вищому серверу."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Фіксоване місто. За замовчуванням місто обчислюється автоматично за IP. Після ввімкнення автоматичний розрахунок вимикається, і місто задається вручну"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Дозволити анонімний доступ до трасування. Дозволяє неавторизованим користувачам відкривати сторінку трасування /trace; дані моніторингу можуть містити конфіденційну інформацію. За замовчуванням false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Інтервал синхронізації dotNet. Отримання відомостей про інсталятор .NET runtime з офіційного сайту, 0 — вимкнено, одиниця — секунди, типово 43200 (12 годин)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Адреса синхронізації dotNet. Офіційна адреса API для отримання версій .NET runtime, підтримує заповнювач {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Базова адреса завантаження ресурсів Stardust. Базовий URL для інсталяторів/скриптів StarAgent; за замовчуванням офіційна адреса"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Дозволяти, коли керовані вузли порожні. Чи дозволяти операції, коли AllowControlNodes порожній, за замовчуванням false (безпечний режим, керовані вузли потрібно налаштувати явно). У внутрішніх середовищах можна встановити true для сумісності зі старими даними"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Увімкнути службу MCP. Вимкнена за замовчуванням; після ввімкнення надає кінцеву точку POST /mcp для викликів LLM/агентів."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Набір дій MCP. Імена модулів через кому (node/app/config/deploy/gateway/monitor/system), * — увімкнути все"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Префікси шляхів для обмеження частоти. Через кому; для відповідних шляхів застосовується обмеження за IP; за замовчуванням — кінцеві точки автентифікації, як-от login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Кількість запитів для обмеження частоти. Кількість дозволених запитів на IP за хвилину; за замовчуванням 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Дозволити анонімне надсилання телеметрії. Потрібно для багаторівневого каскадування або мінімального SDK; за замовчуванням false (безпечно)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Дозволені джерела CORS. Через кому; порожнє дозволяє будь-яке джерело; після задання cross-origin дозволено лише джерелам зі списку"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Автентифікація завантаження вкладень. Чи перевіряти токен завантаження вкладень для /cube/file. За замовчуванням false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Загальнодоступні категорії вкладень без входу. Через кому, збіги можна завантажити анонімно."
"Attachment download token validity. Seconds, default 600.": "Термін дії токена завантаження вкладень. Секунди, за замовчуванням 600."
