"MAC address mismatch (new != old): {0} != {1}": "Địa chỉ MAC không khớp (mới != cũ): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "Số sê-ri ổ đĩa không khớp (mới != cũ): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "Phiên bản={0} Kích thước={1:n0} Node={2}"
"Associated online": "Liên kết trực tuyến"
"Dynamic registration": "Đăng ký động"
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to detect from each request in web hosts and to follow the system language otherwise": "Ngôn ngữ giao diện, ví dụ zh-Hans, zh-Hant, en hoặc ja; để trống để phát hiện từ từng yêu cầu trên máy chủ web và theo ngôn ngữ hệ thống trong các trường hợp khác"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] đăng nhập lúc {2}, hoạt động lần cuối lúc {3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "Nút [{0}/{1}] rất giống với nút hiện có [{2}]; sẽ sử dụng nút hiện có"
"Stardust service platform": "Nền tảng dịch vụ Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Lõi backend của nền tảng dịch vụ phân tán Stardust. Cung cấp các dịch vụ API cốt lõi cho trung tâm cấu hình, sổ đăng ký, khám phá dịch vụ, triển khai từ xa, giám sát hiệu năng và trung tâm nhật ký; hỗ trợ đăng ký ứng dụng, phân phối cấu hình, tổng hợp số liệu, tính toán thống kê và lập lịch tác vụ, đồng thời có thể mở rộng theo chiều ngang."
"Service port. Default 6600.": "Cổng dịch vụ. Mặc định 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Bí mật mã thông báo. Thuật toán và khóa dùng để tạo mã thông báo JWT, ví dụ HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Thời hạn hiệu lực của token. Mặc định 2*3600 giây."
"Session timeout. Default 600 seconds": "Thời gian chờ phiên. Mặc định 600 giây"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Thời gian lệch salt. Máy khách dùng thời gian hiện tại làm salt khi đăng nhập; chênh lệch thời gian quá lớn so với máy chủ sẽ khiến xác minh khóa thất bại; mặc định 600 giây"
"Auto-register. Allow node clients to register automatically, default true": "Tự động đăng ký. Cho phép máy khách nút tự động đăng ký, mặc định true"
"Application auto-registration. Allow app clients to register automatically; default true": "Tự động đăng ký ứng dụng. Cho phép máy khách ứng dụng tự động đăng ký; mặc định true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Danh sách trắng được chấp nhận. Nếu được chỉ định, chỉ các nút thỏa mãn điều kiện IP mới được đăng ký, phân tách nhiều mục bằng dấu phẩy, hỗ trợ khớp ký tự đại diện *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Công thức mã nút. Chọn thông tin phần cứng nào trong NodeInfo được dùng để tính mã nút. Hỗ trợ Crc/Crc16/MD5/MD5_16, mặc định Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Ngưỡng nhận diện mã nút. UUID+Guid+SerialNumber+DiskId+MAC; nếu một vài mục trong số đó trùng khớp, nút được coi là cùng một nút, mặc định 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Chu kỳ thống kê luồng giám sát. Mặc định 5 giây. Xử lý hàng đợi trong bộ nhớ để tính thống kê theo phút; giá trị nhỏ hơn tăng tính thời gian thực nhưng tăng mức dùng CPU, giá trị lớn hơn giảm mức dùng CPU nhưng tăng độ trễ cảnh báo"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Chu kỳ thống kê theo lô của giám sát. Mặc định 30 giây. Hiệu chỉnh dữ liệu bằng cách tổng hợp từ cơ sở dữ liệu; giá trị nhỏ hơn tăng tốc hiệu chỉnh nhưng tăng áp lực IO, giá trị lớn hơn giảm áp lực nhưng làm chậm hiệu chỉnh"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Chu kỳ ghi dữ liệu giám sát. Mặc định 300 giây. Chu kỳ gửi theo lô của hàng đợi thống kê trễ; cảnh báo đọc giá trị thời gian thực trong bộ nhớ nên không bị ảnh hưởng. Giá trị lớn hơn giảm đáng kể áp lực UPDATE lên cơ sở dữ liệu"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Chu kỳ kiểm tra giám sát. Mặc định 600 giây. Tính lại định kỳ thống kê theo giờ/ngày cho các ứng dụng ít phổ biến thay vì tính lại toàn bộ trong mỗi chu kỳ lô, giúp giảm khuếch đại ghi"
"Monitoring alert period. Default 30 seconds": "Chu kỳ cảnh báo giám sát. Mặc định 30 giây"
"Console address. Used for monitoring alert addresses": "Địa chỉ bảng điều khiển. Dùng cho địa chỉ cảnh báo giám sát"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Thời gian lưu giữ dữ liệu. Chi tiết mẫu và thống kê theo phút; mặc định 3 ngày."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Thời gian lưu trữ dữ liệu độ chi tiết trung bình. Dữ liệu hiệu năng và thống kê theo giờ, mặc định 30 ngày"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Thời gian lưu giữ dữ liệu thô. Dữ liệu lịch sử và thống kê hằng ngày, mặc định 300 ngày."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Chế độ dọn dẹp dữ liệu. Hỗ trợ Truncate hiệu quả hoặc Delete không cần DDL. Mặc định Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Thư mục tải lên. Lưu trữ gói nâng cấp và phải là cùng thư mục được cấu hình cho StarWeb. Mặc định ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Kích thước gói tải lên tối đa. Chỉ áp dụng cho số byte nội dung yêu cầu tối đa mà điểm cuối Deploy/UploadBuildFile cho phép; mặc định 100000000 (100MB), 0 nghĩa là dùng giới hạn mặc định của Kestrel, tối đa 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Thư mục bộ nhớ đệm tệp. Lưu trữ các tệp bộ nhớ đệm như trình điều khiển cơ sở dữ liệu; không kích hoạt khi để trống; mặc định ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Danh sách trắng bộ nhớ đệm tệp. Nếu được chỉ định, chỉ các nguồn IP khớp điều kiện mới được truy cập bộ nhớ đệm tệp; phân tách nhiều mục bằng dấu phẩy; hỗ trợ ký tự đại diện *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Dịch vụ kho lưu trữ tệp. Có phản hồi yêu cầu tải xuống tệp từ các nút khác hay không. Mặc định true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Kéo từ kho lưu trữ tệp. Có chủ động kéo các tệp mới do nút khác phát hành hay không. Mặc định false."
"Upstream server. Reports data synchronously to the upstream server.": "Máy chủ cấp trên. Báo cáo dữ liệu đồng bộ lên máy chủ cấp trên."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Thành phố cố định. Theo mặc định, thành phố được tính tự động từ IP. Khi bật, quá trình tính tự động dừng lại và thành phố được đặt thủ công"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Cho phép truy cập theo dõi ẩn danh. Cho phép người dùng chưa đăng nhập truy cập trang theo dõi /trace; dữ liệu giám sát có thể chứa thông tin nhạy cảm. Mặc định false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Khoảng thời gian đồng bộ dotNet. Lấy thông tin trình cài đặt .NET runtime từ trang chính thức, 0 là tắt, đơn vị giây, mặc định 43200 (12 giờ)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Địa chỉ đồng bộ dotNet. Địa chỉ API chính thức để lấy phiên bản .NET runtime, hỗ trợ trình giữ chỗ {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Địa chỉ cơ sở tải tài nguyên Stardust. URL cơ sở cho bộ cài/script StarAgent; mặc định là địa chỉ chính thức"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Cho phép khi nút có thể điều khiển trống. Có cho phép thao tác khi AllowControlNodes trống hay không, mặc định false (chế độ an toàn, phải cấu hình rõ các nút có thể điều khiển). Môi trường nội bộ có thể đặt thành true để tương thích với dữ liệu cũ"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Bật dịch vụ MCP. Mặc định tắt; khi bật sẽ mở điểm cuối POST /mcp cho các cuộc gọi LLM/tác nhân."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Bộ hành động MCP. Tên mô-đun phân tách bằng dấu phẩy (node/app/config/deploy/gateway/monitor/system), * nghĩa là bật tất cả"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Tiền tố đường dẫn giới hạn tần suất. Phân tách bằng dấu phẩy; các đường dẫn khớp sẽ bị giới hạn theo IP; mặc định là các điểm cuối xác thực như login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Số lần giới hạn tần suất. Số yêu cầu được phép cho mỗi IP mỗi phút; mặc định 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Cho phép báo cáo đo từ xa ẩn danh. Cần thiết cho xếp tầng nhiều cấp hoặc SDK tối giản; mặc định false (an toàn)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Nguồn CORS được phép. Phân tách bằng dấu phẩy; để trống cho phép mọi nguồn; khi chỉ định, chỉ các nguồn trong danh sách trắng mới được cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Xác thực tải xuống tệp đính kèm. Có xác minh mã thông báo tải xuống tệp đính kèm cho /cube/file hay không. Mặc định false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Danh mục tệp đính kèm công khai không cần đăng nhập. Phân tách bằng dấu phẩy, mục khớp có thể tải xuống ẩn danh."
"Attachment download token validity. Seconds, default 600.": "Hiệu lực mã thông báo tải xuống tệp đính kèm. Giây, mặc định 600."
