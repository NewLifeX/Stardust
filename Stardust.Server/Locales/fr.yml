"[{0}] is not allowed to operate application [{1}].\nFor security, applications cannot send control commands to other applications by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all applications.": "[{0}] n'est pas autorisé à exploiter l'application [{1}].\nPour des raisons de sécurité, les applications ne peuvent pas envoyer de commandes de contrôle à d'autres applications par défaut.\nDans le registre, modifiez les nœuds contrôlables de [{0}], ajoutez [{2}] ou définissez-le sur * pour toutes les applications."
