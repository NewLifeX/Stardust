"Stardust service platform": "Plateforme de services Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Cœur backend de la plateforme de services distribués Stardust. Fournit les services API essentiels pour le centre de configuration, le registre, la découverte de services, le déploiement à distance, la surveillance des performances et le centre de journaux ; prend en charge l'enregistrement des applications, la distribution de la configuration, l'agrégation des métriques, les calculs statistiques et l'ordonnancement des tâches, et peut être mis à l'échelle horizontalement."
"Service port. Default 6600.": "Port du service. Par défaut 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Secret du jeton. Algorithme et secret utilisés pour générer les jetons JWT, par ex. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Durée de validité du jeton. Par défaut 2*3600 secondes."
"Session timeout. Default 600 seconds": "Délai d'expiration de la session. Par défaut 600 secondes"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Délai de déviation du sel. Les clients utilisent l'heure actuelle comme sel lors de la connexion ; un écart trop important avec l'heure du serveur entraîne l'échec de la vérification de la clé ; par défaut 600 secondes"
"Auto-register. Allow node clients to register automatically, default true": "Enregistrement automatique. Autoriser les clients de nœud à s'enregistrer automatiquement, par défaut true"
"Application auto-registration. Allow app clients to register automatically; default true": "Enregistrement automatique des applications. Autoriser les clients d'application à s'enregistrer automatiquement ; par défaut true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Liste blanche d'admission. Si spécifiée, seuls les nœuds correspondant aux conditions IP peuvent s'enregistrer ; séparez plusieurs entrées par des virgules ; prend en charge la correspondance générique *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formule du code de nœud. Sélectionne les informations matérielles de NodeInfo utilisées pour calculer le code de nœud. Prend en charge Crc/Crc16/MD5/MD5_16, par défaut Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Seuil d'identification du code de nœud. UUID+Guid+SerialNumber+DiskId+MAC ; si plusieurs d'entre eux correspondent, le nœud est considéré comme identique, par défaut 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Période des statistiques de flux de supervision. Par défaut 5 secondes. Traite la file en mémoire pour calculer des statistiques à la minute ; des valeurs plus petites améliorent la réactivité mais augmentent l'utilisation du CPU, des valeurs plus grandes réduisent l'utilisation du CPU mais augmentent la latence des alertes"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Période des statistiques par lots de supervision. Par défaut 30 secondes. Corrige les données en agrégeant depuis la base de données ; des valeurs plus petites accélèrent la correction mais augmentent la pression IO, des valeurs plus grandes réduisent la pression mais retardent la correction"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Période de persistance de la supervision. Par défaut 300 secondes. Période de validation par lots de la file de statistiques différées ; les alertes lisent les valeurs en temps réel depuis la mémoire et ne sont pas affectées. Des valeurs plus grandes réduisent nettement la pression UPDATE sur la base de données"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Période d'inspection de la supervision. Par défaut 600 secondes. Recalcule périodiquement les statistiques horaires/journalières des applications peu utilisées au lieu d'un recalcul complet à chaque cycle par lots, ce qui réduit l'amplification d'écriture"
"Monitoring alert period. Default 30 seconds": "Période d'alerte de supervision. Par défaut 30 secondes"
"Console address. Used for monitoring alert addresses": "Adresse de la console. Utilisée pour les adresses d'alerte de supervision"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Durée de conservation des données. Détails des échantillons et statistiques à la minute ; par défaut 3 jours."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Durée de conservation des données à granularité moyenne. Données de performance et statistiques horaires, par défaut 30 jours"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Durée de conservation des données à gros grain. Données historiques et statistiques quotidiennes, par défaut 300 jours."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Mode de nettoyage des données. Prend en charge Truncate efficace ou Delete sans DDL. Par défaut Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Répertoire de téléversement. Stocke les paquets de mise à niveau et doit être le même répertoire que celui configuré pour StarWeb. Par défaut ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Taille maximale du paquet de téléversement. S'applique uniquement au nombre maximal d'octets du corps de requête autorisé par le point de terminaison Deploy/UploadBuildFile ; par défaut 100000000 (100MB), 0 signifie utiliser la limite par défaut de Kestrel, maximum 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Répertoire du cache de fichiers. Stocke les fichiers de cache tels que les pilotes de base de données ; désactivé s'il est vide ; par défaut ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Liste blanche du cache de fichiers. Si elle est spécifiée, seules les sources IP correspondantes peuvent accéder au cache de fichiers ; séparez plusieurs entrées par des virgules ; prend en charge les caractères génériques *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Service de stockage de fichiers. Répondre ou non aux demandes de téléchargement de fichiers des autres nœuds. Par défaut true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Extraction du stockage de fichiers. Extraire ou non activement les nouveaux fichiers publiés par les autres nœuds. Par défaut false."
"Upstream server. Reports data synchronously to the upstream server.": "Serveur parent. Signale les données de manière synchrone au serveur parent."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Ville fixe. Par défaut, la ville est calculée automatiquement à partir de l'IP. Une fois activé, le calcul automatique est désactivé et la ville est définie manuellement"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Autoriser l'accès anonyme au traçage. Permet aux utilisateurs non authentifiés d'accéder à la page de traçage /trace ; les données de supervision peuvent contenir des informations sensibles. Par défaut false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Intervalle de synchronisation dotNet. Récupérer les informations de l'installateur .NET runtime depuis le site officiel, 0 désactive, unité secondes, par défaut 43200 (12 heures)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Adresse de synchronisation dotNet. Adresse API officielle pour récupérer les versions de .NET runtime, prend en charge le paramètre {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Adresse de base de téléchargement des ressources Stardust. URL de base des programmes d'installation/scripts StarAgent ; par défaut, l'adresse officielle"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Autoriser lorsque les nœuds contrôlables sont vides. Indique si les opérations sont autorisées lorsque AllowControlNodes est vide, par défaut false (mode sécurisé, les nœuds contrôlables doivent être configurés explicitement). Les environnements internes peuvent le définir sur true pour rester compatible avec les anciennes données"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Activer le service MCP. Désactivé par défaut ; une fois activé, il expose le point de terminaison POST /mcp aux appels de LLM/agent."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Ensemble d'actions MCP. Noms de modules séparés par des virgules (node/app/config/deploy/gateway/monitor/system), * active tout"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Préfixes de chemin de limitation de débit. Séparés par des virgules ; les chemins correspondants sont limités par IP ; par défaut, les points de terminaison d'authentification tels que login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Limite de débit. Nombre de requêtes autorisées par IP et par minute ; par défaut 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Autoriser les rapports de télémétrie anonymes. Nécessaire pour la cascade multi-niveaux ou un SDK minimal ; par défaut false (sécurisé)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Origines CORS autorisées. Séparées par des virgules ; vide autorise toute origine ; si spécifié, seules les origines en liste blanche peuvent faire du cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Authentification du téléchargement des pièces jointes. Indique si le jeton de téléchargement des pièces jointes est vérifié pour /cube/file. Par défaut false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Catégories de pièces jointes publiques sans connexion. Séparées par des virgules ; les éléments correspondants peuvent être téléchargés anonymement."
"Attachment download token validity. Seconds, default 600.": "Validité du jeton de téléchargement des pièces jointes. Secondes, par défaut 600."
