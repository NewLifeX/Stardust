"Stardust service platform": "Platforma de servicii Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Miezul backend al platformei distribuite de servicii Stardust. Oferă servicii API esențiale pentru centrul de configurare, registru, descoperirea serviciilor, implementarea la distanță, monitorizarea performanței și centrul de jurnale; acceptă înregistrarea aplicațiilor, distribuirea configurațiilor, agregarea metricilor, calcule statistice și programarea sarcinilor și poate fi scalat orizontal."
"Service port. Default 6600.": "Port de serviciu. Implicit 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Secretul tokenului. Algoritmul și secretul folosite pentru generarea tokenurilor JWT, de ex. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Perioada de valabilitate a tokenului. Implicit 2*3600 secunde."
"Session timeout. Default 600 seconds": "Timeout sesiune. Implicit 600 secunde"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Timp de abatere a salt-ului. Clienții folosesc ora curentă ca salt la autentificare; o diferență prea mare față de server duce la eșecul verificării cheii; implicit 600 secunde"
"Auto-register. Allow node clients to register automatically, default true": "Înregistrare automată. Permite clienților nod să se înregistreze automat, implicit true"
"Application auto-registration. Allow app clients to register automatically; default true": "Înregistrare automată a aplicațiilor. Permite clienților de aplicații să se înregistreze automat; implicit true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Lista albă de admitere. Dacă este specificată, doar nodurile care îndeplinesc condițiile IP se pot înregistra, separați mai multe intrări cu virgule, acceptă potrivire cu wildcard *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formula codului de nod. Selectează ce informații hardware din NodeInfo sunt folosite pentru calcularea codului de nod. Acceptă Crc/Crc16/MD5/MD5_16, implicit Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Prag de identificare a codului de nod. UUID+Guid+SerialNumber+DiskId+MAC; dacă mai multe dintre ele coincid, nodul este considerat același, implicit 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Perioada statisticilor fluxului de monitorizare. Implicit 5 secunde. Procesează coada din memorie pentru a calcula statistici la nivel de minut; valorile mai mici îmbunătățesc actualitatea, dar cresc utilizarea CPU, valorile mai mari reduc utilizarea CPU, dar cresc latența alertelor"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Perioada statisticilor în loturi de monitorizare. Implicit 30 secunde. Corectează datele prin agregare din baza de date; valorile mai mici accelerează corectarea, dar cresc presiunea IO, valorile mai mari reduc presiunea, dar întârzie corectarea"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Perioada de salvare a monitorizării. Implicit 300 secunde. Perioada de trimitere în lot a cozii de statistici întârziate; alertele citesc valorile în timp real din memorie și nu sunt afectate. Valorile mai mari reduc semnificativ presiunea UPDATE asupra bazei de date"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Perioada de inspecție a monitorizării. Implicit 600 secunde. Recalculează periodic statisticile orare/zilnice pentru aplicațiile nepopulare, în locul recalculării complete la fiecare ciclu de lot, reducând amplificarea scrierilor"
"Monitoring alert period. Default 30 seconds": "Perioadă de alertă de monitorizare. Implicit 30 secunde"
"Console address. Used for monitoring alert addresses": "Adresa consolei. Folosită pentru adresele alertelor de monitorizare"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Perioada de păstrare a datelor. Detalii despre eșantioane și statistici la nivel de minut; implicit 3 zile."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Durata de păstrare a datelor cu granularitate medie. Date de performanță și statistici orare, implicit 30 zile"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Perioada de păstrare a datelor cu granularitate mare. Date istorice și statistici zilnice, implicit 300 zile."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Mod de curățare a datelor. Acceptă Truncate eficient sau Delete fără DDL. Implicit Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Director de încărcare. Stochează pachetele de actualizare și trebuie să fie același director configurat pentru StarWeb. Implicit ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Dimensiunea maximă a pachetului de încărcare. Se aplică numai numărului maxim de octeți din corpul cererii permis de punctul final Deploy/UploadBuildFile; implicit 100000000 (100MB), 0 înseamnă utilizarea limitei implicite Kestrel, maximum 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Directorul cache-ului de fișiere. Stochează fișiere cache precum drivere de baze de date; dezactivat când este gol; implicit ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Lista de permisiuni pentru memoria cache de fișiere. Dacă este specificată, doar sursele IP corespunzătoare pot accesa cache-ul de fișiere; separați mai multe intrări prin virgule; acceptă metacaractere *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Serviciu de stocare a fișierelor. Dacă se răspunde la cererile de descărcare de fișiere de la alte noduri. Implicit true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Preluare din stocarea fișierelor. Dacă se preiau activ fișierele noi publicate de alte noduri. Implicit false."
"Upstream server. Reports data synchronously to the upstream server.": "Server superior. Raportează datele sincron serverului superior."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Oraș fix. În mod implicit, orașul este calculat automat din IP. Când este activat, calculul automat este oprit, iar orașul este setat manual"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Permite accesul anonim la trasare. Permite utilizatorilor neautentificați să acceseze pagina de trasare /trace; datele de monitorizare pot conține informații sensibile. Implicit false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Interval de sincronizare dotNet. Preluați informațiile despre programul de instalare .NET runtime de pe site-ul oficial, 0 dezactivează, unitate secunde, implicit 43200 (12 ore)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Adresă de sincronizare dotNet. Adresă API oficială pentru preluarea versiunilor .NET runtime, acceptă substituentul {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Adresa de bază pentru descărcarea resurselor Stardust. URL de bază pentru instalatoarele/scripturile StarAgent; implicit adresa oficială"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Permite când nodurile controlabile sunt goale. Dacă operațiile sunt permise când AllowControlNodes este gol, implicit false (mod securizat, nodurile controlabile trebuie configurate explicit). Mediile interne îl pot seta pe true pentru compatibilitate cu datele vechi"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Activare serviciu MCP. Dezactivat implicit; când este activat, expune punctul final POST /mcp pentru apeluri LLM/agent."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Set de acțiuni MCP. Nume de module separate prin virgule (node/app/config/deploy/gateway/monitor/system), * activează tot"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Prefixe de cale pentru limitarea ratei. Separate prin virgule; căile corespunzătoare sunt limitate după IP; implicit endpoint-uri de autentificare precum login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Limită de rată. Numărul de cereri permise per IP pe minut; implicit 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Permite raportarea anonimă de telemetrie. Necesară pentru cascadare pe mai multe niveluri sau SDK minimal; implicit false (sigur)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Origini CORS permise. Separate prin virgule; gol permite orice origine; când este specificat, doar originile din lista albă pot face cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Autentificarea descărcării atașamentelor. Dacă se verifică tokenul de descărcare a atașamentelor pentru /cube/file. Implicit false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Categorii publice de atașamente fără autentificare. Separate prin virgulă, elementele potrivite pot fi descărcate anonim."
"Attachment download token validity. Seconds, default 600.": "Valabilitatea tokenului de descărcare a atașamentelor. Secunde, implicit 600."
