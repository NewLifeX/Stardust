"Stardust service platform": "Stardust-serviceplatform"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Backendkern van het gedistribueerde Stardust-serviceplatform. Biedt kern-API-diensten voor configuratiecentrum, register, servicedetectie, externe implementatie, prestatiemonitoring en logcentrum, ondersteunt applicatieregistratie, configuratielevering, aggregatie van metrische gegevens, statistische berekeningen en taakplanning, en kan horizontaal worden geschaald."
"Service port. Default 6600.": "Servicepoort. Standaard 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Tokengeheim. Algoritme en geheim voor het genereren van JWT-tokens, bijv. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Geldigheidsduur van token. Standaard 2*3600 seconden."
"Session timeout. Default 600 seconds": "Sessietime-out. Standaard 600 seconden"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Salt-afwijkingstijd. Clients gebruiken de huidige tijd als salt bij het inloggen; een te groot tijdsverschil met de server laat de sleutelverificatie mislukken; standaard 600 seconden"
"Auto-register. Allow node clients to register automatically, default true": "Automatische registratie. Sta toe dat nodeclients zich automatisch registreren, standaard true"
"Application auto-registration. Allow app clients to register automatically; default true": "Automatische applicatieregistratie. Sta toe dat app-clients zich automatisch registreren; standaard true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Toelatingswhitelist. Indien opgegeven mogen alleen knooppunten die aan de IP-voorwaarden voldoen zich registreren, scheid meerdere met komma's, ondersteunt *-jokertekens"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Formule voor nodecode. Selecteert welke hardware-informatie in NodeInfo wordt gebruikt om de nodecode te berekenen. Ondersteunt Crc/Crc16/MD5/MD5_16, standaard Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Drempel voor nodecode-identificatie. UUID+Guid+SerialNumber+DiskId+MAC; als meerdere daarvan overeenkomen, wordt de node als dezelfde beschouwd, standaard 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Statistiekperiode voor monitoringstream. Standaard 5 seconden. Verwerkt de wachtrij in het geheugen om statistieken per minuut te berekenen; kleinere waarden verbeteren de realtime werking maar verhogen het CPU-gebruik, grotere waarden verlagen het CPU-gebruik maar verhogen de meldingsvertraging"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Batchstatistiekperiode voor monitoring. Standaard 30 seconden. Corrigeert gegevens door te aggregeren uit de database; kleinere waarden versnellen de correctie maar verhogen de IO-druk, grotere waarden verlagen de druk maar vertragen de correctie"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Opslagperiode voor monitoring. Standaard 300 seconden. Periode voor batchgewijze verwerking van de statistiekvertragingswachtrij; meldingen lezen realtimewaarden uit het geheugen en worden niet beïnvloed. Grotere waarden verlagen de UPDATE-druk op de database aanzienlijk"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Inspectieperiode voor monitoring. Standaard 600 seconden. Herberekent uur-/dagstatistieken voor niet-populaire toepassingen periodiek in plaats van een volledige herberekening in elke batchcyclus, waardoor schrijfversterking afneemt"
"Monitoring alert period. Default 30 seconds": "Meldingsperiode voor monitoring. Standaard 30 seconden"
"Console address. Used for monitoring alert addresses": "Consoleadres. Wordt gebruikt voor meldingsadressen van monitoring"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Bewaartermijn van gegevens. Steekproefdetails en statistieken op minuutniveau; standaard 3 dagen."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Bewaartermijn voor gegevens met gemiddelde granulariteit. Prestatiedata en statistieken per uur, standaard 30 dagen"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Bewaartermijn voor grofkorrelige gegevens. Historische gegevens en dagelijkse statistieken, standaard 300 dagen."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Opschoningsmodus voor gegevens. Ondersteunt efficiënte Truncate of Delete zonder DDL. Standaard Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Uploadmap. Slaat upgradepakketten op en moet dezelfde map zijn als geconfigureerd voor StarWeb. Standaard ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maximale grootte van uploadpakket. Geldt alleen voor het maximaal toegestane aantal bytes in de aanvraagbody van het Deploy/UploadBuildFile-eindpunt; standaard 100000000 (100MB), 0 betekent de standaardlimiet van Kestrel gebruiken, maximaal 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Map voor bestandscache. Slaat cachebestanden op zoals databasedrivers; uitgeschakeld indien leeg; standaard ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Whitelist voor bestandscache. Indien opgegeven hebben alleen overeenkomende IP-bronnen toegang tot de bestandscache; scheid meerdere vermeldingen met komma's; ondersteunt * jokertekens"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Bestandsopslagservice. Of wordt gereageerd op bestandsdownloadverzoeken van andere nodes. Standaard true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Ophalen uit bestandsopslag. Of nieuwe bestanden die door andere nodes zijn gepubliceerd actief worden opgehaald. Standaard false."
"Upstream server. Reports data synchronously to the upstream server.": "Bovenliggende server. Rapporteert gegevens synchroon aan de bovenliggende server."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Vaste stad. Standaard wordt de stad automatisch berekend op basis van het IP. Indien ingeschakeld, vervalt de automatische berekening en wordt de stad handmatig ingesteld"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Anonieme trace-toegang toestaan. Niet-aangemelde gebruikers toegang geven tot de /trace-tracepagina; bewakingsgegevens kunnen gevoelige informatie bevatten. Standaard false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet-synchronisatie-interval. .NET runtime-installatiegegevens ophalen van de officiële site, 0 schakelt uit, eenheid seconden, standaard 43200 (12 uur)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet-synchronisatieadres. Officieel API-adres voor het ophalen van .NET runtime-versies, ondersteunt de plaatsaanduiding {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Basisadres voor het downloaden van Stardust-resources. Basis-URL voor StarAgent-installatieprogramma's/scripts; standaard het officiële adres"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Toestaan wanneer bestuurbare nodes leeg zijn. Of bewerkingen zijn toegestaan wanneer AllowControlNodes leeg is, standaard false (veilige modus, bestuurbare nodes moeten expliciet worden geconfigureerd). Interne omgevingen kunnen dit op true zetten voor compatibiliteit met oude gegevens"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP-service inschakelen. Standaard uitgeschakeld; indien ingeschakeld wordt het POST /mcp-eindpunt beschikbaar voor LLM-/agent-aanroepen."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP-actieset. Kommagescheiden modulenamen (node/app/config/deploy/gateway/monitor/system), * schakelt alles in"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Padprefixen voor snelheidsbeperking. Komma-gescheiden; overeenkomende paden worden per IP beperkt; standaard authenticatie-eindpunten zoals login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Aantal snelheidsbeperkingen. Aantal toegestane verzoeken per IP per minuut; standaard 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Anonieme telemetrierapportage toestaan. Vereist voor cascadering op meerdere niveaus of een minimale SDK; standaard false (veilig)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Toegestane CORS-origins. Kommagescheiden; leeg staat elke origin toe; indien opgegeven mogen alleen whitelisted origins cross-origin uitvoeren"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Authenticatie van bijlagendownload. Of het downloadtoken voor bijlagen bij /cube/file wordt geverifieerd. Standaard false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Openbare bijlagecategorieën zonder aanmelding. Kommagescheiden, overeenkomende items kunnen anoniem worden gedownload."
"Attachment download token validity. Seconds, default 600.": "Geldigheid van downloadtoken voor bijlagen. Seconden, standaard 600."
