"Token validity period. Default 2*3600 seconds.": "Belirteç geçerlilik süresi. Varsayılan 2*3600 saniye."
"Session timeout. Default 600 seconds": "Oturum zaman aşımı. Varsayılan 600 saniye"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Salt sapma süresi. İstemciler oturum açarken geçerli saati salt olarak kullanır; sunucuyla saat farkı çok büyükse anahtar doğrulaması başarısız olur; varsayılan 600 saniye"
"Auto-register. Allow node clients to register automatically, default true": "Otomatik kayıt. Düğüm istemcilerinin otomatik kaydolmasına izin ver, varsayılan true"
"Application auto-registration. Allow app clients to register automatically; default true": "Otomatik uygulama kaydı. Uygulama istemcilerinin otomatik olarak kaydolmasına izin verir; varsayılan true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Kabul beyaz listesi. Belirtilirse yalnızca IP koşullarını karşılayan düğümler kayıt olabilir, birden çok girişi virgülle ayırın, * joker eşleşmesi desteklenir"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Düğüm kodu formülü. NodeInfo içindeki hangi donanım bilgilerinin düğüm kodunu hesaplamak için kullanılacağını seçer. Crc/Crc16/MD5/MD5_16 desteklenir, varsayılan Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Düğüm kodu tanımlama eşiği. UUID+Guid+SerialNumber+DiskId+MAC; bunlardan birkaçı eşleşirse düğüm aynı kabul edilir, varsayılan 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "İzleme akışı istatistik periyodu. Varsayılan 5 saniye. Dakika düzeyinde istatistikleri hesaplamak için bellek içi kuyruğu işler; küçük değerler gerçek zamanlılığı artırır ancak CPU kullanımını yükseltir, büyük değerler CPU kullanımını düşürür ancak uyarı gecikmesini artırır"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "İzleme toplu istatistik periyodu. Varsayılan 30 saniye. Verileri veritabanından toplayarak düzeltir; küçük değerler düzeltmeyi hızlandırır ancak IO yükünü artırır, büyük değerler yükü azaltır ancak düzeltmeyi geciktirir"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "İzleme kayıt periyodu. Varsayılan 300 saniye. İstatistik gecikme kuyruğunun toplu gönderim periyodu; uyarılar bellekteki gerçek zamanlı değerleri okur ve etkilenmez. Büyük değerler veritabanı UPDATE yükünü önemli ölçüde azaltır"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "İzleme denetim periyodu. Varsayılan 600 saniye. Popüler olmayan uygulamaların saatlik/günlük istatistiklerini her toplu döngüde tam yeniden hesaplama yerine periyodik olarak yeniden hesaplar ve yazma çoğaltmasını azaltır"
"Monitoring alert period. Default 30 seconds": "İzleme uyarı periyodu. Varsayılan 30 saniye"
"Console address. Used for monitoring alert addresses": "Konsol adresi. İzleme uyarı adresleri için kullanılır"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Veri saklama süresi. Örnek ayrıntıları ve dakika düzeyinde istatistikler; varsayılan 3 gün."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Orta ayrıntılı veri saklama süresi. Performans verileri ve saatlik istatistikler, varsayılan 30 gün"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Kaba taneli veriler için saklama süresi. Geçmiş veriler ve günlük istatistikler, varsayılan 300 gün."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Veri temizleme modu. Verimli Truncate veya DDL gerektirmeyen Delete desteklenir. Varsayılan Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Yükleme dizini. Yükseltme paketlerini saklar ve StarWeb için yapılandırılan dizinle aynı olmalıdır. Varsayılan ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Maksimum yükleme paketi boyutu. Yalnızca Deploy/UploadBuildFile uç noktasının izin verdiği maksimum istek gövdesi bayt sayısı için geçerlidir; varsayılan 100000000 (100MB), 0 Kestrel varsayılan sınırının kullanılacağı anlamına gelir, en fazla 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Dosya önbelleği dizini. Veritabanı sürücüleri gibi önbellek dosyalarını saklar; boş olduğunda devre dışıdır; varsayılan ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Dosya önbelleği beyaz listesi. Belirtilirse, yalnızca eşleşen IP kaynakları dosya önbelleğine erişebilir; birden çok girişi virgülle ayırın; * joker karakterlerini destekler"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Dosya depolama hizmeti. Diğer düğümlerden gelen dosya indirme isteklerine yanıt verilip verilmeyeceği. Varsayılan true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Dosya depolama çekme. Diğer düğümlerin yayımladığı yeni dosyaların etkin olarak çekilip çekilmeyeceği. Varsayılan false."
"Upstream server. Reports data synchronously to the upstream server.": "Üst sunucu. Verileri üst sunucuya eşzamanlı olarak bildirir."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Sabit şehir. Varsayılan olarak şehir IP'den otomatik hesaplanır. Etkinleştirildiğinde otomatik hesaplama durur ve şehir elle ayarlanır"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Anonim izleme erişimine izin ver. Oturum açmamış kullanıcıların /trace izleme sayfasına erişmesine izin verir; izleme verileri hassas bilgiler içerebilir. Varsayılan false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet eşitleme aralığı. Resmi siteden .NET çalışma zamanı yükleyici bilgilerini al, 0 devre dışı bırakır, birim saniye, varsayılan 43200 (12 saat)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet eşitleme adresi. .NET çalışma zamanı sürümlerini almak için resmi API adresi, {major} yer tutucusunu destekler"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Stardust kaynak indirme temel adresi. StarAgent yükleyicileri/betikleri için temel URL; varsayılan resmi adres"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Denetlenebilir düğümler boşken izin ver. AllowControlNodes boşken işlemlere izin verilip verilmeyeceği, varsayılan false (güvenli mod, denetlenebilir düğümler açıkça yapılandırılmalıdır). Dahili ortamlar, eski verilerle uyumluluk için bunu true olarak ayarlayabilir"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP hizmetini etkinleştir. Varsayılan olarak kapalıdır; etkinleştirildiğinde LLM/ajan çağrıları için POST /mcp uç noktasını sunar."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP eylem kümesi. Virgülle ayrılmış modül adları (node/app/config/deploy/gateway/monitor/system), * tümünü etkinleştirir"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Hız sınırı yol önekleri. Virgülle ayrılır; eşleşen yollar IP'ye göre sınırlandırılır; varsayılan olarak login/token gibi kimlik doğrulama uç noktaları"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Hız sınırı sayısı. IP başına dakikada izin verilen istek sayısı; varsayılan 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Anonim telemetri raporlamasına izin ver. Çok düzeyli kademeleme veya minimal SDK için gereklidir; varsayılan false (güvenli)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "İzin verilen CORS kaynakları. Virgülle ayrılmış; boşsa her kaynağa izin verilir; belirtilirse yalnızca beyaz listedeki kaynaklar çapraz kaynak isteği yapabilir"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Ek indirme kimlik doğrulaması. /cube/file için ek indirme belirtecinin doğrulanıp doğrulanmayacağı. Varsayılan false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Oturum açmadan erişilebilen genel ek kategorileri. Virgülle ayrılır, eşleşen öğeler anonim olarak indirilebilir."
"Attachment download token validity. Seconds, default 600.": "Ek indirme belirteci geçerliliği. Saniye, varsayılan 600."
