"[{0}] is not allowed to operate node [{1}].\nFor security, applications cannot send control commands to arbitrary nodes by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all nodes.": "[{0}] non può operare sul nodo [{1}].\nPer sicurezza, per impostazione predefinita le applicazioni non possono inviare comandi di controllo a nodi arbitrari.\nNel registro, modificare i nodi controllabili di [{0}], aggiungere [{2}] oppure impostarlo su * per tutti i nodi."
"[{0}] is not allowed to operate application [{1}].\nFor security, applications cannot send control commands to other applications by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all applications.": "[{0}] non può operare sull'applicazione [{1}].\nPer sicurezza, per impostazione predefinita le applicazioni non possono inviare comandi di controllo ad altre applicazioni.\nNel registro, modificare i nodi controllabili di [{0}], aggiungere [{2}] oppure impostarlo su * per tutte le applicazioni."
