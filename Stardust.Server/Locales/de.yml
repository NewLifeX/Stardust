"Stardust service platform": "Stardust-Dienstplattform"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Backend-Kern der verteilten Stardust-Dienstplattform. Bietet zentrale API-Dienste für Konfigurationscenter, Registry, Dienstermittlung, Remote-Bereitstellung, Performance-Überwachung und Log-Center, unterstützt Anwendungsregistrierung, Konfigurationsverteilung, Metrikaggregation, Statistiken und Aufgabenplanung und lässt sich horizontal skalieren."
"Service port. Default 6600.": "Dienstport. Standard 6600."
