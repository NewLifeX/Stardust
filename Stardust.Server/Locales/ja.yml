"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "ノード [{0}/{1}] は既存のノード [{2}] と非常に類似しているため、既存のノードを使用します"
"Stardust service platform": "Stardust サービスプラットフォーム"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Stardust 分散サービスプラットフォームのバックエンドコア。構成センター、レジストリ、サービス検出、リモートデプロイ、パフォーマンス監視、ログセンター向けの中核 API サービスを提供し、アプリケーション登録、構成配信、メトリック集約、統計計算、タスクスケジューリングをサポートするとともに、水平スケーリングが可能です。"
"Service port. Default 6600.": "サービスポート。既定値6600。"
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "トークンシークレット。JWT トークンの生成に使用するアルゴリズムとシークレット。例：HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "トークンの有効期間。既定 2*3600 秒。"
"Session timeout. Default 600 seconds": "セッションタイムアウト。既定 600 秒"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "ソルト偏差時間。クライアントはログイン時に現在時刻をソルトとして使用します。サーバーとの時刻差が大きすぎると鍵の検証に失敗します。既定値は 600 秒です"
"Auto-register. Allow node clients to register automatically, default true": "自動登録。ノードクライアントの自動登録を許可します。既定 true"
"Application auto-registration. Allow app clients to register automatically; default true": "アプリケーションの自動登録。アプリクライアントの自動登録を許可します。既定値は true です"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "受け入れホワイトリスト。指定時は IP 条件に一致するノードのみ登録を許可します。複数はカンマ区切り、* によるあいまい一致に対応"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "ノードコード式。ノードコードの計算に NodeInfo のどのハードウェア情報を使用するかを選択します。Crc/Crc16/MD5/MD5_16 に対応、既定 Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "ノードコード識別しきい値。UUID+Guid+SerialNumber+DiskId+MAC のうちいくつかが一致すれば同一ノードとみなします。既定 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "監視ストリーム統計周期。既定 5 秒。メモリ内キューを処理して分単位の統計を計算します。小さくするとリアルタイム性が向上しますが CPU 使用率が増加し、大きくすると CPU 使用率は下がりますがアラート遅延が増加します"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "監視バッチ統計周期。既定 30 秒。データベースから集計してデータを補正します。小さくすると補正が速くなりますが IO 負荷が増加し、大きくすると負荷は下がりますが補正が遅れます"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "監視データの書き込み周期。既定 300 秒。統計遅延キューの一括コミット周期です。アラートはメモリ上のリアルタイム値を読み取るため影響を受けません。大きくするとデータベースの UPDATE 負荷が大幅に低下します"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "監視巡回周期。既定 600 秒。人気のないアプリケーションの時間/日次統計を、各バッチ周期での全量再計算の代わりに定期的に再計算し、書き込み増幅を抑えます"
"Monitoring alert period. Default 30 seconds": "監視アラート周期。既定 30 秒"
"Console address. Used for monitoring alert addresses": "コンソールアドレス。監視アラートのアドレスに使用します"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "データ保持期間。サンプル明細および分単位の統計データ、既定 3 日。"
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "中粒度データの保存期間。パフォーマンスデータと時間別統計、既定 30 日"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "粗粒度データの保持期間。履歴データと日次統計、既定値300日。"
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "データクリーンアップモード。効率的な Truncate、または DDL 不要の Delete をサポート。既定 Truncate。"
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "アップロードディレクトリ。アップグレードパッケージを保存し、StarWeb に構成したものと同じディレクトリである必要があります。既定 ../Uploads。"
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "アップロードパッケージの最大サイズ。Deploy/UploadBuildFile エンドポイントで許可されるリクエスト本文の最大バイト数のみに適用、既定 100000000（100MB）、0 は Kestrel の既定制限を使用、最大 1GB。"
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "ファイルキャッシュディレクトリ。データベースドライバーなどのキャッシュファイルを保存します。空の場合は無効です。既定値は ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "ファイルキャッシュのホワイトリスト。指定した場合、条件に一致するIP送信元のみがファイルキャッシュにアクセスできます。複数の項目はカンマで区切ります。* のワイルドカードをサポートします"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "ファイルストレージの提供。他のノードからのファイルダウンロード要求に応答するか。既定 true。"
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "ファイルストレージの取得。他のノードが公開した新規ファイルを能動的に取得するか。既定 false。"
"Upstream server. Reports data synchronously to the upstream server.": "上位サーバー。データを上位サーバーへ同期的に報告します。"
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "固定城市。既定ではIPから都市を自動計算します。有効にすると自動計算を停止し、手動で設定します"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "匿名でトレースにアクセスすることを許可します。未ログインユーザーが/traceのトレースページにアクセスできるようにします。監視データに機密情報が含まれる場合があります。既定値false。"
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "dotNet 同期間隔。公式サイトから .NET ランタイムインストーラー情報を取得します。0 は無効、単位は秒、既定 43200（12 時間）"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "dotNet 同期アドレス。.NET ランタイムのバージョンを取得する公式 API アドレス。{major} プレースホルダーに対応"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Stardust リソースのダウンロードベースアドレス。StarAgent インストーラー/スクリプトのベース URL です。既定値は公式アドレスです"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "制御可能ノードが空の場合に許可。AllowControlNodes が空の場合に操作を許可するかどうか。既定 false（セキュアモード、制御可能ノードの明示的な設定が必要）。内部環境では旧データとの互換性のため true に設定できます"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "MCP サービスを有効化。既定では無効、有効にすると LLM/エージェント呼び出し用に POST /mcp エンドポイントを公開します。"
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "MCP アクションセット。カンマ区切りのモジュール名（node/app/config/deploy/gateway/monitor/system）。* はすべて有効を意味します"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "レート制限パスのプレフィックス。カンマ区切りです。一致するパスはIPごとにレート制限されます。既定値は login/token などの認証エンドポイントです"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "レート制限回数。IPごと1分あたりに許可されるリクエスト数です。既定値は 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "匿名テレメトリレポートを許可します。多段カスケードや最小構成の SDK に必要です。既定値は false（安全）です"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "CORS 許可オリジン。カンマ区切り。空の場合は任意のオリジンを許可し、指定時はホワイトリストのオリジンのみクロスオリジンを許可します"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "添付ファイルのダウンロード認証。/cube/fileの添付ファイルダウンロードトークンを検証するかどうか。既定値false。"
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "ログイン不要の公開添付ファイル分類。カンマ区切り、一致した項目は匿名でダウンロードできます。"
"Attachment download token validity. Seconds, default 600.": "添付ファイルのダウンロードトークンの有効期間。秒、既定値600。"
