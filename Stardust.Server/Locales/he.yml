"[{0}] the client now carries the correct secret; the convergence window is closed automatically": "[{0}] הלקוח נושא כעת את הסוד הנכון; חלון ההתכנסות נסגר אוטומטית"
"Hardware information changed too much.": "פרטי החומרה השתנו יותר מדי."
"Unique identifier mismatch (new != old): {0} != {1}": "אי התאמה במזהה הייחודי (חדש != ישן): {0} != {1}"
"Machine identifier mismatch (new != old): {0} != {1}": "אי התאמה במזהה המכונה (חדש != ישן): {0} != {1}"
"Computer serial number mismatch (new != old): {0} != {1}": "אי התאמה במספר הסידורי של המחשב (חדש != ישן): {0} != {1}"
"Motherboard mismatch (new != old): {0} != {1}": "אי התאמה בלוח האם (חדש != ישן): {0} != {1}"
"Product code mismatch (new != old): {0} != {1}": "אי התאמה בקוד המוצר (חדש != ישן): {0} != {1}"
"Machine name mismatch (new != old): {0} != {1}": "אי התאמה בשם המכונה (חדש != ישן): {0} != {1}"
"MAC address mismatch (new != old): {0} != {1}": "אי התאמה בכתובת MAC (חדש != ישן): {0} != {1}"
"Disk serial number mismatch (new != old): {0} != {1}": "אי התאמה במספר הסידורי של הדיסק (חדש != ישן): {0} != {1}"
"Version={0} Size={1:n0} Node={2}": "גרסה={0} גודל={1:n0} צומת={2}"
"Associated online": "משויך ומקוון"
"Dynamic registration": "רישום דינמי"
"UI language, for example zh-Hans, zh-Hant, en, or ja; leave empty to detect from each request in web hosts and to follow the system language otherwise": "שפת ממשק המשתמש, לדוגמה zh-Hans, zh-Hant, en או ja; השאירו ריק כדי לזהות מכל בקשה במארחי אינטרנט ולעקוב אחר שפת המערכת אחרת"
"[{0}/{1}] logged in at {2}, last active at {3}": "[{0}/{1}] התחבר ב-{2}, פעיל לאחרונה ב-{3}"
"Node [{0}/{1}] is highly similar to the existing node [{2}]; using the existing node": "הצומת [{0}/{1}] דומה מאוד לצומת הקיים [{2}]; הצומת הקיים ישמש"
"Stardust service platform": "פלטפורמת השירותים Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "ליבת ה-backend של פלטפורמת השירותים המבוזרת Stardust. מספקת שירותי API ליבה עבור מרכז התצורה, הרישום, גילוי שירותים, פריסה מרחוק, ניטור ביצועים ומרכז יומנים; תומכת ברישום יישומים, הפצת תצורה, צבירת מדדים, חישובים סטטיסטיים ותזמון משימות, וניתנת להרחבה אופקית."
"Service port. Default 6600.": "יציאת השירות. ברירת מחדל 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "סוד אסימון. האלגוריתם והמפתח המשמשים ליצירת אסימוני JWT, כגון HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "תקופת תוקף האסימון. ברירת מחדל 2*3600 שניות."
"Session timeout. Default 600 seconds": "פסק זמן של הפעלה. ברירת מחדל 600 שניות"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "זמן סטיית salt. לקוחות משתמשים בזמן הנוכחי כ-salt בעת ההתחברות; פער זמן גדול מדי מול השרת יגרום לכשל באימות המפתח; ברירת מחדל 600 שניות"
"Auto-register. Allow node clients to register automatically, default true": "רישום אוטומטי. לאפשר ללקוחות צמתים להירשם אוטומטית, ברירת מחדל true"
"Application auto-registration. Allow app clients to register automatically; default true": "רישום יישומים אוטומטי. לאפשר ללקוחות יישומים להירשם אוטומטית; ברירת מחדל true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "רשימת היתר קבלה. אם צוינה, רק צמתים העומדים בתנאי IP יוכלו להירשם, יש להפריד ערכים מרובים בפסיקים, נתמכת התאמת תו כללי *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "נוסחת קוד צומת. בוחר אילו פרטי חומרה ב-NodeInfo משמשים לחישוב קוד הצומת. תומך ב-Crc/Crc16/MD5/MD5_16, ברירת מחדל Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "סף זיהוי קוד צומת. UUID+Guid+SerialNumber+DiskId+MAC; אם כמה מהם תואמים, הצומת נחשב לזהה, ברירת מחדל 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "פרק סטטיסטיקת זרם הניטור. ברירת מחדל 5 שניות. מעבד את התור בזיכרון לחישוב סטטיסטיקות ברמת דקות; ערכים קטנים משפרים את העדכניות אך מגדילים את השימוש ב-CPU, ערכים גדולים מקטינים את השימוש ב-CPU אך מגדילים את השהיית ההתראות"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "פרק סטטיסטיקות אצווה של הניטור. ברירת מחדל 30 שניות. מתקן נתונים על ידי צבירה ממסד הנתונים; ערכים קטנים מאיצים את התיקון אך מגדילים את עומס ה-IO, ערכים גדולים מקטינים את העומס אך מעכבים את התיקון"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "פרק שמירת הניטור. ברירת מחדל 300 שניות. פרק שליחה באצוות של תור עיכוב הסטטיסטיקות; ההתראות קוראות ערכים בזמן אמת מהזיכרון ואינן מושפעות. ערכים גדולים מקטינים באופן ניכר את עומס ה-UPDATE על מסד הנתונים"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "פרק בדיקת הניטור. ברירת מחדל 600 שניות. מחשב מחדש סטטיסטיקות שעתיות/יומיות עבור יישומים לא פופולריים באופן תקופתי במקום חישוב מלא בכל מחזור אצווה, ובכך מפחית כתיבה מוגברת"
"Monitoring alert period. Default 30 seconds": "פרק התראת ניטור. ברירת מחדל 30 שניות"
"Console address. Used for monitoring alert addresses": "כתובת מסוף. משמשת לכתובות התראות ניטור"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "תקופת שמירת נתונים. פרטי דגימות וסטטיסטיקות ברמת דקה; ברירת מחדל 3 ימים."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "משך שמירת נתונים ברזולוציה בינונית. נתוני ביצועים וסטטיסטיקות שעתיות, ברירת מחדל 30 ימים"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "משך שמירת נתונים גסים. נתונים היסטוריים וסטטיסטיקות יומיות, ברירת מחדל 300 ימים."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "מצב ניקוי נתונים. תומך ב-Truncate יעיל או ב-Delete ללא DDL. ברירת מחדל Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "תיקיית העלאה. מאחסנת חבילות שדרוג וחייבת להיות אותה תיקייה שהוגדרה עבור StarWeb. ברירת מחדל ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "גודל מרבי של חבילת העלאה. חל רק על מספר הבתים המרבי המותר בגוף הבקשה של נקודת הקצה Deploy/UploadBuildFile; ברירת מחדל 100000000 (100MB), 0 פירושו שימוש במגבלה המוגדרת כברירת מחדל של Kestrel, מקסימום 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "ספריית מטמון קבצים. מאחסנת קבצי מטמון כגון מנהלי התקנים של מסדי נתונים; מושבת כשהיא ריקה; ברירת מחדל ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "רשימת היתר של מטמון קבצים. אם צוינה, רק מקורות IP תואמים יוכלו לגשת למטמון הקבצים; הפרידו ערכים מרובים בפסיקים; תומך בתו כללי *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "שירות אחסון קבצים. האם להגיב לבקשות הורדת קבצים מצמתים אחרים. ברירת מחדל true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "משיכת אחסון קבצים. האם למשוך באופן אקטיבי קבצים חדשים שפורסמו על ידי צמתים אחרים. ברירת מחדל false."
"Upstream server. Reports data synchronously to the upstream server.": "שרת על. מדווח נתונים באופן סינכרוני לשרת העל."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "עיר קבועה. כברירת מחדל העיר מחושבת אוטומטית לפי ה-IP. כאשר האפשרות מופעלת, החישוב האוטומטי מופסק והעיר מוגדרת ידנית"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "אפשר גישה אנונימית למעקב. מאפשר למשתמשים שאינם מחוברים לגשת לעמוד המעקב /trace; נתוני ניטור עשויים להכיל מידע רגיש. ברירת מחדל false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "מרווח סנכרון dotNet. שליפת מידע מתקין .NET runtime מהאתר הרשמי, 0 משמעו מושבת, יחידה שניות, ברירת מחדל 43200 (12 שעות)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "כתובת סנכרון dotNet. כתובת ה-API הרשמית לשליפת גרסאות .NET runtime, תומכת במציין המקום {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "כתובת בסיס להורדת משאבי Stardust. כתובת URL בסיסית לחבילות התקנה/סקריפטים של StarAgent; ברירת מחדל הכתובת הרשמית"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "אפשר כאשר צמתים ניתנים לשליטה ריקים. האם לאפשר פעולות כאשר AllowControlNodes ריק, ברירת מחדל false (מצב מאובטח, יש להגדיר במפורש צמתים ניתנים לשליטה). בסביבות פנימיות ניתן להגדיר true לתאימות עם נתונים ישנים"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "הפעל את שירות MCP. כבוי כברירת מחדל; לאחר ההפעלה חושף את נקודת הקצה POST /mcp לקריאות LLM/סוכן."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "קבוצת פעולות MCP. שמות מודולים מופרדים בפסיקים (node/app/config/deploy/gateway/monitor/system), * פירושו הפעלת הכול"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "קידומות נתיב להגבלת קצב. מופרדות בפסיקים; נתיבים תואמים מוגבלים לפי IP; ברירת מחדל נקודות קצה לאימות כגון login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "מספר הגבלת קצב. מספר הבקשות המותרות לכל IP בדקה; ברירת מחדל 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "אפשר דיווח טלמטריה אנונימי. נדרש עבור מפל רב-שלבי או SDK מינימלי; ברירת מחדל false (מאובטח)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "מקורות CORS מותרים. מופרדים בפסיקים; ריק מאפשר כל מקור; כאשר צוין, רק מקורות ברשימת ההיתר רשאים לבצע cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "אימות הורדת קבצים מצורפים. האם לאמת את אסימון הורדת הקבצים המצורפים עבור /cube/file. ברירת מחדל false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "קטגוריות קבצים מצורפים ציבוריות ללא התחברות. מופרדות בפסיקים, פריטים תואמים ניתנים להורדה בעילום שם."
"Attachment download token validity. Seconds, default 600.": "תוקף אסימון הורדת קבצים מצורפים. שניות, ברירת מחדל 600."
