"Stardust service platform": "Platform layanan Stardust"
"Backend core of the Stardust distributed service platform. Provides core API services for configuration center, registry, service discovery, remote deployment, performance monitoring, and log center, supporting application registration, configuration delivery, metric aggregation, statistics, and task scheduling, and can scale horizontally.": "Inti backend platform layanan terdistribusi Stardust. Menyediakan layanan API inti untuk pusat konfigurasi, registri, penemuan layanan, penerapan jarak jauh, pemantauan kinerja, dan pusat log; mendukung pendaftaran aplikasi, pengiriman konfigurasi, agregasi metrik, perhitungan statistik, dan penjadwalan tugas, serta dapat diskalakan secara horizontal."
"Service port. Default 6600.": "Port layanan. Default 6600."
"Token secret. Algorithm and secret used to generate JWT tokens, e.g. HS256:ABCD1234": "Rahasia token. Algoritma dan rahasia yang digunakan untuk membuat token JWT, mis. HS256:ABCD1234"
"Token validity period. Default 2*3600 seconds.": "Masa berlaku token. Default 2*3600 detik."
"Session timeout. Default 600 seconds": "Batas waktu sesi. Default 600 detik"
"Salt deviation time. Clients use the current time as salt when logging in; too large a clock difference from the server causes key verification to fail; default 600 seconds": "Waktu deviasi salt. Klien menggunakan waktu saat ini sebagai salt saat login; perbedaan waktu yang terlalu besar dengan server menyebabkan verifikasi kunci gagal; default 600 detik"
"Auto-register. Allow node clients to register automatically, default true": "Pendaftaran otomatis. Izinkan klien node mendaftar secara otomatis, default true"
"Application auto-registration. Allow app clients to register automatically; default true": "Pendaftaran otomatis aplikasi. Izinkan klien aplikasi mendaftar secara otomatis; default true"
"Admission whitelist. If specified, only nodes matching the IP conditions may register; separate multiple entries with commas; supports * wildcard matching": "Daftar putih penerimaan. Jika ditentukan, hanya node yang memenuhi kondisi IP yang dapat mendaftar, pisahkan beberapa entri dengan koma, mendukung pencocokan wildcard *"
"Node code formula. Selects which hardware information in NodeInfo is used to compute the node code. Supports Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})": "Rumus kode node. Memilih informasi perangkat keras mana di NodeInfo yang digunakan untuk menghitung kode node. Mendukung Crc/Crc16/MD5/MD5_16, default Crc({ProductCode}@{UUID}@{DiskID}@{Macs})"
"Node code identification threshold. UUID+Guid+SerialNumber+DiskId+MAC; if several of them match, the node is considered the same, default 2": "Ambang identifikasi kode node. UUID+Guid+SerialNumber+DiskId+MAC; jika beberapa di antaranya cocok, node dianggap sama, default 2"
"Monitoring stream statistics period. Default 5 seconds. Processes the in-memory queue to compute minute-level statistics; smaller values improve real-time responsiveness but increase CPU usage, while larger values reduce CPU usage but increase alert latency": "Periode statistik aliran pemantauan. Default 5 detik. Memproses antrean dalam memori untuk menghitung statistik tingkat menit; nilai lebih kecil meningkatkan real-time tetapi menambah penggunaan CPU, nilai lebih besar mengurangi penggunaan CPU tetapi menambah latensi peringatan"
"Monitoring batch statistics period. Default 30 seconds. Corrects data by aggregating from the database; smaller values speed up correction but increase IO pressure, larger values reduce pressure but delay correction": "Periode statistik batch pemantauan. Default 30 detik. Memperbaiki data dengan agregasi dari database; nilai lebih kecil mempercepat perbaikan tetapi menambah tekanan IO, nilai lebih besar mengurangi tekanan tetapi menunda perbaikan"
"Monitoring flush period. Default 300 seconds. Batch commit period for the statistics delay queue; alerts read real-time in-memory values and are unaffected. Larger values significantly reduce database UPDATE pressure": "Periode penyimpanan pemantauan. Default 300 detik. Periode pengiriman batch antrean penundaan statistik; peringatan membaca nilai real-time di memori dan tidak terpengaruh. Nilai lebih besar secara signifikan mengurangi tekanan UPDATE database"
"Monitoring inspection period. Default 600 seconds. Recalculates hourly/daily statistics for non-hot applications on a periodic basis instead of full recalculation in each batch cycle, reducing write amplification": "Periode inspeksi pemantauan. Default 600 detik. Menghitung ulang statistik per jam/harian untuk aplikasi non-populer secara berkala alih-alih penghitungan ulang penuh di setiap siklus batch, sehingga mengurangi amplifikasi tulis"
"Monitoring alert period. Default 30 seconds": "Periode peringatan pemantauan. Default 30 detik"
"Console address. Used for monitoring alert addresses": "Alamat konsol. Digunakan untuk alamat peringatan pemantauan"
"Data retention period. Sampled details and minute-level statistics; default 3 days.": "Masa retensi data. Detail sampel dan statistik tingkat menit; default 3 hari."
"Medium-granularity data retention. Performance data and hourly statistics, default 30 days": "Waktu retensi data granularitas sedang. Data performa dan statistik per jam, default 30 hari"
"Retention period for coarse-grained data. Historical data and daily statistics, default 300 days.": "Periode retensi data butiran kasar. Data historis dan statistik harian, default 300 hari."
"Data cleanup mode. Supports efficient Truncate or Delete without DDL. Default Truncate.": "Mode pembersihan data. Mendukung Truncate yang efisien, atau Delete tanpa DDL. Default Truncate."
"Upload directory. Stores upgrade packages and must be the same directory configured for StarWeb. Default ../Uploads.": "Direktori unggahan. Menyimpan paket peningkatan dan harus berupa direktori yang sama dengan yang dikonfigurasi untuk StarWeb. Default ../Uploads."
"Maximum upload package size. Applies only to the maximum allowed request body bytes for the Deploy/UploadBuildFile endpoint; default 100000000 (100MB), 0 means use the Kestrel default limit, max 1GB.": "Ukuran maksimum paket unggahan. Hanya berlaku untuk byte isi permintaan maksimum yang diizinkan oleh endpoint Deploy/UploadBuildFile; default 100000000 (100MB), 0 berarti menggunakan batas default Kestrel, maksimum 1GB."
"File cache directory. Stores cache files such as database drivers; disabled when empty; default ../FileCache": "Direktori cache file. Menyimpan file cache seperti driver database; nonaktif jika kosong; default ../FileCache"
"File cache whitelist. If specified, only matching IP sources can access the file cache; separate multiple entries with commas; supports * wildcards": "Daftar putih cache file. Jika ditentukan, hanya sumber IP yang cocok yang dapat mengakses cache file; pisahkan beberapa entri dengan koma; mendukung wildcard *"
"File storage serving. Whether to respond to file download requests from other nodes. Default true.": "Layanan penyimpanan file. Apakah merespons permintaan unduhan file dari node lain. Default true."
"File storage pull. Whether to actively pull new files published by other nodes. Default false.": "Penarikan penyimpanan file. Apakah secara aktif menarik file baru yang diterbitkan oleh node lain. Default false."
"Upstream server. Reports data synchronously to the upstream server.": "Server induk. Melaporkan data secara sinkron ke server induk."
"Fixed city. By default, the city is calculated automatically from the IP. When enabled, automatic calculation stops and the city is set manually": "Kota tetap. Secara default kota dihitung otomatis dari IP. Saat diaktifkan, perhitungan otomatis dihentikan dan kota diatur secara manual"
"Allow anonymous trace access. Allow unauthenticated users to access the /trace trace page; monitoring data may contain sensitive information. Default false.": "Izinkan akses trace anonim. Izinkan pengguna yang belum masuk mengakses halaman trace /trace; data pemantauan mungkin berisi informasi sensitif. Default false."
"dotNet sync interval. Fetch .NET runtime installer info from the official site, 0 disables, unit: seconds, default 43200 (12 hours)": "Interval sinkronisasi dotNet. Ambil info pemasang .NET runtime dari situs resmi, 0 menonaktifkan, satuan detik, default 43200 (12 jam)"
"dotNet sync URL. Official API URL for fetching .NET runtime versions, supports the {major} placeholder": "Alamat sinkronisasi dotNet. Alamat API resmi untuk mengambil versi .NET runtime, mendukung placeholder {major}"
"Stardust resource download base address. Base URL for StarAgent installers/scripts; defaults to the official address": "Alamat dasar unduhan sumber daya Stardust. URL dasar untuk installer/skrip StarAgent; default alamat resmi"
"Allow when controllable nodes are empty. Whether operations are allowed when AllowControlNodes is empty, default false (secure mode, controllable nodes must be configured explicitly). Internal environments can set it to true for compatibility with legacy data": "Izinkan saat node yang dapat dikendalikan kosong. Apakah operasi diizinkan saat AllowControlNodes kosong, default false (mode aman, node yang dapat dikendalikan harus dikonfigurasi secara eksplisit). Lingkungan internal dapat menyetelnya ke true untuk kompatibilitas dengan data lama"
"Enable the MCP service. Disabled by default; when enabled, exposes the POST /mcp endpoint for LLM/agent calls.": "Aktifkan layanan MCP. Nonaktif secara default; jika diaktifkan, mengekspos endpoint POST /mcp untuk panggilan LLM/agen."
"MCP action set. Comma-separated module names (node/app/config/deploy/gateway/monitor/system), * means all enabled": "Kumpulan aksi MCP. Nama modul dipisahkan koma (node/app/config/deploy/gateway/monitor/system), * berarti semua diaktifkan"
"Rate limit path prefixes. Comma-separated; matching paths are rate-limited by IP; defaults to authentication endpoints such as login/token": "Prefiks jalur pembatasan laju. Dipisahkan koma; jalur yang cocok dibatasi berdasarkan IP; default endpoint autentikasi seperti login/token"
"Rate limit count. Number of requests allowed per IP per minute; default 60": "Jumlah pembatasan laju. Jumlah permintaan yang diizinkan per IP per menit; default 60"
"Allow anonymous telemetry reporting. Required for multi-level cascading or minimal SDK; default false (secure)": "Izinkan pelaporan telemetri anonim. Diperlukan untuk kaskade bertingkat atau SDK minimal; default false (aman)"
"CORS allowed origins. Comma-separated; empty allows any origin; when specified, only whitelisted origins may cross-origin": "Origin CORS yang diizinkan. Dipisahkan koma; kosong mengizinkan origin apa pun; jika ditentukan, hanya origin dalam daftar putih yang dapat melakukan cross-origin"
"Attachment download authentication. Whether to verify the attachment download token for /cube/file. Default false.": "Autentikasi unduhan lampiran. Apakah token unduhan lampiran untuk /cube/file diverifikasi. Default false."
"Public attachment categories that require no login. Comma separated; matching items can be downloaded anonymously.": "Kategori lampiran publik tanpa login. Dipisahkan koma, item yang cocok dapat diunduh secara anonim."
"Attachment download token validity. Seconds, default 600.": "Masa berlaku token unduhan lampiran. Detik, default 600."
