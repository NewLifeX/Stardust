"[{0}] is not allowed to operate application [{1}].\nFor security, applications cannot send control commands to other applications by default.\nIn the registry, edit the controllable nodes of [{0}], add [{2}], or set it to * for all applications.": "[{0}] tidak diizinkan mengoperasikan aplikasi [{1}].\nDemi keamanan, aplikasi secara default tidak dapat mengirim perintah kontrol ke aplikasi lain.\nDi registri, ubah node yang dapat dikendalikan oleh [{0}], tambahkan [{2}], atau setel ke * untuk semua aplikasi."
