"告警错误率。错误率达到该值时触发告警，0表示不启用，阈值和率值必须同时满足": "Wskaźnik błędów alertu. Alert jest zgłaszany, gdy wskaźnik błędów osiągnie tę wartość; 0 oznacza wyłączenie, próg i wskaźnik muszą być spełnione jednocześnie"
"告警错误率。错误率达到该值时触发告警，0表示不启用，阈值和率值满足其一": "Wskaźnik błędów alertu. Alert jest zgłaszany, gdy wskaźnik błędów osiągnie tę wartość; 0 oznacza wyłączenie, wystarczy spełnienie progu lub wskaźnika"
"告警机器人": "Robot alertów"
"告警机器人。钉钉、企业微信等": "Robot alertów. DingTalk, WeCom itd."
"告警历史。记录告警内容": "Historia alertów. Rejestruje treść alertów"
"告警阈值": "Próg alertu"
"告警阈值。错误数达到该值时触发告警，0表示不启用，阈值和率值必须同时满足": "Próg alertu. Alert jest zgłaszany, gdy liczba błędów osiągnie tę wartość; 0 oznacza wyłączenie, próg i wskaźnik muszą być spełnione jednocześnie"
"告警阈值。错误数达到该值时触发告警，0表示不启用，阈值和率值满足其一": "Próg alertu. Alert jest zgłaszany, gdy liczba błędów osiągnie tę wartość; 0 oznacza wyłączenie, wystarczy spełnienie progu lub wskaźnika"
"告警组": "Grupa alertów"
"告警组。按照项目组设置告警，便于管理多节点和多应用，节点和应用的分类名对应组名": "Grupa alertów. Alerty konfiguruje się według grup projektów, aby ułatwić zarządzanie wieloma węzłami i aplikacjami; nazwa kategorii węzła i aplikacji odpowiada nazwie grupy"
"告警组。使用告警组中指定的机器人": "Grupa alertów. Używa robota wskazanego w grupie alertów"
"跟踪分钟统计": "Minutowe statystyki śledzenia"
"跟踪分钟统计。每应用每接口每5分钟统计，用于分析接口健康状况": "Minutowe statystyki śledzenia. Statystyki co 5 minut na aplikację i interfejs, do analizy kondycji interfejsów"
"跟踪规则": "Reguła śledzenia"
"跟踪规则。全局黑白名单，白名单放行，黑名单拦截": "Reguła śledzenia. Globalna biała i czarna lista; biała lista przepuszcza, czarna blokuje"
"跟踪每日统计": "Dzienne statystyki śledzenia"
"跟踪每日统计。每应用每接口每日统计，用于分析接口健康状况": "Dzienne statystyki śledzenia. Dzienne statystyki na aplikację i interfejs, do analizy kondycji interfejsów"
