"覆盖文件": "上書きファイル"
"覆盖文件。需要拷贝覆盖已存在的文件或子目录，支持*模糊匹配，多文件分号隔开。如果目标文件不存在，配置文件等自动拷贝": "上書きファイル。既存のファイルやサブディレクトリをコピーして上書きします。* によるあいまい一致に対応し、複数ファイルはセミコロン区切りです。対象ファイルが存在しない場合は、構成ファイルなどが自動的にコピーされます"
"告警": "アラート"
