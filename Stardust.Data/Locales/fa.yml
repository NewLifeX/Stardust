"关联项": "مورد مرتبط"
"关联项。当前跟踪数据为克隆数据时，采用数据落在关联项所指定的跟踪数据之下": "مورد مرتبط. اگر داده‌های ردیابی فعلی داده کلون‌شده باشند، زیر داده ردیابی مشخص‌شده توسط مورد مرتبط حساب می‌شوند"
