"规则。支持多个埋点操作按照规则聚合成为一个跟踪项，用于处理多变的操作名，支持*模糊匹配，多个规则逗号隔开，多组规则分号隔开。如name=*/check*,*/ping*;clientId=10.10.*": "قاعده. امکان تجمیع چند عملیات تله‌متری در یک مورد ردیابی بر اساس قاعده را می‌دهد، برای پردازش نام‌های متغیر عملیات، از تطبیق فازی با * پشتیبانی می‌کند، چند قاعده با کاما و چند گروه با نقطه‌ویرگول جدا می‌شود. مانند name=*/check*,*/ping*;clientId=10.10.*"
