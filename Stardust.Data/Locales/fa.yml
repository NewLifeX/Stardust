"告警阈值。错误数达到该值时触发告警，0表示不启用，阈值和率值必须同时满足": "آستانه هشدار. با رسیدن تعداد خطاها به این مقدار هشدار داده می‌شود؛ ۰ یعنی غیرفعال و آستانه و نرخ باید هم‌زمان برقرار باشند"
"告警阈值。错误数达到该值时触发告警，0表示不启用，阈值和率值满足其一": "آستانه هشدار. با رسیدن تعداد خطاها به این مقدار هشدار داده می‌شود؛ ۰ یعنی غیرفعال و برقراری آستانه یا نرخ کافی است"
