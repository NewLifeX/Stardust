"应用配置。需要管理配置的应用系统列表，每个应用以命令对形式管理配置数据，支持版本发布": "Ρύθμιση εφαρμογής. Λίστα συστημάτων εφαρμογών που χρειάζονται διαχείριση ρυθμίσεων· κάθε εφαρμογή διαχειρίζεται δεδομένα ρυθμίσεων ως ζεύγη ονόματος-τιμής και υποστηρίζει δημοσίευση εκδόσεων."
