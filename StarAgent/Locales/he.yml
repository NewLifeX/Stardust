"Forced update completed; the new process has been launched, waiting for the current service to restart.": "העדכון הכפוי הושלם; התהליך החדש הופעל, ממתין להפעלה מחדש של השירות הנוכחי."
"The new version failed to start (smoke test failed); the old files have been rolled back and the current service keeps running. {0}": "הגרסה החדשה לא הופעלה (בדיקת העשן נכשלה); הקבצים הישנים שוחזרו והשירות הנוכחי ממשיך לפעול. {0}"
"Forced update completed; launching the new process. PID={0}": "העדכון הכפוי הושלם; התהליך החדש מופעל. PID={0}"
"Forced update completed; the new process has been launched and the current process is about to exit. PID={0}": "העדכון הכפוי הושלם; התהליך החדש הופעל והתהליך הנוכחי עומד לצאת. PID={0}"
"Executing command: {0}, timeout: {1}ms, time: {2}": "מבצע פקודה: {0}, פסק זמן: {1}ms, זמן: {2}"
"Execution succeeded, command: {0}, elapsed: {1}ms, output length: {2}": "ההרצה הצליחה, פקודה: {0}, משך: {1}ms, אורך פלט: {2}"
"Execution failed, command: {0}, elapsed: {1}ms, error: {2}": "ההרצה נכשלה, פקודה: {0}, משך: {1}ms, שגיאה: {2}"
"Parameter is empty.": "הפרמטר ריק."
"No synchronization required.": "אין צורך בסנכרון."
"Unsupported system!": "מערכת לא נתמכת!"
"Synchronized time: {0}, offset: {1}": "הזמן המסונכרן: {0}, סטייה: {1}"
"Synchronization failed; root permission is required. Run manually: sudo date -u -s \"{0}\"": "הסנכרון נכשל; נדרשת הרשאת root. הרץ ידנית: sudo date -u -s \"{0}\""
"Command is empty.": "הפקודה ריקה."
"Overwrite file list: {0}": "רשימת הקבצים שיוחלפו: {0}"
"Deleting old shadow directory {0}": "מוחק את ספריית הצל הישנה {0}"
"Copying config file {0}": "מעתיק את קובץ התצורה {0}"
"Copying overwrite files to the working directory: {0}": "מעתיק קבצי החלפה לספריית העבודה: {0}"
"Succeeded": "הצלחה"
"Extracting {0} to {1}": "מחלץ {0} אל {1}"
"Overwriting file {0}": "דורס את הקובץ {0}"
"Overwriting directory {0}": "דורס את הספרייה {0}"
"Deleting shadow directory: {0}": "מוחק את ספריית הצל: {0}"
"Stardust agent": "Stardust agent"
"Node guardian agent for Stardust. Deployed on every application server or edge node, providing process supervision, remote deployment, performance metrics collection (CPU/memory/disk/network/GPU), log and metric reporting, and supporting Windows services, Linux systemd, and IoT edge environments.": "סוכן שומר צמתים עבור Stardust. נפרס בכל שרת אפליקציות או צומת קצה, ומספק פיקוח על תהליכים, פריסה מרחוק, איסוף מדדי ביצועים (CPU/זיכרון/דיסק/רשת/GPU), דיווח יומנים ומדדים, ותמיכה בשירותי Windows, Linux systemd וסביבות קצה של IoT."
"AccessKeyId. Used for dynamic domain name resolution": "AccessKeyId. משמש לפתרון שמות תחום דינמי"
"AccessKeySecret. Used for dynamic domain name resolution": "AccessKeySecret. משמש לפתרון שמות תחום דינמי"
"Domain name. For example: example.com": "שם דומיין. לדוגמה: example.com"
"Record. For example, www means www.example.com. @ means the root domain": "רשומה. לדוגמה, www פירושו www.example.com. @ פירושו תחום השורש"
"Record type. Default A record": "סוג רשומה. רשומת A כברירת מחדל"
"Update interval. Default 300 seconds.": "מרווח עדכון. ברירת מחדל 300 שניות."
"Debug switch. Default true.": "מתג ניפוי באגים. ברירת מחדל true."
"Certificate": "תעודה"
"Secret key": "מפתח סודי"
"Project name. The project that new nodes join by default": "שם הפרויקט. הפרויקט שאליו מצטרפים צמתים חדשים כברירת מחדל"
"Local port. Default 5500.": "יציאה מקומית. ברירת מחדל 5500."
"Web panel bind address. Default 127.0.0.1 allows local access only; set to * to listen on all NICs, or specify a concrete IP": "כתובת כריכה של פאנל Web. ברירת המחדל 127.0.0.1 מאפשרת גישה מקומית בלבד, הגדרו * כדי להאזין בכל כרטיסי הרשת או ציינו IP ספציפי"
"Update channel. Default Release.": "ערוץ עדכונים. ברירת מחדל Release."
"Windows auto-start. Auto-start requires a user logged in to the desktop; default false uses a system service": "הפעלה אוטומטית של Windows. הפעלה אוטומטית דורשת משתמש מחובר לשולחן העבודה, ברירת המחדל false משתמשת בשירות מערכת"
"User name. Stored in user mode and read in service mode": "שם משתמש. נשמר במצב משתמש ונקרא במצב שירות"
"Pixels. For example 96*96. Stored in user mode and read in service mode": "פיקסלים. לדוגמה 96*96. נשמר במצב משתמש ונקרא במצב שירות"
"Resolution. e.g. 1024*768. Stored in user mode, read in service mode.": "רזולוציה. לדוגמה 1024*768. נשמר במצב משתמש, נקרא במצב שירות."
"Delay time. Delay before restarting the process or service; default 3000ms": "זמן השהיה. השהיה לפני הפעלה מחדש של התהליך או השירות; ברירת מחדל 3000ms"
"Time sync interval. Periodically syncs server time to local time; default 0 seconds (no sync).": "מרווח סנכרון זמן. מסנכרן מעת לעת את זמן השרת לזמן המקומי; ברירת מחדל 0 שניות (ללא סנכרון)."
"Startup hook. Injects the Stardust monitoring hook into dotNet applications when launching the target process. Default false.": "וו אתחול. מזריק את וו הניטור של Stardust ליישומי dotNet בעת הפעלת תהליך היעד. ברירת מחדל false."
"Application services": "אוסף שירותי יישומים"
