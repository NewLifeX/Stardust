"Web panel listen address, default 127.0.0.1 for local access only. Set to * for all interfaces or a specific IP. Requires a StarAgent restart": "ที่อยู่รับฟังของแผงเว็บ ค่าเริ่มต้น 127.0.0.1 เฉพาะภายในเครื่อง ตั้งเป็น * เพื่อเปิดทุกอินเทอร์เฟซ หรือระบุ IP ที่ต้องการ ต้องรีสตาร์ท StarAgent"
"Unique code of the current node": "รหัสเฉพาะของโหนดปัจจุบัน"
