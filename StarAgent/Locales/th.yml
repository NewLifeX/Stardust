"Overwriting directory {0}": "กำลังเขียนทับไดเรกทอรี {0}"
"Deleting shadow directory: {0}": "กำลังลบไดเรกทอรีเงา: {0}"
"Stardust agent": "Stardust agent"
"Node guardian agent for Stardust. Deployed on every application server or edge node, providing process supervision, remote deployment, performance metrics collection (CPU/memory/disk/network/GPU), log and metric reporting, and supporting Windows services, Linux systemd, and IoT edge environments.": "เอเจนต์ผู้พิทักษ์โหนดสำหรับ Stardust ติดตั้งบนเซิร์ฟเวอร์แอปพลิเคชันหรือโหนดเอดจ์ทุกเครื่อง ให้การกำกับดูแลโปรเซส การติดตั้งใช้งานระยะไกล การเก็บเมตริกประสิทธิภาพ (CPU/หน่วยความจำ/ดิสก์/เครือข่าย/GPU) การรายงานบันทึกและเมตริก และรองรับบริการ Windows, Linux systemd และสภาพแวดล้อมเอดจ์ IoT"
"AccessKeyId. Used for dynamic domain name resolution": "AccessKeyId ใช้สำหรับการแปลงชื่อโดเมนแบบไดนามิก"
"AccessKeySecret. Used for dynamic domain name resolution": "AccessKeySecret ใช้สำหรับการแปลงชื่อโดเมนแบบไดนามิก"
"Domain name. For example: example.com": "ชื่อโดเมน ตัวอย่างเช่น example.com"
"Record. For example, www means www.example.com. @ means the root domain": "ระเบียน ตัวอย่างเช่น www หมายถึง www.example.com และ @ หมายถึงโดเมนราก"
"Record type. Default A record": "ประเภทระเบียน ค่าเริ่มต้นคือระเบียน A"
"Update interval. Default 300 seconds.": "ช่วงเวลาอัปเดต ค่าเริ่มต้น 300 วินาที"
"Debug switch. Default true.": "สวิตช์ดีบัก ค่าเริ่มต้น true"
"Certificate": "ใบรับรอง"
"Secret key": "คีย์ลับ"
"Project name. The project that new nodes join by default": "ชื่อโปรเจกต์ โปรเจกต์ที่โหนดใหม่เข้าร่วมโดยค่าเริ่มต้น"
"Local port. Default 5500.": "พอร์ตภายในเครื่อง ค่าเริ่มต้น 5500"
"Web panel bind address. Default 127.0.0.1 allows local access only; set to * to listen on all NICs, or specify a concrete IP": "ที่อยู่ผูกของแผง Web ค่าเริ่มต้น 127.0.0.1 อนุญาตเฉพาะการเข้าถึงภายในเครื่อง ตั้งเป็น * เพื่อรับฟังบนการ์ดเครือข่ายทั้งหมด หรือระบุ IP ที่เจาะจง"
"Update channel. Default Release.": "ช่องทางการอัปเดต ค่าเริ่มต้น Release"
"Windows auto-start. Auto-start requires a user logged in to the desktop; default false uses a system service": "การเริ่มต้นอัตโนมัติของ Windows การเริ่มต้นอัตโนมัติต้องมีผู้ใช้ลงชื่อเข้าใช้เดสก์ท็อป ค่าเริ่มต้น false ใช้บริการระบบ"
"User name. Stored in user mode and read in service mode": "ชื่อผู้ใช้ จัดเก็บในโหมดผู้ใช้และอ่านในโหมดบริการ"
"Pixels. For example 96*96. Stored in user mode and read in service mode": "พิกเซล ตัวอย่างเช่น 96*96 จัดเก็บในโหมดผู้ใช้และอ่านในโหมดบริการ"
"Resolution. e.g. 1024*768. Stored in user mode, read in service mode.": "ความละเอียด ตัวอย่าง 1024*768 จัดเก็บในโหมดผู้ใช้ อ่านในโหมดบริการ"
"Delay time. Delay before restarting the process or service; default 3000ms": "เวลาหน่วง เวลาหน่วงก่อนรีสตาร์ตโปรเซสหรือบริการ ค่าเริ่มต้น 3000ms"
"Time sync interval. Periodically syncs server time to local time; default 0 seconds (no sync).": "ช่วงเวลาการซิงโครไนซ์เวลา ซิงโครไนซ์เวลาของเซิร์ฟเวอร์กับเวลาท้องถิ่นเป็นระยะ ค่าเริ่มต้น 0 วินาที (ไม่ซิงโครไนซ์)"
"Startup hook. Injects the Stardust monitoring hook into dotNet applications when launching the target process. Default false.": "ฮุกเริ่มต้น ฉีดฮุกตรวจสอบ Stardust ลงในแอปพลิเคชัน dotNet เมื่อเริ่มต้นกระบวนการเป้าหมาย ค่าเริ่มต้น false"
"Application services": "คอลเลกชันบริการแอปพลิเคชัน"
