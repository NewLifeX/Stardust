"Forced update completed; restarting the background service. PID={0}": "อัปเดตแบบบังคับเสร็จสิ้น กำลังรีสตาร์ตบริการเบื้องหลัง PID={0}"
"The new version failed to start for the first time; retrying in {0}ms. {1}": "เวอร์ชันใหม่เริ่มทำงานครั้งแรกไม่สำเร็จ จะลองใหม่ใน {0}ms {1}"
"Forced update completed; the new process has been launched, waiting for the current service to restart.": "อัปเดตแบบบังคับเสร็จสิ้น เริ่มโปรเซสใหม่แล้ว กำลังรอให้บริการปัจจุบันรีสตาร์ต"
"The new version failed to start (smoke test failed); the old files have been rolled back and the current service keeps running. {0}": "เวอร์ชันใหม่เริ่มทำงานไม่สำเร็จ (ทดสอบเบื้องต้นไม่ผ่าน) คืนค่าไฟล์เวอร์ชันเก่าแล้ว บริการปัจจุบันยังทำงานต่อไป {0}"
"Forced update completed; launching the new process. PID={0}": "อัปเดตแบบบังคับเสร็จสิ้น กำลังเริ่มโปรเซสใหม่ PID={0}"
"Forced update completed; the new process has been launched and the current process is about to exit. PID={0}": "อัปเดตแบบบังคับเสร็จสิ้น เริ่มโปรเซสใหม่แล้ว โปรเซสปัจจุบันกำลังจะออก PID={0}"
"Executing command: {0}, timeout: {1}ms, time: {2}": "กำลังเรียกใช้คำสั่ง: {0} หมดเวลา: {1}ms เวลา: {2}"
"Execution succeeded, command: {0}, elapsed: {1}ms, output length: {2}": "เรียกใช้สำเร็จ คำสั่ง: {0} ใช้เวลา: {1}ms ความยาวเอาต์พุต: {2}"
"Execution failed, command: {0}, elapsed: {1}ms, error: {2}": "เรียกใช้ล้มเหลว คำสั่ง: {0} ใช้เวลา: {1}ms ข้อผิดพลาด: {2}"
"Parameter is empty.": "พารามิเตอร์ว่างเปล่า"
"No synchronization required.": "ไม่จำเป็นต้องซิงโครไนซ์"
"Unsupported system!": "ไม่รองรับระบบนี้!"
"Synchronized time: {0}, offset: {1}": "เวลาที่ซิงโครไนซ์: {0} ความคลาดเคลื่อน: {1}"
"Synchronization failed; root permission is required. Run manually: sudo date -u -s \"{0}\"": "ซิงโครไนซ์ล้มเหลว ต้องใช้สิทธิ์ root โปรดเรียกใช้ด้วยตนเอง: sudo date -u -s \"{0}\""
"Command is empty.": "คำสั่งว่างเปล่า"
