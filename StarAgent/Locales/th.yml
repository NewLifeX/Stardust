"Project the new node joins by default": "โปรเจกต์ที่โหนดใหม่เข้าร่วมโดยค่าเริ่มต้น"
"Update channel: Release/Debug": "ช่องทางอัปเดต: Release/Debug"
"Delay before restarting the process or service, default 3000 ms": "หน่วงเวลาก่อนรีสตาร์ทโปรเซสหรือบริการ ค่าเริ่มต้น 3000 มิลลิวินาที"
"Periodically sync server time to local, 0 to disable": "ซิงค์เวลาของเซิร์ฟเวอร์กับภายในเครื่องเป็นระยะ 0 หมายถึงปิดใช้งาน"
"Inject the Stardust monitoring hook into .NET applications when launching the target process": "ฉีดฮุกตรวจสอบ Stardust เข้าในแอป .NET เมื่อเริ่มโปรเซสเป้าหมาย"
"Autorun requires a signed-in desktop; false by default uses the system service": "การเรียกใช้อัตโนมัติต้องมีผู้ใช้ลงชื่อเข้าใช้เดสก์ท็อป ค่าเริ่มต้น false จะใช้บริการของระบบ"
