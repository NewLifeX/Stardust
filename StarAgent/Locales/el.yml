"Execution succeeded, command: {0}, elapsed: {1}ms, output length: {2}": "Η εκτέλεση ολοκληρώθηκε, εντολή: {0}, διάρκεια: {1}ms, μήκος εξόδου: {2}"
"Execution failed, command: {0}, elapsed: {1}ms, error: {2}": "Η εκτέλεση απέτυχε, εντολή: {0}, διάρκεια: {1}ms, σφάλμα: {2}"
