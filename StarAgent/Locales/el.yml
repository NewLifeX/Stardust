"Autorun requires a signed-in desktop; false by default uses the system service": "Η αυτόματη εκκίνηση απαιτεί συνδεδεμένη επιφάνεια εργασίας· η προεπιλογή false χρησιμοποιεί την υπηρεσία συστήματος"
"Unauthorized": "Μη εξουσιοδοτημένο"
"Service manager not available": "Ο διαχειριστής υπηρεσιών δεν είναι διαθέσιμος"
# 运行时消息补充词条
"Stardust agent self-healing completed: {0}": "Η αυτοεπιδιόρθωση του πράκτορα Stardust ολοκληρώθηκε: {0}"
"Forced update completed; restarting the background service. PID={0}": "Η αναγκαστική ενημέρωση ολοκληρώθηκε· επανεκκίνηση της υπηρεσίας παρασκηνίου. PID={0}"
"The new version failed to start for the first time; retrying in {0}ms. {1}": "Η νέα έκδοση δεν ξεκίνησε την πρώτη φορά· νέα προσπάθεια σε {0}ms. {1}"
"Forced update completed; the new process has been launched, waiting for the current service to restart.": "Η αναγκαστική ενημέρωση ολοκληρώθηκε· η νέα διεργασία ξεκίνησε και αναμένεται η επανεκκίνηση της τρέχουσας υπηρεσίας."
"The new version failed to start (smoke test failed); the old files have been rolled back and the current service keeps running. {0}": "Η νέα έκδοση δεν ξεκίνησε (η δοκιμή καπνού απέτυχε)· τα παλιά αρχεία επαναφέρθηκαν και η τρέχουσα υπηρεσία συνεχίζει να εκτελείται. {0}"
"Forced update completed; launching the new process. PID={0}": "Η αναγκαστική ενημέρωση ολοκληρώθηκε· εκκίνηση της νέας διεργασίας. PID={0}"
"Forced update completed; the new process has been launched and the current process is about to exit. PID={0}": "Η αναγκαστική ενημέρωση ολοκληρώθηκε· η νέα διεργασία ξεκίνησε και η τρέχουσα διεργασία τερματίζεται. PID={0}"
